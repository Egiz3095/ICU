{"id":183,"section":4,"sectionName":"Neurocritical Care","stem":"A 52-year-old has a malignant MCA infarct with declining consciousness on day 2. What intervention reduces mortality?","options":{"A":"Decompressive hemicraniectomy within 48 hours","B":"Hypertonic saline alone for 7 days","C":"High-dose dexamethasone","D":"Prophylactic hyperventilation to PaCO2 25 mmHg"},"answer":"A","explanation":"Pooled DECIMAL, DESTINY and HAMLET: hemicraniectomy within 48 hours in patients ≤60 years reduced mortality and improved functional outcome. DESTINY II showed survival benefit (with more disability) in those >60.","distractor":"Steroids have no benefit in cytotoxic oedema of stroke."},
{"id":184,"section":4,"sectionName":"Neurocritical Care","stem":"For spontaneous ICH with SBP 190 mmHg, what is the recommended SBP target?","options":{"A":"Below 110 mmHg within 1 hour","B":"Below 180 mmHg only, with no lower target required","C":"About 140 mmHg, avoiding large rapid drops","D":"Below 160 mmHg only after 24 hours"},"answer":"C","explanation":"AHA/ASA 2022: lowering SBP to 140 mmHg is safe (INTERACT2); target 130–150 mmHg. ATACH-2 showed no benefit and more AKI with 110–139 mmHg targets.","distractor":"Very intensive lowering showed no benefit and more harm."},
{"id":185,"section":4,"sectionName":"Neurocritical Care","stem":"A patient on warfarin has ICH with INR 3.1. What is the best reversal?","options":{"A":"Vitamin K alone, 10 mg IV, then repeat INR at 24 h","B":"Fresh frozen plasma alone","C":"4-factor PCC plus IV vitamin K 10 mg","D":"Idarucizumab 5 g IV"},"answer":"C","explanation":"4F-PCC achieves rapid INR correction (INCH trial superior to FFP); vitamin K sustains reversal.","distractor":"Idarucizumab reverses dabigatran only."},
{"id":186,"section":4,"sectionName":"Neurocritical Care","stem":"A patient on aspirin has spontaneous ICH and will not undergo surgery. Should platelets be transfused?","options":{"A":"No; PATCH showed worse outcomes with platelet transfusion","B":"Yes; for all patients taking any antiplatelet agent at presentation","C":"Only if platelet count is above 150 × 10^9/L","D":"Yes; it reduces haematoma expansion and mortality"},"answer":"A","explanation":"PATCH (Lancet 2016): platelet transfusion in antiplatelet-associated ICH increased death or dependence. It may be considered before neurosurgery.","distractor":"PATCH showed harm, not benefit."},
{"id":187,"section":4,"sectionName":"Neurocritical Care","stem":"A patient has a 4-cm cerebellar haemorrhage with brainstem compression and hydrocephalus. What is the management?","options":{"A":"Medical management with BP control only","B":"Repeat CT in 24 hours","C":"EVD alone without evacuation","D":"Urgent surgical evacuation"},"answer":"D","explanation":"Cerebellar haemorrhage with deterioration, brainstem compression or hydrocephalus requires surgical evacuation; EVD alone is not recommended.","distractor":"EVD alone risks upward herniation."},
{"id":188,"section":4,"sectionName":"Neurocritical Care","stem":"Which trial showed better independence at 1 year with endovascular coiling versus clipping in ruptured aneurysms?","options":{"A":"BRAT","B":"ISAT","C":"STICH","D":"CONSCIOUS-1"},"answer":"B","explanation":"ISAT (2002): coiling was associated with a lower risk of death or dependency at 1 year than clipping in suitable aneurysms.","distractor":"STICH studied surgery for spontaneous ICH."},
{"id":189,"section":4,"sectionName":"Neurocritical Care","stem":"What is the nimodipine regimen after aneurysmal SAH?","options":{"A":"60 mg orally every 4 hours for 21 days","B":"30 mg orally every 4 hours for 3 days","C":"IV nimodipine bolus 10 mg daily","D":"60 mg orally every 12 hours for 7 days"},"answer":"A","explanation":"Oral nimodipine 60 mg every 4 hours for 21 days improves outcome in aSAH (reduces DCI-related poor outcome). If hypotension occurs, give 30 mg every 2 hours.","distractor":"Shorter courses lack evidence."},
{"id":190,"section":4,"sectionName":"Neurocritical Care","stem":"On day 7 after aSAH, a patient develops new confusion and hemiparesis; CT shows no hydrocephalus or rebleed. What is first-line treatment?","options":{"A":"IV mannitol 1 g/kg","B":"Prophylactic hypervolaemia with 5 L/day","C":"Triple-H therapy with haemodilution","D":"Induced hypertension with euvolaemia"},"answer":"D","explanation":"Delayed cerebral ischaemia: maintain euvolaemia, induce hypertension, and consider endovascular therapy if refractory. Prophylactic hypervolaemia and haemodilution are not recommended.","distractor":"Haemodilution and hypervolaemia increase complications."},
{"id":191,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with SAH has drowsiness and enlarged ventricles on CT. What is the treatment?","options":{"A":"Lumbar puncture to remove CSF","B":"External ventricular drain","C":"High-dose acetazolamide","D":"Observation for spontaneous improvement"},"answer":"B","explanation":"Acute hydrocephalus with reduced consciousness requires EVD. Lumbar drainage is contraindicated with obstructive hydrocephalus.","distractor":"LP risks herniation with obstructive hydrocephalus."},
{"id":192,"section":4,"sectionName":"Neurocritical Care","stem":"What did ULTRA show for ultra-early tranexamic acid in aSAH?","options":{"A":"Improved functional outcome at 6 months","B":"Reduced delayed cerebral ischaemia and improved 6-month outcome","C":"Reduced rebleeding but no improvement in functional outcome","D":"Increased rebleeding and mortality"},"answer":"C","explanation":"ULTRA (Lancet 2021): TXA before aneurysm treatment did not improve 6-month outcomes.","distractor":"TXA did not improve outcome."},
{"id":193,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with SAH has Na 128 mmol/L, high urine sodium and hypovolaemia. What is the treatment?","options":{"A":"Tolvaptan to correct sodium","B":"Isotonic or hypertonic saline, with fludrocortisone if needed","C":"Fluid restriction to 1 L/day, as for SIADH in other settings","D":"Furosemide with free water"},"answer":"B","explanation":"Cerebral salt wasting causes hypovolaemic hyponatraemia; fluid restriction increases DCI risk. Replace sodium and volume.","distractor":"Fluid restriction worsens ischaemia in SAH."},
{"id":194,"section":4,"sectionName":"Neurocritical Care","stem":"When is convulsive status epilepticus defined for treatment purposes?","options":{"A":"Continuous seizure lasting 30 minutes, or repeated seizures within an hour","B":"Two seizures within 24 hours","C":"Any seizure lasting longer than 1 minute","D":"Continuous seizure lasting 5 minutes or recurrent seizures without recovery"},"answer":"D","explanation":"ILAE: t1 = 5 minutes (treat); t2 = 30 minutes (long-term consequences).","distractor":"The 30-minute threshold reflects risk of neuronal injury, not when to start treatment."},
{"id":195,"section":4,"sectionName":"Neurocritical Care","stem":"A seizing patient has no IV access. What prehospital therapy is supported by RAMPART?","options":{"A":"IM phenytoin 15 mg/kg","B":"Rectal diazepam 5 mg","C":"IM midazolam 10 mg","D":"IV lorazepam after cannulation attempts"},"answer":"C","explanation":"RAMPART (2012): IM midazolam 10 mg was at least as effective as IV lorazepam for prehospital status epilepticus.","distractor":"IM phenytoin is erratically absorbed."},
{"id":196,"section":4,"sectionName":"Neurocritical Care","stem":"What is the correct IV lorazepam dose for status epilepticus?","options":{"A":"0.1 mg/kg (up to 4 mg per dose), repeat once","B":"1 mg/kg once","C":"0.01 mg/kg once, then infusion","D":"2 mg total, no repeat"},"answer":"A","explanation":"Lorazepam 0.1 mg/kg (max 4 mg/dose), may repeat once after 5–10 minutes. Underdosing is common.","distractor":"Underdosing benzodiazepines is a frequent error."},
{"id":197,"section":4,"sectionName":"Neurocritical Care","stem":"What did ESETT show for second-line therapy in established status epilepticus?","options":{"A":"Fosphenytoin was superior to levetiracetam for stopping seizures","B":"Levetiracetam, fosphenytoin and valproate were similarly effective","C":"Valproate was superior to both other drugs","D":"Levetiracetam was superior to valproate"},"answer":"B","explanation":"ESETT (NEJM 2019) randomised benzodiazepine-refractory status epilepticus to levetiracetam, fosphenytoin or valproate. Seizure cessation with improved consciousness at 60 minutes was about 45–47% in each arm, with similar safety, so any of the three is an acceptable second-line agent.","distractor":"No drug was superior."},
{"id":198,"section":4,"sectionName":"Neurocritical Care","stem":"Status epilepticus continues despite benzodiazepines and levetiracetam. What is the next step?","options":{"A":"Observation for 2 hours","B":"A third benzodiazepine dose, then observation without intubation","C":"Oral carbamazepine loading","D":"Intubation and anaesthetic infusion (e.g. midazolam or propofol)"},"answer":"D","explanation":"Refractory status epilepticus requires continuous anaesthetic infusion with EEG monitoring. Ketamine is used for super-refractory cases.","distractor":"Further benzodiazepines are ineffective."},
{"id":199,"section":4,"sectionName":"Neurocritical Care","stem":"A comatose ICU patient has no clear cause. What test is indicated to exclude non-convulsive status epilepticus?","options":{"A":"Continuous EEG","B":"Lumbar puncture only","C":"Serum prolactin","D":"MRI brain only"},"answer":"A","explanation":"NCSE is common in comatose ICU patients and is diagnosed only by EEG; continuous monitoring improves detection.","distractor":"Prolactin is unreliable."},
{"id":200,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with GBS has rapidly progressive weakness. What is the treatment?","options":{"A":"IVIG followed immediately by plasma exchange in all patients","B":"Oral prednisolone for 4 weeks","C":"IVIG 2 g/kg over 5 days or plasma exchange","D":"High-dose methylprednisolone"},"answer":"C","explanation":"IVIG or plasma exchange are equally effective; combining them gives no extra benefit; steroids do not help.","distractor":"Corticosteroids are not effective in GBS."},
{"id":201,"section":4,"sectionName":"Neurocritical Care","stem":"A GBS patient has labile BP and arrhythmias. What is the main cause?","options":{"A":"Autonomic dysfunction","B":"IVIG adverse reaction","C":"Coexisting myocardial infarction","D":"Hypovolaemia only"},"answer":"A","explanation":"Dysautonomia occurs in up to two-thirds of severe GBS: labile BP, arrhythmias, ileus; monitor and treat cautiously.","distractor":"IVIG does not cause marked dysautonomia."},
{"id":202,"section":4,"sectionName":"Neurocritical Care","stem":"A patient in myasthenic crisis needs antibiotics. Which should be avoided?","options":{"A":"Beta-lactams and glycopeptides","B":"Aminoglycosides and fluoroquinolones","C":"Vancomycin","D":"Metronidazole"},"answer":"B","explanation":"Aminoglycosides, fluoroquinolones and macrolides worsen neuromuscular transmission; magnesium should also be avoided.","distractor":"Beta-lactams are generally safe."},
{"id":203,"section":4,"sectionName":"Neurocritical Care","stem":"What is the treatment of myasthenic crisis?","options":{"A":"High-dose pyridostigmine","B":"Immediate thymectomy","C":"Plasma exchange or IVIG","D":"Botulinum antitoxin"},"answer":"C","explanation":"Plasma exchange or IVIG with respiratory support; hold pyridostigmine while ventilated.","distractor":"Increasing pyridostigmine risks cholinergic crisis."},
{"id":204,"section":4,"sectionName":"Neurocritical Care","stem":"A patient has descending paralysis, ptosis, fixed dilated pupils and normal sensation after eating home-canned food. What is the treatment?","options":{"A":"Pyridostigmine and high-dose steroids with close monitoring","B":"Antibiotics alone","C":"IVIG and plasma exchange","D":"Botulinum antitoxin and ventilatory support"},"answer":"D","explanation":"Botulism causes descending symmetric paralysis with autonomic features. Give antitoxin early.","distractor":"GBS is usually ascending with areflexia and no pupillary involvement."},
{"id":205,"section":4,"sectionName":"Neurocritical Care","stem":"When is an ancillary test needed for brain death determination?","options":{"A":"In every patient before brain death determination, as a legal rule","B":"Only when pupils are reactive","C":"When clinical examination or apnoea test cannot be completed","D":"Only in children under 18"},"answer":"C","explanation":"Ancillary tests (cerebral blood flow studies) are needed when confounders prevent complete examination or apnoea testing.","distractor":"Ancillary tests are not required routinely in adults."},
{"id":206,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with suspected meningitis has a GCS of 9 and new seizures. What is correct?","options":{"A":"Give antibiotics immediately, then CT before LP","B":"LP without CT because seizures do not matter","C":"Delay antibiotics until CT and LP are done to avoid sterile CSF","D":"Perform LP first, then antibiotics"},"answer":"A","explanation":"CT before LP is indicated with reduced consciousness, focal deficits, seizures, immunocompromise or papilloedema. Do not delay antibiotics.","distractor":"Delaying antibiotics increases mortality."},
{"id":207,"section":4,"sectionName":"Neurocritical Care","stem":"A patient has fever, confusion and temporal lobe changes on MRI. What is the empirical therapy?","options":{"A":"Oral valacyclovir 1 g daily","B":"IV acyclovir 10 mg/kg every 8 hours","C":"IV acyclovir 5 mg/kg every 24 hours","D":"IV ganciclovir 5 mg/kg daily"},"answer":"B","explanation":"Suspected HSV encephalitis: IV acyclovir 10 mg/kg every 8 hours (adjust for renal function).","distractor":"Oral therapy is inadequate."},
{"id":208,"section":4,"sectionName":"Neurocritical Care","stem":"A young woman has psychiatric symptoms, seizures, orofacial dyskinesia and autonomic instability. What should be searched for?","options":{"A":"Hepatocellular carcinoma","B":"Pituitary adenoma (hypothalamic dysfunction)","C":"Adrenal pheochromocytoma","D":"Ovarian teratoma (anti-NMDA receptor encephalitis)"},"answer":"D","explanation":"Anti-NMDAR encephalitis is associated with ovarian teratoma; tumour removal and immunotherapy improve outcome.","distractor":"Other tumours are not typical."},
{"id":209,"section":4,"sectionName":"Neurocritical Care","stem":"Which tool is validated for delirium screening in ventilated patients?","options":{"A":"Mini-Mental State Examination","B":"Glasgow Coma Scale","C":"RASS alone","D":"CAM-ICU"},"answer":"D","explanation":"CAM-ICU (and ICDSC) are validated for delirium in ventilated, non-verbal patients. CAM-ICU tests acute change or fluctuation, inattention, and either disorganised thinking or altered consciousness. RASS only measures arousal and is the first step; MMSE needs verbal answers and GCS assesses consciousness, not delirium.","distractor":"RASS measures arousal, not delirium."},
{"id":210,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with severe alcohol withdrawal is refractory to high-dose benzodiazepines. What is an evidence-based adjunct?","options":{"A":"Haloperidol monotherapy","B":"Phenobarbital","C":"Dexmedetomidine monotherapy","D":"Gabapentin alone"},"answer":"B","explanation":"Phenobarbital is effective for benzodiazepine-resistant withdrawal; dexmedetomidine controls autonomic symptoms but does not prevent seizures.","distractor":"Dexmedetomidine does not prevent withdrawal seizures."},
{"id":211,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with alcohol use disorder has confusion and nystagmus. What is the treatment?","options":{"A":"High-dose IV thiamine (e.g. 500 mg three times daily)","B":"Thiamine 100 mg orally daily, given after IV dextrose","C":"IV dextrose before thiamine","D":"Folic acid alone"},"answer":"A","explanation":"Wernicke encephalopathy requires high-dose IV thiamine; oral absorption is poor.","distractor":"Glucose alone may worsen Wernicke encephalopathy."},
{"id":212,"section":4,"sectionName":"Neurocritical Care","stem":"A postpartum woman has CVT with a small haemorrhagic infarct. What is the treatment?","options":{"A":"Thrombolysis in all patients","B":"Aspirin only","C":"Anticoagulation with LMWH despite the haemorrhage","D":"Avoid anticoagulation because of the venous haemorrhage"},"answer":"C","explanation":"Anticoagulation is recommended in CVT even with haemorrhagic infarction; endovascular therapy is reserved for deterioration.","distractor":"Haemorrhage is not a contraindication."},
{"id":213,"section":4,"sectionName":"Neurocritical Care","stem":"What MAP target is recommended after acute spinal cord injury?","options":{"A":"No specific MAP target","B":"100–110 mmHg for 14 days","C":"85–90 mmHg for the first 7 days","D":"65 mmHg for 24 hours"},"answer":"C","explanation":"Spinal cord perfusion depends on MAP because autoregulation is lost after injury. The AANS/CNS guidelines suggest MAP 85–90 mmHg for the first 7 days; the 2024 AO Spine guideline accepts a lower limit of 75–80 mmHg for 3–7 days. A MAP of 65 risks secondary ischaemic cord injury.","distractor":"MAP 65 may compromise cord perfusion."},
{"id":214,"section":4,"sectionName":"Neurocritical Care","stem":"Should high-dose methylprednisolone be given after acute spinal cord injury?","options":{"A":"Yes; for all cervical injuries","B":"No; it is not recommended due to harm and lack of benefit","C":"Yes; for 48 hours if started within 3–8 hours of injury","D":"Yes; within 8 hours for 24 hours"},"answer":"B","explanation":"NASCIS-based steroid regimens are not recommended due to infection and complications without proven benefit.","distractor":"The NASCIS protocol is no longer recommended."},
{"id":215,"section":4,"sectionName":"Neurocritical Care","stem":"A T4 SCI patient develops severe headache, BP 210/110 mmHg, bradycardia and flushing above the lesion. What is the first step?","options":{"A":"Sit upright and remove the trigger (e.g. blocked catheter)","B":"Give IV atropine","C":"Give IV labetalol first, then lie the patient flat","D":"Lie flat and give fluids"},"answer":"A","explanation":"Autonomic dysreflexia (injuries above T6): sit up, loosen clothing, relieve bladder or bowel distension; give antihypertensives if persistent.","distractor":"Lying flat worsens hypertension."},
{"id":216,"section":4,"sectionName":"Neurocritical Care","stem":"A patient on haloperidol develops fever, rigidity, autonomic instability and CK 12,000 U/L. What is the treatment?","options":{"A":"Physostigmine","B":"Increase haloperidol","C":"Cyproheptadine orally, and continue haloperidol at a lower dose","D":"Stop haloperidol; supportive care ± dantrolene or bromocriptine"},"answer":"D","explanation":"Neuroleptic malignant syndrome: stop the drug, cool, hydrate; dantrolene and bromocriptine for severe cases.","distractor":"Cyproheptadine is used in serotonin syndrome."},
{"id":217,"section":4,"sectionName":"Neurocritical Care","stem":"A patient on an SSRI and linezolid develops clonus, hyperthermia and agitation. What is the treatment?","options":{"A":"Bromocriptine","B":"Stop serotonergic drugs; benzodiazepines ± cyproheptadine","C":"Dantrolene IV, and continue serotonergic drugs at lower dose","D":"Haloperidol"},"answer":"B","explanation":"Serotonin syndrome: stop drugs, benzodiazepines, cyproheptadine; intubate and paralyse for severe hyperthermia.","distractor":"Bromocriptine may worsen serotonin syndrome."},
{"id":218,"section":4,"sectionName":"Neurocritical Care","stem":"A patient develops quadriparesis and dysarthria 3 days after rapid sodium correction. What is the diagnosis?","options":{"A":"Osmotic demyelination syndrome","B":"GBS","C":"Wernicke encephalopathy","D":"Brainstem stroke"},"answer":"A","explanation":"ODS appears 2–6 days after overly rapid correction of chronic hyponatraemia.","distractor":"Wernicke involves ophthalmoplegia and ataxia."},
{"id":219,"section":4,"sectionName":"Neurocritical Care","stem":"A patient on cyclosporine has seizures and BP 200/110 mmHg; MRI shows posterior vasogenic oedema. What is the diagnosis?","options":{"A":"Brain abscess","B":"HSV encephalitis","C":"Bilateral PCA stroke","D":"PRES"},"answer":"D","explanation":"PRES is associated with hypertension and calcineurin inhibitors; treat with BP control and drug adjustment.","distractor":"Stroke shows restricted diffusion."},
{"id":220,"section":4,"sectionName":"Neurocritical Care","stem":"A ventilated patient has symmetric limb weakness with reduced CMAP and normal sensory potentials. What is the likely diagnosis?","options":{"A":"Critical illness polyneuropathy","B":"GBS","C":"Critical illness myopathy","D":"Myasthenia gravis"},"answer":"C","explanation":"Myopathy shows low CMAP with preserved sensory potentials; polyneuropathy affects both.","distractor":"Polyneuropathy reduces sensory potentials."},
{"id":221,"section":4,"sectionName":"Neurocritical Care","stem":"What is the earliest time for multimodal neuroprognostication after cardiac arrest?","options":{"A":"Immediately after ROSC","B":"7 days after ROSC","C":"24 hours after ROSC, once sedation has been stopped","D":"At least 72 hours after ROSC, excluding confounders"},"answer":"D","explanation":"ERC-ESICM 2021: prognosticate at ≥72 hours after ROSC using multimodal assessment.","distractor":"Early prognostication risks self-fulfilling prophecy."},
{"id":222,"section":4,"sectionName":"Neurocritical Care","stem":"Which finding at 72 hours after cardiac arrest is associated with poor outcome?","options":{"A":"NSE below 30 µg/L","B":"Bilaterally absent N20 SSEP responses","C":"Continuous reactive EEG","D":"Reactive pupils at 72 hours"},"answer":"B","explanation":"Bilaterally absent N20 SSEP is a strong predictor of poor outcome in comatose post-arrest patients.","distractor":"Reactive EEG suggests a favourable outcome."},
{"id":223,"section":4,"sectionName":"Neurocritical Care","stem":"Which sedation strategy is recommended for most ventilated ICU patients?","options":{"A":"Continuous benzodiazepine infusion","B":"Routine neuromuscular blockade","C":"Light sedation (RASS −2 to 0)","D":"Deep sedation for 72 hours"},"answer":"C","explanation":"PADIS 2018 recommends light sedation, which shortens ventilation and ICU stay.","distractor":"Benzodiazepines increase delirium."},
{"id":224,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with TBI has ICP 25 mmHg despite tier 1 measures. What is the next tier step?","options":{"A":"Hyperosmolar therapy and CSF drainage","B":"Barbiturate coma immediately","C":"Decompressive craniectomy immediately","D":"Hypothermia to 32 °C"},"answer":"A","explanation":"SIBICC tiers: tier 1 (head-up, sedation, CSF drainage, osmotherapy), tier 2 (mild hypocapnia, paralysis, MAP challenge), tier 3 (barbiturates, craniectomy, hypothermia).","distractor":"Barbiturates are a tier-3 therapy."},
{"id":225,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with severe TBI has PbtO2 of 12 mmHg with normal ICP. What does this suggest?","options":{"A":"Brain tissue hypoxia requiring intervention","B":"Hyperoxia requiring lower FiO2","C":"Probe malfunction only, so the reading can be ignored","D":"Normal brain tissue oxygenation"},"answer":"A","explanation":"PbtO2 \u003c20 mmHg indicates brain tissue hypoxia (normal about 25–35 mmHg); BOOST-II showed that combined ICP/PbtO2-guided management reduced the burden of brain hypoxia. Check FiO2, Hb, CPP and PaCO2.","distractor":"A PbtO2 of 12 mmHg is well below the normal range of 25–35 mmHg."},
{"id":226,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient's creatinine rises from a baseline of 0.8 to 2.5 mg/dL over 4 days. What is the KDIGO AKI stage?","options":{"A":"Stage 2 (2.0–2.9 times baseline)","B":"Stage 1 (rise of at least 0.3 mg/dL)","C":"Not AKI, because the rise took 4 days","D":"Stage 3 (more than 3 times baseline)"},"answer":"D","explanation":"2.5/0.8 = 3.1 times baseline → stage 3. Creatinine ≥4.0 mg/dL or initiation of RRT also defines stage 3. A rise of ≥1.5 times within 7 days qualifies as AKI.","distractor":"The 48-hour window applies only to the 0.3 mg/dL criterion."},
{"id":227,"section":5,"sectionName":"Renal and Electrolytes","stem":"A 70 kg patient has passed 400 mL of urine over the last 12 hours. What is the KDIGO stage by urine output?","options":{"A":"Stage 3 (\u003c0.3 mL/kg/h for ≥24 hours)","B":"Stage 2 (\u003c0.5 mL/kg/h for ≥12 hours)","C":"No AKI, as urine output is above 0.3 mL/kg/h","D":"Stage 1 (\u003c0.5 mL/kg/h for 6–12 hours)"},"answer":"B","explanation":"400 mL / 12 h / 70 kg ≈ 0.48 mL/kg/h, which is \u003c0.5 mL/kg/h for 12 hours → stage 2.","distractor":"Stage 3 by urine output requires \u003c0.3 mL/kg/h for 24 h or anuria for 12 h."},
{"id":228,"section":5,"sectionName":"Renal and Electrolytes","stem":"An oliguric patient (not on diuretics) has urine Na 10, plasma Na 140 mmol/L, urine creatinine 100 and plasma creatinine 2.0 mg/dL. What is the FENa and its meaning?","options":{"A":"1.4%; suggests acute tubular necrosis","B":"0.14%; suggests acute tubular necrosis","C":"0.14%; suggests a prerenal state","D":"14%; suggests acute interstitial nephritis"},"answer":"C","explanation":"FENa = (UNa × PCr)/(PNa × UCr) × 100 = (10 × 2)/(140 × 100) × 100 ≈ 0.14%. FENa \u003c1% suggests prerenal physiology (also seen in contrast AKI, early obstruction and HRS).","distractor":"ATN usually gives FENa >2%."},
{"id":229,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient on furosemide has urine urea 300 mg/dL, BUN 60 mg/dL, urine creatinine 100 mg/dL and plasma creatinine 2.0 mg/dL. What is the FEUrea?","options":{"A":"10%; suggests prerenal AKI despite diuretics","B":"1%; suggests postrenal obstruction","C":"50%; suggests acute tubular necrosis","D":"10%; suggests acute tubular necrosis rather than prerenal AKI"},"answer":"A","explanation":"FEUrea = (Uurea × PCr)/(BUN × UCr) × 100 = (300 × 2)/(60 × 100) × 100 = 10%. FEUrea \u003c35% indicates prerenal AKI and is less affected by diuretics than FENa.","distractor":"ATN usually gives FEUrea >50%."},
{"id":230,"section":5,"sectionName":"Renal and Electrolytes","stem":"Urine microscopy in an AKI patient after septic shock shows muddy brown granular casts. What is the most likely diagnosis?","options":{"A":"Acute interstitial nephritis","B":"Acute glomerulonephritis","C":"Prerenal azotaemia","D":"Acute tubular necrosis"},"answer":"D","explanation":"Muddy brown granular casts and renal tubular epithelial cells are characteristic of ATN.","distractor":"Prerenal AKI has bland sediment with hyaline casts."},
{"id":231,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with AKI has haematuria, proteinuria and red cell casts. What does this indicate?","options":{"A":"Renal stone","B":"Glomerulonephritis","C":"Acute tubular necrosis","D":"Urinary tract infection"},"answer":"B","explanation":"Red cell casts and dysmorphic red cells indicate glomerular bleeding (GN or vasculitis) and warrant urgent serology and possibly biopsy.","distractor":"Stones cause non-glomerular haematuria without casts."},
{"id":232,"section":5,"sectionName":"Renal and Electrolytes","stem":"Which measure has evidence for reducing contrast-associated AKI in high-risk patients?","options":{"A":"IV sodium bicarbonate instead of saline before contrast","B":"Oral N-acetylcysteine","C":"IV isotonic fluid before and after contrast","D":"Prophylactic haemodialysis after contrast"},"answer":"C","explanation":"IV isotonic fluids are recommended for high-risk patients. PRESERVE showed no benefit of bicarbonate or NAC; prophylactic HD is not beneficial.","distractor":"NAC showed no benefit in PRESERVE."},
{"id":233,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with crush injury has CK 45,000 U/L. What is the main treatment to prevent AKI?","options":{"A":"Mannitol infusion to promote diuresis and flush casts","B":"Immediate prophylactic haemodialysis","C":"Early aggressive isotonic fluids targeting high urine output","D":"Routine sodium bicarbonate infusion"},"answer":"C","explanation":"Early isotonic fluid (targeting urine output of about 200–300 mL/h) is the mainstay. Bicarbonate and mannitol lack evidence of benefit.","distractor":"Routine bicarbonate has no proven benefit."},
{"id":234,"section":5,"sectionName":"Renal and Electrolytes","stem":"A septic patient on vancomycin and piperacillin-tazobactam develops AKI. What is the most appropriate stewardship step?","options":{"A":"Review nephrotoxins and consider an alternative to vancomycin","B":"Continue all drugs and repeat creatinine in a week","C":"Increase vancomycin dose to achieve a trough of 20 mg/L","D":"Add an aminoglycoside for synergy"},"answer":"A","explanation":"The vancomycin + piperacillin-tazobactam combination is associated with higher AKI rates. Use AUC-guided vancomycin dosing or linezolid where appropriate; avoid other nephrotoxins.","distractor":"Aminoglycosides add nephrotoxicity."},
{"id":235,"section":5,"sectionName":"Renal and Electrolytes","stem":"A post-laparotomy patient has IAP 24 mmHg with oliguria. What is the diagnosis?","options":{"A":"Prerenal AKI unrelated to IAP","B":"Intra-abdominal hypertension grade I","C":"Normal postoperative IAP","D":"Abdominal compartment syndrome"},"answer":"D","explanation":"ACS is sustained IAP >20 mmHg with new organ dysfunction. Renal venous congestion reduces GFR.","distractor":"Grade I IAH is 12–15 mmHg."},
{"id":236,"section":5,"sectionName":"Renal and Electrolytes","stem":"A cirrhotic patient meets criteria for HRS-AKI. What is first-line therapy?","options":{"A":"Immediate haemodialysis","B":"Terlipressin plus albumin","C":"Midodrine plus octreotide as first-line","D":"Dopamine plus furosemide"},"answer":"B","explanation":"Terlipressin with albumin (CONFIRM) improves HRS reversal; noradrenaline is an ICU alternative. Midodrine/octreotide is less effective.","distractor":"Midodrine/octreotide is inferior to terlipressin."},
{"id":237,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with decompensated HF and rising creatinine has effective decongestion. How should the creatinine rise be interpreted?","options":{"A":"Indicates hypovolaemia, so give fluids","B":"Often haemodynamic; continue decongestion if clinically improving","C":"Indicates nephrotoxicity, so stop all diuretics immediately","D":"Indicates ATN, so start RRT"},"answer":"B","explanation":"A modest creatinine rise during successful decongestion is not associated with worse outcomes ('pseudo-worsening renal function').","distractor":"Stopping diuretics leaves the patient congested."},
{"id":238,"section":5,"sectionName":"Renal and Electrolytes","stem":"Which is an absolute indication for urgent RRT?","options":{"A":"Creatinine of 3.0 mg/dL","B":"Oliguria for 6 hours in a patient with sepsis","C":"Refractory hyperkalaemia with ECG changes","D":"BUN of 60 mg/dL"},"answer":"C","explanation":"Urgent indications: refractory hyperkalaemia, severe acidosis, refractory fluid overload, uraemic complications, dialysable intoxication.","distractor":"A creatinine value alone is not an indication."},
{"id":239,"section":5,"sectionName":"Renal and Electrolytes","stem":"In STARRT-AKI, what was the effect of accelerated RRT?","options":{"A":"No mortality benefit and more RRT dependence at 90 days","B":"Lower 90-day mortality","C":"Fewer adverse events","D":"Faster renal recovery and less RRT dependence at 90 days"},"answer":"A","explanation":"STARRT-AKI (2020) showed no difference in 90-day mortality and more RRT dependence and adverse events with accelerated initiation.","distractor":"Mortality was not reduced."},
{"id":240,"section":5,"sectionName":"Renal and Electrolytes","stem":"What delivered effluent dose is recommended for CRRT by KDIGO?","options":{"A":"50 mL/kg/h","B":"35–40 mL/kg/h","C":"10–15 mL/kg/h","D":"20–25 mL/kg/h"},"answer":"D","explanation":"ATN and RENAL trials showed no benefit of higher intensity; KDIGO recommends a delivered dose of 20–25 mL/kg/h.","distractor":"Higher doses gave no benefit."},
{"id":241,"section":5,"sectionName":"Renal and Electrolytes","stem":"Which patient most strongly favours CRRT over intermittent HD?","options":{"A":"Stable patient with isolated hyperkalaemia","B":"Lithium overdose with normal haemodynamics","C":"Acute liver failure with cerebral oedema","D":"Chronic dialysis patient with missed session"},"answer":"C","explanation":"CRRT avoids rapid osmotic shifts and haemodynamic instability, preferred in ALF, TBI and unstable patients.","distractor":"IHD is preferable for rapid toxin or potassium removal."},
{"id":242,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient on citrate CRRT has total/ionised calcium ratio 2.8 and worsening acidosis. What is the diagnosis?","options":{"A":"Hypoalbuminaemia artefact","B":"Citrate accumulation","C":"Citrate overload with alkalosis","D":"Inadequate citrate dose"},"answer":"B","explanation":"A ratio >2.5 with low ionised calcium and anion gap acidosis indicates citrate accumulation (often liver failure or shock).","distractor":"Citrate overload causes alkalosis with a normal ratio."},
{"id":243,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient on post-dilution CVVH has frequent filter clotting. What should be checked?","options":{"A":"Filtration fraction (target below 20–25%)","B":"Effluent bag volume","C":"Dialysate potassium concentration","D":"Patient's platelet count and coagulation tests only"},"answer":"A","explanation":"High filtration fraction causes haemoconcentration in the filter; reduce by pre-dilution or increasing blood flow.","distractor":"Dialysate potassium does not affect clotting."},
{"id":244,"section":5,"sectionName":"Renal and Electrolytes","stem":"Which site is preferred for a dialysis catheter according to KDIGO?","options":{"A":"Right subclavian vein","B":"Left subclavian vein","C":"Left internal jugular vein","D":"Right internal jugular vein"},"answer":"D","explanation":"KDIGO: right IJ first, then femoral, then left IJ, with subclavian last (risk of central vein stenosis compromising future access).","distractor":"Subclavian access risks stenosis."},
{"id":245,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with BUN 180 mg/dL develops headache, confusion and seizures during first haemodialysis. What is the diagnosis?","options":{"A":"Hypoglycaemia from dialysis","B":"Air embolism","C":"Dialysis disequilibrium syndrome","D":"Hypercalcaemia"},"answer":"C","explanation":"Rapid urea removal causes osmotic shift and cerebral oedema. Prevent with short, low-efficiency first sessions.","distractor":"Air embolism causes sudden cardiorespiratory collapse."},
{"id":246,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with lithium level 4.8 mmol/L and confusion has eGFR 25. What is the treatment?","options":{"A":"Haemodialysis","B":"Forced diuresis with furosemide","C":"Observation and IV saline only","D":"Activated charcoal"},"answer":"A","explanation":"Lithium is small, unbound and well removed by HD (EXTRIP). Charcoal does not bind lithium.","distractor":"Charcoal is ineffective for lithium."},
{"id":247,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient has K 7.2 mmol/L with wide QRS. What is the correct order of treatment?","options":{"A":"Haemodialysis first, then calcium","B":"Potassium binder first, then calcium","C":"Insulin–glucose first, then calcium, then K removal","D":"Calcium, then insulin–glucose and salbutamol, then K removal"},"answer":"D","explanation":"Stabilise the myocardium with calcium, shift K into cells, then remove K (binders, diuretics, dialysis).","distractor":"Binders act too slowly."},
{"id":248,"section":5,"sectionName":"Renal and Electrolytes","stem":"What insulin regimen is standard for hyperkalaemia?","options":{"A":"50 units regular insulin IV with 50 g glucose","B":"10 units regular insulin IV with 25 g glucose","C":"10 units insulin SC with oral glucose","D":"1 unit insulin IV without glucose"},"answer":"B","explanation":"10 units IV regular insulin with 25 g glucose lowers K by about 0.6–1 mmol/L within 30–60 minutes; monitor glucose. Lower insulin doses (5 units) reduce hypoglycaemia in renal failure.","distractor":"SC insulin has an unpredictable onset."},
{"id":249,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient's hypokalaemia does not correct despite high-dose potassium. What should be checked?","options":{"A":"Serum calcium only","B":"Serum amylase","C":"Serum phosphate only","D":"Serum magnesium"},"answer":"D","explanation":"Hypomagnesaemia causes renal potassium wasting; replace magnesium first.","distractor":"Phosphate does not cause refractory hypokalaemia."},
{"id":250,"section":5,"sectionName":"Renal and Electrolytes","stem":"What is the maximum correction rate for chronic hyponatraemia in a patient at high risk of osmotic demyelination?","options":{"A":"20 mmol/L per 24 hours","B":"12 mmol/L per 24 hours","C":"8 mmol/L per 24 hours","D":"No limit if symptoms are severe"},"answer":"C","explanation":"High-risk features: Na ≤105, hypokalaemia, alcohol use, malnutrition, liver disease. Limit to 8 mmol/L in 24 h.","distractor":"12 mmol/L is too fast for high-risk patients."},
{"id":251,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient's sodium rose 14 mmol/L in 18 hours. What is the management?","options":{"A":"Re-lower with D5W and desmopressin","B":"Continue current therapy","C":"Give furosemide","D":"Give 3% saline to stabilise"},"answer":"A","explanation":"Overcorrection should be reversed with D5W and desmopressin to reduce osmotic demyelination risk.","distractor":"Continuing allows further overcorrection."},
{"id":252,"section":5,"sectionName":"Renal and Electrolytes","stem":"A 70 kg man has Na 162 mmol/L. What is his estimated free water deficit?","options":{"A":"About 9.9 L","B":"About 6.6 L","C":"About 3.3 L","D":"About 1.5 L"},"answer":"B","explanation":"FWD = 0.6 × 70 × (162/140 − 1) = 42 × 0.157 ≈ 6.6 L. Replace gradually, adding ongoing losses.","distractor":"3.3 L halves the calculation."},
{"id":253,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with polyuria has urine osmolality 600 mOsm/kg and glucose 650 mg/dL. What is the cause?","options":{"A":"Nephrogenic diabetes insipidus","B":"Osmotic diuresis from glucose","C":"Primary polydipsia","D":"Central diabetes insipidus"},"answer":"B","explanation":"Diabetes insipidus produces dilute urine (\u003c300 mOsm/kg); high urine osmolality with polyuria indicates solute diuresis.","distractor":"DI gives dilute urine."},
{"id":254,"section":5,"sectionName":"Renal and Electrolytes","stem":"Which finding is required for SIAD diagnosis?","options":{"A":"Hypertonic hyponatraemia","B":"Hypovolaemia with low urine sodium and high urine osmolality","C":"Euvolaemia with urine osmolality >100 and urine Na >30","D":"Hypervolaemia with oedema"},"answer":"C","explanation":"SIAD: hypotonic hyponatraemia, inappropriately concentrated urine, urine Na >30, euvolaemia, normal thyroid and adrenal function.","distractor":"Hypovolaemia excludes SIAD."},
{"id":255,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient has calcium 15 mg/dL and confusion from malignancy. What is first-line therapy?","options":{"A":"Furosemide first, before any IV fluids, then a bisphosphonate","B":"Oral phosphate supplements","C":"Calcium channel blocker","D":"IV isotonic saline, then calcitonin and a bisphosphonate"},"answer":"D","explanation":"Volume repletion first; calcitonin acts quickly; bisphosphonates (or denosumab in renal failure) act over days.","distractor":"Loop diuretics before volume repletion worsen hypovolaemia."},
{"id":256,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient has tetany and ionised calcium 0.8 mmol/L. What is the treatment?","options":{"A":"IV calcium gluconate 1–2 g over 10 minutes, then infusion","B":"IV magnesium only","C":"IV calcium chloride via a peripheral line as a rapid bolus","D":"Oral calcium carbonate only"},"answer":"A","explanation":"Symptomatic hypocalcaemia: calcium gluconate IV; correct magnesium too.","distractor":"Calcium chloride peripherally risks tissue necrosis."},
{"id":257,"section":5,"sectionName":"Renal and Electrolytes","stem":"A malnourished patient develops weakness and respiratory failure 3 days after starting feeding. Phosphate is 0.3 mmol/L. What is the treatment?","options":{"A":"IV phosphate and reduce feeding rate","B":"Increase feeding to full target","C":"Oral phosphate only and continue feeding","D":"Stop feeding for 7 days"},"answer":"A","explanation":"Refeeding hypophosphataemia: IV phosphate and slow feeding, then gradual increase.","distractor":"Increasing feeding worsens hypophosphataemia."},
{"id":258,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with renal failure taking magnesium-containing laxatives has Mg 9 mg/dL, hypotension and loss of reflexes. What is the treatment?","options":{"A":"Oral sodium bicarbonate","B":"Observation only","C":"IV calcium and haemodialysis","D":"IV magnesium antagonist naloxone"},"answer":"C","explanation":"Severe hypermagnesaemia: calcium antagonises effects; dialysis removes magnesium.","distractor":"Naloxone has no effect on magnesium."},
{"id":259,"section":5,"sectionName":"Renal and Electrolytes","stem":"A vomiting patient has metabolic alkalosis with urine chloride 8 mmol/L. What is the treatment?","options":{"A":"Spironolactone","B":"Hydrochloric acid infusion first-line","C":"Acetazolamide alone, without volume replacement","D":"Isotonic saline with potassium chloride"},"answer":"D","explanation":"Chloride-responsive alkalosis (urine Cl \u003c20) improves with saline and KCl.","distractor":"Acetazolamide is used in volume-overloaded alkalosis."},
{"id":260,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with suspected methanol poisoning has pH 7.08 and visual disturbance. What is the management?","options":{"A":"Bicarbonate alone","B":"Fomepizole and haemodialysis","C":"Ethanol alone","D":"Fomepizole alone until levels fall"},"answer":"B","explanation":"Severe toxic alcohol poisoning (visual changes, severe acidosis) needs HD to remove formate plus fomepizole.","distractor":"Fomepizole alone does not remove toxic metabolites."},
{"id":261,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with salicylate level 105 mg/dL and confusion. What is the management?","options":{"A":"Activated charcoal only","B":"Haemodialysis with urinary alkalinisation meanwhile","C":"Urinary alkalinisation alone, without dialysis","D":"Intubation to normocapnia"},"answer":"B","explanation":"EXTRIP: altered mental status or level >100 mg/dL warrants dialysis.","distractor":"Intubation without maintaining hyperventilation worsens acidosis."},
{"id":262,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient on metformin has lactate 22 mmol/L and pH 6.9. What is the management?","options":{"A":"Haemodialysis","B":"Activated charcoal","C":"Bicarbonate infusion alone","D":"Observation"},"answer":"A","explanation":"EXTRIP recommends HD for metformin-associated lactic acidosis with lactate >20 or pH ≤7.0.","distractor":"Bicarbonate does not remove metformin."},
{"id":263,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with G6PD deficiency develops tumour lysis syndrome. Which drug is contraindicated?","options":{"A":"Allopurinol","B":"IV fluids","C":"Rasburicase","D":"Calcium gluconate for symptomatic hypocalcaemia"},"answer":"C","explanation":"Rasburicase produces hydrogen peroxide, causing haemolysis and methaemoglobinaemia in G6PD deficiency.","distractor":"Allopurinol is safe."},
{"id":264,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient has pulmonary haemorrhage and RPGN with anti-GBM antibodies. What is the treatment?","options":{"A":"High-dose steroids alone, without plasma exchange","B":"Rituximab alone","C":"Observation","D":"Plasma exchange, steroids and cyclophosphamide"},"answer":"D","explanation":"Anti-GBM disease requires plasma exchange plus immunosuppression.","distractor":"Steroids alone are insufficient."},
{"id":265,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient given large volumes of 0.9% saline develops normal anion gap acidosis. What is the mechanism?","options":{"A":"Renal tubular acidosis","B":"Lactate accumulation","C":"Hyperchloraemia reducing the strong ion difference","D":"Ketone production from starvation during illness"},"answer":"C","explanation":"Saline has an SID of 0; large volumes decrease plasma SID causing acidosis.","distractor":"Lactate would raise the anion gap."},
{"id":266,"section":5,"sectionName":"Renal and Electrolytes","stem":"What did SMART show for balanced crystalloids versus saline?","options":{"A":"Lower mortality with saline","B":"No difference in any outcome","C":"More AKI and more RRT with balanced crystalloids","D":"Fewer major adverse kidney events with balanced crystalloids"},"answer":"D","explanation":"SMART (2018): balanced crystalloids reduced MAKE30 (14.3% vs 15.4%).","distractor":"Saline showed more kidney events."},
{"id":267,"section":5,"sectionName":"Renal and Electrolytes","stem":"In a euvolaemic AKI patient, furosemide 1 mg/kg produces 120 mL urine in 2 hours. What does this indicate?","options":{"A":"Low risk of progression","B":"High risk of progression to stage 3 AKI","C":"Need for immediate RRT","D":"Prerenal state that will respond to more fluid"},"answer":"B","explanation":"Furosemide stress test: \u003c200 mL in 2 h predicts progression.","distractor":"The test predicts progression; it is not itself an indication for RRT."},
{"id":268,"section":5,"sectionName":"Renal and Electrolytes","stem":"What is the role of [TIMP-2]·[IGFBP7] in AKI?","options":{"A":"Predicts risk of moderate–severe AKI within 12 hours","B":"Excludes all AKI when low","C":"Measures GFR directly in patients with unstable creatinine","D":"Diagnoses glomerulonephritis"},"answer":"A","explanation":"Values >0.3 indicate increased risk of AKI; PrevAKI used it to guide KDIGO bundles.","distractor":"It does not measure GFR."},
{"id":269,"section":5,"sectionName":"Renal and Electrolytes","stem":"Which statement about sepsis-associated AKI is correct?","options":{"A":"It is prevented by low-dose dopamine","B":"It never recovers","C":"It is always due to reduced renal blood flow and hypoperfusion","D":"It can occur with normal or increased renal blood flow"},"answer":"D","explanation":"SA-AKI involves inflammation, microvascular dysfunction and tubular injury, not only hypoperfusion.","distractor":"Low-dose dopamine is ineffective."},
{"id":270,"section":5,"sectionName":"Renal and Electrolytes","stem":"Does low-dose dopamine prevent AKI in critically ill patients?","options":{"A":"Yes; it prevents AKI in septic shock at 2–3 µg/kg/min","B":"No; it does not prevent AKI or reduce RRT","C":"Yes; at 2–3 µg/kg/min","D":"Yes; after cardiac surgery"},"answer":"B","explanation":"The ANZICS trial and meta-analyses show no renal protection.","distractor":"Renal-dose dopamine is ineffective."},
{"id":271,"section":5,"sectionName":"Renal and Electrolytes","stem":"Does mannitol prevent AKI?","options":{"A":"No; it is not recommended for AKI prevention","B":"Yes; in contrast nephropathy","C":"Yes; in sepsis","D":"Yes; it prevents AKI in all high-risk surgical patients"},"answer":"A","explanation":"Mannitol has no proven benefit and can cause osmotic nephrosis.","distractor":"It may worsen kidney injury."},
{"id":272,"section":5,"sectionName":"Renal and Electrolytes","stem":"In BICAR-ICU, which subgroup benefited from bicarbonate?","options":{"A":"Patients with normal renal function","B":"Patients with pH 7.25–7.30","C":"Patients with AKI (AKIN 2–3)","D":"Patients with lactate >4 mmol/L only"},"answer":"C","explanation":"Bicarbonate reduced 28-day mortality and RRT in AKI patients with pH ≤7.20.","distractor":"No benefit was shown in the overall population."},
{"id":273,"section":5,"sectionName":"Renal and Electrolytes","stem":"When should RRT discontinuation be considered?","options":{"A":"Only after diuretic challenge fails","B":"When spontaneous urine output exceeds about 400 mL/day","C":"After 7 days of RRT regardless of urine output","D":"Only when creatinine is normal"},"answer":"B","explanation":"Urine output >400 mL/day without diuretics predicts successful discontinuation.","distractor":"Creatinine normalisation is not required."},
{"id":274,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient survives AKI requiring RRT. What follow-up is recommended?","options":{"A":"No follow-up if creatinine normalises","B":"Follow-up only if dialysis continues","C":"Renal follow-up for CKD and AKI risk","D":"Routine renal biopsy"},"answer":"C","explanation":"Survivors of AKI, especially after RRT, have a higher risk of CKD, end-stage kidney disease, recurrent AKI and death, even when creatinine returns to baseline. KDIGO advises review at about 3 months to reassess kidney function, proteinuria and nephrotoxic drug exposure.","distractor":"Normal creatinine does not exclude CKD risk."},
{"id":275,"section":5,"sectionName":"Renal and Electrolytes","stem":"After relief of bilateral obstruction, a patient produces 500 mL/h urine. What is the risk?","options":{"A":"Nephrotic syndrome","B":"Acute glomerulonephritis","C":"Renal artery thrombosis from sudden pressure change","D":"Post-obstructive diuresis with volume and electrolyte depletion"},"answer":"D","explanation":"Monitor fluids and electrolytes; replace a portion of losses.","distractor":"Glomerulonephritis is unrelated."},
{"id":276,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient has dark urine, dipstick positive for blood, no RBCs, and pink plasma. What is the cause?","options":{"A":"Haemoglobinuria from haemolysis","B":"Glomerular haematuria","C":"Myoglobinuria from rhabdomyolysis","D":"Bilirubinuria"},"answer":"A","explanation":"Pink plasma indicates free haemoglobin; myoglobin is cleared rapidly so plasma is clear.","distractor":"Myoglobin does not discolour plasma."},
{"id":277,"section":5,"sectionName":"Renal and Electrolytes","stem":"Envelope-shaped crystals are seen in urine. What toxin is likely?","options":{"A":"Methanol","B":"Isopropanol","C":"Ethanol","D":"Ethylene glycol"},"answer":"D","explanation":"Calcium oxalate crystals are typical of ethylene glycol poisoning.","distractor":"Methanol does not cause oxalate crystals."},
{"id":278,"section":5,"sectionName":"Renal and Electrolytes","stem":"Na 140, Cl 108, HCO3 14 mmol/L, albumin 1.5 g/dL. What is the albumin-corrected anion gap?","options":{"A":"18 mmol/L","B":"About 24 mmol/L","C":"30 mmol/L","D":"12 mmol/L"},"answer":"B","explanation":"AG = 140 − 122 = 18; corrected = 18 + 2.5 × (4.0 − 1.5) ≈ 24.","distractor":"18 is uncorrected."},
{"id":279,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with AKI receives gentamicin. How should dosing be adjusted?","options":{"A":"No adjustment is needed","B":"Increase each dose to maintain peak concentrations","C":"Extend the dosing interval guided by drug levels","D":"Give continuous infusion"},"answer":"C","explanation":"Aminoglycosides are concentration-dependent; toxicity relates to sustained troughs, so extend intervals.","distractor":"Continuous infusion increases toxicity."},
{"id":280,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient on CRRT receives meropenem. What is the dosing principle?","options":{"A":"Full loading dose; maintenance adjusted for CRRT clearance","B":"Reduced loading dose, as for patients with ESRD","C":"Single daily dose only","D":"No dose adjustment ever"},"answer":"A","explanation":"Loading doses are not reduced; CRRT clears beta-lactams significantly; use TDM where possible.","distractor":"ESRD dosing underdoses patients on CRRT."},
{"id":281,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient with crush injury has K 6.5 mmol/L and oliguria despite fluids. What is the next step?","options":{"A":"Bicarbonate infusion alone","B":"Mannitol","C":"Observation","D":"Urgent RRT"},"answer":"D","explanation":"Refractory hyperkalaemia and oliguria in rhabdomyolysis require RRT.","distractor":"Mannitol does not treat hyperkalaemia."},
{"id":282,"section":5,"sectionName":"Renal and Electrolytes","stem":"A patient has hypokalaemia, metabolic alkalosis, hypertension and urine Cl 40 mmol/L. What is the likely cause?","options":{"A":"Diarrhoea","B":"Vomiting","C":"Mineralocorticoid excess","D":"Renal tubular acidosis"},"answer":"C","explanation":"Chloride-resistant alkalosis with hypertension suggests hyperaldosteronism or Cushing syndrome.","distractor":"Vomiting causes low urine chloride."},
{"id":283,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with pneumonia has bilateral infiltrates within 1 week, PaO2/FiO2 150 on PEEP 8 cmH2O, and no cardiac failure. What is the Berlin ARDS category?","options":{"A":"Moderate ARDS","B":"Severe ARDS","C":"Not ARDS, because the cause is pneumonia","D":"Mild ARDS"},"answer":"A","explanation":"Berlin: mild 200–300, moderate 100–200, severe ≤100 (all with PEEP ≥5). Pneumonia is the commonest direct cause of ARDS.","distractor":"Severe ARDS requires PaO2/FiO2 ≤100."},
{"id":284,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What is the predicted body weight of a 175 cm man?","options":{"A":"About 62 kg","B":"About 70 kg","C":"About 80 kg","D":"His actual body weight"},"answer":"B","explanation":"PBW (men) = 50 + 0.91 × (height cm − 152.4) = 50 + 0.91 × 22.6 ≈ 70.6 kg. Tidal volume should be 6 mL/kg PBW.","distractor":"Actual weight overestimates lung size in obese patients."},
{"id":285,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient on volume control has Vt 420 mL, plateau 32 cmH2O and PEEP 12 cmH2O. What is the driving pressure and its implication?","options":{"A":"20 cmH2O; acceptable because the plateau pressure is under 35","B":"32 cmH2O; increase PEEP to lower it","C":"12 cmH2O; no change needed","D":"20 cmH2O; reduce tidal volume, as driving pressure above 15 is harmful"},"answer":"D","explanation":"Driving pressure = Pplat − PEEP. Amato 2015 linked ΔP >15 cmH2O with mortality; plateau should be ≤30.","distractor":"Plateau 32 also exceeds the 30 cmH2O target."},
{"id":286,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A ventilated patient has peak pressure 45 cmH2O and plateau 18 cmH2O. What is the most likely cause?","options":{"A":"Pneumothorax","B":"Mainstem intubation","C":"Increased airway resistance such as bronchospasm or tube obstruction","D":"Reduced lung compliance from pulmonary oedema or ARDS"},"answer":"C","explanation":"A large peak–plateau gap means resistive pressure. Compliance problems raise both peak and plateau.","distractor":"Pneumothorax raises plateau pressure too."},
{"id":287,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which intervention in severe ARDS (PaO2/FiO2 \u003c150) has a mortality benefit from PROSEVA?","options":{"A":"Prone positioning for 4 hours daily in all ARDS patients","B":"Prone positioning for at least 16 hours daily","C":"Inhaled nitric oxide","D":"High-frequency oscillatory ventilation"},"answer":"B","explanation":"PROSEVA (2013): prone ≥16 h/day reduced 28-day mortality (16% vs 33%). iNO improves oxygenation but not survival; HFOV increased mortality (OSCILLATE).","distractor":"Short prone sessions showed no benefit in earlier trials."},
{"id":288,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What was the main finding of the ART trial (2017)?","options":{"A":"Aggressive recruitment with titrated PEEP increased mortality","B":"Recruitment manoeuvres reduced mortality","C":"High PEEP with recruitment reduced barotrauma and mortality","D":"Recruitment had no adverse effects"},"answer":"A","explanation":"ART used stepwise recruitment to 45 cmH2O and found higher 28-day mortality and barotrauma; routine aggressive recruitment is not recommended.","distractor":"Barotrauma increased."},
{"id":289,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"In early severe ARDS, ACURASYS showed benefit of neuromuscular blockade. What did ROSE (2019) show?","options":{"A":"Mortality reduction with cisatracurium","B":"Increased ICU-acquired weakness reduction","C":"Benefit of cisatracurium only when controls received deep sedation","D":"No mortality benefit of routine early cisatracurium with lighter sedation controls"},"answer":"D","explanation":"ROSE found no difference in 90-day mortality; NMB is reserved for refractory asynchrony or hypoxaemia.","distractor":"ROSE did not reproduce ACURASYS."},
{"id":290,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which patient best meets EOLIA-style criteria for VV-ECMO?","options":{"A":"PaO2/FiO2 \u003c50 for 3 hours despite optimal ventilation and proning","B":"Mild ARDS with pH 7.32","C":"Severe ARDS after 14 days of high-pressure, high-FiO2 ventilation","D":"PaO2/FiO2 180 on PEEP 10"},"answer":"A","explanation":"EOLIA entry: PaO2/FiO2 \u003c50 for >3 h, \u003c80 for >6 h, or pH \u003c7.25 with PaCO2 ≥60 for >6 h. Prolonged injurious ventilation is a relative contraindication.","distractor":"Ventilation >7 days at high settings reduces ECMO benefit."},
{"id":291,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient on VV-ECMO has persistent hypoxaemia with good circuit flow. Pre- and post-oxygenator blood gases are similar. What is the likely cause?","options":{"A":"Low cardiac output","B":"Oxygenator failure","C":"Excess sweep gas","D":"Recirculation"},"answer":"B","explanation":"Low post-oxygenator PO2 indicates membrane failure; recirculation shows high pre-oxygenator saturation.","distractor":"Recirculation increases pre-oxygenator saturation."},
{"id":292,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient on VV-ECMO has rising pre-oxygenator SpO2 and falling patient SaO2 after the cannulas move closer. What is the problem?","options":{"A":"Oxygenator thrombosis with reduced gas transfer across the membrane","B":"Haemolysis","C":"Recirculation between drainage and return cannulas","D":"Increased native lung function"},"answer":"C","explanation":"Recirculation returns oxygenated blood to the drainage cannula; increasing cannula distance or using a dual-lumen cannula helps.","distractor":"Native lung recovery improves patient saturation."},
{"id":293,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A ventilated asthmatic becomes hypotensive with high plateau pressure. What is the first action?","options":{"A":"Disconnect from the ventilator briefly to allow exhalation","B":"Increase PEEP to 15 cmH2O","C":"Give a fluid bolus first, then increase respiratory rate","D":"Increase respiratory rate"},"answer":"A","explanation":"Dynamic hyperinflation (auto-PEEP) causes hypotension; disconnection allows exhalation. Then reduce rate and Vt, prolong expiration.","distractor":"Increasing rate worsens air trapping."},
{"id":294,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"How is intrinsic PEEP measured in a passive ventilated patient?","options":{"A":"End-inspiratory hold manoeuvre","B":"End-expiratory hold manoeuvre","C":"Spontaneous breathing trial","D":"Measuring peak pressure"},"answer":"B","explanation":"An expiratory hold allows alveolar and circuit pressures to equilibrate, revealing total PEEP; intrinsic PEEP = total − set PEEP.","distractor":"Inspiratory hold measures plateau pressure."},
{"id":295,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A COPD patient has pH 7.28, PaCO2 70 mmHg, RR 28. What is first-line therapy?","options":{"A":"Oxygen to SpO2 98%","B":"Immediate intubation","C":"High-flow nasal oxygen as first choice","D":"Non-invasive ventilation"},"answer":"D","explanation":"NIV reduces intubation and mortality in hypercapnic COPD exacerbation with pH 7.25–7.35. Target SpO2 88–92%.","distractor":"High-flow is an alternative but NIV is first-line."},
{"id":296,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"In COPD exacerbation, how long should systemic steroids typically be given?","options":{"A":"14 days","B":"Not at all","C":"About 5 days","D":"21 days"},"answer":"C","explanation":"REDUCE trial: 5 days of prednisone was non-inferior to 14 days.","distractor":"Longer courses add adverse effects."},
{"id":297,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What did FLORALI (2015) suggest in non-hypercapnic acute hypoxaemic respiratory failure?","options":{"A":"All modalities had equal mortality","B":"NIV reduced intubation and mortality compared with HFNO","C":"Standard oxygen was superior to both HFNO and NIV for intubation","D":"High-flow nasal oxygen reduced 90-day mortality versus NIV or standard oxygen"},"answer":"D","explanation":"HFNO reduced 90-day mortality; NIV via face mask had higher mortality in this population.","distractor":"NIV was not superior."},
{"id":298,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient on HFNO has ROX index 3.5 at 12 hours. What does this suggest?","options":{"A":"Need to increase flow only, with low risk of failure","B":"High risk of HFNO failure; consider intubation","C":"Readiness to wean","D":"Low risk of failure"},"answer":"B","explanation":"ROX = (SpO2/FiO2)/RR. ≥4.88 predicts success; \u003c3.85 at 12 h predicts failure.","distractor":"A low ROX predicts failure."},
{"id":299,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What is a contraindication to NIV?","options":{"A":"Inability to protect the airway with copious secretions","B":"Immunocompromised patient","C":"Cardiogenic pulmonary oedema","D":"Hypercapnic respiratory failure with pH 7.28"},"answer":"A","explanation":"Contraindications: cardiac arrest, airway unprotected, facial trauma, uncontrolled vomiting, untreated pneumothorax.","distractor":"Cardiogenic oedema is an indication."},
{"id":300,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with cardiogenic pulmonary oedema is hypoxaemic. What is the benefit of CPAP?","options":{"A":"Increases LV afterload, worsening pulmonary oedema","B":"Increases preload","C":"Reduces intubation and improves oxygenation","D":"Has no evidence of benefit"},"answer":"C","explanation":"CPAP reduces LV afterload and preload, recruits alveoli and reduces intubation.","distractor":"Positive pressure reduces LV afterload."},
{"id":301,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient passes a 30-minute SBT on pressure support 5/PEEP 5. What is the next step?","options":{"A":"Continue the SBT for 24 hours before deciding","B":"Increase sedation","C":"Tracheostomy","D":"Assess airway protection and secretions, then extubate"},"answer":"D","explanation":"Successful SBT plus adequate cough, secretions and mental status → extubation.","distractor":"Prolonged SBT is unnecessary."},
{"id":302,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What is the RSBI and its threshold?","options":{"A":"RR × Vt; \u003c10 predicts success","B":"Vt/PBW; \u003c6 predicts success","C":"RR/Vt (L); \u003c105 predicts weaning success","D":"Vt/RR; values above 105 predict weaning success"},"answer":"C","explanation":"Rapid shallow breathing index = RR ÷ Vt in litres; >105 predicts failure.","distractor":"The ratio is RR divided by Vt."},
{"id":303,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A high-risk patient (age >65, heart disease) is extubated. What reduces reintubation?","options":{"A":"Delaying extubation for 48 hours after a successful SBT","B":"Prophylactic NIV or NIV alternating with HFNO","C":"Standard oxygen only","D":"Prophylactic steroids in all patients"},"answer":"B","explanation":"HIGH-WEAN: NIV + HFNO reduced reintubation versus HFNO alone in high-risk patients.","distractor":"Standard oxygen is inferior in high-risk patients."},
{"id":304,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient fails a cuff leak test before extubation. What can reduce post-extubation stridor?","options":{"A":"IV methylprednisolone at least 4 hours before extubation","B":"Furosemide","C":"Racemic adrenaline nebulised routinely before extubation","D":"Immediate extubation"},"answer":"A","explanation":"Steroids given ≥4 h before extubation reduce laryngeal oedema in high-risk patients.","distractor":"Racemic adrenaline treats stridor after extubation."},
{"id":305,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Post-extubation stridor develops. What should be avoided?","options":{"A":"Heliox to reduce turbulent flow while awaiting response","B":"Using NIV to delay reintubation in established respiratory failure","C":"Steroids","D":"Nebulised adrenaline"},"answer":"B","explanation":"NIV in established post-extubation failure increases mortality from delayed reintubation (Esteban 2004).","distractor":"Heliox is a reasonable temporizing measure."},
{"id":306,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which strategy reduces ventilator-associated events?","options":{"A":"Prophylactic antibiotics for all","B":"Supine flat positioning","C":"Daily sedation interruption paired with SBT","D":"Routine ventilator circuit changes every 24 hours"},"answer":"C","explanation":"ABC trial: paired SAT/SBT reduced ventilator days and mortality. Head elevation 30–45° and subglottic suctioning help.","distractor":"Routine circuit changes increase VAP."},
{"id":307,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A ventilated patient develops fever and new infiltrate with purulent secretions after 6 days. Which sample is appropriate?","options":{"A":"Endotracheal aspirate or BAL with semi-quantitative culture","B":"Blood cultures only, as respiratory samples are contaminated","C":"Sputum Gram stain only","D":"Urine antigen only"},"answer":"A","explanation":"Respiratory sampling guides antibiotics; IDSA prefers non-invasive semi-quantitative cultures.","distractor":"Blood cultures alone are insensitive."},
{"id":308,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"For VAP, how long is antibiotic therapy typically?","options":{"A":"21 days","B":"14 days","C":"3 days","D":"7 days"},"answer":"D","explanation":"IDSA/ATS recommend 7 days for most VAP; longer for complications.","distractor":"Longer courses increase resistance."},
{"id":309,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with massive PE has hypotension. What is first-line therapy?","options":{"A":"Systemic thrombolysis","B":"IVC filter","C":"Fluids up to 4 L","D":"Unfractionated heparin alone"},"answer":"A","explanation":"High-risk PE: systemic thrombolysis unless contraindicated; surgical or catheter therapy if contraindicated.","distractor":"Large fluid volumes worsen RV failure."},
{"id":310,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"An intermediate-high risk PE patient (RV dysfunction, positive troponin, normotensive). What is the management?","options":{"A":"Immediate full-dose systemic thrombolysis in all such patients","B":"IVC filter","C":"Discharge home","D":"Anticoagulation with close monitoring; rescue thrombolysis if deterioration"},"answer":"D","explanation":"PEITHO: thrombolysis reduced decompensation but increased bleeding; not routine.","distractor":"Routine thrombolysis increased major bleeding."},
{"id":311,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with PE has hypotension and RV failure. Which intubation approach is safest?","options":{"A":"Rapid sequence induction with full-dose propofol, then high PEEP","B":"Give a large fluid bolus before induction to fill the dilated right ventricle","C":"Avoid or delay intubation; use haemodynamically stable induction and vasopressor support","D":"High PEEP after intubation"},"answer":"C","explanation":"Positive pressure and induction can cause RV collapse; optimise with noradrenaline.","distractor":"High PEEP increases RV afterload."},
{"id":312,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"In massive haemoptysis, how should the patient be positioned?","options":{"A":"Bleeding side up","B":"Bleeding side down","C":"Supine flat","D":"Prone"},"answer":"B","explanation":"Place the patient bleeding side down (lateral decubitus) so blood stays in the affected lung and does not spill into the healthy lung, preserving gas exchange. Then secure the airway (large ETT, or selective intubation of the non-bleeding lung) and arrange bronchoscopy and bronchial artery embolisation.","distractor":"Bleeding side up floods the good lung."},
{"id":313,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What is the definitive treatment of massive haemoptysis from bronchial artery?","options":{"A":"Bronchial artery embolisation","B":"Bronchoscopic biopsy","C":"Observation","D":"Oral tranexamic acid alone"},"answer":"A","explanation":"Bronchial arteries cause most massive haemoptysis; embolisation is first-line.","distractor":"TXA alone is insufficient."},
{"id":314,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with large unilateral pneumothorax is ventilated and hypotensive with tracheal deviation. What is the immediate action?","options":{"A":"Increase PEEP","B":"Urgent chest X-ray to confirm before intervention","C":"Needle or finger decompression","D":"CT chest"},"answer":"C","explanation":"Tension pneumothorax is a clinical diagnosis; decompress immediately.","distractor":"Imaging delays treatment."},
{"id":315,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient has a persistent air leak via chest drain after 5 days. What is the next step?","options":{"A":"Increase suction to maximum","B":"Clamp the drain","C":"Remove the drain","D":"Thoracic surgical referral"},"answer":"D","explanation":"A persistent air leak lasting more than 3–5 days usually means a bronchopleural fistula or a non-healing leak that is unlikely to close by itself. It needs thoracic surgical review (VATS, pleurodesis or endobronchial valves). Clamping a bubbling drain can cause tension pneumothorax, and maximal suction may keep the leak open.","distractor":"Clamping a bubbling drain risks tension."},
{"id":316,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient has a parapneumonic effusion with pH 7.0 and glucose 30 mg/dL. What is management?","options":{"A":"Observation","B":"Chest tube drainage","C":"Therapeutic thoracentesis once","D":"Antibiotics alone"},"answer":"B","explanation":"pH \u003c7.2 or glucose \u003c60 indicates complicated effusion requiring drainage.","distractor":"Antibiotics alone are insufficient."},
{"id":317,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which intrapleural therapy for empyema improved drainage in MIST-2?","options":{"A":"Streptokinase","B":"DNase alone","C":"tPA alone","D":"tPA plus DNase"},"answer":"D","explanation":"MIST-2: combined tPA/DNase improved radiographic drainage and reduced surgery.","distractor":"Single agents were ineffective."},
{"id":318,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A ventilated patient has severe hypoxaemia, high plateau pressure and absent lung sliding with a lung point on ultrasound. What is the diagnosis?","options":{"A":"Pneumothorax","B":"Atelectasis","C":"Pleural effusion","D":"Consolidation"},"answer":"A","explanation":"Absent lung sliding with no B-lines suggests pneumothorax; the lung point, where sliding lung meets the free air, is about 100% specific. Atelectasis keeps a lung pulse, effusion shows an anechoic space, and consolidation shows tissue-like lung with air bronchograms.","distractor":"Atelectasis shows a lung pulse."},
{"id":319,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Lung ultrasound shows multiple B-lines bilaterally. What does this indicate?","options":{"A":"Pleural effusion only, without lung involvement","B":"Interstitial syndrome such as pulmonary oedema","C":"Pneumothorax","D":"Normal lung"},"answer":"B","explanation":"≥3 B-lines per intercostal space indicates interstitial fluid.","distractor":"A-lines indicate normal or pneumothorax."},
{"id":320,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which mode targets ventilation by proportional assist?","options":{"A":"APRV","B":"PRVC","C":"PAV+","D":"SIMV"},"answer":"C","explanation":"PAV+ measures resistance and compliance continuously and delivers pressure in proportion to the patient's instantaneous effort, so support follows demand breath by breath. APRV uses two time-cycled pressure levels, PRVC adjusts inspiratory pressure to reach a set tidal volume, and SIMV mixes mandatory and spontaneous breaths.","distractor":"PRVC adjusts pressure to a target volume."},
{"id":321,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which ventilator waveform suggests ineffective triggering?","options":{"A":"Premature cycling","B":"Flow deflection without a delivered breath","C":"Reverse triggering","D":"Double triggering, with two breaths for one patient effort"},"answer":"B","explanation":"Patient effort fails to trigger; often from auto-PEEP or high trigger sensitivity.","distractor":"Double triggering produces two breaths."},
{"id":322,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"In APRV, what is the principle?","options":{"A":"Low PEEP with high tidal volumes","B":"High-frequency oscillation","C":"Mandatory ventilation that does not allow spontaneous breathing","D":"High CPAP with brief releases for CO2 clearance"},"answer":"D","explanation":"APRV maintains high pressure with short releases, allowing spontaneous breathing.","distractor":"Spontaneous breathing is encouraged."},
{"id":323,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient on HFNO for COVID-19 hypoxaemia. Which intervention reduced intubation in awake patients?","options":{"A":"Restrictive fluids only","B":"Routine NMB","C":"Awake prone positioning","D":"Inhaled prostacyclin"},"answer":"C","explanation":"Meta-trial (Ehrmann 2021) showed reduced intubation with awake prone positioning.","distractor":"NMB requires intubation."},
{"id":324,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which drug reduced mortality in COVID-19 patients needing oxygen?","options":{"A":"Dexamethasone 6 mg daily","B":"Azithromycin","C":"Lopinavir-ritonavir","D":"Hydroxychloroquine"},"answer":"A","explanation":"RECOVERY: dexamethasone reduced mortality in oxygen-requiring patients.","distractor":"Hydroxychloroquine showed no benefit."},
{"id":325,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"In severe CAP, what did CAPE COD (2023) show?","options":{"A":"No effect on mortality","B":"Benefit only in patients with influenza pneumonia","C":"Hydrocortisone increased mortality","D":"Hydrocortisone reduced 28-day mortality"},"answer":"D","explanation":"Hydrocortisone 200 mg/day reduced mortality in severe CAP; influenza and septic shock were excluded.","distractor":"Influenza was excluded."},
{"id":326,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with ARDS has a positive fluid balance. What did FACTT show?","options":{"A":"Conservative fluids increased ventilator-free days","B":"Liberal fluids reduced mortality and organ failure","C":"No differences","D":"Conservative fluids increased dialysis"},"answer":"A","explanation":"Conservative strategy improved lung function and ventilator-free days without more renal failure.","distractor":"Dialysis was not increased."},
{"id":327,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"An obese patient (BMI 45) is hypoxaemic on PEEP 8. What is the effect of higher PEEP?","options":{"A":"Reduces end-expiratory lung volume and worsens atelectasis","B":"May recruit atelectatic lung due to high pleural pressure","C":"Always causes barotrauma","D":"Has no role in obesity"},"answer":"B","explanation":"High pleural pressure in obesity causes atelectasis; oesophageal pressure can guide PEEP.","distractor":"PEEP increases end-expiratory lung volume."},
{"id":328,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What is transpulmonary pressure?","options":{"A":"Airway pressure plus pleural pressure","B":"Peak minus plateau pressure","C":"Airway pressure minus pleural (oesophageal) pressure","D":"Plateau pressure minus PEEP (the driving pressure)"},"answer":"C","explanation":"Transpulmonary pressure is airway pressure minus pleural pressure, estimated by oesophageal manometry. It is the pressure that actually distends the lung (lung stress) and separates lung from chest-wall mechanics, which matters in obesity and abdominal hypertension. Plateau minus PEEP is driving pressure, and peak minus plateau reflects airway resistance.","distractor":"Plateau − PEEP is driving pressure."},
{"id":329,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which statement about oxygen targets is supported by evidence?","options":{"A":"Oxygen targets do not matter","B":"Avoid hyperoxia; target SpO2 about 92–96% in most","C":"Target SpO2 of 100% in all patients to protect organs","D":"Target SpO2 85% in all"},"answer":"B","explanation":"In the IOTA meta-analysis (Lancet 2018), liberal oxygen raised mortality in acutely ill adults in a dose-dependent way. Most guidelines target SpO2 about 92–96% (88–92% in hypercapnic patients) and avoid hyperoxia. An SpO2 of 85% risks tissue hypoxia.","distractor":"SpO2 of 85% is too low for most."},
{"id":330,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with myasthenic crisis has FVC 15 mL/kg. What is the management?","options":{"A":"Observation only","B":"Increase pyridostigmine and observe on the ward","C":"Discharge to ward","D":"Elective intubation or NIV in ICU"},"answer":"D","explanation":"FVC \u003c20 mL/kg, NIF weaker than −30 cmH2O indicate impending failure.","distractor":"Higher pyridostigmine increases secretions."},
{"id":331,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with Guillain-Barré has FVC falling. What is the threshold for intubation?","options":{"A":"Any reduction","B":"FVC \u003c40 mL/kg","C":"FVC \u003c20 mL/kg","D":"FVC \u003c5 mL/kg"},"answer":"C","explanation":"The 20/30/40 rule for intubation in GBS: FVC \u003c20 mL/kg, MIP weaker than −30 cmH2O, or MEP \u003c40 cmH2O. Other predictors are rapid progression, bulbar weakness, inability to cough or lift the head, and autonomic instability. Delaying until gas exchange fails leads to emergency intubation.","distractor":"Waiting until FVC \u003c5 is unsafe."},
