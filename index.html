{"id":332,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"Which tracheostomy timing was studied in TracMan?","options":{"A":"Early (day 1–4) vs late (day 10+) with no mortality difference","B":"Early tracheostomy (day 1–4) reduced 30-day mortality","C":"Early tracheostomy increased VAP","D":"Late tracheostomy reduced mortality"},"answer":"A","explanation":"TracMan (JAMA 2013) randomised about 900 ventilated adults to tracheostomy within 4 days or after day 10. 30-day mortality was similar (about 31% in both groups), and early tracheostomy did not reduce ventilator days, ICU stay or VAP. Many late-group patients never needed a tracheostomy.","distractor":"Early tracheostomy did not reduce mortality."},
{"id":333,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A tracheostomy (\u003c7 days old) is displaced. What is the safest first action?","options":{"A":"Wait for surgeon","B":"Blind forceful reinsertion of the tracheostomy tube","C":"Bag via the stoma only","D":"Oral intubation if unable to oxygenate"},"answer":"D","explanation":"Immature tracts may not allow safe reinsertion; NTSP guidelines: oxygen to face and stoma, oral intubation if needed.","distractor":"Blind reinsertion may create a false passage."},
{"id":334,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"In a ventilated patient, which sign suggests right mainstem intubation?","options":{"A":"Absent left breath sounds with high pressures","B":"Increased end-tidal CO2 with equal chest movement","C":"Low peak pressures","D":"Bilateral equal breath sounds"},"answer":"A","explanation":"The right main bronchus is shorter, wider and more vertical, so an ETT advanced too far usually enters it. This causes absent left breath sounds, asymmetric chest movement, high peak pressures and hypoxaemia. Withdraw the tube until breath sounds are equal and confirm the tip 3–5 cm above the carina on X-ray.","distractor":"Equal sounds indicate correct position."},
{"id":335,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A ventilated patient has high minute ventilation and rising PaCO2. What is the cause?","options":{"A":"Reduced CO2 production","B":"Hyperventilation","C":"Increased dead space","D":"Hypoventilation"},"answer":"C","explanation":"PaCO2 is proportional to CO2 production divided by alveolar ventilation. When dead space rises (PE, high PEEP or overdistension, low cardiac output, ARDS), much of the minute ventilation does not exchange gas, so PaCO2 rises despite high minute ventilation. Hypoventilation implies low minute ventilation.","distractor":"Hypoventilation implies low minute ventilation."},
{"id":336,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"What is the effect of inhaled nitric oxide in ARDS?","options":{"A":"Reduces mortality","B":"Improves oxygenation transiently without mortality benefit","C":"Increases ventilator-free days and survival in ARDS","D":"Reduces renal failure"},"answer":"B","explanation":"Inhaled NO dilates vessels in ventilated lung units and improves V/Q matching, which raises PaO2/FiO2 for about 24–48 hours. Meta-analyses show no effect on mortality or ventilator-free days and a higher risk of AKI. It is only a rescue bridge in refractory hypoxaemia.","distractor":"It increases renal failure risk."},
{"id":337,"section":6,"sectionName":"Respiratory and Mechanical Ventilation","stem":"A patient with life-threatening asthma has silent chest and PaCO2 rising. What is the next step?","options":{"A":"Discharge","B":"Sedation without airway control","C":"Continue nebulisers only","D":"Intubation"},"answer":"D","explanation":"Silent chest, exhaustion, confusion and a rising or normal PaCO2 indicate life-threatening asthma with impending respiratory arrest. The next step is intubation by an experienced operator (ketamine is useful). Ventilate with low rate, long expiratory time and permissive hypercapnia to limit dynamic hyperinflation.","distractor":"Sedation without airway control is dangerous."},
{"id":338,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which four principles form the classic framework of medical ethics?","options":{"A":"Honesty, fidelity, autonomy and capacity","B":"Autonomy, paternalism, confidentiality and justice","C":"Autonomy, beneficence, non-maleficence and justice","D":"Beneficence, utility, consent and equity"},"answer":"C","explanation":"Beauchamp and Childress' four principles guide ICU decisions.","distractor":"Paternalism conflicts with autonomy."},
{"id":339,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"A competent patient refuses intubation knowing the consequences. What should the team do?","options":{"A":"Seek an urgent court order before withholding intubation","B":"Respect the refusal and provide comfort and other therapies","C":"Intubate, as refusal of life-saving treatment implies impaired capacity","D":"Sedate and intubate to save life"},"answer":"B","explanation":"A competent adult who understands the consequences may refuse any treatment, including life-sustaining treatment, and the refusal must be respected. Intubating against the refusal is battery. The team should document capacity, explore the reasons, offer alternatives such as NIV or HFNO if acceptable, and provide symptom control.","distractor":"Emergency doctrine does not override a competent refusal."},
{"id":340,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What four elements define decision-making capacity?","options":{"A":"Understand, retain, weigh information and communicate a choice","B":"Orientation to time, place and person with a GCS of 15","C":"GCS 15, normal labs, family support and consent","D":"Understand, agree with doctor, sign and communicate"},"answer":"A","explanation":"Under the Mental Capacity Act test, a person has capacity if they can understand the relevant information, retain it long enough, use or weigh it, and communicate a decision. Capacity is decision-specific and can fluctuate. Agreeing with the doctor is not required, and orientation or GCS 15 does not prove capacity.","distractor":"Agreement with the doctor is not required."},
{"id":341,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"A patient lacks capacity and has no advance directive. Who decides?","options":{"A":"The nurse in charge","B":"The closest relative, choosing what they personally prefer","C":"Surrogate using substituted judgement, then best interests","D":"The senior intensivist, based on best interests alone"},"answer":"C","explanation":"Surrogates try to reflect what the patient would have wanted.","distractor":"Doctors do not have sole authority."},
{"id":342,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"A valid advance directive refuses CPR. Family demand CPR. What is correct?","options":{"A":"Honour the advance directive","B":"Perform slow CPR","C":"Perform CPR as family requests","D":"Ask an ethics committee during arrest"},"answer":"A","explanation":"A valid and applicable advance directive refusing CPR is legally binding and reflects the patient's autonomy. The family cannot override it, although they should be supported and the reasons explained. 'Slow codes' are deceptive and unethical, and an arrest is not the time to convene an ethics committee.","distractor":"Slow CPR is deceptive and unethical."},
{"id":343,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the doctrine of double effect?","options":{"A":"A treatment may be given only if two senior doctors agree it is beneficial","B":"Hastening death is acceptable if the patient explicitly requests it","C":"Treatment must be doubled before withdrawal","D":"An action with a good intended effect is allowed despite a foreseen bad effect"},"answer":"D","explanation":"Opioids for symptoms are justified even if they may hasten death.","distractor":"Intention to hasten death is not permitted."},
{"id":344,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Is there an ethical difference between withholding and withdrawing life-sustaining treatment?","options":{"A":"Withdrawing is always unethical","B":"No; both are ethically equivalent","C":"Withholding is always unethical","D":"Withdrawing requires court approval"},"answer":"B","explanation":"Ethical consensus holds them equivalent; trials of therapy are allowed.","distractor":"Court approval is not required in most jurisdictions."},
{"id":345,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the best approach to terminal extubation regarding distress?","options":{"A":"Pre-emptive opioids and sedatives titrated to comfort","B":"Neuromuscular blockade before extubation to prevent visible gasping","C":"High doses unrelated to symptoms","D":"No sedatives or opioids, to avoid any risk of hastening death"},"answer":"A","explanation":"Comfort is priority; NMB masks distress and is inappropriate.","distractor":"NMB prevents assessment."},
{"id":346,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the principle of medical futility?","options":{"A":"Treatment that is expensive","B":"Treatment that cannot achieve its physiological or patient goals","C":"Treatment the family refuses","D":"Any treatment with less than a 50% chance of survival to discharge"},"answer":"B","explanation":"Futility disputes should be addressed with communication and process.","distractor":"Cost does not define futility."},
{"id":347,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"A family requests non-beneficial treatment. What is the best first step?","options":{"A":"Withdraw treatment unilaterally, as doctors decide on futility","B":"Refer to police","C":"Family meeting to explore goals and values","D":"Continue all treatment indefinitely, as the family has requested"},"answer":"C","explanation":"Communication resolves most conflicts; mediation and ethics consult next.","distractor":"Unilateral withdrawal damages trust."},
{"id":348,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which communication approach improved family outcomes in the Lautrette 2007 study?","options":{"A":"Shorter, more frequent meetings led by junior staff","B":"Written information leaflets given instead of meetings","C":"No family meetings","D":"Proactive conference with VALUE approach and brochure"},"answer":"D","explanation":"Lautrette (NEJM 2007) tested a proactive end-of-life family conference using the VALUE mnemonic (Value, Acknowledge, Listen, Understand the patient as a person, Elicit questions) plus a bereavement brochure. At 90 days, relatives had less PTSD, anxiety and depression than with usual conferences.","distractor":"Written information alone was inferior."},
{"id":349,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What does SPIKES describe?","options":{"A":"A protocol for breaking bad news","B":"A sedation scale","C":"A structured bedside tool for assessing decision-making capacity","D":"A triage tool"},"answer":"A","explanation":"Setting, Perception, Invitation, Knowledge, Emotions, Strategy/summary.","distractor":"It is a communication protocol."},
{"id":350,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which statement on brain death is correct?","options":{"A":"It allows continued treatment indefinitely","B":"It is a form of coma that may recover","C":"It is death determined by neurological criteria","D":"It requires a confirmatory EEG in all cases before diagnosis"},"answer":"C","explanation":"Brain death is irreversible loss of all brain function including the brainstem; it is legally recognised as death in most countries.","distractor":"EEG is not mandatory in most protocols."},
{"id":351,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which prerequisite is required before brain death testing?","options":{"A":"Cardiac ultrasound","B":"Written family consent before clinical testing begins","C":"A normal MRI brain and a normal cerebral angiogram","D":"Exclusion of confounders like sedatives, hypothermia and metabolic disturbances"},"answer":"D","explanation":"Before brain death testing, establish an irreversible cause of coma and exclude confounders: sedatives and neuromuscular blockers, core temperature below 36°C, SBP below 100 mmHg, and severe metabolic, electrolyte or endocrine disturbance. Imaging and ancillary tests are only needed when clinical testing cannot be completed; family consent for testing is not required.","distractor":"Family consent is not required for testing."},
{"id":352,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"During apnoea testing, which result confirms apnoea?","options":{"A":"SpO2 below 85%","B":"PaCO2 ≥60 mmHg and ≥20 mmHg above baseline without breathing","C":"Absence of breathing for 1 minute","D":"PaCO2 ≥45 mmHg with no breathing during 3 minutes of disconnection"},"answer":"B","explanation":"After preoxygenation, the patient is disconnected with oxygen delivered to the trachea. Apnoea is confirmed if there is no respiratory effort and PaCO2 reaches ≥60 mmHg and ≥20 mmHg above baseline (AAN 2023). A PaCO2 of 45 mmHg is not a sufficient respiratory stimulus.","distractor":"45 mmHg is insufficient."},
{"id":353,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which reflex can be present in brain death?","options":{"A":"Cough reflex","B":"Corneal reflex","C":"A sluggish pupillary light reflex on one side","D":"Spinal reflexes like triple flexion"},"answer":"D","explanation":"Brain death requires absent brainstem function: no pupillary, corneal, oculocephalic, vestibulo-ocular, gag or cough reflexes and no respiratory drive. Spinal reflexes such as triple flexion, Lazarus sign and deep tendon reflexes come from the cord and do not exclude brain death.","distractor":"Brainstem reflexes must be absent."},
{"id":354,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the dead donor rule?","options":{"A":"Organ retrieval must not cause the donor's death","B":"Donors must be certified dead for at least 24 hours before retrieval","C":"Only brain-dead donors allowed","D":"Organs are taken before death declared"},"answer":"A","explanation":"The dead donor rule says vital organs may only be retrieved from someone already declared dead, and retrieval must not cause death. It applies to both DBD (neurological criteria) and DCD (circulatory criteria). No minimum 24-hour waiting period is required after death is declared.","distractor":"DCD donors are allowed."},
{"id":355,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"In DCD, why is the treating team separated from the transplant team?","options":{"A":"To shorten warm ischaemia time and speed organ retrieval","B":"To avoid conflict of interest in end-of-life decisions","C":"To allow the transplant team to choose the time of withdrawal","D":"Legal requirement for surgery"},"answer":"B","explanation":"In DCD, the decision to withdraw life-sustaining treatment must be made in the patient's best interests, independently of donation. Keeping the transplant team out of withdrawal, death declaration and timing avoids a conflict of interest and protects public trust. Speed and warm ischaemia are not the reason.","distractor":"Speed is not the reason."},
{"id":356,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Who should approach the family about organ donation?","options":{"A":"Junior resident alone","B":"Hospital administrator","C":"Trained donation specialist with the ICU team","D":"The transplant surgeon who will perform the retrieval"},"answer":"C","explanation":"Consent rates are highest when a trained donation specialist (for example a specialist nurse for organ donation) approaches the family with the ICU team, after the family has understood that death has occurred or is inevitable. Retrieval surgeons should not be involved because of conflict of interest.","distractor":"Transplant surgeon involvement is a conflict."},
{"id":357,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the primary purpose of triage in mass casualty?","options":{"A":"Treat first-come first","B":"Treat the sickest patients first, regardless of their prognosis","C":"Maximise benefit for the population","D":"Treat VIPs first"},"answer":"C","explanation":"Disaster triage moves from individual to population ethics: scarce resources go to those most likely to benefit, maximising lives saved. Patients are sorted by severity and likelihood of survival. Treating the sickest first regardless of prognosis, or first-come-first-served, wastes resources and costs lives.","distractor":"Sickest first ignores benefit."},
{"id":358,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"A patient requests treatment details be hidden from family. What should the doctor do?","options":{"A":"Inform the family anyway","B":"Respect confidentiality","C":"Inform employer","D":"Ignore request"},"answer":"B","explanation":"Medical information belongs to a competent patient, who can decide who is told. The family should not be told against the patient's wishes. Exceptions are narrow: serious risk to others, legal requirements (for example notifiable disease) or a court order.","distractor":"Family disclosure breaches confidentiality."},
{"id":359,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"When may confidentiality be broken?","options":{"A":"To prevent serious harm to others or when law requires","B":"Never; confidentiality is absolute in all circumstances","C":"When employer asks","D":"When the next of kin requests the information"},"answer":"A","explanation":"Exceptions: public health notification, court order, serious harm.","distractor":"Family request does not justify disclosure."},
{"id":360,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"A medication error causes harm. What should the doctor do?","options":{"A":"Conceal","B":"Blame nurse","C":"Disclose only if the patient or family asks directly","D":"Disclose honestly and apologise"},"answer":"D","explanation":"The duty of candour requires prompt, honest disclosure of an error that caused harm, an apology, an explanation of what happened and what will be done, and a report through incident systems. Disclosure supports trust and learning, while concealing an error or blaming others is unethical and may be illegal.","distractor":"Concealment is unethical."},
{"id":361,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is a root cause analysis?","options":{"A":"System-focused investigation of adverse events","B":"An audit of individual staff performance and competence","C":"Legal investigation","D":"Disciplinary process"},"answer":"A","explanation":"Root cause analysis is a structured, system-focused investigation of an adverse event. It asks what happened, why it happened and how to prevent it, looking at processes, equipment, staffing and communication. It is not a disciplinary process; a blame-free culture encourages reporting.","distractor":"It is not disciplinary."},
{"id":362,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the Swiss cheese model?","options":{"A":"Errors arise from equipment only","B":"Errors occur when multiple defence layers fail","C":"Errors are random","D":"Most errors are caused by a single careless individual"},"answer":"B","explanation":"In James Reason's Swiss cheese model, each defence layer (policies, checks, equipment, staff) has holes. Harm happens when the holes in several layers line up. Most errors come from latent system failures plus active errors, so safety needs multiple independent defences, not blaming a single person.","distractor":"Single-person focus misses systems."},
{"id":363,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which checklist reduced CLABSI in the Keystone project?","options":{"A":"Ventilator bundle","B":"Sepsis bundle","C":"Central line insertion bundle","D":"WHO surgical checklist"},"answer":"C","explanation":"Pronovost 2006: hand hygiene, barrier precautions, chlorhexidine, avoid femoral, remove unnecessary lines.","distractor":"Sepsis bundle is different."},
{"id":364,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is SBAR used for?","options":{"A":"Delirium assessment","B":"A structured tool for assessing sedation depth","C":"Pain scoring","D":"Structured communication during handover"},"answer":"D","explanation":"SBAR (Situation, Background, Assessment, Recommendation) structures communication at handover and when escalating a deteriorating patient. It reduces omissions and misunderstanding between professionals. It is not a clinical scoring tool.","distractor":"It is not a clinical score."},
{"id":365,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the intensivist-to-patient effect on outcomes?","options":{"A":"High-intensity intensivist staffing improves outcomes","B":"No effect, as long as a physician is available by phone","C":"Low staffing improves outcomes","D":"Only nurses matter"},"answer":"A","explanation":"Pronovost's systematic review (JAMA 2002) found that high-intensity staffing (mandatory intensivist consultation or a closed ICU) lowered ICU and hospital mortality and length of stay compared with low-intensity models. Phone availability alone does not give the same benefit.","distractor":"Staffing matters."},
{"id":366,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which nurse-to-patient ratio is typical for ventilated patients?","options":{"A":"1:6","B":"1:4","C":"1:8","D":"1:1 or 1:2"},"answer":"D","explanation":"Level 3 patients (for example ventilated or multi-organ support) need 1:1 nursing, and level 2 patients 1:2, in standards such as the UK GPICS and ESICM recommendations. Lower ratios are linked with more adverse events and higher mortality. Ratios of 1:4 or more are ward levels.","distractor":"1:4 is ward level."},
{"id":367,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is burnout among ICU staff?","options":{"A":"Physical fatigue that resolves after rest from night shifts","B":"Physical illness","C":"Emotional exhaustion, depersonalisation and reduced accomplishment","D":"Depression only"},"answer":"C","explanation":"Burnout, as defined by Maslach, is a syndrome of emotional exhaustion, depersonalisation (cynicism) and reduced personal accomplishment caused by chronic work stress. It is common in ICU staff, harms patient safety and staff retention, and does not resolve with a short rest.","distractor":"It is more than fatigue."},
{"id":368,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is moral distress?","options":{"A":"Fatigue","B":"Knowing the right action but constrained from taking it","C":"Grief after death","D":"Persistent disagreement with a colleague about a diagnosis"},"answer":"B","explanation":"Moral distress happens when a clinician knows the ethically right action but institutional or other constraints prevent it, for example giving treatment felt to be futile. It is common in ICU nurses and doctors and contributes to burnout. It is different from grief or simple clinical disagreement.","distractor":"It is not grief."},
{"id":369,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is post-intensive care syndrome?","options":{"A":"New impairments in physical, cognitive or mental health after ICU","B":"Infection after ICU","C":"Delirium that develops during the ICU admission","D":"Readmission to ICU within 30 days of discharge to the ward"},"answer":"A","explanation":"Post-intensive care syndrome is new or worse impairment in physical (ICU-acquired weakness), cognitive or mental health (anxiety, depression, PTSD) that persists after critical illness. PICS-F describes similar psychological effects in family members. ICU delirium is a risk factor, not the syndrome itself.","distractor":"Delirium during ICU is a risk factor."},
{"id":370,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which intervention reduces PTSD in ICU survivors?","options":{"A":"Benzodiazepines","B":"Deep sedation","C":"Avoiding family visits","D":"ICU diaries"},"answer":"D","explanation":"In the RACHEL trial (Jones, Crit Care 2010), ICU diaries with photos and entries from staff and family, given at follow-up, reduced new-onset PTSD at 3 months. Diaries help patients fill memory gaps and correct delusional memories. Benzodiazepines and deep sedation raise the risk of delirium and PTSD.","distractor":"Benzodiazepines increase delirium."},
{"id":371,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the ABCDEF bundle?","options":{"A":"Airway, breathing, circulation, disability, exposure, family","B":"Pain, SAT/SBT, sedation choice, delirium, mobility, family","C":"Antibiotics, blood, cultures, drugs, early goal, fluids","D":"Assess, bundle, care, discharge, evaluate, follow-up"},"answer":"B","explanation":"ABCDEF bundle: Assess, prevent and manage pain; Both spontaneous awakening and breathing trials; Choice of analgesia and sedation; Delirium assessment and management; Early mobility; Family engagement. Higher compliance was linked with better survival and fewer days of coma and delirium (Pun, CCM 2019).","distractor":"ABCDE is trauma assessment."},
{"id":372,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the ethical principle of justice in ICU?","options":{"A":"Doing good","B":"Respecting each patient's own choice of treatment","C":"Fair allocation of scarce resources","D":"Avoiding harm"},"answer":"C","explanation":"Justice means fair and consistent allocation of limited resources such as ICU beds, ventilators and organs, using transparent criteria rather than social status. Beneficence is doing good, non-maleficence is avoiding harm, and autonomy is respecting the patient's choices.","distractor":"Respect for choice is autonomy."},
{"id":373,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the principle of proportionality in ICU?","options":{"A":"Benefits should outweigh burdens","B":"Use maximal therapy whenever survival is possible","C":"Avoid all burden","D":"Treat all equally"},"answer":"A","explanation":"Proportionality means a treatment is ethically justified when its expected benefits outweigh its burdens for that patient. It underpins decisions to withhold or withdraw therapy that gives little benefit at great burden. Maximal therapy is not required simply because survival is possible.","distractor":"Maximum therapy may be disproportionate."},
{"id":374,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is informed consent?","options":{"A":"A signed consent form completed before the procedure","B":"Voluntary agreement with understanding of risks, benefits and alternatives","C":"Agreement of the next of kin on behalf of a capacitous patient","D":"Verbal agreement only"},"answer":"B","explanation":"Informed consent is a process: a competent patient voluntarily agrees after understanding the nature, benefits, risks and alternatives, including no treatment. A signature only documents the process. Next of kin cannot consent for a capacitous adult.","distractor":"A signature alone is not consent."},
{"id":375,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"When is consent not required?","options":{"A":"For elective procedures","B":"For all routine ICU procedures once the patient is admitted","C":"When family is absent","D":"Emergency treatment to save life when patient lacks capacity"},"answer":"D","explanation":"When a patient lacks capacity and needs urgent treatment to save life or prevent serious harm, clinicians may act in the patient's best interests without consent (emergency or necessity doctrine). This does not override a known valid refusal. Elective procedures still require consent.","distractor":"Elective procedures need consent."},
{"id":376,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"A patient's religion conflicts with blood transfusion. What is the approach?","options":{"A":"Transfuse while sedated","B":"Seek a court order immediately so transfusion can proceed","C":"Respect refusal; use blood conservation strategies","D":"Transfuse anyway"},"answer":"C","explanation":"A competent adult Jehovah's Witness may refuse blood, and transfusing against that refusal is assault. Clarify which products are acceptable (some accept albumin or cell salvage) and use blood conservation: cell salvage, tranexamic acid, iron and erythropoietin, minimal phlebotomy and early haemorrhage control.","distractor":"Transfusing against refusal is assault."},
{"id":377,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is a time-limited trial?","options":{"A":"Therapy until death","B":"Immediate withdrawal","C":"Agreement to use therapy for a defined period and reassess","D":"Open-ended full treatment until the patient recovers"},"answer":"C","explanation":"A time-limited trial is an agreement between clinicians and the patient or family to give defined therapy for a set period with pre-agreed measures of improvement, then reassess. It helps when prognosis is uncertain and avoids both early withdrawal and open-ended non-beneficial care.","distractor":"It has a defined endpoint."},
{"id":378,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which statement on DNR orders is correct?","options":{"A":"DNR prohibits ICU admission","B":"DNR means comfort care only","C":"DNR prohibits antibiotics","D":"DNR does not mean do not treat"},"answer":"D","explanation":"A DNR (DNACPR) order applies only to cardiopulmonary resuscitation. It does not mean withdrawing other treatment: ICU admission, antibiotics, vasopressors, NIV and even intubation may still be appropriate. Other limits must be discussed and documented separately.","distractor":"DNR is CPR-specific."},
{"id":379,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the role of an ethics committee?","options":{"A":"Advisory consultation in ethical dilemmas","B":"Approve all withdrawals","C":"Discipline staff","D":"Making binding decisions that the treating team must follow"},"answer":"A","explanation":"Clinical ethics committees give advisory consultation in difficult cases by clarifying values, facilitating communication and suggesting options. Their recommendations are not binding; responsibility stays with the treating team, and legal disputes go to the courts.","distractor":"Decisions are not binding."},
{"id":380,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which factor predicts family dissatisfaction?","options":{"A":"A long ICU stay with multiple procedures","B":"Inconsistent information from different clinicians","C":"Patient age","D":"Use of ventilator"},"answer":"B","explanation":"Studies of ICU family satisfaction (for example FS-ICU) show that inconsistent or conflicting information from different clinicians is a major driver of dissatisfaction and conflict. Regular, consistent communication with an identified lead clinician improves satisfaction more than patient factors such as age or length of stay.","distractor":"Long stay alone is not the main factor."},
{"id":381,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the primary goal of palliative care in ICU?","options":{"A":"Relieve suffering and improve quality of life","B":"Hasten death","C":"Prolong life with all available therapies","D":"Reduce costs"},"answer":"A","explanation":"Palliative care in ICU aims to relieve physical and psychological suffering and to support patients and families, with or without curative treatment. It includes symptom control, communication and goal setting, and end-of-life care when appropriate. It does not aim to hasten death.","distractor":"Hastening death is not the goal."},
{"id":382,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the definition of euthanasia?","options":{"A":"Withdrawing a treatment that is no longer beneficial","B":"Respecting refusal","C":"Intentional act to end life to relieve suffering","D":"Giving opioids for pain"},"answer":"C","explanation":"Euthanasia is a deliberate act by a clinician, such as giving a lethal drug, with the intention of ending life to relieve suffering. Withdrawing non-beneficial treatment lets the disease take its course. Giving opioids to relieve symptoms is acceptable under the doctrine of double effect.","distractor":"Withdrawal is not euthanasia."},
{"id":383,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What does Egyptian law state about euthanasia?","options":{"A":"It is permitted for terminal illness","B":"It is prohibited","C":"It is permitted with consent","D":"It is permitted with court approval"},"answer":"B","explanation":"Euthanasia and physician-assisted suicide are illegal in Egypt and are treated as homicide under the penal code. They are also prohibited in Islamic jurisprudence and by the Egyptian Medical Syndicate code of ethics. Consent or terminal illness does not create an exception.","distractor":"No consent-based exception exists."},
{"id":384,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"In Islamic ethics, what is the position on withdrawing futile life support?","options":{"A":"Requires religious court approval","B":"Always forbidden","C":"Permissible only if every family member agrees to it","D":"Permissible when treatment is futile per medical judgement"},"answer":"D","explanation":"Islamic juristic bodies (for example the Islamic Fiqh Academy and Saudi fatwas) allow withholding or withdrawing life support when specialist physicians judge it futile, while basic care continues. Death is then seen as natural rather than caused. A religious court order or unanimous family agreement is not required, but families should be involved.","distractor":"It is not always forbidden."},
{"id":385,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the definition of a sentinel event?","options":{"A":"Unexpected occurrence causing death or serious harm","B":"Minor error","C":"An expected, recognised complication of a procedure","D":"Near miss"},"answer":"A","explanation":"A sentinel event is an unexpected occurrence causing death or serious physical or psychological harm, for example wrong-site surgery or a major medication error. It signals the need for immediate investigation (usually RCA) and system change. Expected complications and near misses are not sentinel events.","distractor":"Near misses do not cause harm."},
{"id":386,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is a near miss?","options":{"A":"A recognised complication that caused temporary harm","B":"Serious harm","C":"Error that did not reach the patient or cause harm","D":"Death"},"answer":"C","explanation":"A near miss is an error or unsafe event that did not reach the patient, or reached them without harm. Reporting near misses is valuable because they show the same system weaknesses as harmful events without injury. Expected complications are not near misses.","distractor":"It does not cause harm."},
{"id":387,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which strategy improves handover?","options":{"A":"Unstructured verbal handover","B":"No handover","C":"Written only","D":"Structured tools like I-PASS"},"answer":"D","explanation":"I-PASS (Illness severity, Patient summary, Action list, Situation awareness and contingency, Synthesis by receiver) is a structured handover tool. In a multicentre study (Starmer, NEJM 2014), it reduced medical errors by about 23% and preventable adverse events by about 30% without lengthening handover.","distractor":"Unstructured handover increases errors."},
{"id":388,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the purpose of a rapid response team?","options":{"A":"Palliative care","B":"Early intervention for deteriorating ward patients","C":"Responding to in-hospital cardiac arrests only","D":"Elective procedures"},"answer":"B","explanation":"Rapid response teams bring critical care skills to deteriorating ward patients early, triggered by early warning scores or concern. The aim is to treat before cardiac arrest or unplanned ICU admission. They are linked with fewer arrests outside ICU, although the effect on mortality varies.","distractor":"Not only arrests."},
{"id":389,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which early warning score is commonly used?","options":{"A":"APACHE II","B":"SOFA","C":"NEWS2","D":"SAPS"},"answer":"C","explanation":"NEWS2 combines respiratory rate, SpO2 (with a separate scale for hypercapnic patients), supplemental oxygen, temperature, systolic BP, heart rate and consciousness (including new confusion). It is the UK standard for detecting ward deterioration and triggering escalation. APACHE II, SOFA and SAPS are ICU severity scores.","distractor":"APACHE is a severity score."},
{"id":390,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"Which score is used for ICU severity and mortality prediction?","options":{"A":"APACHE II","B":"qSOFA","C":"NEWS2","D":"GCS"},"answer":"A","explanation":"APACHE II uses the worst physiological values in the first 24 hours of ICU admission, plus age and chronic health, to predict hospital mortality. It is used for case-mix adjustment and benchmarking (SMR). qSOFA and NEWS2 are bedside screening tools, and GCS assesses consciousness.","distractor":"NEWS2 is for wards."},
{"id":391,"section":7,"sectionName":"Ethics, Communication and Organisation","stem":"What is the standardised mortality ratio?","options":{"A":"Predicted deaths divided by observed deaths","B":"Observed deaths divided by predicted deaths","C":"Deaths per bed","D":"Deaths per 100 admissions"},"answer":"B","explanation":"SMR = observed deaths divided by predicted (expected) deaths, with predictions from a severity model such as APACHE or SAPS. An SMR below 1 means fewer deaths than expected, and above 1 means more. It depends on how well the model is calibrated for the population.","distractor":"Inverted ratio is incorrect."},
{"id":392,"section":8,"sectionName":"Transplantation and Oncology","stem":"A brain-dead donor develops polyuria 400 mL/h with Na 158 mmol/L. What is the treatment?","options":{"A":"Hydrochlorothiazide only","B":"Furosemide with fluid restriction to limit polyuria","C":"Restrict all fluids","D":"Desmopressin and hypotonic fluid replacement"},"answer":"D","explanation":"Central DI is common after brainstem death; desmopressin or vasopressin plus free water.","distractor":"Fluid restriction worsens hypernatraemia and hypovolaemia."},
{"id":393,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which vasopressor is preferred in brain-dead donors with vasoplegia and DI?","options":{"A":"Vasopressin","B":"Phenylephrine","C":"Dopamine high-dose","D":"High-dose noradrenaline only"},"answer":"A","explanation":"Vasopressin treats DI and vasoplegia, reduces catecholamine need.","distractor":"High-dose catecholamines may impair grafts."},
{"id":394,"section":8,"sectionName":"Transplantation and Oncology","stem":"What MAP target is typical in donor management?","options":{"A":"No target","B":"≥90 mmHg","C":"≥50 mmHg","D":"≥60–65 mmHg"},"answer":"D","explanation":"Donor management aims for euvolaemia with MAP ≥60–65 mmHg, urine output above 0.5–1 mL/kg/h and normal lactate. Vasopressin is preferred to high-dose catecholamines, which may harm grafts. Hormonal therapy is added if the donor stays unstable.","distractor":"Excess vasopressor harms."},
{"id":395,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which hormone therapy is used in unstable brain-dead donors?","options":{"A":"Insulin infusion alone to control hyperglycaemia","B":"Glucagon","C":"Methylprednisolone with thyroid hormone and vasopressin","D":"Growth hormone"},"answer":"C","explanation":"Brain death causes hormonal collapse: diabetes insipidus, loss of vasopressin, falling thyroid hormone and an inflammatory surge. In unstable donors, hormonal resuscitation with methylprednisolone (about 15 mg/kg), vasopressin and T3/T4, plus insulin for glucose control, can reduce vasopressor needs and help preserve organs.","distractor":"Insulin alone does not stabilise."},
{"id":396,"section":8,"sectionName":"Transplantation and Oncology","stem":"For lung donation, which ventilation strategy improves lung procurement?","options":{"A":"FiO2 1.0 continuously","B":"Lung-protective ventilation with recruitment and PEEP","C":"High tidal volume of 10–12 mL/kg to prevent atelectasis","D":"Zero PEEP"},"answer":"B","explanation":"Mascia 2010: protective ventilation increased eligible lungs.","distractor":"High Vt injures lungs."},
{"id":397,"section":8,"sectionName":"Transplantation and Oncology","stem":"A donor's PaO2/FiO2 is used in lung assessment. What value is acceptable?","options":{"A":">150","B":">200","C":">100","D":">300 on PEEP 5 and FiO2 1.0"},"answer":"D","explanation":"Standard lung acceptance requires PaO2 above 300 mmHg on FiO2 1.0 and PEEP 5 cmH2O, plus a clear chest X-ray and bronchoscopy. Lower values may improve with recruitment and bronchoscopic toilet, and some lungs can be assessed and reconditioned with ex vivo lung perfusion.","distractor":"Lower values exclude lungs."},
{"id":398,"section":8,"sectionName":"Transplantation and Oncology","stem":"After liver transplant, a patient has rising LFTs and absent hepatic artery flow on Doppler. What is the diagnosis?","options":{"A":"Hepatic artery thrombosis","B":"Biliary leak","C":"Portal vein thrombosis","D":"Acute rejection"},"answer":"A","explanation":"HAT causes graft failure; urgent revascularisation or retransplant.","distractor":"Rejection preserves arterial flow."},
{"id":399,"section":8,"sectionName":"Transplantation and Oncology","stem":"A liver transplant patient has very high transaminases, coagulopathy and lactic acidosis within 48 hours with patent vessels. What is the diagnosis?","options":{"A":"Acute cellular rejection","B":"Chronic rejection","C":"Primary non-function","D":"Hepatitis C recurrence"},"answer":"C","explanation":"Primary non-function presents within days of liver transplant as graft failure: very high transaminases, rising INR, lactic acidosis, hypoglycaemia, encephalopathy and poor bile output, with patent vessels on Doppler. It needs urgent listing for retransplantation. Acute cellular rejection usually occurs after day 5–7.","distractor":"Rejection usually occurs after day 5."},
{"id":400,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which drug class is associated with nephrotoxicity, hypertension and hyperkalaemia in transplant recipients?","options":{"A":"Azathioprine","B":"Calcineurin inhibitors","C":"Mycophenolate","D":"Steroids"},"answer":"B","explanation":"Calcineurin inhibitors (tacrolimus and ciclosporin) constrict the afferent arteriole and cause nephrotoxicity, hypertension, hyperkalaemia, hypomagnesaemia and neurotoxicity (tremor, PRES). Tacrolimus also causes post-transplant diabetes. Mycophenolate causes GI toxicity and cytopenias, and azathioprine causes myelosuppression.","distractor":"Mycophenolate causes GI toxicity and cytopenias."},
{"id":401,"section":8,"sectionName":"Transplantation and Oncology","stem":"A tacrolimus patient starts clarithromycin. What happens?","options":{"A":"No interaction","B":"Tacrolimus levels rise due to CYP3A4 inhibition","C":"Clarithromycin levels fall","D":"Tacrolimus levels fall due to CYP3A4 induction"},"answer":"B","explanation":"Tacrolimus is metabolised by CYP3A4 and P-glycoprotein. Clarithromycin, erythromycin, azoles, diltiazem and grapefruit inhibit CYP3A4, which raises tacrolimus levels and risks nephrotoxicity and neurotoxicity. Use azithromycin instead where possible, or reduce the dose and monitor trough levels.","distractor":"Rifampicin lowers levels."},
{"id":402,"section":8,"sectionName":"Transplantation and Oncology","stem":"A tacrolimus patient starts rifampicin. What happens?","options":{"A":"Tacrolimus levels fall, risking rejection","B":"Tacrolimus levels rise, risking nephrotoxicity","C":"No interaction","D":"Nephrotoxicity increases"},"answer":"A","explanation":"Rifampicin strongly induces CYP3A4 and P-glycoprotein, so tacrolimus levels can fall sharply within days and cause acute rejection. Large dose increases with close trough monitoring are needed, or a non-rifamycin regimen. Phenytoin and carbamazepine have a similar effect.","distractor":"Inhibitors raise levels."},
{"id":403,"section":8,"sectionName":"Transplantation and Oncology","stem":"A transplant recipient on tacrolimus develops confusion, seizures and posterior white matter oedema. What is the diagnosis?","options":{"A":"Stroke","B":"Cerebral lymphoma","C":"Herpes simplex encephalitis (temporal lobe)","D":"PRES (posterior reversible encephalopathy syndrome)"},"answer":"D","explanation":"Calcineurin inhibitor toxicity; control BP and change agent.","distractor":"Encephalitis affects temporal lobes."},
{"id":404,"section":8,"sectionName":"Transplantation and Oncology","stem":"What is the typical timing of CMV infection after transplant?","options":{"A":"Never with prophylaxis","B":"After 5 years only","C":"1–6 months","D":"First week"},"answer":"C","explanation":"Infection follows a timeline after transplant. In the first month, nosocomial and surgical infections dominate. From 1 to 6 months, at peak immunosuppression, opportunistic infections such as CMV, PJP and fungi appear. CMV is highest in D+/R− recipients, and prophylaxis can delay it until after prophylaxis stops.","distractor":"Early infections are nosocomial."},
{"id":405,"section":8,"sectionName":"Transplantation and Oncology","stem":"A kidney transplant recipient 3 months post-transplant has pneumonia with diffuse infiltrates and high LDH. Prophylaxis was stopped. What is likely?","options":{"A":"Pneumococcal pneumonia","B":"Pneumocystis jirovecii pneumonia","C":"Aspiration","D":"Pulmonary oedema"},"answer":"B","explanation":"Treat with high-dose co-trimoxazole; steroids if hypoxaemic.","distractor":"Pneumococcus causes lobar consolidation."},
{"id":406,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which drug treats CMV disease?","options":{"A":"Fluconazole","B":"Aciclovir","C":"Oseltamivir","D":"IV ganciclovir"},"answer":"D","explanation":"IV ganciclovir (5 mg/kg twice daily, adjusted for renal function) treats severe CMV disease. Oral valganciclovir is used for mild to moderate disease and as step-down therapy, and foscarnet is used for ganciclovir resistance. Immunosuppression should also be reduced. Aciclovir has poor activity against CMV.","distractor":"Aciclovir is ineffective for CMV."},
{"id":407,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which drug causes neutropenia when combined with valganciclovir?","options":{"A":"Mycophenolate","B":"Prednisolone","C":"Tacrolimus","D":"Amlodipine"},"answer":"A","explanation":"Valganciclovir and mycophenolate both suppress the bone marrow, so the combination commonly causes neutropenia. Co-trimoxazole and azathioprine add to the risk. Management is dose adjustment, reducing mycophenolate, or G-CSF. Corticosteroids cause neutrophilia rather than neutropenia.","distractor":"Prednisolone causes neutrophilia."},
{"id":408,"section":8,"sectionName":"Transplantation and Oncology","stem":"A transplant recipient has a fever and pulmonary nodules with halo sign on CT. What is likely?","options":{"A":"Bacterial pneumonia","B":"CMV pneumonia","C":"Invasive aspergillosis","D":"Pneumocystis"},"answer":"C","explanation":"In an immunocompromised patient, nodules with a halo sign (ground glass around a nodule, from haemorrhage) suggest invasive aspergillosis; the air-crescent sign appears later. Confirm with serum or BAL galactomannan. First-line treatment is voriconazole or isavuconazole. PJP causes diffuse ground-glass change.","distractor":"Pneumocystis gives ground glass."},
{"id":409,"section":8,"sectionName":"Transplantation and Oncology","stem":"Voriconazole is started in a tacrolimus patient. What should be done?","options":{"A":"Stop tacrolimus","B":"Reduce tacrolimus dose and monitor levels","C":"No change","D":"Increase tacrolimus dose to prevent rejection"},"answer":"B","explanation":"Voriconazole is a potent CYP3A4 inhibitor. When it is started, reduce the tacrolimus dose (often to about one third) and check trough levels closely. When voriconazole stops, levels fall and the dose must go back up to avoid rejection.","distractor":"Increasing dose causes toxicity."},
{"id":410,"section":8,"sectionName":"Transplantation and Oncology","stem":"After heart transplant, what is the typical response to atropine?","options":{"A":"No response due to denervation","B":"Tachycardia","C":"Bradycardia","D":"Hypotension"},"answer":"A","explanation":"The transplanted heart is denervated, so drugs that act through the vagus (atropine, glycopyrrolate) do not raise heart rate. Use direct-acting agents such as isoprenaline or adrenaline, or pacing. The resting rate is often about 90–110/min because there is no vagal tone.","distractor":"Atropine requires vagal innervation."},
{"id":411,"section":8,"sectionName":"Transplantation and Oncology","stem":"After lung transplant, a patient develops hypoxaemia and infiltrates within 72 hours. What is likely?","options":{"A":"Chronic rejection","B":"CMV pneumonitis","C":"Primary graft dysfunction","D":"Bronchiolitis obliterans"},"answer":"C","explanation":"Primary graft dysfunction is ischaemia–reperfusion injury within 72 hours of lung transplant. It causes hypoxaemia and diffuse infiltrates without infection, rejection or anastomotic problems, and is graded by PaO2/FiO2 at 0–72 hours. It is the main cause of early mortality, treated with protective ventilation, fluid restriction, iNO and ECMO if severe.","distractor":"Chronic rejection occurs late."},
{"id":412,"section":8,"sectionName":"Transplantation and Oncology","stem":"What is the commonest cause of death after the first year of lung transplant?","options":{"A":"Primary graft dysfunction (ischaemia–reperfusion injury)","B":"Hyperacute rejection","C":"Surgical complications","D":"Chronic lung allograft dysfunction"},"answer":"D","explanation":"After the first year, chronic lung allograft dysfunction is the main cause of death. It includes bronchiolitis obliterans syndrome (obstructive) and restrictive allograft syndrome. Primary graft dysfunction and surgical complications are early causes, and hyperacute rejection is rare with crossmatching.","distractor":"PGD is early."},
{"id":413,"section":8,"sectionName":"Transplantation and Oncology","stem":"A kidney transplant recipient has oliguria on day 1 with patent vessels. What is likely?","options":{"A":"Chronic rejection","B":"Recurrence of disease","C":"Delayed graft function","D":"BK nephropathy"},"answer":"C","explanation":"Delayed graft function means dialysis is needed in the first week after a kidney transplant, usually from ischaemic acute tubular necrosis. It is commoner with deceased donors, especially DCD and long cold ischaemia. Exclude vascular thrombosis, obstruction and urine leak first. BK nephropathy and chronic rejection occur months later.","distractor":"BK nephropathy is later."},
{"id":414,"section":8,"sectionName":"Transplantation and Oncology","stem":"What is hyperacute rejection?","options":{"A":"Immediate graft failure due to preformed antibodies","B":"T-cell mediated rejection developing over several weeks","C":"Infection-related failure","D":"Chronic fibrosis"},"answer":"A","explanation":"Hyperacute rejection occurs within minutes to hours of reperfusion. Preformed antibodies against donor HLA or ABO antigens activate complement and cause graft thrombosis. It is now rare because of ABO matching and pre-transplant crossmatching, and the graft must be removed.","distractor":"T-cell rejection is acute cellular rejection."},
{"id":415,"section":8,"sectionName":"Transplantation and Oncology","stem":"A transplant recipient has diarrhoea, rash and liver dysfunction after HSCT. What is likely?","options":{"A":"C. difficile only","B":"Drug reaction","C":"CMV colitis with hepatitis from reactivation","D":"Acute graft-versus-host disease"},"answer":"D","explanation":"Acute GVHD typically involves the skin (maculopapular rash on palms and soles), gut (secretory diarrhoea) and liver (cholestatic jaundice) after allogeneic HSCT. Biopsy helps confirm it. First-line treatment is systemic steroids, with ruxolitinib for steroid-refractory disease. CMV colitis does not explain the rash.","distractor":"CMV colitis lacks rash."},
{"id":416,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which is first-line treatment for acute GVHD grade II–IV?","options":{"A":"Stop immunosuppression","B":"Systemic corticosteroids","C":"Antibiotics only","D":"Plasma exchange"},"answer":"B","explanation":"Methylprednisolone 2 mg/kg/day; ruxolitinib for steroid-refractory.","distractor":"Stopping immunosuppression worsens GVHD."},
{"id":417,"section":8,"sectionName":"Transplantation and Oncology","stem":"After HSCT, a patient has painful hepatomegaly, jaundice and weight gain. What is the diagnosis?","options":{"A":"Hepatic veno-occlusive disease (sinusoidal obstruction syndrome)","B":"Extrahepatic biliary obstruction from gallstones","C":"Hepatitis B","D":"GVHD"},"answer":"A","explanation":"Hepatic veno-occlusive disease (sinusoidal obstruction syndrome) usually occurs within about 21 days of HSCT. It presents with painful hepatomegaly, jaundice, weight gain and ascites from sinusoidal endothelial injury, and Doppler may show reversed portal flow. Treatment is defibrotide with fluid and sodium restriction.","distractor":"GVHD lacks weight gain."},
{"id":418,"section":8,"sectionName":"Transplantation and Oncology","stem":"A patient with neutropenic fever (ANC 0.3) is hypotensive. What is the first antibiotic?","options":{"A":"Oral amoxicillin","B":"Antipseudomonal beta-lactam within 1 hour","C":"Wait for cultures","D":"IV vancomycin alone, pending culture results"},"answer":"B","explanation":"Piperacillin-tazobactam or meropenem; add vancomycin if indicated.","distractor":"Vancomycin alone misses Gram-negatives."},
{"id":419,"section":8,"sectionName":"Transplantation and Oncology","stem":"In neutropenic fever, when is vancomycin added?","options":{"A":"Only after 7 days","B":"Routinely in all patients with neutropenic fever","C":"Haemodynamic instability, line infection, skin infection or MRSA","D":"Never"},"answer":"C","explanation":"IDSA and ESMO advise against routine vancomycin in neutropenic fever. Add Gram-positive cover for haemodynamic instability, suspected catheter-related or skin and soft tissue infection, pneumonia, MRSA colonisation, or Gram-positive cocci in blood cultures. Stop it after 48–72 hours if no resistant Gram-positive organism is found.","distractor":"Routine use increases resistance."},
{"id":420,"section":8,"sectionName":"Transplantation and Oncology","stem":"A neutropenic patient has persistent fever after 5 days of antibiotics. What is the next step?","options":{"A":"Discharge","B":"Stop antibiotics","C":"Add an aminoglycoside and continue current therapy","D":"Empirical or pre-emptive antifungal therapy"},"answer":"D","explanation":"Fever persisting for 4–7 days despite broad-spectrum antibiotics in high-risk neutropenia raises the possibility of invasive fungal infection. Investigate with CT chest, galactomannan and β-D-glucan, then start empirical or pre-emptive antifungal treatment (an echinocandin, liposomal amphotericin or voriconazole). Do not stop antibiotics.","distractor":"Stopping antibiotics is unsafe."},
{"id":421,"section":8,"sectionName":"Transplantation and Oncology","stem":"Neutropenic patient has right lower quadrant pain, fever and bowel wall thickening. What is likely?","options":{"A":"Neutropenic enterocolitis (typhlitis)","B":"Diverticulitis","C":"Acute appendicitis needing urgent appendicectomy","D":"Crohn's disease"},"answer":"A","explanation":"Neutropenic enterocolitis (typhlitis) is necrotising inflammation, usually of the caecum, presenting with fever, RLQ pain and bowel wall thickening above 4 mm on CT. Treat with bowel rest, broad-spectrum antibiotics with anaerobic cover, and G-CSF. Surgery is reserved for perforation, uncontrolled bleeding or deterioration.","distractor":"Appendicitis less likely."},
{"id":422,"section":8,"sectionName":"Transplantation and Oncology","stem":"A leukaemia patient has WBC 250 × 10^9/L and hypoxaemia. What is the diagnosis?","options":{"A":"Pulmonary oedema","B":"Pulmonary embolism","C":"Hyperleukocytosis with leukostasis","D":"Pneumonia requiring broad-spectrum antibiotics only"},"answer":"C","explanation":"Treat with cytoreduction (hydroxyurea, chemotherapy); avoid transfusion.","distractor":"Transfusion increases viscosity."},
{"id":423,"section":8,"sectionName":"Transplantation and Oncology","stem":"A lymphoma patient after chemotherapy has K 6.8, phosphate high, calcium low, uric acid high. What is the diagnosis?","options":{"A":"Hypoparathyroidism","B":"Tumour lysis syndrome","C":"Rhabdomyolysis","D":"Sepsis"},"answer":"B","explanation":"Tumour lysis syndrome follows rapid cell breakdown, typically after chemotherapy for high-grade lymphoma or leukaemia. It causes hyperkalaemia, hyperphosphataemia, secondary hypocalcaemia and hyperuricaemia (Cairo–Bishop criteria), with AKI and arrhythmias in clinical TLS. Rhabdomyolysis also causes high CK.","distractor":"Rhabdomyolysis has high CK."},
{"id":424,"section":8,"sectionName":"Transplantation and Oncology","stem":"What is the prophylaxis for TLS in high-risk patients?","options":{"A":"Bicarbonate routinely","B":"Allopurinol alone with restricted fluids","C":"Diuretics only","D":"Aggressive hydration and rasburicase"},"answer":"D","explanation":"High-risk patients need aggressive IV hydration (about 3 L/m²/day to keep urine output high) and rasburicase, which breaks down existing uric acid. Allopurinol only prevents new uric acid and suits intermediate risk. Rasburicase is contraindicated in G6PD deficiency, and urine alkalinisation is no longer recommended.","distractor":"Routine bicarbonate is not recommended."},
{"id":425,"section":8,"sectionName":"Transplantation and Oncology","stem":"A lung cancer patient has facial swelling and distended neck veins. What is the diagnosis?","options":{"A":"Cardiac tamponade","B":"Superior vena cava syndrome","C":"Heart failure","D":"Angioedema"},"answer":"B","explanation":"SVC obstruction, commonly from lung cancer or lymphoma, causes face and arm swelling, distended neck and chest veins and dyspnoea, worse on lying flat. Obtain a tissue diagnosis when possible. Endovascular stenting gives rapid relief of severe symptoms, then chemotherapy or radiotherapy. Airway compromise or cerebral oedema is an emergency.","distractor":"Tamponade causes pulsus paradoxus."},
{"id":426,"section":8,"sectionName":"Transplantation and Oncology","stem":"A cancer patient has back pain and leg weakness. MRI shows cord compression. What is immediate treatment?","options":{"A":"Observation","B":"Physiotherapy","C":"High-dose dexamethasone and urgent oncology or surgery","D":"Analgesia and physiotherapy, with outpatient MRI review"},"answer":"C","explanation":"Malignant cord compression is an emergency. Give dexamethasone (for example 16 mg daily) immediately and refer urgently for decompressive surgery and/or radiotherapy within 24 hours. Ambulatory status at diagnosis predicts outcome, and surgery plus radiotherapy improved ambulation versus radiotherapy alone (Patchell, Lancet 2005).","distractor":"Delay worsens outcome."},
{"id":427,"section":8,"sectionName":"Transplantation and Oncology","stem":"A cancer patient has malignant hypercalcaemia. Which drug is preferred with renal failure?","options":{"A":"Zoledronic acid","B":"Thiazide","C":"Pamidronate","D":"Denosumab"},"answer":"D","explanation":"Bisphosphonates (zoledronic acid, pamidronate) are renally cleared and nephrotoxic, so they need dose reduction or avoidance in significant renal failure. Denosumab is not renally cleared and can be used, with monitoring for hypocalcaemia. Start with IV fluids; calcitonin acts quickly but briefly, and thiazides raise calcium.","distractor":"Bisphosphonates are nephrotoxic."},
{"id":428,"section":8,"sectionName":"Transplantation and Oncology","stem":"A patient on CAR-T therapy develops fever and hypotension. What is the diagnosis?","options":{"A":"Cytokine release syndrome","B":"Septic shock only","C":"Anaphylaxis","D":"GVHD"},"answer":"A","explanation":"Cytokine release syndrome usually starts 1–14 days after CAR-T infusion with fever, then hypotension and hypoxia (ASTCT grading). Sepsis must be excluded and treated in parallel. Tocilizumab is first-line for grade 2 or higher, with corticosteroids for refractory or severe CRS.","distractor":"Sepsis must be excluded."},
{"id":429,"section":8,"sectionName":"Transplantation and Oncology","stem":"A CAR-T patient develops confusion and seizures. What is the diagnosis?","options":{"A":"Immune effector cell-associated neurotoxicity syndrome","B":"Meningitis","C":"Stroke","D":"Cytokine release syndrome affecting the brain"},"answer":"A","explanation":"ICANS (immune effector cell-associated neurotoxicity syndrome) causes encephalopathy, aphasia, tremor, seizures and cerebral oedema, usually after or with CRS. It is graded with the ICE score. Treat with corticosteroids (dexamethasone) and levetiracetam for seizures. Tocilizumab does not cross the blood–brain barrier and is not effective for isolated ICANS.","distractor":"Tocilizumab does not treat ICANS."},
{"id":430,"section":8,"sectionName":"Transplantation and Oncology","stem":"A patient on immune checkpoint inhibitors develops dyspnoea and infiltrates. What is likely?","options":{"A":"Bacterial pneumonia only","B":"PE","C":"Heart failure","D":"Immune-related pneumonitis"},"answer":"D","explanation":"Immune checkpoint inhibitors can cause immune-related pneumonitis with cough, dyspnoea, hypoxia and ground-glass or organising-pneumonia infiltrates. Exclude infection and PE. Grade 2 or higher needs the drug withheld and steroids (methylprednisolone 1–2 mg/kg for severe disease), with infliximab or mycophenolate if refractory.","distractor":"Infection must be excluded."},
{"id":431,"section":8,"sectionName":"Transplantation and Oncology","stem":"A checkpoint inhibitor patient has chest pain, arrhythmias and raised troponin. What is likely?","options":{"A":"PE","B":"MI only","C":"Immune-related myocarditis","D":"Pericarditis only"},"answer":"C","explanation":"ICI myocarditis typically occurs in the first weeks of therapy, more often with combined anti-PD-1 and anti-CTLA-4. It presents with troponin rise, arrhythmias, conduction block and heart failure, sometimes with myositis or myasthenia overlap. Mortality is high (up to about 40–50%), so stop the drug and give high-dose methylprednisolone early.","distractor":"MI is less likely."},
{"id":432,"section":8,"sectionName":"Transplantation and Oncology","stem":"A cancer patient on chemotherapy has neutropenia and fever. What is MASCC score used for?","options":{"A":"Assessing mortality in ICU","B":"Identifying low-risk patients","C":"Diagnosing sepsis","D":"Choosing antifungal"},"answer":"B","explanation":"The MASCC score uses burden of illness, hypotension, COPD, solid tumour or no previous fungal infection, dehydration, outpatient status and age. A score ≥21 identifies low-risk febrile neutropenia that may be suitable for oral or outpatient treatment. It is not a sepsis diagnosis or antifungal selection tool.","distractor":"It is not a sepsis tool."},
{"id":433,"section":8,"sectionName":"Transplantation and Oncology","stem":"What is the ICU mortality trend for cancer patients?","options":{"A":"It has worsened","B":"It remains about 90%, so ICU admission is rarely appropriate","C":"It has improved; admission should not be refused based on cancer alone","D":"All cancer patients should be refused"},"answer":"C","explanation":"ICU survival of cancer patients has improved a lot over the last decades, thanks to better cancer treatment and supportive care. Outcomes depend more on performance status, number of organ failures and disease control than on the cancer diagnosis itself. Blanket refusal of ICU admission is not justified.","distractor":"Blanket refusal is inappropriate."},
{"id":434,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which approach is suggested for uncertain prognosis in cancer patients?","options":{"A":"Unlimited full ICU care without planned reassessment","B":"Palliative care only","C":"Refuse ICU","D":"ICU trial with reassessment after a few days"},"answer":"D","explanation":"When prognosis is uncertain, a time-limited ICU trial of full treatment (often 3–5 days) followed by structured reassessment is recommended. Survival is predicted mainly by the trajectory of organ failure over the first days. This avoids both early refusal and prolonged non-beneficial treatment.","distractor":"Unlimited care may not be beneficial."},
{"id":435,"section":8,"sectionName":"Transplantation and Oncology","stem":"A patient has ARF after HSCT with diffuse alveolar haemorrhage. What is the treatment?","options":{"A":"Antibiotics only","B":"High-dose steroids","C":"Tranexamic acid only","D":"Anticoagulation"},"answer":"B","explanation":"Diffuse alveolar haemorrhage after HSCT presents with progressive hypoxaemia and increasingly bloody BAL returns. Infection must be excluded. Treatment is high-dose corticosteroids (for example methylprednisolone 250–1000 mg/day for several days) with platelet support and correction of coagulopathy, although mortality remains high.","distractor":"Anticoagulation worsens bleeding."},
{"id":436,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which drug causes cardiotoxicity dose-dependently?","options":{"A":"Anthracyclines (doxorubicin)","B":"Methotrexate","C":"Cyclophosphamide only","D":"Cisplatin"},"answer":"A","explanation":"Anthracyclines (doxorubicin, daunorubicin) cause dose-dependent cardiotoxicity, with risk rising sharply above a cumulative doxorubicin dose of about 400–450 mg/m². It may appear acutely or years later as dilated cardiomyopathy. Dexrazoxane is cardioprotective. High-dose cyclophosphamide can cause acute myopericarditis, but this is not cumulative.","distractor":"Cisplatin causes nephrotoxicity."},
{"id":437,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which chemotherapy causes haemorrhagic cystitis?","options":{"A":"Vincristine","B":"Cyclophosphamide","C":"Doxorubicin","D":"Cisplatin"},"answer":"B","explanation":"Cyclophosphamide and ifosfamide are metabolised to acrolein, which is excreted in urine and injures the bladder mucosa, causing haemorrhagic cystitis. Prevent with hyperhydration and mesna, which binds acrolein. After HSCT, BK virus is another cause.","distractor":"Cisplatin causes nephrotoxicity."},
{"id":438,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which chemotherapy causes pulmonary fibrosis?","options":{"A":"Doxorubicin","B":"Cytarabine","C":"Bleomycin","D":"Vincristine"},"answer":"C","explanation":"Bleomycin causes dose-dependent pulmonary toxicity (pneumonitis that progresses to fibrosis), with higher risk in older patients, renal impairment, smoking and thoracic radiotherapy. High FiO2 can worsen or trigger lung injury, so use the lowest FiO2 that keeps SpO2 about 88–92%, including during surgery.","distractor":"Vincristine causes neuropathy."},
{"id":439,"section":8,"sectionName":"Transplantation and Oncology","stem":"Methotrexate toxicity with renal failure. What is the antidote?","options":{"A":"N-acetylcysteine","B":"Naloxone","C":"Vitamin K and fresh frozen plasma","D":"Leucovorin and glucarpidase"},"answer":"D","explanation":"Methotrexate toxicity is treated with leucovorin (folinic acid) rescue, which bypasses dihydrofolate reductase, plus hydration and urine alkalinisation. In renal failure with toxic levels, glucarpidase quickly hydrolyses extracellular methotrexate into inactive metabolites. N-acetylcysteine is for paracetamol poisoning.","distractor":"NAC is for paracetamol."},
{"id":440,"section":8,"sectionName":"Transplantation and Oncology","stem":"A patient with acute promyelocytic leukaemia has bleeding and DIC. What is treatment?","options":{"A":"All-trans retinoic acid immediately","B":"Platelets only","C":"Delay treatment","D":"Heparin infusion to treat the DIC first"},"answer":"A","explanation":"APL causes life-threatening DIC with hyperfibrinolysis. Start ATRA immediately on suspicion (from the blood film) without waiting for genetic confirmation, as it rapidly corrects the coagulopathy. Support with platelets, cryoprecipitate and FFP. Early haemorrhagic death is the main cause of mortality, so delay is dangerous.","distractor":"Delay increases mortality."},
{"id":441,"section":8,"sectionName":"Transplantation and Oncology","stem":"A patient on ATRA develops dyspnoea, fever and infiltrates. What is the diagnosis?","options":{"A":"PE","B":"Pneumonia","C":"Differentiation syndrome","D":"Heart failure"},"answer":"C","explanation":"Differentiation syndrome (retinoic acid syndrome) occurs days to weeks after starting ATRA or arsenic trioxide. Features are fever, dyspnoea, pulmonary infiltrates and effusions, weight gain, hypotension and AKI. Treat with dexamethasone 10 mg IV twice daily and consider pausing ATRA.","distractor":"Pneumonia less likely."},
{"id":442,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which organ donation type allows donation after withdrawal of life support?","options":{"A":"Living donation","B":"Donation after circulatory death","C":"Paired donation","D":"Donation after brain death"},"answer":"B","explanation":"In controlled DCD (Maastricht III), life-sustaining treatment is withdrawn in the patient's best interests and organs are retrieved after circulatory arrest and a no-touch period. DBD requires death confirmed by neurological criteria while the heart is still beating.","distractor":"DBD requires brain death."},
{"id":443,"section":8,"sectionName":"Transplantation and Oncology","stem":"In DCD, what is the standard no-touch period after circulatory arrest?","options":{"A":"5 minutes","B":"30 seconds","C":"1 hour","D":"30 minutes"},"answer":"A","explanation":"After circulatory arrest in DCD, a no-touch observation period of 5 minutes (2–5 minutes depending on country) confirms permanent loss of circulation and the absence of autoresuscitation before death is declared. A 30-second period is too short to confirm that circulation will not return.","distractor":"30 seconds is too short."},
{"id":444,"section":8,"sectionName":"Transplantation and Oncology","stem":"What is normothermic regional perfusion?","options":{"A":"Cooling organs","B":"Machine perfusion of the isolated heart after retrieval","C":"Hypothermic storage","D":"ECMO-based perfusion of organs after DCD"},"answer":"D","explanation":"Normothermic regional perfusion uses ECMO circuits to restore oxygenated blood flow to abdominal (and sometimes thoracic) organs after DCD death is declared, with the cerebral circulation excluded. It reverses warm ischaemic injury and improves liver graft outcomes, with less ischaemic cholangiopathy.","distractor":"It is not cooling."},
{"id":445,"section":8,"sectionName":"Transplantation and Oncology","stem":"Which complication is characteristic of DCD liver grafts compared with DBD grafts?","options":{"A":"Hyperacute antibody-mediated rejection in the first hours","B":"Recurrent hepatitis B","C":"Ischaemic cholangiopathy (non-anastomotic biliary strictures)","D":"Higher rate of CMV disease in the recipient"},"answer":"C","explanation":"Warm ischaemia during DCD injures the biliary epithelium; NRP and machine perfusion reduce this risk.","distractor":"Hyperacute rejection relates to preformed antibodies, not donor type."},
{"id":446,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"pH 7.25, PaCO2 25 mmHg, HCO3 11 mmol/L. Using Winter's formula, what is the respiratory status?","options":{"A":"Primary respiratory alkalosis","B":"Appropriate respiratory compensation (expected PaCO2 22.5 ± 2)","C":"Concomitant respiratory alkalosis","D":"Concomitant respiratory acidosis (PaCO2 higher than expected)"},"answer":"B","explanation":"Expected PaCO2 = 1.5 × 11 + 8 = 24.5 ± 2 (22.5–26.5); measured 25 is appropriate.","distractor":"PaCO2 above 26.5 would mean concomitant respiratory acidosis."},
{"id":447,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"pH 7.10, PaCO2 40 mmHg, HCO3 12 mmol/L. What is the disorder?","options":{"A":"Metabolic acidosis with concomitant respiratory acidosis","B":"Metabolic alkalosis","C":"Pure metabolic acidosis with full respiratory compensation","D":"Respiratory acidosis only"},"answer":"A","explanation":"Expected PaCO2 = 1.5 × 12 + 8 = 26 ± 2. A PaCO2 of 40 is too high, indicating inadequate ventilation.","distractor":"Normal PaCO2 is not appropriate compensation here."},
{"id":448,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Na 140, Cl 100, HCO3 10 mmol/L. What is the delta ratio and its meaning?","options":{"A":"0.2; pure normal anion gap acidosis","B":"About 0.5; mixed HAGMA and normal anion gap acidosis","C":"2.5; HAGMA with metabolic alkalosis","D":"About 1.3; pure high anion gap metabolic acidosis"},"answer":"D","explanation":"AG = 30; ΔAG = 30 − 12 = 18; ΔHCO3 = 24 − 10 = 14; ratio ≈ 1.3, within 1–2 → pure HAGMA.","distractor":"A ratio >2 suggests concurrent metabolic alkalosis."},
{"id":449,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Na 135, Cl 85, HCO3 20 mmol/L in a vomiting diabetic. What is the disorder?","options":{"A":"Pure metabolic alkalosis","B":"HAGMA with metabolic alkalosis","C":"NAGMA","D":"Pure HAGMA"},"answer":"B","explanation":"AG = 30; ΔAG 18; ΔHCO3 4; ratio 4.5 → concurrent metabolic alkalosis (vomiting) with ketoacidosis.","distractor":"A near-normal HCO3 hides the HAGMA."},
{"id":450,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A COPD patient has chronic PaCO2 60 mmHg. What HCO3 is expected?","options":{"A":"About 31 mmol/L","B":"About 26 mmol/L","C":"About 24 mmol/L","D":"About 40 mmol/L"},"answer":"A","explanation":"Chronic respiratory acidosis: HCO3 rises 3.5–4 per 10 mmHg PaCO2 → 24 + 7 ≈ 31.","distractor":"26 is acute compensation."},
{"id":451,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient with acute respiratory acidosis has PaCO2 70 mmHg. What is expected HCO3?","options":{"A":"About 34 mmol/L","B":"About 40 mmol/L","C":"About 27 mmol/L","D":"About 24 mmol/L"},"answer":"C","explanation":"In acute respiratory acidosis, HCO3 rises by about 1 mmol/L for each 10 mmHg rise in PaCO2 above 40. PaCO2 70 gives 24 + 3 = 27 mmol/L. In chronic respiratory acidosis renal compensation raises HCO3 by 3.5–4 per 10 mmHg, giving about 34–36 mmol/L.","distractor":"34 is chronic compensation."},
{"id":452,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient has metabolic alkalosis with HCO3 40 mmol/L. What PaCO2 is expected?","options":{"A":"About 70 mmHg","B":"About 40 mmHg","C":"About 30 mmHg","D":"About 48 mmHg"},"answer":"D","explanation":"Expected PaCO2 in metabolic alkalosis = 0.7 × HCO3 + 20 (±5) = 0.7 × 40 + 20 = 48 mmHg. A higher PaCO2 suggests an extra respiratory acidosis, and a lower one an extra respiratory alkalosis. Compensation rarely pushes PaCO2 above about 55 mmHg.","distractor":"70 suggests additional respiratory acidosis."},
{"id":453,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient at sea level on FiO2 0.21 has PaO2 60 and PaCO2 40 mmHg. What is the A–a gradient?","options":{"A":"About 90 mmHg","B":"About 10 mmHg","C":"About 40 mmHg","D":"About 0 mmHg"},"answer":"C","explanation":"PAO2 = 0.21 × 713 − 40/0.8 ≈ 150 − 50 = 100; A–a = 100 − 60 = 40 (elevated).","distractor":"A normal gradient is \u003c15 in young adults."},
{"id":454,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient has hypoxaemia with normal A–a gradient. What is the cause?","options":{"A":"Hypoventilation","B":"Diffusion limitation","C":"Shunt","D":"V/Q mismatch"},"answer":"A","explanation":"Hypoventilation and low FiO2 cause normal gradient hypoxaemia.","distractor":"Shunt raises the gradient."},
{"id":455,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Which cause of hypoxaemia does not improve with 100% oxygen?","options":{"A":"Diffusion limitation","B":"Hypoventilation","C":"V/Q mismatch","D":"Shunt"},"answer":"D","explanation":"In shunt, blood passes through unventilated alveoli, so extra inspired oxygen cannot reach it; as shunt fraction rises above about 30%, PaO2 barely responds to FiO2 1.0. Hypoventilation, V/Q mismatch and diffusion limitation all improve with supplemental oxygen.","distractor":"V/Q mismatch improves with oxygen."},
{"id":456,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient has SpO2 85% but PaO2 120 mmHg after dapsone. What is the diagnosis?","options":{"A":"Carbon monoxide poisoning","B":"Methaemoglobinaemia","C":"Sample error","D":"Shunt"},"answer":"B","explanation":"Pulse oximetry tends toward 85% in MetHb; treat with methylene blue.","distractor":"CO gives falsely normal SpO2."},
{"id":457,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient from a house fire has SpO2 99% but is confused with lactate 8 mmol/L. What test is needed?","options":{"A":"Standard pulse oximetry and repeat in 1 hour","B":"Serum lactate only","C":"Co-oximetry for carboxyhaemoglobin","D":"Chest X-ray"},"answer":"C","explanation":"Standard pulse oximeters use two wavelengths and read carboxyhaemoglobin as oxyhaemoglobin, so SpO2 is falsely normal. After smoke inhalation with confusion and high lactate, measure COHb by co-oximetry on a blood gas and give 100% oxygen. Lactate above 8–10 mmol/L also suggests cyanide toxicity.","distractor":"Pulse oximetry is unreliable."},
{"id":458,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient has lactic acidosis with high-flow oxygen and normal PaO2. What else may cause cellular hypoxia after house fire?","options":{"A":"Atelectasis","B":"Methaemoglobinaemia only","C":"Hypoventilation","D":"Cyanide poisoning"},"answer":"D","explanation":"Smoke from burning plastics releases hydrogen cyanide, which blocks cytochrome oxidase and stops cells using oxygen despite normal PaO2. It causes severe lactic acidosis and a high venous oxygen saturation. Treat empirically with hydroxocobalamin 5 g IV. Methaemoglobinaemia gives an SpO2 of about 85% that does not correct with oxygen.","distractor":"MetHb causes low SpO2."},
