   ===================================================================== */
const MODE_LABEL = m => t({study:'modeStudy', exam:'modeExam', custom:'modeCustom', review:'modeReview', flagged:'modeFlagged', due:'modeDue', browse:'modeBrowse', weak:'modeWeak', today:'modeToday'}[m] || 'modeStudy');
function createSession(o){
  const s = {id:o.id || uid(), mode:o.mode, title:o.title || MODE_LABEL(o.mode), feedback:o.feedback || 'instant', sections:o.sections || [],
    qids:o.qids, opt:null, resp:{}, revealed:{}, qtime:{}, conf:{}, marked:{}, strike:{}, changes:{}, idx:o.idx || 0, startedAt:Date.now(), endedAt:null, submitted:false,
    limitS:o.limitS || 0, passMark:o.passMark || st.settings.passMark};
  if (o.shuffleOpts) { s.opt = {}; s.qids.forEach(id => { s.opt[id] = shuffle(LETTERS).join(''); }); }
  st.sessions[s.id] = s; st.order = st.order.filter(x => x !== s.id); st.order.push(s.id);
  // keep storage bounded: drop the oldest non-browse sessions beyond 150
  const real = st.order.filter(id => st.sessions[id].mode !== 'browse');
  while (real.length > 150) { const old = real.shift(); delete st.sessions[old]; st.order = st.order.filter(x => x !== old); }
  st.lastSessionId = s.id; save();
  return s;
}
function startSession(o){
  if (!o.qids.length) { toast(t('noQs')); return; }
  const s = createSession(o); go('#/session/' + s.id);
}
function sectionsOf(qids){ return [...new Set(qids.filter(validId).map(id => Q(id).gsec))].sort((a, b) => a - b); }
/* short description of a set of sections: whole banks by name, otherwise section numbers */
function secSummary(secs){
  const parts = [];
  for (const b of BANKS) {
    const mine = secs.filter(n => SECTIONS[n - 1] && SECTIONS[n - 1].bank === b.id);
    if (!mine.length) continue;
    const all = mine.length === b.sections.length;
    parts.push((multi() ? b.short + (all ? '' : ' ') : '') + (all ? (multi() ? '' : t('fAll')) : mine.map(n => SECTIONS[n - 1].local).join(', ')));
  }
  return parts.join(' · ');
}
function sessionResult(s){
  let ans = 0, cor = 0; const bySec = {};
  for (const id of s.qids) {
    const sec = Q(id).gsec; const b = bySec[sec] || (bySec[sec] = {total:0, ans:0, cor:0}); b.total++;
    if (s.resp[id]) { ans++; b.ans++; if (s.resp[id] === Q(id).answer) { cor++; b.cor++; } }
  }
  const denom = s.feedback === 'exam' ? s.qids.length : ans;
  const used = s.feedback === 'exam' ? Math.min((s.endedAt || Date.now()) - s.startedAt, s.limitS * 1000 || Infinity)
    : Object.values(s.qtime).reduce((a, b) => a + b, 0);
  return {total:s.qids.length, ans, cor, pct:pct(cor, denom), bySec, used};
}
const isFinished = s => s.feedback === 'exam' ? s.submitted : !!s.endedAt;
function browseSession(sec){
  const S = SECTIONS[sec - 1], id = 'browse-' + S.bank + '-' + S.local;
  return st.sessions[id] || createSession({id, mode:'browse', title:S.name, qids:secIds(sec), sections:[sec]});
}
function openQuestion(id){
  const s = browseSession(Q(id).gsec); s.idx = s.qids.indexOf(id); st.lastSessionId = s.id; save();
  location.replace('#/session/' + s.id);
}
function sectionStudy(n){
  const ids = secIds(n); const first = ids.findIndex(id => !st.answers[id]);
  startSession({mode:'study', title:SECTIONS[n - 1].name, qids:ids, sections:[n], idx:Math.max(first, 0), shuffleOpts:st.settings.shuffleOpts});
}
function weakPractice(n){
  let ids = secIds(n).filter(id => !st.answers[id] || !st.answers[id].correct);
  if (!ids.length) ids = secIds(n);
  startSession({mode:'weak', title:SECTIONS[n - 1].name, qids:shuffle(ids).slice(0, 20), sections:[n], shuffleOpts:st.settings.shuffleOpts});
}
function startToday(){
  const p = buildPlan();
  startSession({mode:'today', title:t('todayPlan'), qids:p.qids, sections:sectionsOf(p.qids), shuffleOpts:st.settings.shuffleOpts});
}

/* =====================================================================
   ROUTER  (#/home #/study #/exam #/review #/search #/stats #/settings #/q/<key> #/section/n #/session/id #/results/id)
   ===================================================================== */
const NAV = [['home','#/home'], ['study','#/study'], ['exam','#/exam'], ['review','#/review'], ['stats','#/stats'], ['notes','#/notes'], ['search','#/search'], ['settings','#/settings']];
function go(h){ if (location.hash === h) route(); else location.hash = h; }
let lastRoute = '#/home';
function route(){
  const hash = location.hash || '#/home';
  const [path, qs] = hash.slice(1).split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs || '');
  leavePlayer();
  closeDrawer();
  hidePop(); hlPending = null;
  const view = $('#view');
  let title = 'ICU MCQ Bank', active = parts[0] || 'home', html = '';
  switch (parts[0]) {
    case 'study': html = viewStudy(); title = t('study'); break;
    case 'exam': html = viewExam(params); title = t('examTitle'); break;
    case 'review': html = viewReview(); title = t('review'); break;
    case 'search': html = viewSearch(params); title = t('search'); break;
    case 'stats': html = viewStats(); title = t('stats'); break;
    case 'settings': html = viewSettings(); title = t('settings'); break;
    case 'notes': html = viewNotes(params); title = t('notebook'); break;
    case 'cards': html = viewCards(); title = t('flashcards'); active = 'notes'; break;
    case 'section': { const n = clamp(+parts[1], 1, SECTIONS.length); html = viewSection(n); title = SECTIONS[n - 1].name; active = 'home'; break; }
    case 'results': html = viewResults(parts[1]); title = t('results'); active = (st.sessions[parts[1]] || {}).feedback === 'exam' ? 'exam' : 'review'; break;
    case 'q': { const id = /^\d+$/.test(parts[1] || '') ? 'icu500-' + parts[1] : decodeURIComponent(parts[1] || ''); if (validId(id)) { openQuestion(id); return; } html = '<div class="card empty">' + t('notFound') + '</div>'; break; }
    case 'session': {
      const s = st.sessions[parts[1]];
      if (!s) { html = '<div class="card empty">' + t('sessionMissing') + '</div>'; break; }
      if (s.feedback === 'exam' && !s.submitted && s.limitS && Date.now() - s.startedAt >= s.limitS * 1000) { submitExam(s, true); return; }
      enterPlayer(s); setChrome(s.title, s.mode === 'exam' ? 'exam' : 'study', true); return;
    }
    default: html = viewHome(); active = 'home';
  }
  view.innerHTML = (storageOK ? '' : '<div class="storage-warn" role="alert">' + t('storageWarn') + '</div>') + html;
  setChrome(title, active, false);
  afterRender(parts[0], params);
  if (!hash.startsWith('#/session')) lastRoute = hash;
  window.scrollTo(0, 0);
}
function setChrome(title, active, inPlayer){
  $('#page-title').textContent = title;
  document.title = title === 'ICU MCQ Bank' ? title : title + ' · ICU MCQ Bank';
  document.body.classList.toggle('in-player', inPlayer);
  $('#back-btn').hidden = !inPlayer && !location.hash.match(/^#\/(section|results)/);
  $$('[data-nav]').forEach(a => a.toggleAttribute('aria-current', false));
  $$('[data-nav="' + active + '"]').forEach(a => a.setAttribute('aria-current', 'page'));
}
function renderNav(){
  $('#side-links').innerHTML = NAV.map(([k, h]) => '<a class="nav-link" data-nav="' + k + '" href="' + h + '">' + icon(k) + '<span>' + t(k) + '</span></a>').join('');
  $('#bottom-links').innerHTML = NAV.slice(0, 5).map(([k, h]) => '<a data-nav="' + k + '" href="' + h + '">' + icon(k) + '<span>' + t(k) + '</span></a>').join('');
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#search-link').setAttribute('aria-label', t('search')); $('#settings-link').setAttribute('aria-label', t('settings'));
}

/* ---- exam countdown ---- */
const parseDay = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]).getTime() : null; };
const examDates = () => st.settings.examDates.split(',').map(parseDay).filter(Boolean).sort((a, b) => a - b);
const daysTo = ts => Math.round((ts - startOfDay(Date.now())) / DAY);
const fmtShort = ts => new Date(ts).toLocaleDateString(st.settings.lang === 'ar' ? 'ar-EG' : 'en-GB', {weekday:'short', day:'numeric', month:'short'});
/* Arabic counted nouns: 1 يوم, 2 يومان, 3–10 أيام, 11+ يوماً */
const dayWord = n => st.settings.lang === 'ar' ? (n === 1 ? 'يوم' : n === 2 ? 'يومان' : n >= 3 && n <= 10 ? 'أيام' : 'يوماً') : (n === 1 ? 'day' : 'days');
function greeting(){ const h = new Date().getHours(); return t(h < 12 ? 'greetMorning' : h < 17 ? 'greetAfternoon' : 'greetEvening'); }
function countdownHTML(){
  const dates = examDates();
  if (!dates.length) return '<div class="cd-head">' + t('todayPlan') + '</div><a class="small" href="#/settings">' + t('countdownNone') + '</a>';
  const next = dates.find(d => daysTo(d) >= 0);
  const head = next === undefined ? t('examsOver') : daysTo(next) === 0 ? t('examToday') : tf('examIn', {d:'<span class="cd-n">' + daysTo(next) + '</span>', u:dayWord(daysTo(next))});
  const chips = dates.map((d, i) => { const n = daysTo(d), cls = n < 0 ? 'past' : d === next ? 'next' : '';
    return '<span class="cd-chip ' + cls + '">' + ic(n < 0 ? 'check' : 'calendar', 'xs') + t('examDay') + ' ' + (i + 1) + ' · ' + fmtShort(d) +
      (n >= 0 ? ' · <b>' + (n === 0 ? t('today') : tf('daysShort', {d:n, u:dayWord(n)})) + '</b>' : '') + '</span>'; }).join('');
  return '<div class="cd-head">' + head + '</div><div class="cd-chips">' + chips + '</div>';
}
/* daily pace needed to finish the unanswered questions before the next exam day (keeping the last day for review) */
function paceSuggestion(){
  const next = examDates().find(d => daysTo(d) > 0); if (next === undefined) return null;
  const remaining = scopeIds().filter(k => !st.answers[k]).length; if (!remaining) return null;
  return {n:Math.min(NUM_LIMITS.dailyGoal[1], Math.max(NUM_LIMITS.dailyGoal[0], Math.ceil(remaining / Math.max(1, daysTo(next) - 1)))), remaining, date:next};
}

function weekHTML(){

  const max = Math.max(goal, ...days.map(x => x.x.attempted)), tot = days.reduce((a, x) => a + x.x.attempted, 0), cor = days.reduce((a, x) => a + x.x.correct, 0);

/* ---- question of the day: one unanswered question from the weakest section, fixed for the day ---- */
function qotdId(){
  const today = dayKey();
  if (st.qotd && st.qotd.day === today && validId(st.qotd.id) && inScope(st.qotd.id)) return st.qotd.id;
  const rows = scopeSections().map(s => ({s, x:statsFor(s.ids)}));
  const weak = rows.filter(r => r.x.att >= 5).sort((a, b) => a.x.acc - b.x.acc);
  let pool = [];
  for (const r of weak.concat(rows.filter(r => !weak.includes(r)))) { pool = r.s.ids.filter(k => !st.answers[k]); if (pool.length) break; }
  if (!pool.length) pool = wrongIds(); if (!pool.length) pool = scopeIds().slice();
  let h = 0; for (const c of today) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  st.qotd = {day:today, id:pool[h % pool.length], resp:null}; save();
  return st.qotd.id;
}
function qotdHTML(){
  const id = qotdId(), q = Q(id), resp = st.qotd.resp;
  const opts = LETTERS.map(L => { const isAns = L === q.answer, mine = resp === L;
    const cls = !resp ? '' : isAns ? 'correct' : mine ? 'wrong' : 'dim';
    return '<button class="opt ' + cls + '" data-act="qotd" data-l="' + L + '"' + (resp ? ' disabled' : '') + '><span class="key">' + L + '</span><span class="txt">' + fmt(q.options[L]) + '</span><span class="mk">' + (resp && isAns ? ic('check') : mine ? ic('x') : '') + '</span></button>'; }).join('');
  return '<section class="card qotd" id="qotd"><div class="card-title"><h2>' + ic('bulb') + t('qotd') + '</h2>' + secIcon(SECTIONS[q.gsec - 1], true) + '</div>' +

function viewSearch(params){
  const q = params.get('q') || '', sec = params.get('sec') || '';
  return '<section class="card"><div class="search-bar"><input class="input" id="s-q" type="search" placeholder="' + t('searchPh') + '" value="' + esc(q) + '" aria-label="' + t('search') + '" autocomplete="off">' +

    '<p class="small muted" id="s-count" aria-live="polite" style="margin-top:.75rem"></p><div id="s-results"></div></section>';
}
function highlight(text, terms){
  if (!terms.length) return fmt(text);
  const lower = text.toLowerCase(), marks = [];
  for (const term of terms) { let i = 0; while ((i = lower.indexOf(term, i)) !== -1) { marks.push([i, i + term.length]); i += term.length; } }
  if (!marks.length) return fmt(text);
  marks.sort((a, b) => a[0] - b[0]);
  const merged = []; for (const m of marks) { const l = merged[merged.length - 1]; if (l && m[0] <= l[1]) l[1] = Math.max(l[1], m[1]); else merged.push(m.slice()); }
  let out = '', p = 0;
  for (const [a, b] of merged) { out += fmt(text.slice(p, a)) + '<mark>' + fmt(text.slice(a, b)) + '</mark>'; p = b; }
  return out + fmt(text.slice(p));
}
function snippet(text, term){
  const i = text.toLowerCase().indexOf(term); if (i < 0) return null;
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + term.length + 90);
  return (a ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '');
}
function runSearch(){
  const qEl = $('#s-q'); if (!qEl) return;
  const raw = qEl.value.trim(), sec = +$('#s-sec').value || 0;
  history.replaceState(null, '', '#/search' + (raw || sec ? '?' + new URLSearchParams(Object.assign(raw ? {q:raw} : {}, sec ? {sec} : {})).toString() : ''));
  const out = $('#s-results'), cnt = $('#s-count');
  if (raw.length < 2) { out.innerHTML = ''; cnt.textContent = t('searchHint'); return; }
  const terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  const idx = searchIndex(), hits = [];
  for (let i = 0; i < QS.length; i++) { if (sec && QS[i].gsec !== sec) continue; if (terms.every(term => idx[i].includes(term))) hits.push(QS[i]); }
  cnt.textContent = hits.length + ' ' + t('resultsN');
  out.innerHTML = hits.slice(0, 150).map(q => {
    const fields = [...LETTERS.map(l => q.options[l]), q.explanation, q.distractor];
    let snip = ''; if (!terms.every(term => q.stem.toLowerCase().includes(term))) { for (const f of fields) { const sn = snippet(f, terms.find(term => f.toLowerCase().includes(term)) || '\u0000'); if (sn) { snip = sn; break; } } }
    return '<a class="result" href="#/q/' + q.key + '"><div class="r-meta">' + ql(q.key) + ' · ' + esc(q.sectionName) + '</div><div class="r-stem qtext" dir="ltr" lang="en">' + highlight(q.stem, terms) + '</div>' + (snip ? '<div class="r-snip qtext" dir="ltr" lang="en">' + highlight(snip, terms) + '</div>' : '') + '</a>';
  }).join('') + (hits.length > 150 ? '<p class="small muted">+' + (hits.length - 150) + '</p>' : '');
}

function lineChart(points){
  if (points.length < 1) return emptyState('stats', t('noData'));
  const W = 640, H = 230, L = 40, R = 14, T = 14, B = 34, iw = W - L - R, ih = H - T - B;
  const x = i => L + (points.length === 1 ? iw / 2 : i * iw / (points.length - 1)), y = v => T + ih - v / 100 * ih;
  let g = '';
  for (const v of [0, 25, 50, 75, 100]) g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '%</text>';
  const path = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = path + ' L' + x(points.length - 1).toFixed(1) + ' ' + y(0) + ' L' + x(0).toFixed(1) + ' ' + y(0) + ' Z';
  const step = Math.ceil(points.length / 7);
  const labels = points.map((p, i) => i % step === 0 || i === points.length - 1 ? '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + p.label + '</text>' : '').join('');
  const dots = points.map((p, i) => '<circle class="pt" cx="' + x(i) + '" cy="' + y(p.v) + '" r="4"><title>' + p.label + ': ' + p.v + '% (' + p.n + ')</title></circle>').join('');
  return '<div class="chart" dir="ltr"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('accOverTime') + '">' + g + '<path class="ar" d="' + area + '"/><path class="ln" d="' + path + '"/>' + dots + labels + '</svg></div>';
}

function optsHTML(s, id){

    const cls = isAns ? 'correct' : isMine ? 'wrong' : 'dim';
    return '<div class="opt ' + cls + '"><span class="key">' + pos + '</span><span class="txt">' + fmt(q.options[orig]) + (isMine ? ' <span class="small muted">(' + t('yourAnswer') + ')</span>' : '') + '</span><span class="mk">' + (isAns ? ic('check') : isMine ? ic('x') : '') + '</span>' +
      '<span class="sr-only">' + (isAns ? t('correctAnswer') : isMine ? t('wrongMsg') : '') + '</span></div>'; }).join('') + '</div>';
}
function explHTML(s, id){
  const q = Q(id), perm = (s && s.opt && s.opt[id]) || 'ABCD', dl = LETTERS[perm.indexOf(q.answer)];

}

    '<section class="card"><h2>' + t('reviewAll') + '</h2><div class="tabs seg" role="group">' +
      [['all', t('all') + ' (' + r.total + ')'], ['bad', t('wrong') + ' (' + wrongN + ')'], ['un', t('unanswered') + ' (' + unN + ')'], ['f', t('flagged')]].concat(exam && (chg.wr + chg.rw + chg.ww) ? [['c', t('changed') + ' (' + (chg.wr + chg.rw + chg.ww) + ')']] : []).map(([k, l], i) => '<button type="button" data-act="rev-filter" data-k="' + k + '" aria-pressed="' + (i === 0) + '">' + l + '</button>').join('') +

const curId = () => P.sess.qids[P.sess.idx];
function enterPlayer(s){
  P.sess = s; P.explShown = {}; P.returnTo = lastRoute; st.lastSessionId = s.id;
  s.conf = s.conf || {}; s.marked = s.marked || {}; s.strike = s.strike || {}; s.changes = s.changes || {};
  if (s.idx >= s.qids.length || s.idx < 0) s.idx = 0;
  $('#view').innerHTML = (storageOK ? '' : '<div class="storage-warn" role="alert">' + t('storageWarn') + '</div>') +
    '<div class="player"><div class="p-head card" id="p-head"></div><section class="p-main" id="p-main" aria-live="polite"></section><aside class="p-side" id="p-side"></aside><aside class="p-nav card" id="p-nav" aria-label="' + t('navigator') + '"></aside>' +
    '<div class="p-bar"><button class="btn" data-act="prev" aria-label="' + t('prev') + '">' + ic('chevL', 'flip') + '</button><button class="btn nav-open" data-act="drawer" aria-label="' + t('navigator') + '">' + ic('grid') + '</button><button class="btn primary" data-act="next" id="bar-next">' + t('next') + ic('chevR', 'flip') + '</button></div></div>';
  P.visitStart = document.hidden ? null : Date.now();
  if (s.feedback === 'exam' && !s.submitted) { P.timer = setInterval(tickExam, 1000); }

function leavePlayer(){
  if (!P.sess) return;
  flushVisit(); clearInterval(P.timer); P.timer = null; P.sess = null; save(true);
}
function flushVisit(){
  if (!P.sess || !P.visitStart) return;
  const id = curId(), d = Math.min(Date.now() - P.visitStart, 600000);

/* =====================================================================
   READINESS ESTIMATE
   ===================================================================== */
function readiness(){
  const ids = scopeIds(), o = statsFor(ids); if (!o.att) return null;
  const coverage = pct(o.att, ids.length);
  const exams = st.order.slice().reverse().map(id => st.sessions[id]).filter(s => s.mode === 'exam' && s.submitted && s.qids.some(inScope)).slice(0, 3);
  const examAvg = exams.length ? Math.round(exams.reduce((a, s) => a + sessionResult(s).pct, 0) / exams.length) : null;
  const score = Math.round(0.3 * coverage + 0.4 * o.acc + 0.3 * (examAvg === null ? o.acc : examAvg));
  return {score, coverage, acc:o.acc, examAvg, level:score >= 75 ? 'good' : score >= 60 ? 'fair' : 'weak'};
}
function readinessHTML(){
  const r = readiness();
  if (!r) return '<section class="card"><h2 style="display:flex;gap:.45rem;align-items:center">' + ic('gauge') + t('readiness') + '</h2>' + emptyState('gauge', t('readyEmpty')) + '</section>';
  const R = 46, C = 2 * Math.PI * R, col = 'var(--' + (r.level === 'good' ? 'ok' : r.level === 'fair' ? 'warn' : 'bad') + ')';
  const part = (l, v) => '<div class="part"><span class="muted">' + l + '</span><div class="bar"><span style="width:' + (v === null ? 0 : v) + '%"></span></div><span class="num">' + (v === null ? '—' : v + '%') + '</span></div>';
  return '<section class="card"><div class="card-title"><h2>' + ic('gauge') + t('readiness') + '</h2>' + '<span class="badge st st-' + r.level + '">' + t(r.level === 'good' ? 'readyHigh' : r.level === 'fair' ? 'readyMid' : 'readyLow') + '</span></div>' +
    '<div class="ready"><svg class="ready-ring" viewBox="0 0 112 112" role="img" aria-label="' + t('readiness') + ' ' + r.score + '%"><circle class="bg" cx="56" cy="56" r="' + R + '" fill="none" stroke-width="10"/>' +
    '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 56 56)" stroke="' + col + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - r.score / 100)) + '"/>' +
    '<text x="56" y="63" text-anchor="middle" font-size="24" font-weight="800">' + r.score + '%</text></svg>' +
    '<div class="parts">' + part(t('coverage'), r.coverage) + part(t('accuracy'), r.acc) + part(t('lastExams'), r.examAvg) + '</div></div>' +
    '<p class="small muted" style="margin:.6rem 0 0">' + t('readyNote') + '</p></section>';
}

function importFile(file){
  const rd = new FileReader();
  const done = () => { save(true); toast(t('importOk')); route(); };
  rd.onload = () => {
    let obj; try { obj = JSON.parse(rd.result); } catch (e) { obj = null; }
    if (!obj || obj.app !== 'icu-mcq-500' || !isObj(obj.state) || !isObj(obj.state.answers)) { modal(t('importBtn'), '<p>' + t('importInvalid') + '</p>', [{label:t('close'), cls:'primary'}]); return; }
    const inc = normalize(obj.state);
    modal(t('importBtn'), '<p>' + t('importSummary') + ': <b>' + esc(obj.exportedAt ? fmtDate(Date.parse(obj.exportedAt) || Date.now()) : '?') + '</b></p><p><b>' + Object.keys(inc.answers).length + '</b> ' + t('answeredQs') + ' · ' + t('flagged') + ' ' + Object.keys(inc.flags).length + ' · ' + t('note') + ' ' + Object.keys(inc.notes).length + '</p><p class="small muted">' + t('mergeHelp') + '</p>',
      [{label:t('cancel')}, {label:t('replace'), cls:'danger', fn:() => { inc.settings = st.settings; inc.tourDone = true; st = inc; done(); cloudReset(); }}, {label:t('merge'), cls:'primary', fn:() => { mergeState(inc); done(); }}]);
  };
  rd.readAsText(file);
}
function mergeState(inc){
  for (const k in inc.answers) { const a = st.answers[k], b = inc.answers[k]; if (!a || b.lastAt > a.lastAt) { st.answers[k] = b; if (inc.leitner[k]) st.leitner[k] = inc.leitner[k]; else delete st.leitner[k]; } }
  for (const k in inc.leitner) if (!st.leitner[k] && !st.answers[k]) st.leitner[k] = inc.leitner[k];
  Object.assign(st.flags, inc.flags);
  for (const k in inc.hl) if (!st.hl[k]) st.hl[k] = inc.hl[k];
  const seenR = new Set(st.reports.map(r => r.ts + '|' + r.id));
  st.reports = st.reports.concat(inc.reports.filter(r => !seenR.has(r.ts + '|' + r.id)));
  for (const k in inc.notes) if (!st.notes[k]) st.notes[k] = inc.notes[k]; else if (st.notes[k] !== inc.notes[k] && !st.notes[k].includes(inc.notes[k])) st.notes[k] += '\n\n' + inc.notes[k];
  for (const k in inc.daily) { const a = st.daily[k], b = inc.daily[k]; if (!a) st.daily[k] = b; else { a.attempted = Math.max(a.attempted, b.attempted); a.correct = Math.max(a.correct, b.correct); a.timeMs = Math.max(a.timeMs, b.timeMs); } }
  const seen = new Set(st.log.map(e => e[0] + '|' + e[1]));
  st.log = st.log.concat(inc.log.filter(e => !seen.has(e[0] + '|' + e[1]))).sort((a, b) => a[0] - b[0]).slice(-10000);
  for (const id of inc.order) if (!st.sessions[id]) { st.sessions[id] = inc.sessions[id]; st.order.push(id); }
  st.order.sort((a, b) => st.sessions[a].startedAt - st.sessions[b].startedAt);
}

    [{label:t('cancel')}, {label:t('confirm'), cls:'danger solid', fn:() => {
      const notes = $('#reset-notes').checked, set = new Set(ids);
      for (const id of ids) { delete st.answers[id]; delete st.leitner[id]; if (notes) { delete st.flags[id]; delete st.notes[id]; } }
      st.log = st.log.filter(e => !set.has(e[1]));
      if (ids.length === ALL_IDS.length) { st.daily = {}; st.sessions = {}; st.order = []; st.lastSessionId = null; st.log = []; }
      else for (const sid of st.order.slice()) { const s = st.sessions[sid]; if (s.qids.every(q => set.has(q))) { delete st.sessions[sid]; st.order = st.order.filter(x => x !== sid); } }

    }}]);
}

  'rev-filter':el => { $$('[data-act="rev-filter"]').forEach(b => b.setAttribute('aria-pressed', b === el)); const k = el.dataset.k;
    $$('#rev-list .rev-item').forEach(d => { d.hidden = !(k === 'all' || (k === 'f' ? d.dataset.f : k === 'c' ? d.dataset.c : d.dataset.k === k)); }); },
  labs:() => showLabs(0),
  'lab-tab':el => showLabs(+el.dataset.i),
  report:() => showReport(curId()),
  unhl:el => { if (P.sess) removeHL(el); },
  'start-cards':() => startCards(),
  'card-flip':() => { CARDS.flipped = true; rerenderCards(); },
  'card-next':() => { CARDS.i++; CARDS.flipped = false; rerenderCards(); },
  'card-again':() => { const k = CARDS.ids[CARDS.i]; st.leitner[k] = {box:1, due:startOfDay(Date.now()) + DAY}; save(); CARDS.again++; CARDS.i++; CARDS.flipped = false; rerenderCards(); },
  'copy-reports':() => { const txt = reportsText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(t('copied'))).catch(() => { modal(t('reports'), '<textarea class="input" style="min-height:240px" readonly>' + esc(txt) + '</textarea>', [{label:t('close'), cls:'primary'}]); }); },
  'clear-reports':() => modal(t('clear') + ' — ' + t('reports'), '<p>' + st.reports.length + ' ' + t('reports') + '</p>', [{label:t('cancel')}, {label:t('clear'), cls:'danger solid', fn:() => { st.reports = []; save(true); route(); }}]),
  goq:el => go('#/q/' + el.dataset.id),
  set:el => { const k = el.dataset.key; st.settings[k] = el.dataset.val; save(); applySettings(); route(); },
  export:() => exportData(),
  'import-label':(el, e) => { if (e.type === 'click') $('#import-file').click(); },
  'reset-sec':() => { const v = $('#reset-sec').value;
    if (v.startsWith('b:')) { const b = bankOf(v.slice(2)); resetIds(b.ids.slice(), b.title); } else resetIds(secIds(+v), secName(+v)); },
  'reset-all':() => resetIds(ALL_IDS, t('fAll') + ' (' + ALL_IDS.length + ')'),
  'set-goal':el => { st.settings.dailyGoal = clamp(+el.dataset.n, NUM_LIMITS.dailyGoal[0], NUM_LIMITS.dailyGoal[1]); save(); toast(t('goalSet') + ': ' + st.settings.dailyGoal); route(); },
  'quick-exam':() => { const ids = shuffle(scopeIds()).slice(0, 20);
    startSession({mode:'exam', feedback:'exam', title:t('modeExam') + ' · ' + ids.length + ' Q', qids:ids, sections:sectionsOf(ids), limitS:ids.length * st.settings.timerPerQ, passMark:st.settings.passMark, shuffleOpts:st.settings.shuffleOpts}); },
  random10:() => { const un = scopeIds().filter(k => !st.answers[k]), ids = shuffle(un.length >= 10 ? un : scopeIds()).slice(0, 10);
    startSession({mode:'custom', title:t('random10'), qids:ids, sections:sectionsOf(ids), shuffleOpts:st.settings.shuffleOpts}); },
  qotd:el => { if (!st.qotd || st.qotd.resp) return; const L = el.dataset.l; st.qotd.resp = L; recordAnswer(st.qotd.id, L, 0); buzz(L === Q(st.qotd.id).answer);
    const box = $('#qotd'); if (box) box.outerHTML = qotdHTML(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'LABEL') e.preventDefault();
  fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.submit === 'custom') {
    const secs = checkedSecs('csec'), filter = $('#c-filter').value, n = clamp(Math.round(+$('#c-count').value), 1, ALL_IDS.length);
    let ids = secs.flatMap(secIds);
    if (filter === 'unanswered') ids = ids.filter(id => !st.answers[id]);
    if (filter === 'wrong') ids = ids.filter(id => st.answers[id] && !st.answers[id].correct);
    if (filter === 'flagged') ids = ids.filter(id => st.flags[id]);
    if ($('#c-shuffle').checked) ids = shuffle(ids);
    ids = ids.slice(0, n);
    startSession({mode:'custom', title:t('customQuiz'), qids:ids, sections:sectionsOf(ids), shuffleOpts:$('#c-shopts').checked});
  } else if (f.dataset.submit === 'exam') {
    const secs = checkedSecs('esec'), n = examCount(), per = clamp(Math.round(+$('#e-timer').value), 10, 600), pm = clamp(Math.round(+$('#e-pass').value), 1, 100);
    const ids = shuffle(secs.flatMap(secIds)).slice(0, n);
    startSession({mode:'exam', feedback:'exam', title:t('modeExam') + ' · ' + ids.length + ' Q', qids:ids, sections:sectionsOf(ids), limitS:ids.length * per, passMark:pm, shuffleOpts:$('#e-shopts').checked});
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file' && el.files[0]) { importFile(el.files[0]); el.value = ''; }
  if (el.dataset.setbool) { st.settings[el.dataset.setbool] = el.checked; save(); applySettings(); }
  if (el.dataset.setnum) { const k = el.dataset.setnum, lim = NUM_LIMITS[k]; st.settings[k] = clamp(Math.round(+el.value), lim[0], lim[1]); el.value = st.settings[k]; save(); }
  if (el.id === 's-sec') runSearch();
  if (el.id === 'bank-sel') { st.settings.bank = el.value; save(); route(); }
  if (el.dataset.setdate !== undefined) { const d = st.settings.examDates.split(','); d[+el.dataset.setdate] = el.value; st.settings.examDates = d.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)).join(','); save(); }
  if (el.id === 'e-timer' || el.id === 'e-count') updateExamTotal();
});
/* strike-out: long-press on touch screens, right-click with a mouse */
let lpTimer = null, lpFired = false;
document.addEventListener('touchstart', e => {
  const o = e.target.closest && e.target.closest('.opt[data-act="choose"]'); if (!o || o.disabled) return;
  lpFired = false; clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpFired = true; toggleStrike(+o.dataset.pos); buzz(true); }, 550);
}, {passive:true});
['touchend', 'touchmove', 'touchcancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(lpTimer), {passive:true}));
document.addEventListener('contextmenu', e => {
  const o = e.target.closest && e.target.closest('.opt[data-act="choose"]'); if (!o || o.disabled || !P.sess) return;
  e.preventDefault(); if (!lpFired) toggleStrike(+o.dataset.pos);
});
let searchT = null, noteT = null, notesT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'n-q') { clearTimeout(notesT); notesT = setTimeout(renderNotesList, 150); }
  if (el.id === 's-q') { clearTimeout(searchT); searchT = setTimeout(runSearch, 150); }
  if (el.id === 'e-timer' || el.id === 'e-count') updateExamTotal();
  if (el.dataset.note) {
    const id = el.dataset.note; clearTimeout(noteT);
    noteT = setTimeout(() => { if (el.value.trim()) st.notes[id] = el.value; else delete st.notes[id]; save(); const s = $('#note-saved'); if (s) s.textContent = '✓ ' + t('saved'); }, 400);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (closeModal() || closeDrawer()) { e.preventDefault(); return; } }
  if (e.key === 'Tab' && modalOpen()) { const f = $$('#modal-root button, #modal-root input'); const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { z.focus(); e.preventDefault(); } else if (!e.shiftKey && document.activeElement === z) { a.focus(); e.preventDefault(); } return; }
  const tgt = e.target instanceof Element ? e.target : document.body;
  if (e.key === 'Enter' && (tgt.id === 'cloud-user' || tgt.id === 'cloud-pass')) { e.preventDefault(); cloudPassword(false); return; }
  if ((e.key === 'Enter' || e.key === ' ') && tgt.matches('tr[data-act], label[data-act]')) { e.preventDefault(); tgt.click(); return; }
  const tag = tgt.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT' || tgt.isContentEditable || e.ctrlKey || e.metaKey || e.altKey || modalOpen()) return;
  if (e.key === '?') { e.preventDefault(); showHelp(); return; }
  if (location.hash.startsWith('#/cards') && (e.key === ' ' || e.key === 'Enter') && !tgt.closest('button, a, summary')) {
    e.preventDefault(); if (CARDS.i < CARDS.ids.length) ACT[CARDS.flipped ? 'card-next' : 'card-flip'](); return; }
  if (!P.sess) return;
  const k = e.key.toLowerCase(), map = {a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3};
  const sk = {a:0, b:1, c:2, d:3, '!':0, '@':1, '#':2, '$':3}[k];
  if (e.shiftKey && (sk !== undefined || /^Digit[1-4]$/.test(e.code))) { e.preventDefault(); toggleStrike(sk !== undefined ? sk : +e.code.slice(5) - 1); }
  else if (k in map) { e.preventDefault(); choose(map[k]); }
  else if (k === 'l') { e.preventDefault(); showLabs(0); }
  else if (k === 'h') { e.preventDefault(); commitHL(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go2(P.sess.idx - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go2(P.sess.idx + 1); }
  else if (k === 'f') { e.preventDefault(); toggleFlag(curId()); }
  else if (k === 'm') { e.preventDefault(); toggleMark(); }
  else if (k === 's' || k === 'g') { e.preventDefault(); setConf(k); }
  else if (k === 'e') { const s = P.sess, id = curId(); if (s.feedback !== 'exam') { if (!s.resp[id]) s.revealed[id] = true; P.explShown[id] = true; save(); renderQ(); } }
  else if (e.key === 'Enter') { if (tgt.closest('button, a, summary')) return; e.preventDefault(); go2(P.sess.idx + 1); }
});
document.addEventListener('visibilitychange', () => {
  if (!P.sess) { if (document.hidden) save(true); return; }
  if (document.hidden) { flushVisit(); P.visitStart = null; save(true); } else { P.visitStart = Date.now(); tickExam(); }
});
window.addEventListener('pagehide', () => { if (P.sess) flushVisit(); save(true); cloudPush(false); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') cloudPush(false); });
window.addEventListener('hashchange', route);
if (matchMedia('(prefers-color-scheme: dark)').addEventListener) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings);
function afterRender(view, params){
  if (view === 'search') { const q = $('#s-q'); runSearch(); if (q && !params.get('q')) q.focus(); }
  if (view === 'exam') updateExamTotal();
  if (view === 'notes') renderNotesList();
  if (view === 'settings') cloudStatus(CL.status);
}

/* =====================================================================
   INIT
   ===================================================================== */
(function init(){
  loadData();
  st = loadState();
  applySettings();
  route();
  if (!st.tourDone) showTour(0);
  cloudInit();
  // Offline caching + installable app when hosted (GitHub Pages); harmless when opened as a local file.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
