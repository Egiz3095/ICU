{"id":61,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 34 weeks' gestation has a cardiac arrest. CPR with manual uterine displacement has not achieved ROSC. When should perimortem caesarean delivery be performed?","options":{"A":"Begin at about 4 minutes, aiming to deliver within 5 minutes","B":"Never during CPR; deliver only after ROSC","C":"Only if fetal heart activity is first confirmed by bedside ultrasound","D":"Only after 20 minutes of unsuccessful CPR"},"answer":"A","explanation":"For a uterus at or above the umbilicus (≥20 weeks), resuscitative hysterotomy should begin by 4 minutes of arrest so delivery occurs by 5 minutes, primarily to improve maternal resuscitation.","distractor":"Waiting 20 minutes worsens both maternal and fetal outcomes."},
{"id":62,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"Which definition of preeclampsia is correct?","options":{"A":"Proteinuria ≥300 mg/day alone after 20 weeks","B":"BP ≥140/90 before 20 weeks with proteinuria","C":"BP ≥160/110 after 20 weeks on one reading, with or without symptoms","D":"BP ≥140/90 after 20 weeks with proteinuria or new organ dysfunction"},"answer":"D","explanation":"ACOG: new hypertension (≥140/90 on two occasions) after 20 weeks with proteinuria, or, without proteinuria, with thrombocytopenia, renal insufficiency, impaired liver function, pulmonary oedema, or cerebral/visual symptoms.","distractor":"Hypertension before 20 weeks suggests chronic hypertension (or molar pregnancy)."},
{"id":63,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 36 weeks has BP 168/112 mmHg on repeat measurement 15 minutes apart. What is the target timing for antihypertensive treatment?","options":{"A":"Within 24 hours, after preeclampsia labs return","B":"Only if BP exceeds 180/120 mmHg on two repeat checks","C":"Within 30–60 minutes of confirmed severe hypertension","D":"Only after magnesium sulphate has been loaded"},"answer":"C","explanation":"ACOG: acute-onset severe hypertension (≥160/110 persisting ≥15 min) is an emergency; first-line therapy (IV labetalol, IV hydralazine, or oral immediate-release nifedipine) should begin within 30–60 minutes to reduce stroke risk.","distractor":"Waiting for 180/120 increases the risk of maternal stroke."},
{"id":64,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"Which regimen is first-line for acute severe hypertension in pregnancy?","options":{"A":"IV sodium nitroprusside infusion as the first-line agent","B":"IV labetalol 20 mg, then escalating doses every 10 minutes","C":"Oral atenolol 50 mg twice daily","D":"IV enalaprilat 1.25 mg every 6 hours"},"answer":"B","explanation":"First-line agents: IV labetalol (20, 40, 80 mg), IV hydralazine (5–10 mg), or oral immediate-release nifedipine (10–20 mg). ACE inhibitors are contraindicated in pregnancy; nitroprusside is reserved for refractory cases (fetal cyanide risk).","distractor":"ACE inhibitors are fetotoxic."},
{"id":65,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"What is the standard magnesium sulphate regimen for preeclampsia with severe features?","options":{"A":"4–6 g IV over 20–30 min, then 1–2 g/h","B":"2 g IV over 20 min, then 0.5 g/h","C":"1 g IM every 6 hours without a loading dose","D":"10 g IV bolus over 5 min, then 5 g/h"},"answer":"A","explanation":"ACOG: loading dose 4–6 g IV over 20–30 minutes, then 1–2 g/h maintenance, continued for 24 hours postpartum. (The Pritchard IM regimen uses 10 g IM with a 4 g IV load.)","distractor":"Rapid large boluses risk respiratory depression and arrest."},
{"id":66,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman receiving magnesium sulphate becomes drowsy with absent patellar reflexes and RR 8/min. What is the immediate treatment?","options":{"A":"Reduce the infusion rate by half and recheck in 4 hours","B":"Stop magnesium and give 10% calcium gluconate 1 g IV","C":"Give naloxone 0.4 mg IV for respiratory depression","D":"Give furosemide 40 mg IV to enhance magnesium excretion"},"answer":"B","explanation":"Loss of reflexes and respiratory depression indicate toxicity (levels above about 9–12 mg/dL). Stop the infusion, give calcium gluconate 1 g IV over 10 minutes, support ventilation and check the level.","distractor":"Reducing the rate is inadequate with respiratory depression."},
{"id":67,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"What is the drug of choice for treating and preventing recurrent eclamptic seizures?","options":{"A":"Levetiracetam","B":"Phenytoin","C":"Diazepam","D":"Magnesium sulphate"},"answer":"D","explanation":"The Collaborative Eclampsia Trial showed magnesium reduced recurrent seizures and maternal death compared with diazepam and phenytoin; MAGPIE showed it halves the risk of eclampsia in preeclampsia.","distractor":"Diazepam was inferior to magnesium for recurrent seizures."},
{"id":68,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with preeclampsia has oliguria and creatinine 2.1 mg/dL. How should magnesium sulphate be managed?","options":{"A":"Give the maintenance infusion only, without any loading dose","B":"Double the maintenance dose to overcome reduced effect","C":"Give the usual loading dose, then reduce maintenance and monitor levels","D":"Omit magnesium completely because of renal failure"},"answer":"C","explanation":"Magnesium is renally excreted. The loading dose is unchanged, but the maintenance rate is reduced (or omitted) with close monitoring of reflexes, RR, urine output and serum levels.","distractor":"Omitting magnesium leaves her at risk of eclampsia."},
{"id":69,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 35 weeks has platelets 72 × 10^9/L, AST 240 U/L, LDH 820 U/L and schistocytes. What is the diagnosis?","options":{"A":"Intrahepatic cholestasis of pregnancy","B":"Acute fatty liver of pregnancy","C":"Immune thrombocytopenia of pregnancy","D":"HELLP syndrome"},"answer":"D","explanation":"HELLP (Tennessee criteria): haemolysis (LDH ≥600 U/L, schistocytes), AST ≥70 U/L, platelets \u003c100 × 10^9/L. It is a severe form of preeclampsia; treatment is stabilisation and delivery.","distractor":"AFLP features hepatic failure (hypoglycaemia, coagulopathy, raised ammonia)."},
{"id":70,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with HELLP at 34 weeks needs caesarean delivery. Platelets are 38 × 10^9/L. What is appropriate?","options":{"A":"No transfusion; platelets are needed only below 10 × 10^9/L before surgery","B":"Delay delivery 48 hours to allow platelets to recover","C":"Platelet transfusion before surgery, aiming above about 50 × 10^9/L","D":"High-dose dexamethasone to raise platelets before surgery"},"answer":"C","explanation":"Platelet transfusion is recommended before caesarean if platelets are \u003c50 × 10^9/L. Neuraxial anaesthesia is usually avoided at low counts. Steroids for platelet recovery are not recommended (no outcome benefit).","distractor":"Delaying delivery worsens HELLP, which resolves only after delivery."},
{"id":71,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with HELLP develops sudden severe right upper quadrant pain, shoulder pain and hypotension. What is the most likely diagnosis?","options":{"A":"Acute pancreatitis from hypertriglyceridaemia","B":"Ruptured subcapsular hepatic haematoma","C":"Placental abruption with concealed bleeding","D":"Acute cholecystitis with sepsis"},"answer":"B","explanation":"Hepatic haematoma rupture is a rare, life-threatening HELLP complication: massive haemoperitoneum and shock. Management: resuscitation, packing, angioembolisation, or surgery.","distractor":"Abruption causes uterine pain and tenderness rather than shoulder-tip pain."},
{"id":72,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 36 weeks has jaundice, glucose 45 mg/dL, INR 2.0, raised ammonia, creatinine 1.8 mg/dL and mild hypertension. What is the most likely diagnosis and treatment?","options":{"A":"Acute fatty liver of pregnancy; prompt delivery","B":"HELLP syndrome; magnesium and expectant care","C":"Cholestasis of pregnancy; ursodeoxycholic acid","D":"Viral hepatitis; antiviral therapy and delay delivery"},"answer":"A","explanation":"AFLP (Swansea criteria) presents with hepatic failure: hypoglycaemia, coagulopathy, hyperammonaemia, AKI. Management is stabilisation and expedited delivery, with ICU support.","distractor":"HELLP rarely causes hypoglycaemia or significant hyperammonaemia."},
{"id":73,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman 2 days postpartum has platelets 15 × 10^9/L, schistocytes, normal INR, normal liver enzymes and confusion. HELLP was suspected but is not improving. Which test is most useful?","options":{"A":"ADAMTS13 activity","B":"Peripheral blood flow cytometry","C":"Serum ammonia","D":"Antiphospholipid antibodies"},"answer":"A","explanation":"Persistent TMA after delivery, with severe thrombocytopenia and neurological features, suggests TTP (ADAMTS13 \u003c10%) or complement-mediated HUS. Plasma exchange should start while awaiting results.","distractor":"Ammonia helps distinguish AFLP, which has abnormal liver tests."},
{"id":74,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"How does ACOG define postpartum haemorrhage?","options":{"A":"Any fall in haemoglobin of more than 1 g/dL","B":"Blood loss ≥2,000 mL within 24 hours, regardless of mode of delivery","C":"Blood loss ≥500 mL after caesarean delivery only","D":"Cumulative blood loss ≥1,000 mL or loss with hypovolaemia within 24 h"},"answer":"D","explanation":"ACOG (2017) defines PPH as cumulative blood loss ≥1,000 mL or blood loss accompanied by signs or symptoms of hypovolaemia within 24 hours after birth, regardless of route.","distractor":"The 500 mL threshold is the older vaginal-delivery definition."},
{"id":75,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"What is the first-line uterotonic for postpartum haemorrhage from uterine atony?","options":{"A":"Methylergonovine","B":"Oxytocin","C":"Carboprost","D":"Misoprostol"},"answer":"B","explanation":"Oxytocin (IV infusion or IM) is first-line for prevention and treatment of atony. Other agents are added if bleeding continues.","distractor":"Second-line agents are used only after oxytocin."},
{"id":76,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with asthma has PPH from uterine atony despite oxytocin. Which uterotonic should be avoided?","options":{"A":"Oxytocin infusion","B":"Misoprostol","C":"Carboprost (15-methyl PGF2α)","D":"Methylergonovine"},"answer":"C","explanation":"Carboprost causes bronchospasm and is contraindicated in asthma. Methylergonovine is contraindicated in hypertension and preeclampsia.","distractor":"Misoprostol is safe in asthma."},
{"id":77,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with preeclampsia has PPH from atony. Which uterotonic is contraindicated?","options":{"A":"Oxytocin","B":"Misoprostol","C":"Methylergonovine","D":"Tranexamic acid"},"answer":"C","explanation":"Ergot alkaloids cause vasoconstriction and severe hypertension and are contraindicated in hypertension, preeclampsia and coronary disease.","distractor":"Oxytocin is first-line and safe in preeclampsia (with caution about hypotension with boluses)."},
{"id":78,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"What did the WOMAN trial show for tranexamic acid in postpartum haemorrhage?","options":{"A":"1 g IV reduced hysterectomy rates but not death due to bleeding","B":"1 g IV within 3 hours of birth reduced death due to bleeding","C":"No benefit, so it is not recommended in PPH","D":"2 g IV at any time reduced all-cause mortality"},"answer":"B","explanation":"WOMAN (Lancet 2017): TXA 1 g IV (second dose if bleeding continues after 30 min) reduced death due to bleeding, particularly when given within 3 hours, without increasing thromboembolism.","distractor":"The benefit was in bleeding deaths, not hysterectomy rates."},
{"id":79,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"Which laboratory value best predicts progression to severe postpartum haemorrhage?","options":{"A":"Haemoglobin below 10 g/dL","B":"INR above 1.2","C":"Platelets below 150 × 10^9/L","D":"Fibrinogen below 2 g/L"},"answer":"D","explanation":"Fibrinogen \u003c2 g/L at PPH onset has a high positive predictive value for severe haemorrhage. Normal term fibrinogen is 4–6 g/L. FIBTEM A5 \u003c12 mm guides replacement.","distractor":"Mild prolongation of INR is a late finding."},
{"id":80,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman has ongoing PPH from atony despite oxytocin, carboprost and misoprostol. What is the next step?","options":{"A":"Intrauterine balloon tamponade","B":"Systemic recombinant factor VIIa","C":"Observation while giving more oxytocin","D":"Immediate hysterectomy without other measures"},"answer":"A","explanation":"Escalation: uterotonics → bimanual compression → balloon tamponade → compression sutures/vessel ligation → interventional radiology → hysterectomy.","distractor":"Factor VIIa is a last-resort adjunct, not standard escalation."},
{"id":81,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with two previous caesareans has an anterior placenta previa and MRI suggesting placenta accreta. What is the recommended delivery plan?","options":{"A":"Planned caesarean hysterectomy at a specialist centre with placenta left in situ","B":"Emergency delivery only when bleeding starts","C":"Caesarean delivery with immediate manual removal of the placenta","D":"Vaginal delivery after induction at 39 weeks"},"answer":"A","explanation":"Placenta accreta spectrum: planned delivery (usually 34–35+6 weeks) by caesarean hysterectomy, leaving the placenta in situ, with a multidisciplinary team and blood bank readiness.","distractor":"Forcible placental removal causes catastrophic haemorrhage."},
{"id":82,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"During caesarean delivery a woman develops sudden hypoxia, hypotension, cardiac arrest and then diffuse bleeding. What is the most likely diagnosis?","options":{"A":"Massive pulmonary thromboembolism","B":"Amniotic fluid embolism","C":"High spinal block","D":"Anaphylaxis to the antibiotic"},"answer":"B","explanation":"AFE presents with the triad of sudden hypoxia, hypotension/arrest and coagulopathy (DIC, often hyperfibrinolytic) during labour or shortly after delivery.","distractor":"Thromboembolism does not usually cause early DIC."},
{"id":83,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"What is the core management of amniotic fluid embolism?","options":{"A":"Fluid restriction and diuretics for pulmonary oedema","B":"Systemic thrombolysis as the first-line treatment in all cases","C":"High-dose corticosteroids as definitive therapy","D":"High-quality CPR, RV support, and early aggressive blood products"},"answer":"D","explanation":"Management is supportive: airway, oxygenation, inotropes and pulmonary vasodilators for RV failure, delivery, massive transfusion with fibrinogen, and VA-ECMO in selected cases.","distractor":"Steroids and thrombolysis are not standard therapy."},
{"id":84,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman 3 months postpartum has dyspnoea and LVEF 30% with no prior heart disease. What is the diagnosis?","options":{"A":"Takotsubo cardiomyopathy","B":"Dilated cardiomyopathy from viral myocarditis","C":"Peripartum cardiomyopathy","D":"Normal postpartum physiological change"},"answer":"C","explanation":"PPCM: heart failure from LV systolic dysfunction (LVEF \u003c45%) towards the end of pregnancy or in the months after delivery, without another identifiable cause.","distractor":"LVEF does not fall to 30% in normal pregnancy."},
{"id":85,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"Which disease-specific therapy is suggested by ESC guidance for peripartum cardiomyopathy?","options":{"A":"Bromocriptine with anticoagulation","B":"High-dose corticosteroids","C":"IV immunoglobulin with steroids","D":"Colchicine"},"answer":"A","explanation":"PPCM is linked to a cleaved prolactin fragment; bromocriptine (2.5 mg once or twice daily) with prophylactic anticoagulation may be considered, along with standard HF therapy.","distractor":"IVIG has no proven benefit in PPCM."},
{"id":86,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 32 weeks has heart failure. Which HF drug is contraindicated antepartum?","options":{"A":"Furosemide","B":"Metoprolol","C":"Hydralazine plus nitrates","D":"ACE inhibitor (e.g. enalapril)"},"answer":"D","explanation":"ACE inhibitors, ARBs, ARNI, MRA (spironolactone) and SGLT2 inhibitors are avoided in pregnancy (fetotoxic). Hydralazine/nitrates, beta-blockers and loop diuretics are used; ACE inhibitors are resumed postpartum.","distractor":"Beta-blockers (e.g. metoprolol) are used during pregnancy."},
{"id":87,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 28 weeks has acute PE without haemodynamic compromise. What is the anticoagulant of choice?","options":{"A":"Warfarin with an INR target of 2–3","B":"Rivaroxaban 15 mg twice daily","C":"Therapeutic low-molecular-weight heparin","D":"Dabigatran 150 mg twice daily"},"answer":"C","explanation":"LMWH is preferred in pregnancy (does not cross the placenta). Warfarin is teratogenic and causes fetal haemorrhage; DOACs cross the placenta and lack safety data.","distractor":"Warfarin is avoided during pregnancy."},
{"id":88,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 24 weeks with suspected PE has a normal chest radiograph. Which imaging is reasonable to limit breast radiation?","options":{"A":"No imaging; treat empirically for 6 months","B":"Perfusion (V/Q) lung scan","C":"CT pulmonary angiography in all cases","D":"D-dimer alone to exclude PE"},"answer":"B","explanation":"With a normal chest radiograph, a V/Q scan has lower maternal breast radiation than CTPA; both are acceptable. The pregnancy-adapted YEARS algorithm can safely reduce imaging, but D-dimer alone is not sufficient.","distractor":"D-dimer alone is not enough to exclude PE in pregnancy."},
{"id":89,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 30 weeks has massive PE with cardiac arrest. Is systemic thrombolysis contraindicated?","options":{"A":"Yes; pregnancy is an absolute contraindication","B":"No, but only after perimortem caesarean delivery has been performed","C":"No; thrombolysis is indicated for life-threatening PE despite pregnancy","D":"Yes; only surgical embolectomy is allowed"},"answer":"C","explanation":"Pregnancy is a relative contraindication. In life-threatening PE, the maternal benefit outweighs the risk; thrombolysis, catheter-directed therapy, surgical embolectomy or ECMO are options.","distractor":"Pregnancy is not an absolute contraindication."},
{"id":90,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman in labour has fever 38.9 °C, uterine tenderness and foul-smelling amniotic fluid. What is the standard antibiotic regimen?","options":{"A":"Oral amoxicillin alone","B":"IV ampicillin plus gentamicin","C":"IV vancomycin alone","D":"IV ceftriaxone plus doxycycline"},"answer":"B","explanation":"Intra-amniotic infection is treated with ampicillin plus gentamicin (add clindamycin or metronidazole after caesarean). Tetracyclines are avoided.","distractor":"Vancomycin alone does not cover Gram-negative organisms."},
{"id":91,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman 2 days after vaginal delivery has fever, severe abdominal pain, hypotension and rapidly progressive organ failure. Which organism is classically responsible?","options":{"A":"Group A Streptococcus","B":"Staphylococcus epidermidis","C":"Listeria monocytogenes","D":"Chlamydia trachomatis"},"answer":"A","explanation":"Invasive group A streptococcal puerperal sepsis can cause rapid toxic shock. Treat with high-dose penicillin plus clindamycin, consider IVIG, and seek early source control.","distractor":"Listeria causes febrile illness and fetal infection rather than postpartum toxic shock."},
{"id":92,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 26 weeks has influenza with hypoxaemia. When should oseltamivir be started?","options":{"A":"Never; neuraminidase inhibitors are teratogenic","B":"Only if symptoms began within the last 48 hours","C":"Only after PCR confirmation has been obtained","D":"Immediately, regardless of time since symptom onset"},"answer":"D","explanation":"Pregnant women are at high risk of severe influenza. Antiviral treatment should start as early as possible, even beyond 48 hours, without waiting for test results. Oseltamivir is considered safe.","distractor":"The 48-hour window does not apply to severe or high-risk patients."},
{"id":93,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 30 weeks with type 1 diabetes has vomiting, pH 7.21, HCO3 12 mmol/L, ketones 5 mmol/L and glucose 190 mg/dL. What is the correct interpretation?","options":{"A":"Starvation ketosis, as the glucose level is below 250 mg/dL","B":"DKA, which can occur at lower glucose levels in pregnancy","C":"Normal pregnancy acid-base status","D":"Hyperemesis without metabolic acidosis"},"answer":"B","explanation":"Pregnancy predisposes to DKA at lower glucose (euglycaemic DKA) because of increased insulin resistance, a lower buffering capacity and accelerated ketogenesis. Treat urgently; fetal heart abnormalities usually improve with maternal correction.","distractor":"Starvation ketosis does not cause pH 7.21."},
{"id":94,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 28 weeks has severe asthma. Which drug should be avoided during an acute attack?","options":{"A":"Systemic corticosteroids, because of the risk to the fetus","B":"IV magnesium, due to tocolytic effect","C":"Nebulised salbutamol, due to tachycardia","D":"No standard asthma drug; treat as in non-pregnant patients"},"answer":"D","explanation":"Severe asthma in pregnancy should be treated as in non-pregnant patients (beta-agonists, ipratropium, steroids, magnesium); uncontrolled asthma is a greater fetal risk than medication.","distractor":"Withholding steroids risks maternal and fetal hypoxaemia."},
{"id":95,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"When is warfarin embryopathy most likely?","options":{"A":"Exposure during weeks 6–12 of gestation","B":"Exposure only during breastfeeding","C":"Exposure before conception only","D":"Exposure during the last 4 weeks of pregnancy"},"answer":"A","explanation":"Warfarin embryopathy (nasal hypoplasia, stippled epiphyses) occurs with first-trimester exposure, especially weeks 6–12. Later exposure risks fetal haemorrhage and CNS abnormalities. Warfarin is compatible with breastfeeding.","distractor":"Warfarin is safe during breastfeeding."},
{"id":96,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with a mechanical mitral valve is 5 weeks pregnant. Which statement is correct?","options":{"A":"DOACs are preferred, because they do not cross the placenta at all","B":"Anticoagulation should stop until the second trimester","C":"Warfarin is most effective; if ≤5 mg/day it may continue with counselling","D":"Aspirin alone is enough during pregnancy"},"answer":"C","explanation":"ESC 2018: warfarin has the lowest valve thrombosis risk; continuing it in the first trimester is considered if the dose is ≤5 mg/day; otherwise switch to dose-adjusted LMWH (anti-Xa monitoring) for weeks 6–12. DOACs are contraindicated with mechanical valves.","distractor":"DOACs are contraindicated with mechanical valves."},
{"id":97,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 30 weeks with mitral stenosis develops pulmonary oedema and AF at 140/min. What is the first-line management?","options":{"A":"Immediate surgical mitral valve replacement","B":"Beta-blocker for rate control plus a loop diuretic","C":"IV milrinone to improve contractility","D":"Fluid bolus to increase preload and flow across the stenotic valve"},"answer":"B","explanation":"Tachycardia shortens diastolic filling across a stenotic valve, raising left atrial pressure. Rate control (beta-blocker), diuretics and anticoagulation for AF are first-line; percutaneous balloon commissurotomy if refractory.","distractor":"Inotropes increase heart rate and worsen gradients."},
{"id":98,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 34 weeks needs intubation for respiratory failure. Which statement is correct?","options":{"A":"Avoid pre-oxygenation because of fetal hyperoxia","B":"Avoid rapid sequence induction to prevent hypotension and fetal hypoxia","C":"Use a smaller tube and expect higher aspiration and failed-intubation risk","D":"Use a larger tube because the airway enlarges"},"answer":"C","explanation":"Airway oedema, breast enlargement, reduced FRC and delayed gastric emptying increase the risk of difficult intubation, desaturation and aspiration. Use a smaller ETT (6.0–7.0), head-up position, thorough pre-oxygenation and RSI.","distractor":"Mucosal oedema narrows the airway."},
{"id":99,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"What PaCO2 target is appropriate when ventilating a pregnant woman at 30 weeks?","options":{"A":"About 45–55 mmHg with permissive hypercapnia always","B":"About 40 mmHg, as in non-pregnant patients","C":"About 20–25 mmHg to maximise fetal CO2 clearance across the placenta","D":"About 30–32 mmHg, mimicking normal pregnancy physiology"},"answer":"D","explanation":"Maternal PaCO2 is normally about 30 mmHg, creating a gradient for fetal CO2 elimination. Significant hypercapnia may cause fetal acidosis; marked hypocapnia reduces uterine blood flow.","distractor":"Severe hypocapnia causes uterine vasoconstriction."},
{"id":100,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman 6 days postpartum has severe headache, seizures and a focal deficit. BP is 130/80 mmHg. What diagnosis must be excluded urgently?","options":{"A":"Cerebral venous sinus thrombosis","B":"Migraine with aura","C":"Normal postpartum tension headache","D":"Post-dural puncture headache"},"answer":"A","explanation":"Postpartum hypercoagulability predisposes to CVST, presenting with headache, seizures and focal deficits. Diagnose with MR or CT venography; treat with anticoagulation even with haemorrhagic infarction.","distractor":"PDPH is positional and does not cause seizures or focal deficits."},
{"id":101,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"Ten days after delivery, a woman has a seizure with BP 165/105 mmHg and headache. She had a normotensive pregnancy. What is the most likely diagnosis?","options":{"A":"Postpartum eclampsia","B":"Epilepsy unrelated to pregnancy","C":"Hypoglycaemic seizure","D":"Eclampsia is impossible after 48 hours"},"answer":"A","explanation":"Postpartum preeclampsia/eclampsia can occur up to 6 weeks after delivery, even after a normotensive pregnancy. Treat with magnesium sulphate and antihypertensives; consider PRES on MRI.","distractor":"Late postpartum eclampsia (beyond 48 h) is well described."},
{"id":102,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman has a seizure at 37 weeks with BP 170/110 mmHg; MRI shows bilateral parieto-occipital vasogenic oedema. What does this represent?","options":{"A":"Multiple sclerosis relapse","B":"Bilateral ischaemic stroke from vasculitis","C":"Herpes simplex encephalitis","D":"PRES associated with eclampsia"},"answer":"D","explanation":"Posterior reversible encephalopathy syndrome (vasogenic oedema, predominantly posterior) is common in eclampsia. It reverses with BP control and delivery.","distractor":"Infarction shows restricted diffusion, unlike vasogenic oedema."},
{"id":103,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman 7 weeks pregnant has abdominal pain, BP 78/40 mmHg, HR 135/min and free fluid on FAST; no intrauterine pregnancy is seen. What is the management?","options":{"A":"CT abdomen before any intervention","B":"Methotrexate IM and observation","C":"Resuscitation and immediate surgery for ruptured ectopic pregnancy","D":"Serial beta-hCG measurements over 48 hours before deciding"},"answer":"C","explanation":"Haemodynamically unstable ruptured ectopic pregnancy requires resuscitation (including blood) and emergency laparoscopy or laparotomy. Methotrexate is only for stable, unruptured ectopic pregnancy.","distractor":"Methotrexate is contraindicated with haemodynamic instability."},
{"id":104,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman undergoing IVF has abdominal distension, ascites, oliguria, haematocrit 48% and Na 128 mmol/L. What is the diagnosis and a major complication to prevent?","options":{"A":"Hyperemesis; Wernicke encephalopathy","B":"Severe OHSS; thromboembolism requiring LMWH prophylaxis","C":"Pelvic infection; abscess requiring drainage","D":"Ectopic pregnancy; tubal rupture requiring urgent surgery"},"answer":"B","explanation":"Severe ovarian hyperstimulation syndrome causes capillary leak, haemoconcentration, ascites, hyponatraemia, AKI and a high thrombotic risk. Management: fluids, albumin, paracentesis, and LMWH prophylaxis.","distractor":"Ectopic pregnancy does not cause haemoconcentration and ascites from capillary leak."},
{"id":105,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with prolonged hyperemesis gravidarum develops confusion, ophthalmoplegia and ataxia. Before giving dextrose, what must be given?","options":{"A":"IV magnesium sulphate","B":"IV vitamin B12","C":"IV folic acid","D":"IV thiamine"},"answer":"D","explanation":"Wernicke encephalopathy from thiamine deficiency complicates hyperemesis. Give IV thiamine before (or with) glucose-containing fluids to avoid precipitating or worsening it.","distractor":"Folate deficiency does not cause Wernicke encephalopathy."},
{"id":106,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 12 weeks has severe vomiting, hyperthyroidism and a markedly raised beta-hCG with a 'snowstorm' uterus on ultrasound. What is the likely cause?","options":{"A":"Twin pregnancy with hyperemesis gravidarum","B":"Molar pregnancy (gestational trophoblastic disease)","C":"Toxic multinodular goitre","D":"Graves disease unrelated to pregnancy"},"answer":"B","explanation":"Very high hCG stimulates the TSH receptor, causing hyperthyroidism; molar pregnancy also causes early-onset preeclampsia. Treatment: evacuation, with beta-blockade for thyrotoxicosis.","distractor":"Twin pregnancy raises hCG but has no snowstorm appearance."},
{"id":107,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A 22-year-old woman has fever, hypotension and uterine tenderness 2 days after an unsafe abortion. What is the key management besides antibiotics?","options":{"A":"Antibiotics alone for 14 days","B":"Observation and repeat ultrasound in 48 hours","C":"Urgent uterine evacuation for source control","D":"Hysterectomy as first-line treatment"},"answer":"C","explanation":"Septic abortion requires resuscitation, broad-spectrum antibiotics (including anaerobic and clostridial cover) and prompt evacuation of retained products; hysterectomy is for necrosis or failure of evacuation.","distractor":"Antibiotics alone fail without removal of infected tissue."},
{"id":108,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A pregnant woman needs antibiotics for pyelonephritis. Which class should be avoided?","options":{"A":"Tetracyclines (e.g. doxycycline)","B":"Penicillins (e.g. ampicillin)","C":"Beta-lactams (e.g. ceftriaxone)","D":"Cephalosporins (e.g. cefazolin)"},"answer":"A","explanation":"Tetracyclines cause fetal tooth discolouration and bone growth inhibition. Beta-lactams are preferred in pregnancy; fluoroquinolones and aminoglycosides are generally avoided unless necessary.","distractor":"Ceftriaxone is a standard choice for pyelonephritis in pregnancy."},
{"id":109,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with epilepsy on valproate plans pregnancy. Which major fetal risk is associated with valproate?","options":{"A":"Fetal goitre and hypothyroidism","B":"Fetal renal agenesis and oligohydramnios","C":"Neural tube defects and neurodevelopmental impairment","D":"Ebstein anomaly of the tricuspid valve"},"answer":"C","explanation":"Valproate carries the highest teratogenic risk among antiseizure drugs (neural tube defects, cognitive impairment). ACE inhibitors cause renal dysgenesis; lithium is linked to Ebstein anomaly.","distractor":"Ebstein anomaly is associated with lithium."},
{"id":110,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman with preeclampsia had a caesarean 3 days ago and now has BP 162/112 mmHg. How long after delivery should BP monitoring continue?","options":{"A":"Only 24 hours, after which the risk of preeclampsia has resolved","B":"Only 48 hours, as eclampsia cannot occur later","C":"No monitoring is needed after delivery","D":"Up to 6 weeks; postpartum severe hypertension needs prompt treatment"},"answer":"D","explanation":"Hypertension often peaks 3–6 days postpartum. Severe hypertension must be treated within 30–60 minutes; preeclampsia complications can occur up to 6 weeks postpartum.","distractor":"Postpartum eclampsia and stroke can occur after 48 hours."},
{"id":111,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 32 weeks with sepsis requires vasopressors. Which agent is reasonable first-line?","options":{"A":"Noradrenaline, as in non-pregnant septic shock","B":"No vasopressor; use fluids only to protect the fetus","C":"Phenylephrine only, to protect uterine blood flow","D":"Vasopressin, as noradrenaline is contraindicated"},"answer":"A","explanation":"Maternal resuscitation is the priority for fetal well-being. Noradrenaline is used as first-line in septic shock in pregnancy; maternal hypotension is far more harmful to the fetus.","distractor":"Withholding vasopressors worsens uteroplacental perfusion."},
{"id":112,"section":3,"sectionName":"Cardiology","stem":"A 62-year-old man has chest pain with horizontal ST depression and tall R waves in V1–V3. What is the best next step?","options":{"A":"Give fibrinolysis immediately without further leads","B":"Record posterior leads V7–V9 to look for posterior STEMI","C":"Repeat the 12-lead ECG in 6 hours","D":"Treat as NSTEMI with coronary angiography within 72 hours"},"answer":"B","explanation":"ST depression with tall R waves in V1–V3 may be a posterior STEMI mirror image. ST elevation ≥0.5 mm in V7–V9 confirms it and indicates emergency reperfusion.","distractor":"Managing as NSTEMI delays reperfusion of an occluded artery."},
{"id":113,"section":3,"sectionName":"Cardiology","stem":"A patient with known LBBB has chest pain. Which ECG finding is most specific for acute MI?","options":{"A":"Concordant ST elevation ≥1 mm in leads with a positive QRS","B":"Discordant ST depression ≥1 mm in leads V5–V6","C":"Any ST elevation in leads V1–V3","D":"Q waves in leads V1 and V2"},"answer":"A","explanation":"Sgarbossa criteria: concordant ST elevation ≥1 mm (5 points) is the most specific; concordant ST depression in V1–V3 (3 points); excessively discordant ST elevation (≥5 mm, or ratio ≥25% in modified criteria).","distractor":"Discordant ST changes are expected with LBBB."},
{"id":114,"section":3,"sectionName":"Cardiology","stem":"A patient with inferior STEMI is hypotensive with clear lungs and raised JVP. Which ECG lead best confirms RV involvement?","options":{"A":"aVL with ST depression","B":"V6 with ST elevation","C":"V4R with ST elevation ≥1 mm","D":"aVR with ST elevation"},"answer":"C","explanation":"ST elevation ≥1 mm in V4R is the most sensitive and specific ECG sign of RV infarction. Treat with preload maintenance and avoid nitrates and diuretics.","distractor":"ST depression in aVL is reciprocal to inferior injury, not specific for RV involvement."},
{"id":115,"section":3,"sectionName":"Cardiology","stem":"A patient with NSTEMI has ongoing refractory chest pain and dynamic ST changes despite medical therapy. What is the timing of invasive strategy?","options":{"A":"Early (within 24 hours)","B":"Immediate (within 2 hours)","C":"Within 72 hours, after troponin peaks","D":"Selective, only if stress testing is positive"},"answer":"B","explanation":"ESC 2023: very high-risk NSTE-ACS (haemodynamic instability, refractory pain, life-threatening arrhythmias, mechanical complications, acute HF, recurrent dynamic ST changes) requires an immediate invasive strategy (\u003c2 h).","distractor":"Early (\u003c24 h) applies to high-risk patients without very-high-risk features."},
{"id":116,"section":3,"sectionName":"Cardiology","stem":"A patient on ticagrelor after PCI reports mild dyspnoea without hypoxia, wheeze or heart failure. What is the likely cause?","options":{"A":"Drug-induced interstitial lung disease","B":"Ticagrelor-induced bronchospasm needing urgent discontinuation","C":"Pulmonary embolism from stent thrombosis","D":"A known adenosine-mediated adverse effect of ticagrelor"},"answer":"D","explanation":"Dyspnoea occurs in about 10–15% of patients on ticagrelor, usually mild and self-limiting, related to adenosine reuptake inhibition. Exclude other causes; switch only if intolerable.","distractor":"It is not bronchospasm; ticagrelor does not cause wheeze."},
{"id":117,"section":3,"sectionName":"Cardiology","stem":"A patient with NSTEMI on fondaparinux is taken for PCI. What must be added during the procedure?","options":{"A":"No additional anticoagulant is needed","B":"A second fondaparinux dose at double strength before the procedure","C":"An unfractionated heparin bolus to prevent catheter thrombosis","D":"Bivalirudin infusion after the procedure only"},"answer":"C","explanation":"OASIS-5/6: fondaparinux alone during PCI increased catheter thrombosis; a UFH bolus is required at PCI.","distractor":"Fondaparinux alone was associated with catheter thrombosis."},
{"id":118,"section":3,"sectionName":"Cardiology","stem":"A patient with suspected ACS has SpO2 96% on air. What does DETO2X-AMI support?","options":{"A":"Oxygen at 4 L/min for all patients for 24 hours","B":"No routine oxygen when SpO2 is at least 90%","C":"High-flow oxygen to reduce infarct size","D":"Oxygen only if troponin is elevated"},"answer":"B","explanation":"DETO2X-AMI (2017) showed no mortality benefit of routine oxygen in normoxic suspected MI. Give oxygen if SpO2 \u003c90%.","distractor":"Routine oxygen did not reduce infarct size or mortality."},
{"id":119,"section":3,"sectionName":"Cardiology","stem":"A patient with STEMI received IV morphine and oral ticagrelor before PCI. What is the concern?","options":{"A":"Morphine delays absorption and onset of oral P2Y12 inhibitors","B":"Morphine increases ticagrelor levels and therefore bleeding risk","C":"There is no interaction between the two drugs","D":"Morphine reduces aspirin absorption only"},"answer":"A","explanation":"Opioids delay gastric emptying and reduce early platelet inhibition by oral P2Y12 inhibitors (IMPRESSION trial). Consider crushed tablets or IV antiplatelet agents.","distractor":"The effect is reduced, not increased, platelet inhibition."},
{"id":120,"section":3,"sectionName":"Cardiology","stem":"A patient with anterior STEMI has HR 105/min, BP 100/70 mmHg and Killip class II. Should IV metoprolol be given?","options":{"A":"Yes; tachycardia increases oxygen demand, so beta-block immediately","B":"Yes; IV metoprolol 15 mg reduces mortality in all STEMI","C":"No; beta-blockers are contraindicated after any MI","D":"No; early IV beta-blockade increased cardiogenic shock in COMMIT"},"answer":"D","explanation":"COMMIT (2005): early IV then oral metoprolol reduced reinfarction and VF but increased cardiogenic shock, particularly in patients with HF signs or haemodynamic compromise. Start oral beta-blockers once stable.","distractor":"Beta-blockers are beneficial long term after MI."},
{"id":121,"section":3,"sectionName":"Cardiology","stem":"After anterior MI, echo shows an apical LV thrombus. What is the recommended management?","options":{"A":"Surgical thrombectomy in all patients","B":"Oral anticoagulation for about 3–6 months with repeat imaging","C":"Aspirin alone, as dual antiplatelet therapy is sufficient protection","D":"Systemic thrombolysis to dissolve the thrombus"},"answer":"B","explanation":"LV thrombus after MI is treated with anticoagulation (VKA or DOAC) for 3–6 months, guided by repeat imaging, alongside antiplatelet therapy.","distractor":"Antiplatelet therapy alone does not treat LV thrombus."},
{"id":122,"section":3,"sectionName":"Cardiology","stem":"Three weeks after MI, a patient has fever, pleuritic chest pain and a pericardial rub. What is the diagnosis?","options":{"A":"Recurrent infarction from stent thrombosis","B":"Infective endocarditis of the mitral valve","C":"Post-MI pericarditis (Dressler syndrome)","D":"Free wall rupture with contained haematoma"},"answer":"C","explanation":"Dressler syndrome is an immune-mediated pericarditis weeks after MI. Treat with aspirin plus colchicine; avoid other NSAIDs and steroids early after MI.","distractor":"Recurrent MI causes ischaemic changes and troponin rise rather than a rub and fever."},
{"id":123,"section":3,"sectionName":"Cardiology","stem":"Five days after a first anterior MI, a patient suddenly develops PEA arrest. Echo shows a large pericardial effusion. What is the likely cause?","options":{"A":"Ventricular septal rupture","B":"Massive pulmonary embolism","C":"Papillary muscle rupture","D":"LV free wall rupture with tamponade"},"answer":"D","explanation":"Free wall rupture (typically days 1–7, first MI, elderly women, late reperfusion) presents with sudden tamponade and PEA. Emergency pericardiocentesis and surgery are needed.","distractor":"Septal rupture presents with a murmur and shunt, not a large effusion."},
{"id":124,"section":3,"sectionName":"Cardiology","stem":"A patient with hypertrophic cardiomyopathy becomes hypotensive after induction; echo shows systolic anterior motion and an LVOT gradient of 90 mmHg. What is the treatment?","options":{"A":"Fluids, phenylephrine and a beta-blocker; avoid inotropes","B":"Milrinone to improve diastolic function","C":"Dobutamine to improve contractility","D":"IV nitroglycerin to reduce afterload and outflow gradient"},"answer":"A","explanation":"Dynamic LVOT obstruction worsens with hypovolaemia, vasodilation and inotropy. Increase preload and afterload (phenylephrine) and slow the heart rate (beta-blocker).","distractor":"Inotropes and vasodilators worsen the obstruction."},
{"id":125,"section":3,"sectionName":"Cardiology","stem":"A 24-year-old has fever, cardiogenic shock and LVEF 15% after a viral illness; coronary arteries are normal. What is the best management?","options":{"A":"High-dose IVIG as the definitive therapy","B":"Fluid loading and observation","C":"Immediate listing for heart transplantation as the only option","D":"Mechanical circulatory support (e.g. VA-ECMO) as a bridge to recovery"},"answer":"D","explanation":"Fulminant myocarditis often recovers if supported; early MCS (VA-ECMO, Impella) bridges to recovery. Endomyocardial biopsy guides immunosuppression (e.g. giant cell or eosinophilic myocarditis).","distractor":"IVIG has no proven benefit in fulminant myocarditis."},
{"id":126,"section":3,"sectionName":"Cardiology","stem":"A 70-year-old woman develops chest pain after a bereavement. Coronary arteries are normal; ventriculography shows apical ballooning with basal hyperkinesis. What is the diagnosis?","options":{"A":"Acute viral myocarditis","B":"Takotsubo (stress) cardiomyopathy","C":"Acute anterior STEMI with spontaneous reperfusion","D":"Hypertrophic obstructive cardiomyopathy"},"answer":"B","explanation":"Takotsubo syndrome: transient regional wall motion abnormality beyond a single coronary territory, often with an emotional or physical trigger, in postmenopausal women; may cause LVOT obstruction and shock.","distractor":"Coronary arteries are normal, excluding STEMI."},
{"id":127,"section":3,"sectionName":"Cardiology","stem":"Which combination forms the four pillars of guideline-directed therapy in HFrEF?","options":{"A":"ARNI, calcium channel blocker, MRA and statin","B":"Loop diuretic, ACEi, nitrate and ivabradine","C":"ARNI/ACEi, beta-blocker, MRA and SGLT2 inhibitor","D":"ACEi, ARB, beta-blocker and digoxin"},"answer":"C","explanation":"ESC 2021/AHA 2022: ARNI (or ACEi/ARB), evidence-based beta-blocker, MRA and SGLT2 inhibitor each reduce mortality and HF hospitalisation in HFrEF.","distractor":"ACEi plus ARB increases hyperkalaemia and AKI without benefit."},
{"id":128,"section":3,"sectionName":"Cardiology","stem":"A patient on enalapril will be switched to sacubitril/valsartan. What is required?","options":{"A":"Stop enalapril at least 36 hours before starting the ARNI","B":"Stop enalapril 6 hours before starting the ARNI to limit hypotension","C":"Overlap both drugs for 7 days to avoid hypotension","D":"Start the ARNI immediately with the last enalapril dose"},"answer":"A","explanation":"Combining an ACE inhibitor with neprilysin inhibition increases bradykinin and angioedema risk; a 36-hour washout is required.","distractor":"Overlapping the drugs risks angioedema."},
{"id":129,"section":3,"sectionName":"Cardiology","stem":"A patient on high-dose nitroprusside for 3 days develops metabolic acidosis, confusion and a high mixed venous oxygen saturation. What is the diagnosis?","options":{"A":"Sepsis-related lactic acidosis; add antibiotics","B":"Methaemoglobinaemia from nitroprusside; give methylene blue","C":"Thiocyanate toxicity only; continue infusion","D":"Cyanide toxicity; stop nitroprusside, give hydroxocobalamin"},"answer":"D","explanation":"Nitroprusside releases cyanide, which blocks cytochrome oxidase (lactic acidosis, high venous O2 saturation). Risk rises with high doses, prolonged use and renal impairment. Treat with hydroxocobalamin or sodium thiosulfate.","distractor":"Thiocyanate toxicity causes neurotoxicity in renal failure but not acute lactic acidosis."},
{"id":130,"section":3,"sectionName":"Cardiology","stem":"What is the mechanism of action of levosimendan?","options":{"A":"Beta-1 adrenergic receptor agonism","B":"Phosphodiesterase-3 inhibition alone","C":"Calcium sensitisation of troponin C plus K-ATP channel vasodilation","D":"Na/K-ATPase inhibition, increasing intracellular calcium in myocytes"},"answer":"C","explanation":"Levosimendan increases myofilament calcium sensitivity (inotropy without increased O2 demand) and opens K-ATP channels (vasodilation). It has a long-acting active metabolite (OR-1896).","distractor":"PDE-3 inhibition is the mechanism of milrinone."},
{"id":131,"section":3,"sectionName":"Cardiology","stem":"When should an intra-aortic balloon pump inflate and deflate?","options":{"A":"Inflate continuously throughout diastole and systole","B":"Inflate at the dicrotic notch; deflate just before systole","C":"Inflate at the R wave; deflate at the T wave","D":"Inflate at the start of systole; deflate at the dicrotic notch"},"answer":"B","explanation":"Inflation at aortic valve closure (dicrotic notch) augments diastolic coronary perfusion; deflation just before ejection reduces afterload.","distractor":"Inflation during systole increases afterload."},
{"id":132,"section":3,"sectionName":"Cardiology","stem":"Which is a contraindication to an intra-aortic balloon pump?","options":{"A":"Significant aortic regurgitation","B":"Refractory unstable angina before CABG","C":"Mitral regurgitation from papillary muscle rupture","D":"Ventricular septal rupture after MI"},"answer":"A","explanation":"Moderate–severe aortic regurgitation (diastolic inflation increases regurgitation) and aortic dissection are contraindications. Acute MR and VSR are classic indications.","distractor":"Acute MR is an indication, not a contraindication."},
{"id":133,"section":3,"sectionName":"Cardiology","stem":"A patient on a microaxial flow pump (Impella) develops dark urine and plasma-free haemoglobin of 80 mg/dL. What is the most likely cause?","options":{"A":"Rhabdomyolysis from limb ischaemia only","B":"Device-related haemolysis from malposition or high speed","C":"Haemolytic transfusion reaction from recent blood products","D":"Contrast nephropathy from angiography"},"answer":"B","explanation":"Haemolysis is a common Impella complication, often due to malposition (inlet near the mitral apparatus) or high performance levels. Check position on echo and reduce speed.","distractor":"Rhabdomyolysis gives myoglobinuria without raised plasma-free haemoglobin."},
{"id":134,"section":3,"sectionName":"Cardiology","stem":"A heart transplant recipient has symptomatic sinus bradycardia at 38/min. Which drug is ineffective?","options":{"A":"Atropine","B":"Dopamine","C":"Adrenaline","D":"Isoprenaline"},"answer":"A","explanation":"The transplanted heart is denervated, so vagolytic atropine has no effect (and may cause paradoxical block). Use direct-acting beta-agonists or pacing.","distractor":"Isoprenaline acts directly on cardiac beta receptors."},
{"id":135,"section":3,"sectionName":"Cardiology","stem":"A patient with HFrEF (LVEF 25%) has AF at 140/min, BP 105/70 mmHg. Which drug should be avoided for rate control?","options":{"A":"Metoprolol at a low dose","B":"Amiodarone","C":"Diltiazem","D":"Digoxin"},"answer":"C","explanation":"Non-dihydropyridine calcium channel blockers are negatively inotropic and contraindicated in HFrEF. Beta-blockers, digoxin and amiodarone are options.","distractor":"Low-dose beta-blockers are used cautiously in HFrEF."},
{"id":136,"section":3,"sectionName":"Cardiology","stem":"An 82-year-old woman weighing 58 kg with creatinine 1.2 mg/dL starts apixaban for AF. What dose is appropriate?","options":{"A":"10 mg twice daily for 7 days, then 5 mg","B":"2.5 mg once daily (meets all 3 criteria)","C":"5 mg twice daily (meets only 1 of the 3 dose-reduction criteria)","D":"2.5 mg twice daily (meets 2 of 3 dose-reduction criteria)"},"answer":"D","explanation":"Apixaban is reduced to 2.5 mg twice daily if ≥2 of: age ≥80 years, weight ≤60 kg, creatinine ≥1.5 mg/dL. She meets age and weight criteria.","distractor":"10 mg twice daily is the VTE treatment loading regimen."},
{"id":137,"section":3,"sectionName":"Cardiology","stem":"A regular narrow-complex tachycardia is at exactly 150/min with sawtooth baseline in II, III and aVF. What is the rhythm?","options":{"A":"Sinus tachycardia","B":"Multifocal atrial tachycardia","C":"AV nodal re-entrant tachycardia","D":"Atrial flutter with 2:1 conduction"},"answer":"D","explanation":"Typical flutter has an atrial rate of about 300/min; 2:1 block gives a ventricular rate of about 150/min. Flutter waves are best seen in the inferior leads and V1.","distractor":"MAT is irregular with ≥3 P-wave morphologies."},
{"id":138,"section":3,"sectionName":"Cardiology","stem":"What is the mechanism by which adenosine terminates AVNRT?","options":{"A":"Transient AV nodal block via A1 receptors and K channel opening","B":"Sodium channel blockade in the accessory pathway and AV node","C":"Beta-1 receptor blockade in the sinus node","D":"Calcium sensitisation of ventricular myocytes"},"answer":"A","explanation":"Adenosine activates A1 receptors, opening K channels and hyperpolarising AV nodal cells, transiently blocking conduction and interrupting re-entry involving the AV node.","distractor":"Sodium channel blockade is the action of class I drugs."},
{"id":139,"section":3,"sectionName":"Cardiology","stem":"A patient with QTc 590 ms has recurrent torsades de pointes with a pulse between episodes. What is the first drug?","options":{"A":"Sotalol 80 mg IV","B":"Magnesium sulphate 2 g IV","C":"Procainamide 1 g IV","D":"Amiodarone 300 mg IV"},"answer":"B","explanation":"Magnesium is first-line for torsades regardless of serum level. Correct K, stop QT-prolonging drugs; overdrive pacing or isoprenaline for pause-dependent torsades.","distractor":"Amiodarone, sotalol and procainamide prolong the QT."},
{"id":140,"section":3,"sectionName":"Cardiology","stem":"A febrile 35-year-old has a coved ST elevation ≥2 mm with T-wave inversion in V1–V2 and a history of syncope. What is the diagnosis and key acute measure?","options":{"A":"Anterior STEMI; emergency thrombolysis","B":"Early repolarisation; no action needed","C":"Brugada pattern; treat the fever aggressively","D":"Acute pericarditis; NSAIDs"},"answer":"C","explanation":"Type 1 Brugada pattern is unmasked by fever and sodium channel blockers. Treat fever with antipyretics; syncope warrants ICD evaluation. Isoprenaline or quinidine treat electrical storm.","distractor":"STEMI typically causes convex ST elevation in a coronary distribution with reciprocal changes."},
{"id":141,"section":3,"sectionName":"Cardiology","stem":"A patient with core temperature 29 °C has a positive deflection at the J point in the lateral leads. What is this?","options":{"A":"Epsilon wave from ARVC","B":"U wave from hypokalaemia","C":"Osborn (J) wave from hypothermia","D":"Delta wave from pre-excitation"},"answer":"C","explanation":"Osborn waves are typical of hypothermia (usually below 32 °C) and increase in size as temperature falls.","distractor":"Delta waves are slurred QRS upstrokes in WPW."},
{"id":142,"section":3,"sectionName":"Cardiology","stem":"A patient with digoxin toxicity develops a wide-complex tachycardia with beat-to-beat alternation of the QRS axis. What is this rhythm?","options":{"A":"Bidirectional ventricular tachycardia","B":"Polymorphic VT from ischaemia","C":"Atrial fibrillation with aberrancy","D":"Torsades de pointes"},"answer":"A","explanation":"Bidirectional VT is characteristic of digoxin toxicity (and catecholaminergic polymorphic VT). Treat with digoxin immune Fab.","distractor":"Torsades has twisting amplitudes around the baseline, not alternating axis."},
{"id":143,"section":3,"sectionName":"Cardiology","stem":"A patient with a large effusion has ECG QRS amplitude alternating beat to beat. What does this suggest?","options":{"A":"Acute pericarditis with diffuse ST elevation and PR depression","B":"Electrical alternans from the heart swinging in fluid","C":"Hypokalaemia-induced U waves","D":"Bigeminy from ventricular ectopics"},"answer":"B","explanation":"Electrical alternans with low voltage and tachycardia is specific for a large effusion and tamponade physiology.","distractor":"Bigeminy produces alternating ectopic beats, not amplitude alternation of the same QRS."},
{"id":144,"section":3,"sectionName":"Cardiology","stem":"Which finding favours constrictive pericarditis over restrictive cardiomyopathy?","options":{"A":"Reduced tissue Doppler e′ velocity at the medial mitral annulus","B":"Biatrial enlargement with thickened myocardium","C":"Severely elevated BNP with low-voltage ECG","D":"Marked respiratory variation in mitral inflow with septal bounce"},"answer":"D","explanation":"Constriction shows ventricular interdependence (respiratory variation >25% in mitral inflow, septal bounce), preserved or increased e′ (annulus reversus) and relatively lower BNP. Restriction has low e′ and high BNP.","distractor":"Low e′ suggests myocardial disease (restriction)."},
{"id":145,"section":3,"sectionName":"Cardiology","stem":"Which pair constitutes the major modified Duke criteria for infective endocarditis?","options":{"A":"Fever above 38 °C and a predisposing heart condition or injection drug use","B":"Typical organism in 2 blood cultures and echo evidence of endocardial involvement","C":"Raised CRP and splenomegaly","D":"Janeway lesions and Osler nodes"},"answer":"B","explanation":"Major criteria: (1) microbiological — typical organism in two separate cultures (or persistent bacteraemia, Coxiella serology); (2) imaging evidence of endocardial involvement (vegetation, abscess, new dehiscence or regurgitation).","distractor":"Fever and predisposition are minor criteria."},
{"id":146,"section":3,"sectionName":"Cardiology","stem":"A patient with S. aureus mitral endocarditis has a large haemorrhagic stroke. When should cardiac surgery generally be performed if not urgently required?","options":{"A":"Within 24 hours, as for any embolic stroke","B":"Never, because intracranial haemorrhage contraindicates surgery","C":"Only after 6 months of antibiotics","D":"Delay surgery for about 4 weeks after intracranial haemorrhage"},"answer":"D","explanation":"ESC guidance: after intracranial haemorrhage, cardiac surgery is generally postponed for ≥4 weeks; after ischaemic stroke without haemorrhage, surgery need not be delayed if indicated.","distractor":"Early surgery with bypass heparinisation risks haemorrhagic expansion."},
{"id":147,"section":3,"sectionName":"Cardiology","stem":"A patient with AS (AVA 0.8 cm², mean gradient 25 mmHg) has LVEF 30%. How do you distinguish true severe from pseudo-severe stenosis?","options":{"A":"Repeat TTE after 3 months of diuretics","B":"Exercise treadmill test to symptoms","C":"Low-dose dobutamine stress echocardiography","D":"Cardiac MRI late gadolinium enhancement"},"answer":"C","explanation":"Classical low-flow, low-gradient AS: dobutamine stress echo assesses flow reserve; true severe AS shows a rise in gradient with fixed small AVA, whereas pseudo-severe AS shows AVA increasing.","distractor":"Exercise testing is unsafe in symptomatic severe AS."},
{"id":148,"section":3,"sectionName":"Cardiology","stem":"A patient with hypertensive emergency has a soy and egg allergy. Which agent should be avoided?","options":{"A":"Clevidipine","B":"Esmolol","C":"Nicardipine","D":"Labetalol"},"answer":"A","explanation":"Clevidipine is formulated in a lipid emulsion containing soybean oil and egg lecithin; it is contraindicated with these allergies and in disordered lipid metabolism.","distractor":"Nicardipine is not lipid-based."},
{"id":149,"section":3,"sectionName":"Cardiology","stem":"Which echocardiographic sign of tamponade is the most specific?","options":{"A":"Normal inferior vena cava collapsibility","B":"RA systolic collapse lasting less than one-third of systole","C":"Small pericardial effusion under 1 cm","D":"RV diastolic collapse"},"answer":"D","explanation":"RA collapse is sensitive and occurs early; RA inversion >1/3 of the cycle and RV diastolic collapse are more specific. A plethoric non-collapsing IVC supports tamponade.","distractor":"A collapsible IVC argues against tamponade."},
{"id":150,"section":3,"sectionName":"Cardiology","stem":"A patient has pleuritic chest pain with diffuse concave ST elevation and PR depression. What is the diagnosis?","options":{"A":"Early repolarisation variant","B":"Left ventricular aneurysm","C":"Acute pericarditis","D":"Anterior STEMI"},"answer":"C","explanation":"Diffuse concave ST elevation with PR depression (PR elevation in aVR), without reciprocal changes, suggests pericarditis.","distractor":"STEMI is regional, convex and has reciprocal ST depression."},
{"id":151,"section":3,"sectionName":"Cardiology","stem":"After blunt chest trauma, which screening approach is recommended for blunt cardiac injury?","options":{"A":"Echocardiography only if creatine kinase is raised","B":"ECG and troponin; if both normal, injury is effectively excluded","C":"CT coronary angiography in all patients after the injury","D":"Routine coronary angiography for all patients"},"answer":"B","explanation":"EAST guidelines: an ECG plus troponin I; if both are normal, blunt cardiac injury is ruled out. Echo is indicated for haemodynamic instability.","distractor":"CK is not useful for cardiac injury."},
{"id":152,"section":3,"sectionName":"Cardiology","stem":"Which strategy reduces AF after cardiac surgery?","options":{"A":"Prophylactic beta-blocker or amiodarone","B":"Prophylactic verapamil infusion","C":"Prophylactic lidocaine infusion","D":"Routine digoxin loading before surgery"},"answer":"A","explanation":"Beta-blockers (continued or started) and amiodarone reduce postoperative AF, which occurs in 20–40% after cardiac surgery.","distractor":"Digoxin does not prevent postoperative AF."},
{"id":153,"section":3,"sectionName":"Cardiology","stem":"After CABG, chest tube output is 450 mL in the first hour with normal coagulation tests. What is the appropriate action?","options":{"A":"Surgical re-exploration for likely surgical bleeding","B":"Give FFP and platelets and observe for a further 4 hours","C":"Apply PEEP 15 cmH2O to tamponade bleeding","D":"Give protamine repeatedly until bleeding stops"},"answer":"A","explanation":"Bleeding >400 mL in the first hour (or >200 mL/h for several hours) with corrected coagulation suggests surgical bleeding requiring re-exploration.","distractor":"Blood products do not stop surgical bleeding with normal coagulation."},
{"id":154,"section":3,"sectionName":"Cardiology","stem":"Two hours after cardiac surgery, aPTT rises and chest drainage increases after initial protamine reversal. What is a likely explanation?","options":{"A":"Acquired haemophilia A from bypass","B":"Vitamin K deficiency after bypass requiring FFP only","C":"Protamine overdose causing thrombocytosis","D":"Heparin rebound; consider an additional protamine dose"},"answer":"D","explanation":"Heparin rebound occurs as heparin redistributes from tissues after protamine neutralisation. An ACT/aPTT or heparinase TEG confirms; give a small protamine dose.","distractor":"Protamine excess is itself anticoagulant but does not cause thrombocytosis."},
{"id":155,"section":3,"sectionName":"Cardiology","stem":"In non-shockable cardiac arrest, when should adrenaline be given?","options":{"A":"After three cycles of CPR","B":"As soon as feasible, then every 3–5 minutes","C":"After 10 minutes of CPR without ROSC","D":"Only after an advanced airway is placed"},"answer":"B","explanation":"ERC 2021/AHA 2020: in non-shockable rhythms, give adrenaline 1 mg as soon as possible, then every 3–5 minutes. Earlier adrenaline is associated with better outcomes.","distractor":"Delaying adrenaline in non-shockable arrest is associated with worse outcomes."},
{"id":156,"section":3,"sectionName":"Cardiology","stem":"What did the ALPS trial show for amiodarone and lidocaine in shock-refractory VF?","options":{"A":"Lidocaine was harmful compared with placebo","B":"Amiodarone significantly improved neurological survival","C":"No significant overall survival benefit versus placebo","D":"Both drugs doubled survival to discharge"},"answer":"C","explanation":"ALPS (NEJM 2016): neither drug significantly improved survival to discharge overall; a possible benefit was seen in bystander-witnessed arrests. Both remain options.","distractor":"Lidocaine was not harmful."},
{"id":157,"section":3,"sectionName":"Cardiology","stem":"During CPR with an advanced airway, ETCO2 has been 8 mmHg after 20 minutes of ALS. How should this be interpreted?","options":{"A":"Indicates adequate CPR quality","B":"Indicates ROSC is imminent","C":"Associated with very poor prognosis, used with other factors","D":"Should be ignored, as it has no prognostic value at all"},"answer":"C","explanation":"ETCO2 \u003c10 mmHg after 20 minutes of ALS is associated with very low survival but should not be the sole criterion for termination.","distractor":"ETCO2 below 10 indicates poor flow, not adequate CPR."},
{"id":158,"section":3,"sectionName":"Cardiology","stem":"A patient is in VF arrest with core temperature 28 °C. What is the ERC 2021 approach?","options":{"A":"Adrenaline every 1 minute to overcome hypothermia","B":"Up to 3 shocks; withhold adrenaline until above 30 °C","C":"No shocks until temperature exceeds 35 °C","D":"Unlimited shocks every 2 minutes with standard adrenaline"},"answer":"B","explanation":"ERC 2021: below 30 °C, give up to 3 shocks and withhold adrenaline; at 30–35 °C, double the drug interval. Rewarm (ideally ECLS).","distractor":"Drug metabolism is slowed; repeated adrenaline accumulates."},
{"id":159,"section":3,"sectionName":"Cardiology","stem":"A dialysis patient has cardiac arrest with K 8.2 mmol/L. Which drug should be given immediately during CPR?","options":{"A":"Sodium zirconium cyclosilicate orally","B":"Magnesium sulphate 2 g IV","C":"Amiodarone 300 mg IV","D":"Calcium chloride 10 mL of 10% IV"},"answer":"D","explanation":"Hyperkalaemic arrest: IV calcium (cardiac membrane stabilisation), insulin–glucose, consider bicarbonate, and dialysis.","distractor":"Oral binders work too slowly."},
{"id":160,"section":3,"sectionName":"Cardiology","stem":"After ROSC, a comatose patient has no seizures on EEG. Should prophylactic antiseizure drugs be given?","options":{"A":"No; routine seizure prophylaxis is not recommended","B":"Yes; phenytoin loading improves neurological outcome","C":"Yes; levetiracetam for 7 days in all","D":"Yes; continuous midazolam for 48 hours"},"answer":"A","explanation":"ERC-ESICM 2021: treat clinical or electrographic seizures, but routine prophylaxis is not recommended.","distractor":"Phenytoin prophylaxis has no proven benefit."},
{"id":161,"section":3,"sectionName":"Cardiology","stem":"A patient with fulminant myocarditis on VA-ECMO has pulseless arterial waveform and LV distension. What is the next step?","options":{"A":"LV unloading (e.g. Impella or IABP)","B":"Increase ECMO flow further","C":"Reduce sweep gas flow","D":"Stop all inotropes"},"answer":"A","explanation":"LV distension on VA-ECMO from high afterload requires unloading (microaxial pump, IABP, septostomy, surgical vent) with inotropes to open the aortic valve.","distractor":"Increasing flow raises afterload and worsens distension."},
{"id":162,"section":3,"sectionName":"Cardiology","stem":"Which drug class increases mortality in HFrEF and should be avoided?","options":{"A":"SGLT2 inhibitors","B":"Non-dihydropyridine calcium channel blockers","C":"Mineralocorticoid receptor antagonists","D":"Hydralazine with isosorbide dinitrate"},"answer":"B","explanation":"Verapamil and diltiazem are negatively inotropic and worsen HFrEF outcomes. NSAIDs and thiazolidinediones should also be avoided.","distractor":"Hydralazine/ISDN reduces mortality in self-identified Black patients (A-HeFT)."},
{"id":163,"section":3,"sectionName":"Cardiology","stem":"A patient on spironolactone and ramipril has K 6.4 mmol/L with peaked T waves. What is the first treatment?","options":{"A":"Furosemide 80 mg IV","B":"Sodium zirconium cyclosilicate orally","C":"IV calcium gluconate or chloride","D":"Stop drugs and recheck in 6 hours"},"answer":"C","explanation":"With ECG changes, give IV calcium first to stabilise the myocardium, then insulin–glucose and salbutamol, then remove potassium; stop the offending drugs.","distractor":"Binders do not act fast enough with ECG changes."},
{"id":164,"section":3,"sectionName":"Cardiology","stem":"A patient with a mechanical mitral valve develops a sudden stroke; INR is 1.4. What is the most likely mechanism?","options":{"A":"Paradoxical embolism through a patent foramen ovale","B":"Haemorrhagic stroke from excess anticoagulation","C":"Infective endocarditis is the only likely cause","D":"Valve thrombus embolism due to subtherapeutic anticoagulation"},"answer":"D","explanation":"Mechanical mitral valves require INR 3.0 (2.5–3.5); subtherapeutic anticoagulation causes valve thrombosis and embolism. Assess with TEE/fluoroscopy.","distractor":"An INR of 1.4 is too low to cause bleeding."},
{"id":165,"section":3,"sectionName":"Cardiology","stem":"A patient with STEMI is in a hospital where primary PCI can be achieved in 60 minutes. What is the reperfusion of choice?","options":{"A":"Medical therapy with anticoagulation only","B":"Fibrinolysis then routine angiography at 24 hours","C":"Fibrinolysis alone","D":"Primary PCI"},"answer":"D","explanation":"Primary PCI is preferred when it can be performed within 120 minutes of diagnosis (ESC). Fibrinolysis is used when PCI cannot be achieved in that time.","distractor":"Fibrinolysis is inferior when timely PCI is available."},
{"id":166,"section":3,"sectionName":"Cardiology","stem":"A patient with acute severe mitral regurgitation is hypertensive (BP 150/90 mmHg) with pulmonary oedema. Which drug best reduces regurgitant volume?","options":{"A":"IV sodium nitroprusside","B":"IV esmolol","C":"IV vasopressin","D":"IV phenylephrine"},"answer":"A","explanation":"Afterload reduction (nitroprusside, nitrates) increases forward flow and decreases regurgitant fraction; an IABP is used if hypotensive.","distractor":"Phenylephrine increases afterload and regurgitation."},
{"id":167,"section":3,"sectionName":"Cardiology","stem":"A patient with acute RV failure from pulmonary hypertension needs a pulmonary vasodilator without systemic hypotension. Which is preferred?","options":{"A":"IV nitroprusside infusion titrated to MAP","B":"Oral bosentan","C":"Inhaled nitric oxide or inhaled epoprostenol","D":"IV sildenafil bolus"},"answer":"C","explanation":"Inhaled vasodilators act selectively on ventilated lung units, lowering PVR with minimal systemic hypotension.","distractor":"IV vasodilators cause systemic hypotension and worsen RV perfusion."},
{"id":168,"section":4,"sectionName":"Neurocritical Care","stem":"A trauma patient opens eyes to pain, makes incomprehensible sounds and withdraws from pain. What is the GCS?","options":{"A":"9 (E2 V3 M4)","B":"8 (E2 V2 M4)","C":"10 (E3 V2 M5)","D":"7 (E2 V2 M3)"},"answer":"B","explanation":"Eyes to pain = 2; incomprehensible sounds = 2; withdrawal = 4; total 8. GCS ≤8 generally indicates the need for airway protection.","distractor":"Abnormal flexion scores 3, not withdrawal."},
{"id":169,"section":4,"sectionName":"Neurocritical Care","stem":"A TBI patient has MAP 85 mmHg and ICP 30 mmHg. What is the CPP and its implication?","options":{"A":"30 mmHg; indicates brain death","B":"55 mmHg; adequate for all TBI patients, so no change in therapy","C":"115 mmHg; excessive, so lower the MAP","D":"55 mmHg; below target, so treat ICP and support MAP"},"answer":"D","explanation":"CPP = MAP − ICP = 85 − 30 = 55 mmHg. BTF targets CPP 60–70 mmHg and ICP treatment above 22 mmHg.","distractor":"A CPP of 55 is below the recommended range."},
{"id":170,"section":4,"sectionName":"Neurocritical Care","stem":"Above which ICP threshold does the Brain Trauma Foundation (4th edition) recommend treatment?","options":{"A":"15 mmHg","B":"22 mmHg","C":"40 mmHg","D":"30 mmHg"},"answer":"B","explanation":"BTF 2016 recommends treating ICP >22 mmHg, as values above this are associated with increased mortality.","distractor":"Waiting until 30 mmHg allows sustained intracranial hypertension."},
{"id":171,"section":4,"sectionName":"Neurocritical Care","stem":"How should hyperventilation be used in severe TBI?","options":{"A":"Only briefly as a bridge for herniation, not prophylactically","B":"Never, even in impending herniation","C":"Routinely to PaCO2 30 mmHg for the first 24 hours after injury","D":"Prophylactically to PaCO2 25 mmHg for 5 days"},"answer":"A","explanation":"Hyperventilation causes cerebral vasoconstriction and ischaemia; prophylactic PaCO2 ≤25 mmHg is not recommended. Brief hyperventilation is a temporising measure for herniation, ideally with PbtO2 or SjvO2 monitoring.","distractor":"Prolonged prophylactic hyperventilation worsened outcomes."},
{"id":172,"section":4,"sectionName":"Neurocritical Care","stem":"A hypotensive, hypovolaemic trauma patient has signs of raised ICP. Which osmotic agent is preferred?","options":{"A":"Furosemide","B":"Mannitol 20%","C":"Hypertonic saline","D":"Dexamethasone"},"answer":"C","explanation":"Hypertonic saline lowers ICP while expanding intravascular volume, whereas mannitol causes osmotic diuresis and may worsen hypovolaemia and hypotension.","distractor":"Mannitol's diuresis can worsen hypotension and CPP."},
{"id":173,"section":4,"sectionName":"Neurocritical Care","stem":"What did the CRASH trial show for corticosteroids in TBI?","options":{"A":"No effect on mortality, but less cerebral oedema on CT at 2 weeks","B":"Increased mortality; corticosteroids are not recommended","C":"Benefit only when given within 1 hour","D":"Reduced mortality in severe TBI"},"answer":"B","explanation":"CRASH (2004): methylprednisolone increased 2-week and 6-month mortality in TBI. Steroids are contraindicated in TBI.","distractor":"Steroids did not reduce mortality in any subgroup."},
{"id":174,"section":4,"sectionName":"Neurocritical Care","stem":"What did RESCUEicp show for decompressive craniectomy in refractory traumatic intracranial hypertension?","options":{"A":"Lower mortality with better functional outcome at 6 and 12 months","B":"Higher mortality and worse functional outcome","C":"Lower mortality but more vegetative state and severe disability","D":"No difference in mortality or functional outcome"},"answer":"C","explanation":"RESCUEicp (NEJM 2016): craniectomy reduced 6-month mortality (26.9% vs 48.9%) but increased vegetative state and lower or upper severe disability.","distractor":"DECRA (early bifrontal) showed worse functional outcomes."},
{"id":175,"section":4,"sectionName":"Neurocritical Care","stem":"Which statement about seizure prophylaxis in severe TBI is correct?","options":{"A":"Prophylaxis is never indicated after TBI","B":"Prophylaxis improves long-term functional outcome","C":"Prophylaxis for 6 months prevents late epilepsy after severe TBI","D":"Prophylaxis for 7 days reduces early, not late, post-traumatic seizures"},"answer":"D","explanation":"BTF: phenytoin (or levetiracetam) for 7 days reduces early post-traumatic seizures; it does not prevent late seizures or improve outcome.","distractor":"Late post-traumatic epilepsy is not prevented by prophylaxis."},
{"id":176,"section":4,"sectionName":"Neurocritical Care","stem":"What did CRASH-3 show for tranexamic acid in TBI?","options":{"A":"Reduced head-injury deaths in mild–moderate TBI when given within 3 hours","B":"No benefit in any subgroup of TBI patients","C":"Increased thrombotic events and mortality","D":"Reduced mortality in severe TBI with bilateral fixed dilated pupils"},"answer":"A","explanation":"CRASH-3 (2019): TXA within 3 hours reduced head-injury-related deaths in mild–moderate TBI (GCS 9–15), not in severe TBI or with bilateral unreactive pupils.","distractor":"There was no benefit in severe TBI."},
{"id":177,"section":4,"sectionName":"Neurocritical Care","stem":"What did Eurotherm3235 show for therapeutic hypothermia to reduce ICP in TBI?","options":{"A":"Improved functional outcome at 6 months","B":"Reduced mortality in diffuse injury","C":"No effect on ICP control or on functional outcome","D":"Worse functional outcome; not recommended"},"answer":"D","explanation":"Eurotherm3235 (NEJM 2015): hypothermia (32–35 °C) as a stage-2 ICP therapy was associated with worse outcomes; POLAR showed no benefit of prophylactic hypothermia.","distractor":"Hypothermia lowered ICP but did not improve outcome."},
{"id":178,"section":4,"sectionName":"Neurocritical Care","stem":"On the ICP waveform, P2 is higher than P1. What does this indicate?","options":{"A":"Reduced intracranial compliance","B":"Normal intracranial compliance","C":"Arterial line damping artefact","D":"Increased venous outflow"},"answer":"A","explanation":"Normally P1 (percussion) > P2 (tidal) > P3 (dicrotic). P2 exceeding P1 indicates poor compliance and impending ICP rise.","distractor":"A normal waveform has P1 as the highest peak."},
{"id":179,"section":4,"sectionName":"Neurocritical Care","stem":"A TBI patient has ICP plateau waves rising to 60 mmHg for 10–20 minutes. What are these?","options":{"A":"Transducer artefact from zeroing errors","B":"Lundberg A waves, indicating exhausted compensatory reserve","C":"Lundberg B waves, a normal variation linked to the respiratory cycle","D":"Lundberg C waves, related to arterial pressure"},"answer":"B","explanation":"Lundberg A (plateau) waves are sustained ICP elevations (50–100 mmHg for 5–20 min) with poor compliance and are pathological.","distractor":"B waves are smaller oscillations every 0.5–2 minutes."},
{"id":180,"section":4,"sectionName":"Neurocritical Care","stem":"A 68-year-old has acute ischaemic stroke, last known well 3 hours ago, weight 80 kg. What is the alteplase regimen?","options":{"A":"0.25 mg/kg (20 mg) as a single bolus","B":"0.9 mg/kg (72 mg) as a single bolus","C":"0.9 mg/kg (72 mg): 10% bolus, rest over 60 minutes","D":"1.5 mg/kg (120 mg): 10% bolus, rest over 2 hours"},"answer":"C","explanation":"Alteplase 0.9 mg/kg (maximum 90 mg): 10% bolus over 1 minute, remainder over 60 minutes. Tenecteplase 0.25 mg/kg (max 25 mg) single bolus is an alternative.","distractor":"0.25 mg/kg is the tenecteplase dose."},
{"id":181,"section":4,"sectionName":"Neurocritical Care","stem":"A patient with M1 occlusion is seen 14 hours after last known well, with a small core and large penumbra on perfusion imaging. What is appropriate?","options":{"A":"No reperfusion therapy beyond 6 hours","B":"Mechanical thrombectomy based on DAWN/DEFUSE-3 criteria","C":"Decompressive hemicraniectomy now","D":"IV alteplase alone at 14 hours, without vascular imaging"},"answer":"B","explanation":"DAWN (6–24 h) and DEFUSE-3 (6–16 h) showed thrombectomy benefit in patients with clinical–core or perfusion mismatch.","distractor":"Thrombectomy is beneficial up to 24 hours in selected patients."},
{"id":182,"section":4,"sectionName":"Neurocritical Care","stem":"After successful thrombectomy, what does evidence suggest about intensive SBP lowering below 120–140 mmHg?","options":{"A":"Intensive lowering reduced haemorrhage and improved functional outcome","B":"Intensive lowering is required for all patients for 72 hours","C":"SBP should be kept above 200 mmHg to maintain perfusion","D":"Intensive lowering worsened functional outcome (ENCHANTED2/MT, OPTIMAL-BP)"},"answer":"D","explanation":"ENCHANTED2/MT and OPTIMAL-BP found worse functional outcomes with intensive SBP targets after successful thrombectomy; guidelines advise against SBP \u003c140 mmHg.","distractor":"Intensive lowering did not reduce haemorrhage enough to help outcomes."},
