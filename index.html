/* =====================================================================
   VIEWS — RESULTS
   ===================================================================== */
function optsHTML(s, id){
  const q = Q(id), perm = (s && s.opt && s.opt[id]) || 'ABCD', resp = s ? s.resp[id] : undefined;
  return '<div class="opts">' + LETTERS.map((pos, i) => { const orig = perm[i], isAns = orig === q.answer, isMine = resp === orig;
    const cls = isAns ? 'correct' : isMine ? 'wrong' : 'dim';
    return '<div class="opt ' + cls + '"><span class="key">' + pos + '</span><span class="txt">' + fmt(q.options[orig]) + (isMine ? ' <span class="small muted">(' + t('yourAnswer') + ')</span>' : '') + '</span><span class="mk">' + (isAns ? ic('check') : isMine ? ic('x') : '') + '</span>' +
      '<span class="sr-only">' + (isAns ? t('correctAnswer') : isMine ? t('wrongMsg') : '') + '</span></div>'; }).join('') + '</div>';
}
function explHTML(s, id){
  const q = Q(id), perm = (s && s.opt && s.opt[id]) || 'ABCD', dl = LETTERS[perm.indexOf(q.answer)];
  return '<div class="expl qtext" dir="ltr" lang="en"><div class="ans">' + t('correctAnswer') + ': ' + dl + '. ' + fmt(q.options[q.answer]) + '</div><div class="body">' + fmt(q.explanation) + '</div>' +
    (q.distractor ? '<details class="distractor"><summary>' + t('distractor') + ic('chevD') + '</summary><div>' + fmt(q.distractor) + '</div></details>' : '') + '</div>';
}
function viewResults(sid){
  const s = st.sessions[sid];
  if (!s) return '<div class="card empty">' + t('sessionMissing') + '</div>';
  const r = sessionResult(s), exam = s.feedback === 'exam', pm = s.passMark || st.settings.passMark, passed = r.pct >= pm;
  const perm = id => (s.opt && s.opt[id]) || 'ABCD', disp = (id, L) => LETTERS[perm(id).indexOf(L)];
  const chg = {wr:0, rw:0, ww:0};
  const kindOf = id => { const h = (s.changes || {})[id]; if (!h || h.length < 2 || !s.resp[id]) return null; const a = Q(id).answer, f = h[0] === a, l = s.resp[id] === a; return f && !l ? 'rw' : !f && l ? 'wr' : !f && !l ? 'ww' : null; };
  s.qids.forEach(id => { const k = kindOf(id); if (k) chg[k]++; });
  const slow = s.qids.filter(id => s.qtime[id]).sort((a, b) => s.qtime[b] - s.qtime[a]).slice(0, 3);
  const items = s.qids.map((id, i) => { const resp = s.resp[id], ok = resp === Q(id).answer, k = !resp ? 'un' : ok ? 'ok' : 'bad', ck = kindOf(id), h = (s.changes || {})[id];
    return '<details class="rev-item" data-k="' + k + '"' + (st.flags[id] ? ' data-f="1"' : '') + (ck ? ' data-c="1"' : '') + '><summary><span class="st-ic ' + k + '-ic">' + (k === 'ok' ? ic('check') : k === 'bad' ? ic('x') : ic('flat')) + '</span><span style="flex:1;min-width:0"><span class="small muted">' + (i + 1) + ' · ' + ql(id) + ' · ' + esc(Q(id).sectionName) + (st.flags[id] ? ' <span style="color:var(--flag)">' + ic('starF', 'xs') + '</span>' : '') +
      (s.qtime[id] ? ' · <span class="tm">' + ic('clock', 'xs') + fmtDur(s.qtime[id]) + '</span>' : '') + (ck ? ' <span class="chg" dir="ltr">' + ic('swap', 'xs') + h.map(L => disp(id, L)).join(' → ') + '</span>' : '') + '<span class="sr-only">, ' + (k === 'ok' ? t('correctMsg') : k === 'bad' ? t('wrongMsg') : t('unanswered')) + '</span></span><br><span class="qtext" dir="ltr" lang="en">' + fmt(trunc(Q(id).stem, 140)) + '</span></span></summary>' +
      '<div class="rv-body"><p class="stem qtext" dir="ltr" lang="en" style="font-size:1rem">' + fmt(Q(id).stem) + '</p><div class="qtext" dir="ltr" lang="en">' + optsHTML(s, id) + '</div><div style="margin-top:.8rem">' + explHTML(s, id) + '</div>' +
      '<div class="row" style="margin-top:.6rem"><a class="btn sm" href="#/q/' + id + '">' + t('open') + '</a></div></div></details>'; }).join('');
  const wrongN = s.qids.filter(id => s.resp[id] && s.resp[id] !== Q(id).answer).length, unN = s.qids.filter(id => !s.resp[id]).length;
  return '<div class="stack"><section class="card"><div class="card-title"><div><h2>' + esc(s.title) + '</h2><div class="small muted">' + MODE_LABEL(s.mode) + ' · ' + fmtDate(s.startedAt) + '</div></div>' +
    (exam ? '<span class="badge st ' + (passed ? 'st-good' : 'st-weak') + '" style="font-size:.9rem">' + (passed ? ic('check', 'xs') + t('pass') : ic('x', 'xs') + t('fail')) + '</span>' : '') + '</div>' +
    '<div class="row" style="gap:1.5rem;align-items:flex-end"><div><div class="small muted">' + t('score') + '</div><div class="score-big">' + r.pct + '%</div><div class="small muted">' + r.cor + ' / ' + (exam ? r.total : r.ans) + ' ' + t('correct').toLowerCase() + '</div></div>' +
    '<div><div class="small muted">' + t('timeUsed') + '</div><div style="font-size:1.3rem;font-weight:700">' + fmtDur(r.used) + '</div>' + (exam ? '<div class="small muted">/ ' + fmtClock(s.limitS) + '</div>' : '') + '</div>' +
    '<div><div class="small muted">' + t('answered') + '</div><div style="font-size:1.3rem;font-weight:700">' + r.ans + ' / ' + r.total + '</div></div></div>' +
    (exam ? '<div class="passbar" dir="ltr" role="img" aria-label="' + t('score') + ' ' + r.pct + '%, ' + t('passMark') + ' ' + pm + '%"><span style="width:' + r.pct + '%;background:' + (passed ? 'var(--ok)' : 'var(--bad)') + '"></span><div class="line" style="left:' + pm + '%"><b>' + t('passMark') + ' ' + pm + '%</b></div></div>' : '') +
    '<div class="row" style="margin-top:1rem">' + (wrongN ? '<button class="btn primary" data-act="retry-wrong" data-id="' + s.id + '">' + t('practiceAgain') + ' (' + wrongN + ')</button>' : '') + '<a class="btn" href="#/home">' + t('backHome') + '</a></div></section>' +
    '<section class="card"><h2>' + t('bySection') + '</h2><div class="table-wrap"><table class="tbl"><thead><tr><th>' + t('secCount') + '</th><th>' + t('correct') + '</th><th>' + t('score') + '</th></tr></thead><tbody>' +
      Object.keys(r.bySec).map(k => { const b = r.bySec[k], d = exam ? b.total : b.ans, p = pct(b.cor, d);
        return '<tr><td>' + esc(secName(k)) + '</td><td class="num">' + b.cor + ' / ' + d + '</td><td class="num"><span class="badge st st-' + statusOf(p, d) + '">' + (d ? p + '%' : '—') + '</span></td></tr>'; }).join('') + '</tbody></table></div></section>' +
    (exam && (chg.wr + chg.rw + chg.ww || slow.length) ? '<div class="two-col">' +
      '<section class="card"><h2 style="display:flex;gap:.45rem;align-items:center">' + ic('swap') + t('changedAnswers') + ' (' + (chg.wr + chg.rw + chg.ww) + ')</h2>' +
        '<div class="sum-row"><div><span class="small muted">' + t('chWR') + '</span><b style="color:var(--ok)">' + chg.wr + '</b></div><div><span class="small muted">' + t('chRW') + '</span><b style="color:var(--bad)">' + chg.rw + '</b></div><div><span class="small muted">' + t('chWW') + '</span><b>' + chg.ww + '</b></div></div></section>' +
      '<section class="card"><h2 style="display:flex;gap:.45rem;align-items:center">' + ic('clock') + t('slowest') + '</h2>' + slow.map(id => '<div class="weak-item"><a href="#/q/' + id + '" class="small">' + (s.qids.indexOf(id) + 1) + ' · ' + ql(id) + '</a><span class="num"><b>' + fmtDur(s.qtime[id]) + '</b> ' + (s.resp[id] === Q(id).answer ? '<span style="color:var(--ok)">' + ic('check', 'xs') + '</span>' : '<span style="color:var(--bad)">' + ic('x', 'xs') + '</span>') + '</span></div>').join('') + '</section></div>' : '') +
    '<section class="card"><h2>' + t('reviewAll') + '</h2><div class="tabs seg" role="group">' +
      [['all', t('all') + ' (' + r.total + ')'], ['bad', t('wrong') + ' (' + wrongN + ')'], ['un', t('unanswered') + ' (' + unN + ')'], ['f', t('flagged')]].concat(exam && (chg.wr + chg.rw + chg.ww) ? [['c', t('changed') + ' (' + (chg.wr + chg.rw + chg.ww) + ')']] : []).map(([k, l], i) => '<button type="button" data-act="rev-filter" data-k="' + k + '" aria-pressed="' + (i === 0) + '">' + l + '</button>').join('') +
    '</div><div id="rev-list">' + items + '</div></section></div>';
}

/* =====================================================================
   PLAYER (question screen)
   ===================================================================== */
const curId = () => P.sess.qids[P.sess.idx];
function enterPlayer(s){
  P.sess = s; P.explShown = {}; P.returnTo = lastRoute; st.lastSessionId = s.id;
  s.conf = s.conf || {}; s.marked = s.marked || {}; s.strike = s.strike || {}; s.changes = s.changes || {};
  if (s.idx >= s.qids.length || s.idx < 0) s.idx = 0;
  $('#view').innerHTML = (storageOK ? '' : '<div class="storage-warn" role="alert">' + t('storageWarn') + '</div>') +
    '<div class="player"><div class="p-head card" id="p-head"></div><section class="p-main" id="p-main" aria-live="polite"></section><aside class="p-side" id="p-side"></aside><aside class="p-nav card" id="p-nav" aria-label="' + t('navigator') + '"></aside>' +
    '<div class="p-bar"><button class="btn" data-act="prev" aria-label="' + t('prev') + '">' + ic('chevL', 'flip') + '</button><button class="btn nav-open" data-act="drawer" aria-label="' + t('navigator') + '">' + ic('grid') + '</button><button class="btn primary" data-act="next" id="bar-next">' + t('next') + ic('chevR', 'flip') + '</button></div></div>';
  P.visitStart = document.hidden ? null : Date.now();
  if (s.feedback === 'exam' && !s.submitted) { P.timer = setInterval(tickExam, 1000); }
  renderQ(); save();
  bindSwipe($('#p-main'));
}
function leavePlayer(){
  if (!P.sess) return;
  flushVisit(); clearInterval(P.timer); P.timer = null; P.sess = null; save(true);
}
function flushVisit(){
  if (!P.sess || !P.visitStart) return;
  const id = curId(), d = Math.min(Date.now() - P.visitStart, 600000);
  P.sess.qtime[id] = (P.sess.qtime[id] || 0) + d; P.visitStart = Date.now();
}
function timerClass(left){ return left < 60 ? 'warn' : left < 300 ? 'soon' : ''; }
function tickExam(){
  const s = P.sess; if (!s || s.feedback !== 'exam' || s.submitted) return;
  const left = s.limitS - (Date.now() - s.startedAt) / 1000;
  const el = $('#timer'); if (el) { el.lastChild.textContent = fmtClock(left); el.className = 'timer ' + timerClass(left); }
  if (left <= 0) submitExam(s, true);
}
function renderQ(){
  const s = P.sess, id = curId(), q = Q(id), n = s.qids.length, exam = s.feedback === 'exam';
  const resp = s.resp[id], perm = (s.opt && s.opt[id]) || 'ABCD';
  const reveal = exam ? s.submitted : !!(resp || s.revealed[id]);
  const locked = exam ? s.submitted : !!resp;
  const answeredN = s.qids.filter(x => s.resp[x]).length;
  const left = s.limitS - (Date.now() - s.startedAt) / 1000;
  const focusOn = st.settings.focus;
  // header
  $('#p-head').innerHTML = '<div class="p-headrow"><div class="p-count">' + secIcon(SECTIONS[q.gsec - 1], true) + '<div style="min-width:0">' + t('question') + ' <span class="num">' + (s.idx + 1) + '</span> ' + t('of') + ' <span class="num">' + n + '</span><span class="sec">' + esc(q.sectionName) + '</span></div></div><div class="p-tools">' +
    (exam && !s.submitted ? '<span class="timer ' + timerClass(left) + '" id="timer" role="timer" aria-label="' + t('timeLeft') + '">' + ic('clock') + '<span>' + fmtClock(left) + '</span></span>' : '') +
    (exam && !s.submitted ? '<button class="icon-btn mark-btn" data-act="mark" aria-pressed="' + !!s.marked[id] + '" aria-label="' + t('markReview') + '" title="' + t('markReview') + ' (M)">' + ic(s.marked[id] ? 'bookmarkF' : 'bookmark') + '</button>' : '') +
    '<button class="icon-btn" data-act="labs" aria-label="' + t('labs') + '" title="' + t('labs') + ' (L)">' + ic('flask') + '</button>' +
    '<button class="icon-btn flag-btn" data-act="flag" aria-pressed="' + !!st.flags[id] + '" aria-label="' + t('flag') + '" title="' + t('flag') + ' (F)">' + ic(st.flags[id] ? 'starF' : 'star') + '</button>' +
    '<button class="icon-btn hide-phone" data-act="focus" aria-pressed="' + focusOn + '" aria-label="' + t('focusToggle') + '" title="' + t('focusToggle') + '">' + ic('focus') + '</button>' +
    (exam && !s.submitted ? '<button class="btn sm primary" data-act="submit">' + t('submit') + '</button>' : exam ? '<a class="btn sm" href="#/results/' + s.id + '">' + t('results') + '</a>' : s.mode !== 'browse' ? '<button class="btn sm" data-act="finish">' + t('finish') + '</button>' : '') +
    (focusOn ? '<button class="icon-btn" data-act="back" aria-label="' + t('exitFocus') + '" title="' + t('exitFocus') + '">' + ic('x') + '</button>' : '') +
    '</div></div><div class="bar p-progress" role="progressbar" aria-label="' + t('answered') + '" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + answeredN + '"><span style="width:' + pct(answeredN, n) + '%"></span></div>';
  // options
  let opts = '<div class="opts" role="group" aria-label="Answer options">';
  perm.split('').forEach((orig, i) => {
    const pos = LETTERS[i], mine = resp === orig, isAns = orig === q.answer;
    let cls = '', mk = '', sr = '';
    if (reveal) { if (isAns) { cls = 'correct'; mk = ic('check'); sr = t('correctAnswer'); } else if (mine) { cls = 'wrong'; mk = ic('x'); sr = t('yourAnswer') + ', ' + t('wrongMsg'); } else cls = 'dim'; }
    else if (mine) { cls = 'chosen'; mk = ic('dot'); sr = t('yourAnswer'); }
    if (!reveal && (s.strike[id] || '').includes(orig)) { cls += ' struck'; sr = (sr ? sr + ', ' : '') + t('struck'); }
    opts +='<button class="opt ' + cls + '" data-act="choose" data-pos="' + i + '" aria-pressed="' + mine + '"' + (locked ? ' disabled' : '') + '><span class="key" aria-hidden="true">' + pos + '</span><span class="txt"><span class="sr-only">' + pos + '. </span>' + fmt(q.options[orig]) + (sr ? '<span class="sr-only"> (' + sr + ')</span>' : '') + '</span><span class="mk">' + mk + '</span></button>';
  });
  opts += '</div>';
  let fb = '';
  if (reveal && resp) fb = resp === q.answer ? '<div class="feedback ok" role="status">' + ic('check') + t('correctMsg') + '</div>' : '<div class="feedback bad" role="status">' + ic('x') + t('wrongMsg') + ' — ' + t('correctAnswer') + ': ' + LETTERS[perm.indexOf(q.answer)] + '</div>';
  // confidence check after a correct instant-feedback answer
  let conf = '';
  if (!exam && resp === q.answer) {
    if (!s.conf[id]) conf = '<div class="conf"><span class="q">' + t('wasSure') + '</span><button class="btn sm" data-act="conf" data-v="s">' + ic('check') + t('sure') + ' <span class="kbd hide-phone">S</span></button><button class="btn sm" data-act="conf" data-v="g">' + ic('refresh') + t('guessed') + ' <span class="kbd hide-phone">G</span></button></div>';
    else if (s.conf[id] === 'g') conf = '<div class="conf-note">' + ic('refresh') + t('guessNote') + '</div>';
  }
  const allDone = !exam && s.mode !== 'browse' && answeredN === n;
  if (allDone && !s.endedAt) { s.endedAt = Date.now(); save(); }
  const r = allDone ? sessionResult(s) : null;
  const nextBig = !exam && resp && s.idx < n - 1 ? '<button class="btn primary block next-big" data-act="next" id="next-big">' + t('nextQ') + ic('chevR', 'flip') + ' <span class="kbd hide-phone" style="background:transparent;color:inherit;border-color:currentColor">Enter</span></button>' : '';
  $('#p-main').innerHTML = '<div class="card"><div class="qmeta">' + ql(id) + ' · ' + esc(q.sectionName) + (st.leitner[id] ? ' · ' + (st.leitner[id].box === 5 ? t('mastered') : t('box') + ' ' + st.leitner[id].box) : '') + '</div>' +
    '<div class="qtext" dir="ltr" lang="en"><p class="stem" id="stem">' + fmt(q.stem) + '</p>' + opts + '</div>' + fb + conf + nextBig +
    (!reveal && !exam ? '<div class="row" style="margin-top:12px"><button class="btn sm" data-act="reveal-answer">' + t('revealAnswer') + '</button></div>' : '') +
    '<div class="p-actions"><button class="btn" data-act="prev"' + (s.idx === 0 ? ' disabled' : '') + '>' + ic('chevL', 'flip') + t('prev') + '</button><button class="btn' + (nextBig ? '' : ' primary') + '" data-act="next"' + (s.idx === n - 1 ? ' disabled' : '') + '>' + t('next') + ic('chevR', 'flip') + '</button></div></div>' +
    (allDone ? '<div class="card complete" style="margin-top:16px"><h2>' + ic('check') + ' ' + t('sessionDone') + '</h2><p>' + t('score') + ': <b>' + r.pct + '%</b> (' + r.cor + '/' + r.ans + ')</p><div class="row"><a class="btn primary" href="#/results/' + s.id + '">' + t('viewResults') + '</a><a class="btn" href="#/home">' + t('backHome') + '</a></div></div>' : '') +
    (s.idx === 0 && !resp ? '<p class="small muted hide-tablet hide-desktop" style="margin-top:10px">' + t('swipeHint') + '</p>' : '') +
    (s.idx === 0 && !resp && !locked ? '<p class="tool-hint">' + ic('marker') + '<span>' + t('toolHint') + '</span></p>' : '');
  applyHL($('#stem'), st.hl[id]);
  // side: explanation + note
  let side = '';
  if (reveal) {
    const hidden = st.settings.hideExpl && !P.explShown[id] && !exam;
    side += '<section class="card"><h2>' + t('explanation') + '</h2>' + (hidden ? '<button class="btn primary" data-act="show-expl">' + t('reveal') + ' (E)</button>' : explHTML(s, id)) + '</section>';
  }
  side += '<section class="card"><label for="note" style="font-weight:600;display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem">' + ic('pencil') + t('note') + '</label><textarea class="input" id="note" data-note="' + id + '" placeholder="' + t('notePh') + '">' + esc(st.notes[id] || '') + '</textarea><div class="saved-ind" id="note-saved" aria-live="polite"></div>' +
    '<button class="btn sm" data-act="report" style="margin-top:.25rem">' + ic('report') + t('report') + '</button></section>';
  $('#p-side').innerHTML = side;
  $('#p-nav').innerHTML = navHTML();
  const bn = $('#bar-next'); if (bn) bn.disabled = s.idx === n - 1;
  $$('.p-bar [data-act="prev"]').forEach(b => { b.disabled = s.idx === 0; });
  if (P.drawer) openDrawer();
  const cur = $('#p-nav .qcell.cur'); if (cur && cur.scrollIntoView && window.innerWidth >= 600) cur.scrollIntoView({block:'nearest'});
}
function navHTML(){
  const s = P.sess, exam = s.feedback === 'exam' && !s.submitted;
  const cells = s.qids.map((id, i) => {
    const r = s.resp[id], f = st.flags[id], m = s.marked && s.marked[id];
    let cls = '', icx = '', lab = t('unanswered');
    if (r) { if (exam) { cls = 's-ans'; icx = ic('dot'); lab = t('answered'); } else if (r === Q(id).answer) { cls = 's-ok'; icx = ic('check'); lab = t('correctMsg'); } else { cls = 's-bad'; icx = ic('x'); lab = t('wrongMsg'); } }
    return '<button class="qcell ' + cls + (i === s.idx ? ' cur' : '') + '" data-act="jump" data-i="' + i + '" aria-label="' + t('question') + ' ' + (i + 1) + ', ' + lab + (f ? ', ' + t('flagged') : '') + (m ? ', ' + t('marked') : '') + '"' + (i === s.idx ? ' aria-current="true"' : '') + '>' + (i + 1) +
      (f ? '<span class="fl">' + ic('starF') + '</span>' : '') + (m ? '<span class="bm">' + ic('bookmarkF') + '</span>' : '') + (icx ? '<span class="ic">' + icx + '</span>' : '') + '</button>';
  }).join('');
  const lg = exam ? [['s-ans', t('answered')], ['', t('unanswered')]] : [['s-ok', t('correct')], ['s-bad', t('wrong')], ['', t('unanswered')]];
  return '<h2 style="font-size:.95rem">' + t('navigator') + '</h2><div class="qgrid">' + cells + '</div><div class="nav-legend">' +
    lg.map(([c, l]) => '<span><i style="' + (c === 's-ans' ? 'background:var(--teal-soft);border-color:var(--accent)' : c === 's-ok' ? 'background:var(--ok-bg);border-color:var(--ok-line)' : c === 's-bad' ? 'background:var(--bad-bg);border-color:var(--bad-line)' : '') + '"></i>' + l + '</span>').join('') +
    '<span style="color:var(--flag)">' + ic('starF', 'xs') + t('flagged') + '</span>' + (exam ? '<span style="color:var(--accent)">' + ic('bookmarkF', 'xs') + t('marked') + '</span>' : '') + '</div>';
}
function go2(i){
  const s = P.sess; if (!s) return;
  i = clamp(i, 0, s.qids.length - 1); if (i === s.idx) return;
  flushVisit(); s.idx = i; save(); renderQ();

/* highlights are stored as [start, end] offsets into the stem's rendered text */
function textOffset(el, node, off){ const r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, off); return r.toString().length; }
function wrapRange(el, a, b){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), targets = []; let pos = 0, n;
  while ((n = walker.nextNode())) { const s0 = pos, e0 = pos + n.nodeValue.length; pos = e0; if (e0 > a && s0 < b) targets.push([n, Math.max(a, s0) - s0, Math.min(b, e0) - s0]); }
  for (const [node, x, y] of targets) {
    let mid = node; if (x > 0) mid = node.splitText(x); if (y - x < mid.nodeValue.length) mid.splitText(y - x);
    const m = document.createElement('mark'); m.className = 'hl'; m.dataset.act = 'unhl'; m.title = t('highlight');
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  }
}
function applyHL(el, ranges){ if (el && ranges) for (const [a, b] of ranges) wrapRange(el, a, b); }
function addHL(id, a, b){
  const list = (st.hl[id] || []).concat([[a, b]]).sort((x, y) => x[0] - y[0]), out = [];
  for (const r of list) { const l = out[out.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else out.push(r.slice()); }
  st.hl[id] = out; save();
}
let hlPending = null;
function hidePop(){ const p = $('#hl-pop'); if (p) p.remove(); }
function checkSelection(){
  const sel = window.getSelection(), stem = $('#stem');
  if (!P.sess || !stem || !sel || sel.isCollapsed || !sel.rangeCount) { hlPending = null; hidePop(); return; }
  const r = sel.getRangeAt(0);
  if (!stem.contains(r.startContainer) || !stem.contains(r.endContainer)) { hlPending = null; hidePop(); return; }
  const a = textOffset(stem, r.startContainer, r.startOffset), b = textOffset(stem, r.endContainer, r.endOffset);
  if (b - a < 1) return;
  hlPending = {id:curId(), a, b};
  const rect = r.getBoundingClientRect();
  let p = $('#hl-pop');
  if (!p) { p = document.createElement('button'); p.id = 'hl-pop'; p.className = 'hl-pop'; p.type = 'button'; document.body.appendChild(p);
    p.addEventListener('pointerdown', e => { e.preventDefault(); commitHL(); }); }
  p.innerHTML = ic('marker') + t('highlight');
  const below = rect.bottom + 52 < window.innerHeight;
  p.style.top = (below ? rect.bottom + 8 : Math.max(8, rect.top - 48)) + 'px';
  p.style.left = Math.min(window.innerWidth - 70, Math.max(70, rect.left + rect.width / 2)) + 'px';
}
function commitHL(){
  if (!hlPending || !P.sess || hlPending.id !== curId()) return;
  addHL(hlPending.id, hlPending.a, hlPending.b); hlPending = null; hidePop();
  const sel = window.getSelection(); if (sel) sel.removeAllRanges();
  renderQ();
}
function removeHL(mark){
  const id = curId(), stem = $('#stem'), off = textOffset(stem, mark.firstChild || mark, 0);
  st.hl[id] = (st.hl[id] || []).filter(r => !(off >= r[0] && off < r[1]));
  if (!st.hl[id].length) delete st.hl[id];
  save(); renderQ();
}

   ===================================================================== */
function readiness(){
  const ids = scopeIds(), o = statsFor(ids); if (!o.att) return null;
  const coverage = pct(o.att, ids.length);
  const exams = st.order.slice().reverse().map(id => st.sessions[id]).filter(s => s.mode === 'exam' && s.submitted && s.qids.some(inScope)).slice(0, 3);
  const examAvg = exams.length ? Math.round(exams.reduce((a, s) => a + sessionResult(s).pct, 0) / exams.length) : null;
  const score = Math.round(0.3 * coverage + 0.4 * o.acc + 0.3 * (examAvg === null ? o.acc : examAvg));
  return {score, coverage, acc:o.acc, examAvg, level:score >= 75 ? 'good' : score >= 60 ? 'fair' : 'weak'};
}
function readinessHTML(){
  const r = readiness();
  if (!r) return '<section class="card"><h2 style="display:flex;gap:.45rem;align-items:center">' + ic('gauge') + t('readiness') + '</h2>' + emptyState('gauge', t('readyEmpty')) + '</section>';
  const R = 46, C = 2 * Math.PI * R, col = 'var(--' + (r.level === 'good' ? 'ok' : r.level === 'fair' ? 'warn' : 'bad') + ')';
  const part = (l, v) => '<div class="part"><span class="muted">' + l + '</span><div class="bar"><span style="width:' + (v === null ? 0 : v) + '%"></span></div><span class="num">' + (v === null ? '—' : v + '%') + '</span></div>';
  return '<section class="card"><div class="card-title"><h2>' + ic('gauge') + t('readiness') + '</h2>' + '<span class="badge st st-' + r.level + '">' + t(r.level === 'good' ? 'readyHigh' : r.level === 'fair' ? 'readyMid' : 'readyLow') + '</span></div>' +
    '<div class="ready"><svg class="ready-ring" viewBox="0 0 112 112" role="img" aria-label="' + t('readiness') + ' ' + r.score + '%"><circle class="bg" cx="56" cy="56" r="' + R + '" fill="none" stroke-width="10"/>' +
    '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 56 56)" stroke="' + col + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - r.score / 100)) + '"/>' +

function mergeState(inc){
  for (const k in inc.answers) { const a = st.answers[k], b = inc.answers[k]; if (!a || b.lastAt > a.lastAt) { st.answers[k] = b; if (inc.leitner[k]) st.leitner[k] = inc.leitner[k]; else delete st.leitner[k]; } }
  for (const k in inc.leitner) if (!st.leitner[k] && !st.answers[k]) st.leitner[k] = inc.leitner[k];
  Object.assign(st.flags, inc.flags);
  for (const k in inc.hl) if (!st.hl[k]) st.hl[k] = inc.hl[k];
  const seenR = new Set(st.reports.map(r => r.ts + '|' + r.id));
  st.reports = st.reports.concat(inc.reports.filter(r => !seenR.has(r.ts + '|' + r.id)));

  for (const id of inc.order) if (!st.sessions[id]) { st.sessions[id] = inc.sessions[id]; st.order.push(id); }

  route();
  if (!st.tourDone) showTour(0);
  cloudInit();
  // Offline caching + installable app when hosted (GitHub Pages); harmless when opened as a local file.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {});
})();
</script>
