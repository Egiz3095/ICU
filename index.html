<style>
/* ===================== THEME TOKENS ===================== */
:root{
  /* calm green theme */
  --navy:#123B2C; --teal:#0C7D60; --teal-strong:#0A6650; --teal-soft:#E8F6F1;
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F4F3; --text:#111816; --muted:#5F6B66; --border:#E5E7E6;
  --accent:#0C7D60; --accent-ink:#FFFFFF;
  --ok:#166534; --ok-bg:#E3F5E8; --ok-line:#86CFA0; --info-solid:#1D5FBF;
  --bad:#B42318; --bad-bg:#FDECEA; --bad-line:#F1A39B;
  --warn:#8A5A00; --warn-bg:#FFF2D6; --warn-line:#E8C06A;
  --none:#6B7686; --none-bg:#EBEEF3;
  --flag:#B7791F;
  --shadow:0 2px 10px -2px rgba(0,0,0,.06);
  --radius:20px; --fs:17px;
  --brand-grad:linear-gradient(135deg,#14A37F,#07533F);
  --side-w:236px;
  --qfont:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font:var(--qfont);
  --sec-l:93%; --sec-d:30%; --sec-s:55%;
  --sd-glass:rgba(255,255,255,.82); --sd-day:#E1E7E4; --sd-ind:#E3F4EE; --sd-ic:#EEF3F1; --sd-ic-ink:#41504A; --sd-glow:0 4px 12px rgba(12,125,96,.28); --sd-ring:rgba(20,163,127,.45); --sd-tip:#14201B; --sd-tip-ink:#fff; --sd-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.07),0 24px 48px -16px rgba(15,23,42,.12);
  color-scheme:light;
}
:root[lang="ar"]{--font:Cairo,"Noto Sans Arabic",Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0B1410; --teal:#4FD1A5; --teal-strong:#8BE5C7; --teal-soft:#16302A;
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --text:#F2F2F7; --muted:#9A9AA2; --border:#2C2C2E;
    --accent:#4FD1A5; --accent-ink:#06261C;
    --ok:#5AD08F; --ok-bg:#123222; --ok-line:#2F7A51; --info-solid:#2C62C4;
    --bad:#FF8A80; --bad-bg:#3A1716; --bad-line:#8C3A33;
    --warn:#F2BC54; --warn-bg:#382A0E; --warn-line:#8A6A24;
    --none:#8E9AAB; --none-bg:#223047;
    --flag:#F2BC54;
    --shadow:none;
    --sec-l:22%; --sec-d:74%; --sec-s:35%;
  --sd-glass:rgba(28,28,30,.78); --sd-day:#454B49; --sd-ind:rgba(79,209,165,.13); --sd-ic:#2A2E2C; --sd-ic-ink:#C9D2CE; --sd-glow:0 0 0 1px rgba(79,209,165,.35),0 0 18px rgba(79,209,165,.35); --sd-ring:rgba(79,209,165,.4); --sd-tip:#F2F2F7; --sd-tip-ink:#111816; --sd-shadow:0 0 0 1px rgba(255,255,255,.04),0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0B1410; --teal:#4FD1A5; --teal-strong:#8BE5C7; --teal-soft:#16302A;
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --text:#F2F2F7; --muted:#9A9AA2; --border:#2C2C2E;
  --accent:#4FD1A5; --accent-ink:#06261C;
  --ok:#5AD08F; --ok-bg:#123222; --ok-line:#2F7A51; --info-solid:#2C62C4;
  --bad:#FF8A80; --bad-bg:#3A1716; --bad-line:#8C3A33;
  --warn:#F2BC54; --warn-bg:#382A0E; --warn-line:#8A6A24;
  --none:#8E9AAB; --none-bg:#223047;
  --flag:#F2BC54;
  --shadow:none;
  --sec-l:22%; --sec-d:74%; --sec-s:35%;
  --sd-glass:rgba(28,28,30,.78); --sd-day:#454B49; --sd-ind:rgba(79,209,165,.13); --sd-ic:#2A2E2C; --sd-ic-ink:#C9D2CE; --sd-glow:0 0 0 1px rgba(79,209,165,.35),0 0 18px rgba(79,209,165,.35); --sd-ring:rgba(79,209,165,.4); --sd-tip:#F2F2F7; --sd-tip-ink:#111816; --sd-shadow:0 0 0 1px rgba(255,255,255,.04),0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}

/* ===================== BASE ===================== */
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;overflow-x:hidden}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.35rem} h2{font-size:1.12rem} h3{font-size:1rem}
p{margin:0 0 .75rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.modal .btn:focus-visible{outline-width:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
sup{font-size:.7em;line-height:0}
mark{background:#FFE58A;color:#1a1a1a;border-radius:3px;padding:0 1px}
[hidden]{display:none!important}
.qtext{font-family:var(--qfont)}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.i.xs{width:.8em;height:.8em}
[dir="rtl"] .i.flip{transform:scaleX(-1)}

/* ===================== SHELL ===================== */
.app{min-height:100vh;display:flex}
.sidebar{background:var(--surface);color:var(--text);display:flex;flex-direction:column;border-inline-end:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.6rem;padding:1rem 1rem .75rem;font-weight:700;letter-spacing:.2px;color:var(--text);text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:grid;place-items:center;color:#fff;flex:none}
.brand-mark .i{width:20px;height:20px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.nav-link{display:flex;align-items:center;gap:.7rem;color:var(--muted);text-decoration:none;padding:.65rem 1rem;margin:2px .6rem;border-radius:10px;font-weight:500;min-height:44px}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link[aria-current="page"]{background:var(--teal-soft);color:var(--teal-strong);font-weight:600}
.nav-link svg{width:20px;height:20px;flex:none}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;padding:calc(.55rem + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) .55rem max(16px, env(safe-area-inset-left));min-height:56px}
.topbar h1{font-size:1.05rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text);text-decoration:none;padding:0 .4rem}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.lang-btn span{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 .35rem;border:1.5px solid currentColor;border-radius:7px;font-weight:700;font-size:.85rem;line-height:1}
.lang-btn #lang-label:lang(ar){font-family:Cairo,"Noto Sans Arabic",Tahoma,sans-serif;font-size:1rem}
main{flex:1;padding:16px;width:100%;max-width:1180px;margin:0 auto}
main:focus{outline:none}
.disclaimer{font-size:.78rem;color:var(--muted);text-align:center;padding:12px 16px 16px}
.bottomnav{display:none}
.storage-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);padding:.5rem .75rem;border-radius:10px;margin-bottom:12px;font-size:.88rem}
/* focus mode: hide app chrome while answering */
body.focus-pref.in-player .sidebar,body.focus-pref.in-player .topbar{display:none!important}
body.focus-pref.in-player main{padding-top:calc(16px + env(safe-area-inset-top))}

@media (max-width:599.98px){
  .sidebar{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45rem 0 .4rem;font-size:.7rem;color:var(--muted);text-decoration:none;min-height:56px;justify-content:center}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a[aria-current="page"]{color:var(--accent);font-weight:600}
  .app{padding-bottom:64px}
  body.in-player .bottomnav{display:none}
  body.in-player .app{padding-bottom:76px}
  .hide-phone{display:none!important}
  .tbl.sess th:nth-child(3),.tbl.sess td:nth-child(3){display:none}
  .tbl th,.tbl td{padding:.5rem .35rem}
  .bankpick #bank-l{display:none}
  .bankpick .seg{display:flex;flex-wrap:nowrap;width:100%}
  .bankpick .seg button{flex:1 1 0;min-width:0;padding:.4rem .25rem;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (min-width:600px) and (max-width:1024px){
  .app{flex-direction:column}
  .sidebar{flex-direction:row;align-items:center;position:sticky;top:0;z-index:35;overflow-x:auto;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .brand{padding:.5rem .75rem}
  .brand small,.brand .bt{display:none}
  .nav-links{display:flex;flex:1}
  .nav-link{flex:1;justify-content:center;gap:.35rem;padding:.45rem .3rem;margin:6px 2px;font-size:.82rem;white-space:nowrap}
  .nav-link svg{width:18px;height:18px}
  .sidebar{padding-top:env(safe-area-inset-top)}
  .topbar{top:calc(56px + env(safe-area-inset-top));padding-top:.55rem}
  .hide-tablet{display:none!important}
}
@media (min-width:1025px){
  .sidebar{width:var(--side-w);position:sticky;top:0;height:100vh;flex:none}
  .nav-links{display:flex;flex-direction:column;margin-top:.5rem}
  .side-foot{margin-top:auto;padding:1rem;font-size:.75rem;color:var(--muted)}
  .hide-desktop{display:none!important}
}
@media (max-width:1024px){ .side-foot{display:none} }

/* ===================== COMPONENTS ===================== */
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.card-title h2{margin:0;display:flex;align-items:center;gap:.45rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack > * + *{margin-top:16px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:.6rem 1.05rem;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--teal-strong);border-color:var(--teal-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:40px;padding:.4rem .8rem;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;font-weight:600;padding:.15rem .5rem;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.st-good{--st:var(--ok);--st-bg:var(--ok-bg);--st-line:var(--ok-line)}
.st-fair{--st:var(--warn);--st-bg:var(--warn-bg);--st-line:var(--warn-line)}
.st-weak{--st:var(--bad);--st-bg:var(--bad-bg);--st-line:var(--bad-line)}
.st-none{--st:var(--none);--st-bg:var(--none-bg);--st-line:var(--border)}
.badge.st.st-none{color:var(--muted)}
.badge.st{color:var(--st);background:var(--st-bg);border-color:var(--st-line)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.field > label,.field > .lbl{font-weight:600;font-size:.92rem}
.input,.pw-ph{display:flex;gap:8px;direction:ltr}.pw-ph select.input{width:auto;max-width:48%;flex:0 0 auto}.pw-ph .input:last-child{flex:1;min-width:0}
select.input,textarea.input{width:100%;min-height:46px;padding:.55rem .75rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:.45rem .85rem;border:1px solid var(--border);border-radius:99px;background:var(--surface);font-size:.9rem;font-weight:500}
.chip input:checked + span{background:var(--teal-soft);border-color:var(--accent);color:var(--text)}
.chip input:checked + span::before{content:"";width:.55em;height:.95em;border:solid var(--accent);border-width:0 .17em .17em 0;transform:rotate(45deg) translateY(-.1em);margin-inline-end:.2em}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:44px;padding:.4rem .9rem;border:0;background:var(--surface);cursor:pointer;font-weight:500;border-inline-end:1px solid var(--border)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.switch{display:flex;align-items:center;gap:.6rem;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.empty{text-align:center;padding:1.25rem 1rem;color:var(--muted)}
.empty .i{width:2.2rem;height:2.2rem;display:block;margin:0 auto .5rem;color:var(--accent);opacity:.8}
.empty p{max-width:34ch;margin:0 auto .75rem}
.table-wrap{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:.55rem .5rem;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
/* section identity: hue per section, light/dark aware */
.sec-ic{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;flex:none;background:hsl(var(--h) var(--sec-s) var(--sec-l));color:hsl(var(--h) 62% var(--sec-d))}
.sec-ic .i{width:20px;height:20px}
.sec-ic.sm{width:28px;height:28px;border-radius:8px}
.sec-ic.sm .i{width:16px;height:16px}

/* ===================== HOME ===================== */
.plan{background:var(--teal-soft);color:var(--text);border:1px solid var(--border);box-shadow:none}
.plan .k{font-size:.82rem;color:var(--teal-strong);font-weight:600;display:flex;align-items:center;gap:.4rem}
.plan h2{font-size:1.35rem;margin:.25rem 0 .75rem}
.plan .goalbar{height:10px;border-radius:99px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.plan .goalbar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.plan .chipsrow{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0 1rem}
.plan .pchip{display:inline-flex;align-items:center;gap:.35rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:.3rem .7rem;font-size:.85rem}
.plan .pchip b{font-variant-numeric:tabular-nums;color:var(--text)}
.btn.light{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.light:hover{background:var(--teal-strong);border-color:var(--teal-strong)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.plan .done{display:inline-flex;align-items:center;gap:.35rem;color:var(--ok);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem .85rem;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.78rem;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:.35rem}

/* mini question grid / heatmap */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qcell{min-height:42px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:.8rem;font-weight:600;cursor:pointer;position:relative;display:grid;place-items:center;text-decoration:none;color:var(--text);padding:0}
.qcell.s-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.qcell.s-bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.qcell.s-ans{background:var(--teal-soft);border-color:var(--accent)}
.qcell.cur{outline:3px solid var(--accent);outline-offset:1px}
.qcell .fl{position:absolute;top:-7px;inset-inline-end:-5px;color:var(--flag);line-height:0}
.qcell .bm{position:absolute;top:-7px;inset-inline-start:-5px;color:var(--accent);line-height:0}
.qcell .fl .i,.qcell .bm .i{width:14px;height:14px}
.qcell .ic{position:absolute;bottom:2px;inset-inline-end:3px;line-height:0}
.qcell .ic .i{width:10px;height:10px}
.heat{display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:3px}
.heat button{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--none-bg);cursor:pointer;min-width:0;box-shadow:inset 0 0 0 1px var(--border)}
.heat .h-ok{background:var(--ok);box-shadow:none}
.heat .h-bad{background:repeating-linear-gradient(45deg,var(--bad) 0 3px,var(--bad-bg) 3px 5px);box-shadow:none}
.heat .h-flag{box-shadow:inset 0 0 0 2px var(--flag)}
.heat .h-sec{grid-column:1/-1;aspect-ratio:auto;height:auto;background:none;box-shadow:none;font-size:.72rem;color:var(--muted);text-align:start;padding:.3rem 0 .1rem;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.8rem;color:var(--muted);margin-top:.6rem;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:.3rem}

/* ===================== PLAYER ===================== */
.player{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main" "side"}
.p-head{grid-area:head}
.p-main{grid-area:main;min-width:0}

}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:.3rem .65rem;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);min-height:40px;display:inline-flex;align-items:center;gap:.35rem;font-size:1.05rem}

@keyframes pulse{50%{opacity:.6}}
.flag-btn[aria-pressed="true"]{color:var(--flag)}

.qmeta{font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:.75rem;width:100%;min-height:52px;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;text-align:start;line-height:1.45;transition:background .12s,border-color .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--surface-2)}
.opt .key{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.9rem;border:1px solid var(--border)}

.opt.chosen{border-color:var(--accent);background:var(--teal-soft)}
.opt.chosen .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.72}
.feedback{margin-top:14px;padding:.75rem .9rem;border-radius:12px;font-weight:600;display:flex;gap:.5rem;align-items:center;animation:pop .18s ease-out}

/* 8 stats section cards */
.sec-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.6rem}
.sec-card{display:flex;gap:.7rem;align-items:center;padding:.65rem .75rem;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.sec-card:hover{border-color:var(--st)}
.sec-card .ring{width:52px;height:52px;flex:none}
.sec-card .sc-body{flex:1;min-width:0}
.sec-card .sc-name{font-weight:600;font-size:.9rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.2rem}
.sec-card .sc-bar{height:4px;border-radius:99px;background:var(--surface-2);margin-top:.35rem;overflow:hidden}
.sec-card .sc-bar span{display:block;height:100%;background:var(--st);border-radius:99px}
.sec-card.st-none{--st:var(--muted)}
/* answer feedback */
.opt{position:relative}
.opt.fx-ok{animation:fx-ok .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes fx-ok{0%{transform:scale(.97);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}45%{transform:scale(1.025)}100%{transform:none;box-shadow:0 0 0 12px transparent}}
.opt.fx-bad{animation:fx-bad .45s ease}
@keyframes fx-bad{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback.fx-in{animation:fx-in .35s ease-out}
@keyframes fx-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx-burst{position:absolute;inset-inline-end:22px;top:50%;width:0;height:0;pointer-events:none}
.fx-burst i{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--ok);transform:rotate(var(--a)) translateX(0);animation:fx-dot .7s ease-out forwards}
.fx-burst i:nth-child(3n){background:var(--flag)}
@keyframes fx-dot{to{transform:rotate(var(--a)) translateX(34px);opacity:0}}
/* loading */
.spinner{display:inline-block;width:20px;height:20px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--teal) 25%,transparent);border-top-color:var(--teal);animation:spin .8s linear infinite;flex:none}
.spinner.lg{width:34px;height:34px;border-width:3px;margin:.25rem auto .75rem;display:block}
.loading-row{display:flex;align-items:center;gap:.6rem;padding:.4rem 0}
/* question of the day, folded */
details.qotd-d > summary{list-style:none;cursor:pointer}
details.qotd-d > summary::-webkit-details-marker{display:none}
details.qotd-d[open] .qotd-peek,details.qotd-d[open] .qotd-go{display:none}
.qotd-peek{font-weight:600;line-height:1.5}
.p-main{touch-action:pan-y}
@media (prefers-reduced-motion:reduce){.opt.fx-ok,.opt.fx-bad,.feedback.fx-in,.spinner{animation:none}.fx-burst{display:none}}
@media (prefers-reduced-motion:reduce){.ios-arrow{animation:none}}
@keyframes nb-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.newbank .nb-ic{animation:none}}
/* admin: question upload */
.adm-steps{margin:.75rem 0;padding-inline-start:1.2rem;display:grid;gap:.6rem}
.adm-steps li{line-height:2}
.adm-sum{display:flex;gap:.5rem;flex-wrap:wrap;margin:.75rem 0}
.adm-sum .pill{padding:.25rem .7rem;border-radius:999px;font-size:.85rem;font-weight:600}
.adm-sum .pill.ok{background:var(--ok-bg);color:var(--ok)} .adm-sum .pill.bad{background:var(--bad-bg);color:var(--bad)}
.adm-errs{max-height:180px;overflow:auto;border:1px solid var(--bad-line);background:var(--bad-bg);border-radius:10px;padding:.6rem .8rem;display:grid;gap:.3rem}
.adm-table{overflow-x:auto;margin-top:.75rem;border:1px solid var(--border);border-radius:10px}
.adm-table table{width:100%;border-collapse:collapse;font-size:.85rem}
.adm-table th,.adm-table td{padding:.45rem .6rem;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
.adm-table td:nth-child(4){min-width:240px}
.adm-bank{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:.6rem 0;border-bottom:1px solid var(--border)}
.adm-bank:last-child{border-bottom:0}
.q-img{display:block;width:100%;margin:.2rem 0 1rem;padding:0;border:1px solid var(--border);border-radius:14px;background:var(--surface-2);overflow:hidden;cursor:zoom-in}
.q-img img{display:block;width:100%;max-height:360px;object-fit:contain}
.lightbox{position:fixed;inset:0;z-index:1000;background:#000;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;touch-action:pinch-zoom}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox .lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:12px;color:#fff;background:rgba(255,255,255,.15)}
.img-fold{margin-top:.75rem;border-radius:14px;background:var(--surface-2)}
.img-fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.45rem;padding:.75rem .9rem;font-weight:700;min-height:48px}
.img-fold > summary::-webkit-details-marker{display:none}
.img-fold > summary .i:last-child{margin-inline-start:auto;transition:transform .15s}
.img-fold[open] > summary .i:last-child{transform:rotate(180deg)}
.img-fold > .input{margin:0 .75rem .5rem;width:calc(100% - 1.5rem)}
#img-rows{max-height:420px;overflow:auto;padding:0 .5rem .5rem}
.img-row{display:flex;align-items:center;gap:.6rem;padding:.35rem;border-radius:10px}
.img-row + .img-row{border-top:1px solid var(--border)}
.img-row img{width:44px;height:44px;flex:none;object-fit:cover;border-radius:8px;background:var(--surface);cursor:zoom-in}
.img-row .img-name{flex:1;min-width:0}
.img-row .icon-btn.danger{color:var(--bad)}
.img-name{font-size:.75rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mem-head h2{margin:0}
.mem-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:.9rem 0}
.mem-tiles > div{background:var(--surface-2);border-radius:14px;padding:.7rem .5rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.mem-tiles b{font-size:1.3rem}
.mem-tiles span{font-size:.75rem;color:var(--muted)}
.mem-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.4rem}
.mem-tools #mem-q{flex:2;min-width:12rem}
.mem-tools #mem-sort{flex:1;min-width:10rem;width:auto}
.mem-table td{vertical-align:middle;white-space:nowrap}
.adm-table .mem-table td:nth-child(4){min-width:0}
@media (max-width:640px){
  .mem-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mem-table thead{display:none}
  .mem-table,.mem-table tbody{display:block}
  /* phone: one tidy card per member: [tick] name … status / progress bar / 4 small numbers */
  .mem-table tr{display:grid;grid-template-columns:28px repeat(4,minmax(0,1fr));grid-template-areas:"cb nm nm nm ls" ". pg pg pg pg" ". ac wk st ap";gap:.55rem .6rem;padding:.85rem .8rem;border-bottom:1px solid var(--border);align-items:start}
  .mem-table tr:last-child{border-bottom:0}
  .adm-table .mem-table td{border:0;padding:0;white-space:normal;min-width:0}
  .mem-table td:nth-child(1){grid-area:cb;width:auto;text-align:start}
  .mem-table td:nth-child(2){grid-area:nm}
  .mem-table td:nth-child(3){grid-area:ls;text-align:end;font-size:.78rem;white-space:nowrap}
  .mem-table td:nth-child(4){grid-area:pg}
  .mem-table td:nth-child(5){grid-area:ac}.mem-table td:nth-child(6){grid-area:wk}.mem-table td:nth-child(7){grid-area:st}.mem-table td:nth-child(8){grid-area:ap}
  .mem-table td:nth-child(n+5){background:var(--surface-2);border-radius:10px;padding:.35rem .4rem;text-align:center;font-weight:700}
  .mem-table td[data-l]::before{content:attr(data-l);display:block;font-size:.66rem;color:var(--muted);font-weight:600;line-height:1.3;margin-bottom:2px}
  .mem-table .mem-prog{flex-direction:row;align-items:center;gap:8px;min-width:0}
  .mem-table .mem-prog .bar{flex:1}
  .mem-table .mem-acts{gap:.2rem 1rem}
  .mem-table td:nth-child(8) .mem-tag{margin:0;padding:0 .35rem;font-size:.66rem;max-width:100%;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:380px){
  .mem-table tr{grid-template-columns:28px repeat(2,minmax(0,1fr));grid-template-areas:"cb nm nm" ". ls ls" ". pg pg" ". ac wk" ". st ap"}
  .mem-table td:nth-child(3){text-align:start}
}
.mem-prog{display:flex;flex-direction:column;gap:4px;min-width:110px}
.mem-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--none);margin-inline-end:6px;vertical-align:middle}
.mem-dot.on{background:var(--ok)} .mem-dot.mid{background:var(--warn)}
.pw-reqs{border:1px solid var(--warn);border-radius:16px;padding:.8rem 1rem;margin:.6rem 0 1rem}
.pw-reqs h3{display:flex;align-items:center;gap:.4rem;font-size:.95rem;margin:0 0 .2rem}
.pw-req{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.55rem 0;border-top:1px solid var(--line)}
.pw-temp{font:600 1.5rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;background:var(--surface-2);border-radius:14px;padding:.8rem;margin:.6rem 0;user-select:all}
.mem-table .link-btn.small{font-size:.78rem;min-height:24px;padding:.1rem 0}
.use-tiles{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.use-tiles{grid-template-columns:repeat(4,1fr)}}
.use-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:.4rem}
.use-grid h3{font-size:.92rem;margin:0 0 .5rem}
.hbar{display:grid;grid-template-columns:minmax(0,9rem) 1fr 2.6rem;align-items:center;gap:.5rem;font-size:.84rem;margin:.28rem 0}
.hbar > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar i{display:block;height:8px;border-radius:99px;background:var(--teal);min-width:3px}
.hbar b{text-align:end;font-weight:600}
.use-days{display:flex;align-items:flex-end;gap:2px;height:84px;direction:ltr}
.use-days span{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.mem-tag{display:inline-block;font-size:.72rem;font-weight:600;padding:.1rem .5rem;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
/* login gate: shown over everything until the user signs in */
body.gated .modal-back{z-index:210}
.login-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;margin:0 0 1rem}
.login-tabs button{border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:.6rem .4rem;border-radius:11px;cursor:pointer;min-height:44px}
.login-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.login-form .up-only{display:none}
.login-form.up .up-only{display:block}
.login-form.up .in-only{display:none}
.login-form.up .btn.up-only, .login-form .btn.in-only{display:inline-flex}
.login-form.up .btn.in-only{display:none}
label .up-only, label .in-only{display:inline}
.login-form:not(.up) label .up-only, .login-form.up label .in-only{display:none}
.new-here-up{background:var(--teal-soft);color:var(--teal-strong);border-radius:12px;padding:.6rem .8rem;margin:0 0 1rem;font-size:.86rem;line-height:1.6}
.login-form.up .new-here-up{display:flex;gap:.45rem;align-items:flex-start}
.pw-wrap{position:relative}
.pw-wrap .input{width:100%;padding-inline-end:3rem}
.pw-eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--muted);border-radius:10px;display:grid;place-items:center;cursor:pointer}
.pw-eye:hover{color:var(--text)}
html[dir="rtl"] .pw-wrap .input{padding-inline-end:.9rem;padding-left:3rem}
html[dir="rtl"] .pw-eye{inset-inline-end:auto;left:4px}
.field-hint{margin:.1rem 0 0;font-size:.8rem;display:flex;align-items:center;gap:.3rem}
.field-hint .i{width:15px;height:15px;flex:none}
.field-hint.ok{color:var(--ok)} .field-hint.bad{color:var(--bad)} .field-hint.warn{color:var(--warn)} .field-hint.muted{color:var(--muted)}
.pw-meter{margin:-.45rem 0 .85rem}
.login-form.up .pw-meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:center}
.pw-meter i{height:5px;border-radius:99px;background:var(--surface-2)}
.pw-meter span{grid-column:1/-1;font-size:.78rem;color:var(--muted)}
.pw-meter[data-s="1"] i:nth-child(-n+1){background:var(--bad)}
.pw-meter[data-s="2"] i:nth-child(-n+2){background:var(--warn)}
.pw-meter[data-s="3"] i{background:var(--ok)}
.dot-sep{margin:0 .5rem;color:var(--muted)}
.btn.busy{opacity:.7;pointer-events:none}
.mem-acts{display:flex;flex-wrap:wrap;gap:.2rem .8rem;margin-top:.2rem}
.mem-acts .del{color:var(--bad)}
.mem-tag.off{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
tr.banned td{opacity:.75}
.login-msg{margin:.2rem 0 .7rem;padding:.6rem .8rem;border-radius:12px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-size:.88rem;font-weight:600}
.login-msg .link-btn{font-size:inherit;min-height:0;padding:0;margin-inline-start:.3rem}
.input.login-bad{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.new-here{background:var(--teal-soft);border-radius:14px;padding:.6rem .85rem;margin:0 0 1rem;font-size:.88rem}
.new-here summary{cursor:pointer;font-weight:700;color:var(--teal-strong);display:flex;align-items:center;gap:.4rem;list-style:none;min-height:28px}
.new-here summary::-webkit-details-marker{display:none}
.new-here p{margin:.4rem 0 .1rem;line-height:1.6}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
#gate[hidden]{display:none}
body.gated .app{visibility:hidden}
.gate-wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
/* monitor panel: always dark, like a bedside monitor */
.gate-hero{position:relative;min-height:clamp(240px,40vh,360px);background:radial-gradient(120% 90% at 30% 40%,#0B2A1F 0%,#06140F 60%,#040C09 100%);color:#E6FFF4;overflow:hidden;isolation:isolate}
.gate-hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background-image:linear-gradient(rgba(52,211,153,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(52,211,153,.05) 1px,transparent 1px),linear-gradient(rgba(52,211,153,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(52,211,153,.11) 1px,transparent 1px);
  background-size:16px 16px,16px 16px,80px 80px,80px 80px}
.gate-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(140% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.gate-hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-top{position:absolute;inset-inline:clamp(16px,4vw,40px);top:calc(clamp(14px,3vh,32px) + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:16px;z-index:2}
.hero-brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.hero-brand .brand-mark{flex:none;width:40px;height:40px;border-radius:11px;background:var(--brand-grad);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(110,231,183,.25),0 6px 18px rgba(4,120,87,.45)}
.hero-brand .brand-mark svg{width:22px;height:22px}
.hero-brand b{display:block;font-size:1.08rem;letter-spacing:.2px;color:#F0FFF8}
.hero-brand small{display:block;font-size:.78rem;color:#8CC7AE;margin-top:1px}
.vitals{display:flex;gap:clamp(12px,2.5vw,28px);direction:ltr;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:end}
.vitals .v{line-height:1}
.vitals .lbl{display:block;font-size:.66rem;letter-spacing:.12em;opacity:.8;margin-bottom:4px}
.vitals b{font-size:clamp(1.35rem,3.2vw,2.1rem);font-weight:600;font-variant-numeric:tabular-nums}
.vitals small{font-size:.66rem;opacity:.7;margin-inline-start:3px}
.vitals .hr{color:#34D399} .vitals .spo2{color:#67E8F9}
.vitals .hr .lbl::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#34D399;margin-inline-end:5px;vertical-align:1px;box-shadow:0 0 8px #34D399;opacity:.35;transition:opacity .25s}
.vitals .hr.blip .lbl::before{opacity:1;transition:none}
.hero-foot{position:absolute;left:clamp(16px,4vw,40px);right:clamp(16px,4vw,40px);bottom:40px;z-index:2;font-size:.78rem;color:#7FB79F;display:flex;gap:.5rem;flex-wrap:wrap}
.hero-foot span+span::before{content:"·";margin-inline-end:.5rem;opacity:.6}
.hero-copy{display:none}
.gate-form{grid-auto-rows:max-content}
.gate-lang{justify-self:center;margin-top:14px;background:none;border:0;color:var(--muted);font:inherit;font-size:.88rem;padding:8px 12px;border-radius:8px;cursor:pointer}
.gate-lang:hover,.gate-lang:focus-visible{color:var(--text);background:var(--surface-2)}
.gate-form{position:relative;display:grid;place-items:start center;padding:0 16px 32px}
.gate-card{position:relative;z-index:3;width:100%;max-width:400px;margin-top:-28px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 48px rgba(6,20,15,.18);padding:clamp(1.25rem,4vw,2rem)}
.gate-head{margin-bottom:1.2rem}
.gate-head h2{margin:0;font-size:1.3rem}
.gate-head p{margin:.25rem 0 0;font-size:.88rem;color:var(--muted)}
.gate-card .field{margin-bottom:.85rem}
.gate-card .input{width:100%;min-height:46px}
.gate-card .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-top:.4rem}
.gate-card .row .btn{justify-content:center;min-height:46px;width:100%;white-space:nowrap}
.gate-card .gate-note{margin:.9rem 0 0;font-size:.8rem;color:var(--muted);text-align:center}
@media (min-width:900px){
  .gate-wrap{grid-template-columns:minmax(0,1.2fr) minmax(420px,1fr);grid-template-rows:1fr;min-height:100vh}
  .gate-hero{min-height:100vh}
  .hero-foot{bottom:clamp(16px,3vh,28px)}
  .hero-copy{display:block;position:absolute;inset-inline:clamp(24px,4vw,56px);bottom:clamp(56px,10vh,110px);z-index:2;max-width:30rem}
  .hero-copy h1{margin:0 0 .5rem;font-size:clamp(1.9rem,2.6vw,2.6rem);line-height:1.15;color:#F0FFF8}
  .hero-copy p{margin:0;color:#9FD3BC;font-size:1rem}
  .gate-form{place-content:center;justify-items:center;padding:40px}
  .gate-card{margin-top:0;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 32px rgba(6,20,15,.10)}
}
@media (max-height:560px) and (max-width:899px){.gate-hero{min-height:180px}.hero-foot{display:none}}
@media (prefers-reduced-motion: reduce){.vitals .hr .lbl::before{transition:none}}
/* ---- banks: shelf, bank page, path, body map, board ---- */
.i.flipv{transform:rotate(180deg)}
.smart-go{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.9rem;align-items:center;width:100%;text-align:start;border:0;cursor:pointer;font:inherit;color:#fff;background:var(--brand-grad);border-radius:20px;padding:1rem 1.1rem;box-shadow:0 8px 24px rgba(7,83,63,.25)}
.smart-go .sg-ic{grid-row:1/4;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.smart-go .sg-ic .i{width:26px;height:26px}
.smart-go .sg-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.smart-go b{font-size:1.25rem;line-height:1.2}
.smart-go small{opacity:.95;font-size:.86rem}
.smart-go .sg-hint{grid-column:2;font-size:.75rem;opacity:.85;margin-top:.15rem}
.smart-go:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.shelf .home-h{margin-bottom:.5rem}
.shelf-row{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:thin}
@media (min-width:900px){.shelf-row{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));overflow:visible}}
.bk-card{scroll-snap-align:start;background:var(--surface);border-radius:20px;padding:1rem;display:flex;flex-direction:column;gap:.55rem;position:relative;overflow:hidden;border-top:5px solid hsl(var(--h) 55% 45%)}

.main-col.trk-in #view{animation:trkIn .55s cubic-bezier(.2,.8,.2,1)}

.tg-box{background:var(--surface);border-radius:24px;max-width:860px;width:100%;padding:28px 24px 20px;box-shadow:0 24px 60px rgba(0,0,0,.3)}

.tg-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.tg-cards{grid-template-columns:1fr}}
.tg-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:.45rem;padding:20px;border-radius:20px;color:#fff;min-height:200px;position:relative;overflow:hidden;transition:transform .15s}

.tg-seq .tg-tag{background:#C99A2E}
.tg-card b{font-size:1.2rem}.tg-sub{opacity:.9;font-size:.92rem;line-height:1.5}
.tg-prog{height:6px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:auto}.tg-prog i{display:block;height:100%;background:#fff;border-radius:9px}
.tg-meta{font-size:.82rem;opacity:.9}
.tg-go{display:inline-flex;align-items:center;gap:.3rem;font-weight:800;align-self:flex-end}
.tg-foot{text-align:center;color:var(--muted);font-size:.85rem;margin:14px 0 0}

.seq-hero>*{position:relative;z-index:1}
.sh-l{flex:1 1 320px}.sh-tag{font:800 .72rem/1 var(--qfont);letter-spacing:.06em;background:#C99A2E;padding:.32rem .55rem;border-radius:7px}

.sh-cd{flex:0 0 auto;min-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;background:rgba(255,255,255,.1);border-radius:16px;padding:14px 18px;text-align:center}
.sh-cd b{font-size:2.6rem;line-height:1;color:#F2D28C}.sh-cd span{font-size:.85rem;opacity:.9}
.btn.gold{background:#C99A2E;border-color:#C99A2E;color:#1A1404;font-weight:800}
.btn.ghost-l{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.linkish{all:unset;cursor:pointer;font-size:.8rem;text-decoration:underline;opacity:.85}

.sq-tops{display:flex;flex-wrap:wrap;gap:.45rem}.sq-top{padding:.4rem .75rem;border-radius:999px;background:var(--teal-soft);color:var(--accent);font-weight:700;font-size:.85rem;text-decoration:none}
.sq-list{display:flex;flex-direction:column}
.sq-row{display:flex;align-items:center;gap:.8rem;padding:.75rem .2rem;border-bottom:1px solid var(--border);color:inherit;text-decoration:none}.sq-row:last-child{border-bottom:0}
.sq-row:hover .sq-t>span{color:var(--accent)}
.sq-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.2rem}.sq-t small{color:var(--muted)}.sq-t>span{font-size:.92rem;line-height:1.45}

.sq-struct{margin:0 0 .6rem;padding:0;list-style:none;counter-reset:s;display:grid;gap:.4rem}
.sq-struct li{counter-increment:s;display:flex;gap:.6rem;align-items:baseline;padding:.45rem .6rem;border-radius:10px;background:var(--surface-2)}
.sq-struct li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.78rem}
.sq-struct b{flex:none;min-width:11ch}.sq-struct span{color:var(--muted);font-size:.86rem}
.seq-gold{border-top:3px solid var(--gold,#B8862A)}
.sq-top-bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.sq-top-bar>span:nth-child(2){flex:1}
.sq-top-bar.sim{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:5;background:var(--surface);padding:.55rem .8rem;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border)}.sq-top-bar.sim b{flex:1}
.sq-timer{font-weight:800;font-size:1.05rem;padding:.35rem .7rem;border-radius:10px;background:var(--teal-soft);color:var(--accent)}.sq-timer.big{font-size:1.2rem}
.sq-timer.half{background:var(--warn-bg);color:var(--warn)}.sq-timer.over{background:var(--bad-bg);color:var(--bad)}
.sq-score{font-weight:800;font-size:1.15rem;padding:.35rem .8rem;border-radius:10px;background:var(--gold-soft,#FBF3E2);color:var(--gold,#B8862A)}
.sq-stem{border-inline-start:4px solid var(--gold,#B8862A)}.sq-stem p{margin:.5rem 0 0;font-size:1.05rem;line-height:1.65}
.sq-tagline{font-size:.78rem;font-weight:800;color:var(--accent);letter-spacing:.02em}
.seq-tip{display:flex;gap:.4rem;align-items:flex-start;margin:0}
.sq-ph{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.6rem}.sq-ph>span:nth-child(2){flex:1;font-weight:600;line-height:1.5}
.sq-pl{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:.85rem}
.sq-m{flex:none;font-size:.75rem;font-weight:800;color:var(--muted);background:var(--surface-2);padding:.25rem .5rem;border-radius:7px;white-space:nowrap}
.sq-ans{width:100%;min-height:130px;font-family:var(--qfont);line-height:1.55;resize:vertical;background:var(--surface);background-image:repeating-linear-gradient(to bottom,transparent 0 23px,var(--paper-line,rgba(0,0,0,.05)) 23px 24px);background-attachment:local}
.sq-acts{margin-top:.2rem}.sq-acts.row{justify-content:space-between}
.sq-mine{background:var(--surface-2);border-radius:12px;padding:.6rem .8rem;margin-bottom:.7rem}.sq-mine small{color:var(--muted);font-weight:700}.sq-mine div{margin-top:.25rem;line-height:1.55;font-size:.92rem;font-family:var(--qfont)}
.sq-keys{display:flex;flex-direction:column;gap:.4rem}
.sq-k{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border-radius:11px;border:1px solid var(--border);border-inline-start-width:5px;cursor:pointer;line-height:1.45;font-size:.9rem;font-family:var(--qfont)}

.sq-k:has(input:checked){background:var(--teal-soft)}
.lv-c{border-inline-start-color:#2E8B57}.lv-p{border-inline-start-color:#2F6FD0}.lv-g{border-inline-start-color:#C99A2E}
.sq-leg{display:flex;flex-wrap:wrap;gap:.8rem;font-size:.82rem}.sq-leg span{display:inline-flex;align-items:center;gap:.35rem}.sq-leg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.sq-leg .lv-c i{background:#2E8B57}.sq-leg .lv-p i{background:#2F6FD0}.sq-leg .lv-g i{background:#C99A2E}
.sim-pills{display:flex;gap:.4rem;flex-wrap:wrap}
.sim-pills button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:800;cursor:pointer;color:var(--text)}
.sim-pills button.has{background:var(--teal-soft);color:var(--accent);border-color:transparent}
.sim-pills button.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.sq-head .sq-hic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--teal-soft);color:var(--accent);flex:none}
.sq-head .timer.sq-timer,.sq-head .sq-score{font-size:1.05rem}
.sq-head .sq-score{color:var(--accent)}
.sq-head.sim{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:5}

.seq-home .smart-go{text-decoration:none}
.seq-home .quick .qa{text-decoration:none;color:var(--text)}

.seq-tiles.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:599.98px){.seq-tiles.four{grid-template-columns:repeat(2,1fr)}}

.sh-edit{justify-content:center}

.sh-curve{width:100%;height:auto;display:block;direction:ltr}.sh-curve text{font-size:9px;fill:var(--muted)}
.sh-curve .grid{stroke:var(--border);stroke-width:1}.sh-curve .pass{stroke:var(--gold,#B8862A);stroke-dasharray:4 3;stroke-width:1.2}

<script>
'use strict';
/* =====================================================================
   DATA
   Several question banks; every question gets a stable key "<bankId>-<number>" (e.g. icu500-12).
   SECTIONS is a global list across banks: n = 1..N, local = number inside its bank. New banks are appended.
   ===================================================================== */
const LETTERS = ['A','B','C','D'];
let BANKS = [], QS = [], SECTIONS = [], ALL_IDS = [];
const QMAP = new Map();
function loadData(){
  // questions come from the server (cached on the device); the page only keeps the names of the original banks
  const builtIn = JSON.parse(document.getElementById('qdata').textContent).banks, cloud = banksFromRows(cachedCloudRows());
  BANKS = builtIn.map(b => { const c = cloud.find(x => x.id === b.id); return c ? Object.assign(c, {short:b.short, title:b.title}) : b; })
    .concat(cloud.filter(c => !builtIn.some(b => b.id === c.id))).filter(b => b.questions.length)
    .filter(b => !bcfg(b).hidden || lsGet('icuMcq500.isAdm') === '1'); // drafts: admins only
  for (const b of BANKS) {
    b.ids = [];
    b.sections.forEach((s, i) => { s.g = SECTIONS.length + 1; SECTIONS.push({n:s.g, bank:b.id, bankShort:b.short, local:i + 1, name:s.name, from:s.from, to:s.to, ids:[]}); });
    for (const q of b.questions) {
      q.key = b.id + '-' + q.id; q.bank = b.id; q.bankShort = b.short; q.num = q.id; q.gsec = b.sections[q.section - 1].g; q.ord = QS.length;
      QS.push(q); QMAP.set(q.key, q); SECTIONS[q.gsec - 1].ids.push(q.key); b.ids.push(q.key);
    }
  }
  ALL_IDS = QS.map(q => q.key);
  // display tweaks from the admin: names, section order, bank order (ids and numbers stay the same)
  BANKS.forEach((b, i) => {
    const c = bcfg(b); b.home = i; b.name = c.label || b.short || b.title; if (c.label) b.title = c.label;
    // one name everywhere: section tags, question labels, filters and lists all use the edited name
    SECTIONS.forEach(s => { if (s.bank === b.id) s.bankShort = b.name; }); b.questions.forEach(q => { q.bankShort = b.name; });
    if (Array.isArray(c.sec_order)) { const rank = n => { const r = c.sec_order.indexOf(n); return r < 0 ? 1000 : r; };
      SECTIONS.filter(s => s.bank === b.id).sort((x, y) => rank(x.name) - rank(y.name) || x.local - y.local).forEach((s, k) => { s.local = k + 1; }); }
  });
  BANKS.sort((a, b) => (bcfg(a).ord ?? 1000 + a.home) - (bcfg(b).ord ?? 1000 + b.home));
}
function secOrder(x, y){ return BANKS.findIndex(b => b.id === x.bank) - BANKS.findIndex(b => b.id === y.bank) || x.local - y.local; }
const Q = k => QMAP.get(k);
const secIds = n => SECTIONS[n - 1].ids.slice();
const byOrd = (a, b) => Q(a).ord - Q(b).ord;
const bankOf = id => BANKS.find(b => b.id === id);
const multi = () => BANKS.length > 1;
const ql = k => { const q = Q(k); return (multi() ? q.bankShort + ' · ' : '') + 'Q' + q.num; };
const secName = n => { const s = SECTIONS[n - 1]; return (multi() ? s.bankShort + ' · ' : '') + s.local + '. ' + s.name; };
/* active bank scope used by the dashboard, review lists, insights and study launcher */
const scopeBank = () => bankOf(st.settings.bank) || null;
const scopeIds = () => { const b = scopeBank(); return b ? b.ids : ALL_IDS; };
const scopeSections = () => { const b = scopeBank(); return (b ? SECTIONS.filter(s => s.bank === b.id) : SECTIONS.slice()).sort(secOrder); };
const inScope = k => { const b = scopeBank(); return !b || Q(k).bank === b.id; };

// large photos are scaled down to 1600 px so questions load fast on mobile data
async function imgShrink(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 400e3) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, file.type, .85));
    return out && out.size < file.size ? out : file;
  } catch (e) { return file; }
}
async function imgUpload(files){
  IMG.busy = true; imgRender(); let ok = 0, fail = [];
  for (const f of files) {
    const name = f.name.trim().replace(/\s+/g, '-');
    try {
      const {error} = await CL.sb.storage.from('qimages').upload(name, await imgShrink(f), {upsert:true, contentType:f.type, cacheControl:'3600'});
      if (error) throw error; ok++;
    } catch (e) { fail.push(name + ': ' + (e.message || e)); }
  }
  IMG.busy = false;
  if (ok) toast(tf('imgDone', {n:ok}));
  await imgList();
  if (fail.length) modal(t('imgTitle'), '<p>' + t('imgFail') + '</p><p class="small muted" dir="ltr">' + esc(fail.join('\n')) + '</p>', [{label:t('close'), cls:'primary'}]);
}

/* ---- smart start: resume the open session, otherwise today's mix (due → mistakes → new from the weakest sections) ---- */
function openSession(bankId){
  const s = st.sessions[st.lastSessionId];
  if (!s || isFinished(s) || s.mode === 'browse' || s.submitted) return null;
  if (!s.qids.some(k => s.resp[k]) && !s.idx) return null;
  if (bankId && !s.qids.every(k => validId(k) && Q(k).bank === bankId)) return null;
  return s;
}
function withScope(bankId, fn){ const prev = st.settings.bank; if (bankId) st.settings.bank = bankId; try { return fn(); } finally { st.settings.bank = prev; } }
function smartStart(bankId){
  const s = openSession(bankId); if (s) return go('#/session/' + s.id);
  const p = withScope(bankId, buildPlan), b = bankOf(bankId);
  if (!p.qids.length) return toast(t('smartEmpty'));
  startSession({mode:'today', title:b ? b.name : t('todayPlan'), qids:p.qids, sections:sectionsOf(p.qids), shuffleOpts:st.settings.shuffleOpts});
}

function startQuick(){
  const seen = new Set(), pick = [];
  for (const k of [...dueIds(), ...shuffle(wrongIds()), ...pickFresh(5)]) { if (pick.length >= 5) break; if (!seen.has(k)) { seen.add(k); pick.push(k); } }
  if (!pick.length) return toast(t('allSolved'));
  const s = createSession({mode:'quick', title:t('quick2'), qids:pick, sections:sectionsOf(pick), shuffleOpts:st.settings.shuffleOpts});
  if (location.hash.startsWith('#/quick')) location.replace('#/session/' + s.id); else go('#/session/' + s.id);
}

  BOARD.busy = true; BOARD.err = null; boardRender();
  try { const r = await CL.sb.rpc('weekly_board'); if (r.error) BOARD.err = r.error; else { BOARD.rows = r.data || []; BOARD.at = Date.now(); } } catch (e) { BOARD.err = e; }
  BOARD.busy = false; boardRender();
}

function boardRender(){
  const box = $('#board-list'); if (!box) return;
  if (BOARD.busy && !BOARD.rows) { box.innerHTML = '<p class="small muted"><span class="spinner" aria-hidden="true"></span></p>'; return; }
  if (BOARD.err) { box.innerHTML = '<p class="small muted">' + t('boardErr') + '</p>'; return; }
  const rows = (BOARD.rows || []).filter(r => r.answered > 0 || r.me);
  if (!rows.length) { box.innerHTML = '<p class="small muted">' + t('boardEmpty') + '</p>'; return; }
  const medal = i => i < 3 ? ['🥇', '🥈', '🥉'][i] : '<span class="num">' + (i + 1) + '</span>';
  box.innerHTML = '<ol class="board">' + rows.map((r, i) => '<li class="' + (r.me ? 'me' : '') + '"><span class="bd-rank">' + medal(i) + '</span><b dir="auto">' + esc(r.nick) + (r.me ? ' <span class="mem-tag">' + t('boardYou') + '</span>' : '') + '</b><span class="bd-n num">' + r.correct + ' <small>' + t('boardCorrect') + '</small></span><span class="small muted num">' + (r.answered ? Math.round(100 * r.correct / r.answered) : 0) + '%</span></li>').join('') + '</ol>';

// country codes for the WhatsApp field: [ISO, dial code, allowed national lengths (without the leading 0), Arabic name, English name]; Egypt is the default
const PW_CC = [['EG','20',[10],'مصر','Egypt'],['SA','966',[9],'السعودية','Saudi Arabia'],['AE','971',[9],'الإمارات','UAE'],['KW','965',[8],'الكويت','Kuwait'],['QA','974',[8],'قطر','Qatar'],['BH','973',[8],'البحرين','Bahrain'],['OM','968',[8],'عُمان','Oman'],
  ['JO','962',[9],'الأردن','Jordan'],['PS','970',[9],'فلسطين','Palestine'],['LB','961',[7,8],'لبنان','Lebanon'],['SY','963',[9],'سوريا','Syria'],['IQ','964',[10],'العراق','Iraq'],['YE','967',[9],'اليمن','Yemen'],['SD','249',[9],'السودان','Sudan'],
  ['LY','218',[9],'ليبيا','Libya'],['TN','216',[8],'تونس','Tunisia'],['DZ','213',[9],'الجزائر','Algeria'],['MA','212',[9],'المغرب','Morocco'],['MR','222',[8],'موريتانيا','Mauritania'],['SO','252',[8,9],'الصومال','Somalia'],
  ['TR','90',[10],'تركيا','Turkey'],['PK','92',[10],'باكستان','Pakistan'],['IN','91',[10],'الهند','India'],['GB','44',[10],'بريطانيا','United Kingdom'],['IE','353',[9],'أيرلندا','Ireland'],['DE','49',[10,11],'ألمانيا','Germany'],
  ['US','1',[10],'أمريكا / كندا','USA / Canada'],['AU','61',[9],'أستراليا','Australia']];
const ccFlag = iso => iso.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
// local number for the picked country (spaces and a leading 0 allowed); a pasted full number with + or 00 is taken as is
function ccPhone(c, v){ const raw = String(v || '').trim(); if (/^(\+|00)/.test(raw)) return waPhone(raw);
  let d = raw.replace(/\D/g, '').replace(/^0+/, ''); if (d.startsWith(c[1]) && c[2].includes(d.length - c[1].length)) d = d.slice(c[1].length);
  return c[2].includes(d.length) ? c[1] + d : null; }
// WhatsApp number with country code, digits only (00 or + prefix allowed); null when it does not look like one
function waPhone(v){ let d = String(v || '').replace(/[\s\-().]/g, ''); if (d.startsWith('+')) d = d.slice(1); else if (d.startsWith('00')) d = d.slice(2); else if (/^05\d{8}$/.test(d)) d = '966' + d.slice(1);
  return /^[1-9]\d{7,14}$/.test(d) ? d : null; }

async function admParse(file){

  let rows;
  try {
    const X = await needXLSX();
    const wb = X.read(await file.arrayBuffer(), {type:'array'});
    rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:false});
  } catch (e) { box.innerHTML = '<p class="small" style="color:var(--bad)">' + t('admBadFile') + '</p>'; return; }
  const cols = (rows[0] || []).map(normHead);
  if (cols.includes('image')) await imgList();
  const missing = ['bank', 'section', 'question', 'A', 'B', 'C', 'D', 'answer'].filter(c => !cols.includes(c));
  if (missing.length) { box.innerHTML = '<p class="small" style="color:var(--bad)">' + t('admMissingCols') + ': ' + missing.join(', ') + '</p>'; return; }

    const v = {}; cols.forEach((c, j) => { if (c) v[c] = String(r[j] == null ? '' : r[j]).trim(); });
    if (!Object.values(v).some(Boolean)) return; // blank line

    for (const c of ['bank', 'section', 'question', 'A', 'B', 'C', 'D']) if (!v[c]) err.push(t('admEmpty') + ' ' + c);
    const ans = ansMap[(v.answer || '').toUpperCase()] || ansMap[v.answer || ''];
    if (!ans) err.push(t('admBadAnswer'));

    let num = null;
    if (v.number) { num = +v.number; if (!Number.isInteger(num) || num < 1) err.push(t('admBadNum')); else if (seen.has(v.bank + '|' + num)) err.push(t('admDupNum')); else seen.add(v.bank + '|' + num); }
    if (new Set([v.A, v.B, v.C, v.D].map(x => (x || '').toLowerCase())).size < 4 && v.A && v.B && v.C && v.D) err.push(t('admDupOpt'));
    if (v.image && !/^https?:\/\//i.test(v.image) && IMG.names && !IMG.names.has(v.image)) err.push(tf('imgMissing', {f:v.image}));
    if (err.length) ADM.errors.push([line, err.join(' · ')]);

  });

  ADM.diff = {add:0, edit:0, same:0};
  ADM.rows = ADM.rows.filter(r => { const o = r.num ? ex.get(r.bank + '|' + r.num) : null; if (!o) { ADM.diff.add++; return true; } if (same(o, r)) { ADM.diff.same++; return false; } ADM.diff.edit++; return true; });

/* bedside-monitor ECG: a sweeping trace drawn on canvas at a fixed pixel scale, so it looks the same on any screen */
const ECG = {raf:0, ro:null, frac:0};
function ecgStop(){ cancelAnimationFrame(ECG.raf); ECG.raf = 0; if (ECG.ro) { ECG.ro.disconnect(); ECG.ro = null; } }
function ecgStart(){
  ecgStop();
  const cv = $('#gate canvas'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, ys, head = 0, phase = 0, base, amp, beatW, last = 0, rr = 0.84;
  // sum of gaussians for P, Q, R, S, T waves; p is the position within one beat (0–1)
  const g = (p, c, w, a) => a * Math.exp(-((p - c) ** 2) / (2 * w * w));
  const shape = p => g(p, .16, .022, .11) + g(p, .335, .007, -.10) + g(p, .36, .0085, 1) + g(p, .385, .008, -.24) + g(p, .6, .042, .21);
  function size(){
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // keep the trace clear of the header above and the text/card below it
    const cr = cv.getBoundingClientRect(), rel = el => el && el.offsetParent ? el.getBoundingClientRect() : null;
    const top = (rel($('#gate .hero-top')) || {bottom:cr.top + 60}).bottom - cr.top + 12;
    const card = rel($('#gate .gate-card')), copy = rel($('#gate .hero-copy')), foot = rel($('#gate .hero-foot'));
    let bottom = H - 12;
    for (const r of [card, copy, foot]) if (r && r.top - cr.top > top + 40 && r.left < cr.right && r.right > cr.left) bottom = Math.min(bottom, r.top - cr.top - 12);
    // R wave reaches ~1×amp above the baseline, S and T ~0.25×amp below it
    amp = Math.max(30, Math.min(130, (bottom - top) / 1.3));
    base = top + amp + Math.max(0, ((bottom - top) - amp * 1.3) / 2);
    beatW = Math.max(150, Math.min(W * (W >= 700 ? .22 : .42), 280));
    ys = new Float32Array(W).fill(NaN); head = 0; phase = 0;
    if (reduce) { for (let x = 0; x < W; x++) ys[x] = base - shape((x % beatW) / beatW) * amp; draw(); }
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    const gap = reduce ? 0 : Math.max(24, W * .03);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const [lw, col, blur] of [[5, 'rgba(52,211,153,.18)', 14], [2, '#34D399', 6]]) {
      ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.shadowColor = 'rgba(52,211,153,.7)'; ctx.shadowBlur = blur;
      ctx.beginPath(); let pen = false;
      for (let x = 0; x < W; x++) {
        const d = (x - head + W) % W, y = ys[x];
        if ((d > 0 && d < gap) || y !== y) { pen = false; continue; }
        if (pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; }
      }
      ctx.stroke();
    }
    if (!reduce && ys[head] === ys[head]) { ctx.shadowBlur = 18; ctx.shadowColor = '#A7F3D0'; ctx.fillStyle = '#ECFDF5'; ctx.beginPath(); ctx.arc(head, ys[head], 2.6, 0, 7); ctx.fill(); }
    ctx.shadowBlur = 0;
  }
  function beat(){
    rr = 0.8 + Math.random() * 0.08;
    const hr = $('#ecg-hr'), sp = $('#ecg-spo2'), box = hr && hr.parentNode;
    if (hr) hr.textContent = Math.round(60 / rr);
    if (sp && Math.random() < .25) sp.textContent = 97 + Math.round(Math.random() * 2);
    if (box) { box.classList.add('blip'); setTimeout(() => box.classList.remove('blip'), 140); }
  }
  function frame(ts){
    if (!last) last = ts;
    const dt = Math.min(ts - last, 64); last = ts;
    let n = (beatW / rr) * dt / 1000 + ECG.frac; ECG.frac = n % 1; n = Math.floor(n);
    for (let i = 0; i < n; i++) {
      head = (head + 1) % W; phase += 1 / beatW;
      if (phase >= 1) phase -= 1;
      if (phase >= .36 && phase - 1 / beatW < .36) beat();
      ys[head] = base - shape(phase) * amp;
    }
    draw(); ECG.raf = requestAnimationFrame(frame);
  }
  size();
  if ('ResizeObserver' in window) { ECG.ro = new ResizeObserver(() => { if (Math.round(cv.getBoundingClientRect().width) !== W || Math.round(cv.getBoundingClientRect().height) !== H) size(); }); ECG.ro.observe(cv); }
  if (!reduce) ECG.raf = requestAnimationFrame(frame);
}

/* =====================================================================
   PROGRESS LOGIC (stats, Leitner spaced repetition, trends, insights)
   ===================================================================== */
const LEITNER_DAYS = {1:1, 2:3, 3:7, 4:14};
function recordAnswer(id, letter, ms){
  ms = Math.min(Math.max(ms || 0, 0), 600000);
  const ok = letter === Q(id).answer, now = Date.now();
  const a = st.answers[id] || {attempts:0, correctCount:0, timeMs:0};
  a.attempts++; if (ok) a.correctCount++; a.last = letter; a.correct = ok; a.lastAt = now; a.timeMs += ms; a.guessed = false; a.again = false;
  st.answers[id] = a;
  const d = st.daily[dayKey()] || (st.daily[dayKey()] = {attempted:0, correct:0, timeMs:0});
  d.attempted++; if (ok) d.correct++; d.timeMs += ms;
  st.log.push([now, id, ok ? 1 : 0]); if (st.log.length > 10000) st.log.splice(0, st.log.length - 10000);
  // Leitner: wrong → box 1; correct moves a tracked card up one box (box 5 = mastered)
  const l = st.leitner[id];
  if (!ok) st.leitner[id] = {box:1, due:startOfDay(now) + LEITNER_DAYS[1] * DAY};
  else if (l) { l.box = Math.min(l.box + 1, 5); l.due = l.box < 5 ? startOfDay(now) + LEITNER_DAYS[l.box] * DAY : null; }
  save();
}
/* a correct answer the user says was a guess goes back to box 1 so it returns tomorrow */
function markGuess(id){
  if (st.answers[id]) st.answers[id].guessed = true;
  st.leitner[id] = {box:1, due:startOfDay(Date.now()) + DAY};
  save();
}
/* a question answered correctly (and not marked as a guess) is "solved": it leaves every practice list */
const isSolved = k => { const a = st.answers[k]; return !!(a && a.correct && !a.guessed && !a.again); };
const isFresh = k => { const a = st.answers[k]; return !a || !!a.again; };
const unsolved = ids => ids.filter(k => !isSolved(k));
const solvedN = ids => ids.reduce((n, k) => n + (isSolved(k) ? 1 : 0), 0);
/* exam pool: 'open' = never answered first, then mistakes (oldest first); 'wrong' = mistakes only */
function examPool(ids, mode){
  const lastAt = k => (st.answers[k] || {}).lastAt || 0;
  const wr = ids.filter(k => !isFresh(k) && !isSolved(k)).sort((a, b) => lastAt(a) - lastAt(b));
  return mode === 'wrong' ? wr : [...spread(ids.filter(isFresh)), ...wr];
}
/* "mixed" mode: with no bank chosen, new questions come from many banks and sections,
   at most 3 per section, least-covered and weakest sections first */
const mixOn = () => st.settings.mixFresh !== false && !scopeBank();
function spread(ids){
  const by = new Map(); for (const k of ids) { const g = Q(k).gsec; if (!by.has(g)) by.set(g, []); by.get(g).push(k); }
  const groups = shuffle([...by.values()].map(shuffle)), out = [];
  for (let i = 0; groups.some(g => i < g.length); i++) for (const g of groups) if (i < g.length) out.push(g[i]);
  return out;
}
function pickFresh(size, secs){
  secs = secs || scopeSections();
  if (!mixOn()) { const out = []; const order = secs.map(s => ({s, x:statsFor(s.ids)})).sort((a, b) => (a.x.att >= 5 ? a.x.acc : 1000 + a.s.n) - (b.x.att >= 5 ? b.x.acc : 1000 + b.s.n));
    for (const r of order) { for (const k of r.s.ids) { if (out.length >= size) break; if (isFresh(k)) out.push(k); } } return out; }
  const rows = secs.map(s => { const fr = s.ids.filter(isFresh), x = statsFor(s.ids); return {fr:shuffle(fr), w:solvedN(s.ids) / (s.ids.length || 1) + (x.att >= 5 ? x.acc / 200 : 0) + Math.random() * .25}; }).filter(r => r.fr.length).sort((a, b) => a.w - b.w);
  const out = [], per = size <= 10 ? 1 : 3;
  for (let round = 0; out.length < size && rows.some(r => r.fr.length > round * per); round++)
    for (const r of rows) { const part = r.fr.slice(round * per, round * per + per); for (const k of part) { if (out.length >= size) break; out.push(k); } if (out.length >= size) break; }
  return out;
}
const mixInfo = ids => { const b = new Set(ids.map(k => Q(k).bank)).size, sc = new Set(ids.map(k => Q(k).gsec)).size; return tf('mixInfo', {b, s:sc}); };
function redoSection(n){
  const ids = secIds(n).filter(isSolved); if (!ids.length) return;
  modal(t('secRedo'), '<p>' + tf('secRedoQ', {n:ids.length}) + '</p>', [{label:t('cancel')}, {label:t('secRedo'), cls:'primary', fn:() => { ids.forEach(k => { st.answers[k].again = true; }); save(); refresh(); toast(t('memDone')); }}]);
}
function dueIds(){ const end = startOfDay(Date.now()) + DAY; return Object.keys(st.leitner).filter(k => inScope(k) && st.leitner[k].box < 5 && st.leitner[k].due < end && !isSolved(k)).sort(byOrd); }
const wrongIds = () => Object.keys(st.answers).filter(k => inScope(k) && !st.answers[k].correct && !st.answers[k].again).sort(byOrd);
const flaggedIds = () => Object.keys(st.flags).filter(inScope).sort(byOrd);
function statsFor(ids){
  let att = 0, cor = 0, time = 0, tn = 0;
  for (const id of ids) { const a = st.answers[id]; if (a) { att++; if (a.correct) cor++; if (a.timeMs) { time += a.timeMs; tn += a.attempts; } } }
  return {total:ids.length, att, cor, acc:att ? pct(cor, att) : 0, avgMs:tn ? time / tn : 0};
}
/* accuracy of attempts in the last 7 days vs. all earlier attempts (needs ≥5 of each) */
function trendFor(ids){
  const set = new Set(ids), wk = Date.now() - 7 * DAY, r = [0, 0], p = [0, 0];
  for (const e of st.log) { if (!set.has(e[1])) continue; const b = e[0] >= wk ? r : p; b[0]++; b[1] += e[2]; }
  return r[0] >= 5 && p[0] >= 5 ? {prev:pct(p[1], p[0]), now:pct(r[1], r[0])} : null;
}
function trendHTML(tr){
  if (!tr) return '<span class="trend flat" title="' + t('trend') + '">—</span>';
  const d = tr.now - tr.prev, k = d >= 3 ? 'up' : d <= -3 ? 'down' : 'flat';
  return '<span class="trend ' + k + '" title="' + t('trend') + ': ' + tr.prev + '% → ' + tr.now + '%">' + ic(k, 'xs') + (d > 0 ? '+' : '') + d + '%</span>';
}
function streak(){
  let n = 0; const d = new Date();
  if (!(st.daily[dayKey(d)] || {}).attempted) d.setDate(d.getDate() - 1);
  while ((st.daily[dayKey(d)] || {}).attempted) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const totalStudyMs = () => Object.values(st.daily).reduce((s, d) => s + d.timeMs, 0);
function qStatus(id){ const a = st.answers[id]; return !a ? 'none' : a.correct ? 'ok' : 'bad'; }
/* today's plan: due reviews first, then other mistakes, then new questions from the weakest section */
function buildPlan(){
  const goal = st.settings.dailyGoal, done = (st.daily[dayKey()] || {}).attempted || 0;
  const size = goal > done ? goal - done : 10;
  const due = dueIds(), dueSet = new Set(due);
  const freshAll = pickFresh(size);
  /* review takes at most half of the plan while there are new questions left */
  const cap = freshAll.length ? Math.max(Math.ceil(size / 2), size - freshAll.length) : size;
  const picked = due.slice(0, cap);
  const wrong = wrongIds().filter(k => !dueSet.has(k)).slice(0, Math.max(0, cap - picked.length));
  const fresh = freshAll.slice(0, size - picked.length - wrong.length);
  return {goal, done, size, due:picked, wrong, fresh, qids:[...picked, ...shuffle(wrong), ...fresh]};
}
function insights(){
  const ids = scopeIds(), o = statsFor(ids), out = [];
  if (!o.att) return [{icon:'bulb', text:t('insStart'), act:'<button class="btn sm primary" data-act="start-today">' + ic('play', 'flip') + t('startToday') + '</button>'}];
  const rows = scopeSections().map(s => ({s, x:statsFor(s.ids), tr:trendFor(s.ids)}));
  const weak = rows.filter(r => r.x.att >= 5).sort((a, b) => a.x.acc - b.x.acc)[0];
  if (weak && weak.x.acc < 75) out.push({icon:'target', tone:'weak', text:tf('insWeak', {s:'<b>' + esc(weak.s.name) + '</b>', a:weak.x.acc}), act:'<button class="btn sm" data-act="weak" data-sec="' + weak.s.n + '">' + t('practiseNow') + '</button>'});
  const drop = rows.filter(r => r.tr && r.tr.now - r.tr.prev <= -10).sort((a, b) => (a.tr.now - a.tr.prev) - (b.tr.now - b.tr.prev))[0];
  if (drop) out.push({icon:'down', tone:'weak', text:tf('insDrop', {s:'<b>' + esc(drop.s.name) + '</b>', a:drop.tr.prev, b:drop.tr.now}), act:'<button class="btn sm" data-act="weak" data-sec="' + drop.s.n + '">' + t('practiseNow') + '</button>'});
  const up = rows.filter(r => r.tr && r.tr.now - r.tr.prev >= 10).sort((a, b) => (b.tr.now - b.tr.prev) - (a.tr.now - a.tr.prev))[0];
  if (up) out.push({icon:'up', tone:'good', text:tf('insUp', {s:'<b>' + esc(up.s.name) + '</b>', a:up.tr.prev, b:up.tr.now})});

  const weak = rows.filter(r => r.x.att >= 5).sort((a, b) => a.x.acc - b.x.acc);
  let pool = [];

  if (!pool.length) pool = wrongIds(); if (!pool.length) pool = unsolved(scopeIds()); if (!pool.length) pool = scopeIds().slice();
  let h = 0; for (const c of today) h = (h * 31 + c.charCodeAt(0)) >>> 0;

  return st.qotd.id;
}

}
