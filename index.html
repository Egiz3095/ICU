{"id":459,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Which is a cause of normal anion gap metabolic acidosis?","options":{"A":"Uraemia","B":"Diarrhoea","C":"Lactic acidosis","D":"Ketoacidosis"},"answer":"B","explanation":"Normal anion gap (hyperchloraemic) metabolic acidosis results from bicarbonate loss or chloride gain: diarrhoea, intestinal fistulas or ureteric diversions, renal tubular acidosis, large-volume saline and carbonic anhydrase inhibitors. Lactic acidosis, ketoacidosis, uraemia and toxic alcohols raise the anion gap.","distractor":"Lactate raises AG."},
{"id":460,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient has NAGMA with urine anion gap positive. What does it suggest?","options":{"A":"Renal tubular acidosis","B":"Saline infusion","C":"Vomiting","D":"Diarrhoea"},"answer":"A","explanation":"Urine anion gap = (Na + K) − Cl, a surrogate for urinary ammonium. In NAGMA, a negative UAG means the kidney is excreting NH4+ appropriately (GI losses such as diarrhoea). A positive UAG means impaired NH4+ excretion, as in distal RTA or renal failure.","distractor":"Diarrhoea gives negative UAG."},
{"id":461,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient has osmolar gap 30 mOsm/kg and HAGMA. What does this suggest?","options":{"A":"DKA only","B":"Toxic alcohol ingestion","C":"Renal failure only","D":"Lactic acidosis"},"answer":"B","explanation":"Osmolar gap = measured minus calculated osmolality, normally below about 10 mOsm/kg. A high-anion-gap acidosis with a gap above 20 strongly suggests methanol or ethylene glycol, whose unmeasured parent alcohols raise osmolality. Treat with fomepizole and haemodialysis. DKA, lactic acidosis and renal failure raise it only slightly.","distractor":"Lactate does not raise osmolar gap greatly."},
{"id":462,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Calculated osmolality: Na 140, glucose 180 mg/dL, BUN 28 mg/dL. What is it?","options":{"A":"About 310 mOsm/kg","B":"About 280 mOsm/kg","C":"About 300 mOsm/kg","D":"About 290 mOsm/kg"},"answer":"C","explanation":"Calculated osmolality = 2 × Na + glucose (mg/dL)/18 + BUN (mg/dL)/2.8 = 280 + 10 + 10 = 300 mOsm/kg. In mmol/L units it is 2 × Na + glucose + urea. Comparing it with measured osmolality gives the osmolar gap.","distractor":"Omitting glucose gives 290."},
{"id":463,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A DKA patient has glucose 600 mg/dL and Na 128 mmol/L. What is corrected sodium?","options":{"A":"128 mmol/L","B":"145 mmol/L","C":"120 mmol/L","D":"About 136–137 mmol/L"},"answer":"D","explanation":"Add 1.6–2.4 per 100 mg/dL glucose above 100 → 128 + 8 to 12.","distractor":"Uncorrected sodium underestimates."},
{"id":464,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Which ABG artefact occurs with air bubbles in the sample?","options":{"A":"PaO2 tends toward 150 and PaCO2 falls","B":"PaCO2 rises","C":"PaO2 rises towards 600 mmHg and PaCO2 is unchanged","D":"pH falls"},"answer":"A","explanation":"An air bubble equilibrates with room air (PO2 about 150 mmHg, PCO2 near 0). PaO2 therefore moves towards 150 (falsely low if the true value is higher, falsely high if lower), PaCO2 falls and pH rises. Expel bubbles immediately and analyse quickly.","distractor":"PaCO2 decreases."},
{"id":465,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Delayed analysis of an ABG with very high leukocytes causes what?","options":{"A":"Falsely high pH","B":"Falsely high PaO2","C":"Falsely low PaO2","D":"No change"},"answer":"C","explanation":"In marked leucocytosis or thrombocytosis, metabolically active cells keep consuming oxygen in the syringe ('leukocyte larceny'). The measured PaO2 is falsely low while pulse oximetry is normal. Analyse immediately on ice, and trust SpO2 when the two disagree.","distractor":"PaO2 is underestimated."},
{"id":466,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows PR interval 260 ms with every P conducted. What is this?","options":{"A":"First-degree AV block","B":"Complete heart block","C":"Mobitz II","D":"Mobitz I"},"answer":"A","explanation":"First-degree AV block is a PR interval above 200 ms with every P wave followed by a QRS. It reflects slowed AV nodal conduction from vagal tone, drugs (beta-blockers, calcium-channel blockers, digoxin) or ischaemia, and is usually benign. Monitor if the PR is very long or the QRS is wide.","distractor":"Mobitz I shows progressive prolongation."},
{"id":467,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows progressive PR prolongation then a dropped QRS. What is this?","options":{"A":"Third-degree block","B":"Mobitz I (Wenckebach)","C":"Mobitz II","D":"First-degree block"},"answer":"B","explanation":"Mobitz I (Wenckebach) shows progressive PR lengthening until a P wave is not conducted, and the PR after the pause is the shortest. The block is usually in the AV node, often from vagal tone, inferior MI or drugs. It is generally benign and responds to atropine. Mobitz II has a constant PR.","distractor":"Mobitz II has constant PR."},
{"id":468,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows constant PR with intermittent non-conducted P waves and wide QRS. What is this?","options":{"A":"First-degree block","B":"Mobitz I","C":"Sinus arrest","D":"Mobitz II"},"answer":"D","explanation":"Mobitz II has a constant PR interval with sudden non-conducted P waves. It usually comes from block below the AV node (His–Purkinje) and is often associated with a wide QRS. It can progress suddenly to complete heart block with a slow, unreliable escape rhythm, so permanent pacing is indicated (temporary pacing if unstable).","distractor":"Mobitz I shows progressive PR."},
{"id":469,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"2:1 AV block with narrow QRS improves with atropine. What is the likely level?","options":{"A":"AV nodal","B":"Bundle branch","C":"His-Purkinje","D":"Infranodal"},"answer":"A","explanation":"In 2:1 block, Mobitz I and II cannot be distinguished on the ECG. A narrow QRS and improvement with atropine or exercise (faster AV nodal conduction) suggest an AV nodal block. Infranodal block gets worse with atropine because a faster atrial rate meets a fixed His–Purkinje refractory period, while carotid massage may improve it.","distractor":"Infranodal blocks worsen with atropine."},
{"id":470,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows P waves and QRS complexes independent with QRS rate 35. What is this?","options":{"A":"Sinus bradycardia","B":"Junctional rhythm","C":"Mobitz II","D":"Complete heart block"},"answer":"D","explanation":"Complete heart block shows AV dissociation: P waves and QRS complexes march independently, and the atrial rate is faster than the ventricular rate. A ventricular escape at 35/min with wide QRS suggests an infranodal block that needs pacing. Junctional rhythm has absent or retrograde P waves.","distractor":"Junctional rhythm lacks independent P waves."},
{"id":471,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Inferior MI with complete heart block and narrow escape. What is the prognosis?","options":{"A":"Always fatal","B":"Permanent, needing a permanent pacemaker","C":"Usually transient, AV nodal ischaemia","D":"Indicates LAD occlusion"},"answer":"C","explanation":"In inferior MI, the RCA usually supplies the AV node, so complete heart block reflects nodal ischaemia and increased vagal tone. It usually has a narrow junctional escape at 40–60/min, responds to atropine and often resolves within days, rarely needing permanent pacing. Block in anterior MI is infranodal with a worse prognosis.","distractor":"Anterior MI blocks are infranodal."},
{"id":472,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Anterior MI with new bifascicular block and Mobitz II. What is the management?","options":{"A":"Discharge","B":"Temporary pacing","C":"Observation","D":"Atropine only"},"answer":"B","explanation":"In anterior MI, new bifascicular block with Mobitz II means extensive septal infarction involving the conduction system below the AV node. The risk of sudden complete heart block with an unreliable escape is high, so temporary transvenous pacing is indicated. Atropine does not help infranodal block and can worsen it.","distractor":"Atropine ineffective."},
{"id":473,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A bradycardic hypotensive patient does not respond to atropine. What is next?","options":{"A":"Verapamil","B":"Transcutaneous pacing or adrenaline/dopamine infusion","C":"Adenosine 6 mg rapid IV push, then 12 mg if no response","D":"Amiodarone 300 mg IV over 20 minutes"},"answer":"B","explanation":"For bradycardia with shock not responding to atropine, use transcutaneous pacing or a chronotropic infusion (adrenaline 2–10 µg/min, dopamine, or isoprenaline), and arrange transvenous pacing if needed (ERC 2021, AHA 2020). Adenosine is for SVT, and amiodarone and verapamil worsen bradycardia.","distractor":"Amiodarone worsens bradycardia."},
{"id":474,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"What is the atropine dose for symptomatic bradycardia?","options":{"A":"0.5 mg IM","B":"5 mg IV","C":"1 mg IV, repeat every 3–5 min to max 3 mg","D":"0.5 mg IV once, with no repeat dosing"},"answer":"C","explanation":"AHA 2020 recommends atropine 1 mg IV, repeated every 3–5 minutes up to 3 mg (ERC uses 500 µg doses up to 3 mg). Doses below 0.5 mg can cause paradoxical bradycardia. Atropine is often ineffective in heart transplant patients and in infranodal block.","distractor":"Doses \u003c0.5 mg may cause paradoxical bradycardia."},
{"id":475,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"During transcutaneous pacing, how is mechanical capture confirmed?","options":{"A":"Electrical capture only","B":"Pacing spikes visible on the monitor","C":"Patient twitching","D":"Palpable femoral pulse at paced rate"},"answer":"D","explanation":"Electrical capture (a wide QRS after each spike) does not guarantee mechanical capture. Confirm by palpating a femoral pulse at the paced rate, or by arterial line or echo. The carotid pulse is unreliable because pacing causes chest and neck muscle twitching that can be mistaken for a pulse.","distractor":"Electrical capture may not mean mechanical capture."},
{"id":476,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A temporary transvenous pacemaker fails to capture. What is the first step?","options":{"A":"Increase output and check connections","B":"Give adenosine","C":"Decrease output and increase sensitivity","D":"Turn off pacemaker"},"answer":"A","explanation":"Failure to capture means pacing spikes without a QRS. First increase the output (mA) and check all connections and the battery. Then check lead position (CXR or ECG), electrolytes, acidosis, ischaemia and drugs that raise the threshold. Reducing output makes it worse.","distractor":"Decreasing output worsens failure."},
{"id":477,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Pacing spikes without QRS following. What is this?","options":{"A":"Failure to sense","B":"Failure to capture","C":"Normal pacing","D":"Oversensing"},"answer":"B","explanation":"Failure to capture: pacing spikes appear but no depolarisation follows. Causes are lead dislodgement or fracture, a rising threshold (fibrosis, ischaemia, hyperkalaemia, acidosis, antiarrhythmics) and low output or battery. Increase output and reposition the lead.","distractor":"Failure to sense shows spikes inappropriately."},
{"id":478,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Pacing spikes on T waves despite intrinsic beats. What is this?","options":{"A":"Normal pacing","B":"Failure to capture","C":"Undersensing (failure to sense)","D":"Oversensing of T waves by the device"},"answer":"C","explanation":"Undersensing means the pacemaker does not detect intrinsic beats and fires on top of them, for example on the T wave. This risks R-on-T ventricular arrhythmia. Increase sensitivity (lower the mV value) and check lead position. Oversensing causes inappropriate inhibition and pauses.","distractor":"Oversensing causes pauses."},
{"id":479,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A pacemaker patient has pauses during arm movement. What is this?","options":{"A":"Oversensing of myopotentials","B":"Battery depletion only","C":"Failure to capture","D":"Undersensing"},"answer":"A","explanation":"Oversensing happens when the pacemaker detects non-cardiac signals (pectoral muscle myopotentials, electromagnetic interference) or T waves as R waves and inhibits pacing, causing pauses. Arm movement causing pauses is typical of myopotential oversensing. Reduce sensitivity or reprogramme to bipolar sensing.","distractor":"Undersensing causes extra spikes."},
{"id":480,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"What does placing a magnet on a pacemaker do?","options":{"A":"Increases rate to 150","B":"Turns off pacing completely","C":"Activates defibrillator","D":"Switches to asynchronous pacing"},"answer":"D","explanation":"Placing a magnet on most pacemakers turns off sensing and switches to asynchronous pacing (VOO or DOO) at a fixed magnet rate. This prevents inhibition from diathermy. Removing the magnet restores the programmed mode. The response varies by manufacturer.","distractor":"It does not turn pacing off."},
{"id":481,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"What does placing a magnet on an ICD do?","options":{"A":"Delivers a shock","B":"Turns off pacing","C":"Suspends tachyarrhythmia therapy without affecting pacing","D":"Switches to asynchronous pacing and disables shocks"},"answer":"C","explanation":"A magnet on an ICD suspends anti-tachycardia therapies (shocks and ATP) while it stays in place, but does not change bradycardia pacing. For pacing-dependent patients during diathermy, the device must be reprogrammed to asynchronous mode. Use external defibrillation pads while therapies are suspended.","distractor":"ICD magnet does not change pacing."},
{"id":482,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"What does VVI mean?","options":{"A":"Ventricle paced only, no sensing","B":"Dual chamber pacing","C":"Ventricular paced, dual-chamber sensed, inhibited","D":"Ventricular paced, ventricular sensed, inhibited response"},"answer":"D","explanation":"NBG code: position 1 is the chamber paced, 2 the chamber sensed, 3 the response to sensing, and 4 rate modulation. VVI means ventricle paced, ventricle sensed and pacing inhibited by an intrinsic beat. DDD paces and senses both chambers, and VOO paces the ventricle without sensing.","distractor":"Dual-chamber is DDD."},
{"id":483,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows broad QRS tachycardia with AV dissociation and fusion beats. What is the diagnosis?","options":{"A":"Ventricular tachycardia","B":"Sinus tachycardia","C":"SVT with aberrancy","D":"Atrial flutter"},"answer":"A","explanation":"AV dissociation, capture beats and fusion beats are specific for VT, as the ventricles beat independently of the atria. Other supporting features are very wide QRS (above 160 ms), extreme axis, concordance and the Brugada or Vereckei criteria. In structural heart disease, treat broad-complex tachycardia as VT until proven otherwise.","distractor":"SVT does not show AV dissociation."},
{"id":484,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A stable patient has regular narrow QRS tachycardia at 180. What is the first step?","options":{"A":"Amiodarone","B":"Vagal manoeuvres","C":"Synchronised cardioversion","D":"Verapamil first"},"answer":"B","explanation":"For a stable regular narrow-complex tachycardia, first try vagal manoeuvres; the modified Valsalva with leg raise (REVERT trial) works in about 43%. If unsuccessful, give adenosine 6 mg, then 12 mg, as a rapid IV push. Synchronised cardioversion is for haemodynamic instability.","distractor":"Cardioversion is for instability."},
{"id":485,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient with WPW has irregular broad complex tachycardia. Which drug is contraindicated?","options":{"A":"Ibutilide","B":"Verapamil","C":"Procainamide","D":"Synchronised cardioversion"},"answer":"B","explanation":"Pre-excited AF in WPW gives an irregular broad-complex tachycardia. AV nodal blockers (verapamil, diltiazem, beta-blockers, digoxin, adenosine) favour conduction down the accessory pathway and can precipitate VF. Use procainamide or ibutilide if stable, and synchronised cardioversion if unstable.","distractor":"Procainamide is appropriate."},
{"id":486,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows QTc 560 ms with torsades. What is treatment?","options":{"A":"IV magnesium","B":"Sotalol","C":"Amiodarone","D":"Procainamide"},"answer":"A","explanation":"Torsades with prolonged QT: give IV magnesium sulphate 2 g, even if magnesium is normal. Correct potassium and stop QT-prolonging drugs. If it recurs, use overdrive pacing or isoprenaline to raise the heart rate and shorten the QT. Defibrillate if pulseless. Amiodarone and sotalol prolong the QT.","distractor":"Amiodarone prolongs QT."},
{"id":487,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows peaked T waves, wide QRS and loss of P waves. What is the cause?","options":{"A":"Hypomagnesaemia","B":"Hypokalaemia","C":"Hyperkalaemia","D":"Hypercalcaemia"},"answer":"C","explanation":"Hyperkalaemia ECG progression: peaked T waves, then PR prolongation and loss of P waves, then QRS widening, then sine wave, VF or asystole. The ECG does not reliably track the potassium level. Wide QRS or loss of P waves needs immediate IV calcium. Hypokalaemia shows U waves.","distractor":"Hypokalaemia shows U waves."},
{"id":488,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows U waves and ST depression. What is the cause?","options":{"A":"Hyperkalaemia","B":"Hypothermia","C":"Hypercalcaemia","D":"Hypokalaemia"},"answer":"D","explanation":"Hypokalaemia causes ST depression, T-wave flattening, prominent U waves and an apparently long QT (really a QU interval), and predisposes to arrhythmias, especially with digoxin. Hyperkalaemia shows peaked T waves, and hypothermia shows J waves.","distractor":"Hyperkalaemia shows peaked T."},
{"id":489,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows short QT. What is the cause?","options":{"A":"Hypercalcaemia","B":"Hypocalcaemia","C":"Hypokalaemia","D":"Hypomagnesaemia"},"answer":"A","explanation":"Hypercalcaemia shortens the ST segment and therefore the QT interval, and very high levels may cause Osborn-like J waves. Other causes of a short QT are digoxin and congenital short-QT syndrome. Hypocalcaemia, hypokalaemia and hypomagnesaemia prolong the QT.","distractor":"Hypocalcaemia lengthens QT."},
{"id":490,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows J (Osborn) waves. What is the cause?","options":{"A":"Pericarditis","B":"Hyperkalaemia","C":"PE","D":"Hypothermia"},"answer":"D","explanation":"Osborn (J) waves are positive deflections at the junction of the QRS and ST segment, seen in hypothermia, typically below about 32°C. They grow as temperature falls, with bradycardia, a long QT and a risk of VF. Other causes are hypercalcaemia and brain injury.","distractor":"Hyperkalaemia gives peaked T."},
{"id":491,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows S1Q3T3, sinus tachycardia and RBBB. What is suggested?","options":{"A":"Inferior MI","B":"Pericarditis","C":"Pulmonary embolism","D":"Hyperkalaemia"},"answer":"C","explanation":"PE causes ECG changes through acute right ventricular strain: sinus tachycardia (the commonest), RBBB, right axis deviation, T inversion in V1–V4 and S1Q3T3. These are insensitive and non-specific, but ECG signs of RV strain carry a worse prognosis. Inferior MI shows ST elevation in II, III and aVF with reciprocal changes.","distractor":"Inferior MI shows ST elevation in II, III, aVF."},
{"id":492,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows diffuse concave ST elevation and PR depression. What is the diagnosis?","options":{"A":"Early repolarisation","B":"Acute pericarditis","C":"STEMI","D":"Brugada syndrome"},"answer":"B","explanation":"Acute pericarditis shows widespread concave ST elevation and PR depression, with PR elevation and ST depression in aVR and no reciprocal changes or Q waves. STEMI is territorial with reciprocal depression. Early repolarisation is usually limited to the precordial leads and lacks PR depression.","distractor":"STEMI is territorial with reciprocal changes."},
{"id":493,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows low voltage and electrical alternans. What is suspected?","options":{"A":"Pericardial tamponade","B":"Pneumothorax","C":"Hyperkalaemia","D":"Hypothermia"},"answer":"A","explanation":"A large pericardial effusion causes low QRS voltage, and the heart swinging in the fluid causes electrical alternans (beat-to-beat variation in QRS amplitude). With sinus tachycardia, this suggests tamponade. Confirm with echocardiography and drain urgently if there is haemodynamic compromise.","distractor":"Hyperkalaemia gives peaked T."},
{"id":494,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows coved ST elevation in V1–V2 with fever. What is the diagnosis?","options":{"A":"Anterior STEMI needing reperfusion","B":"Pericarditis","C":"RBBB only","D":"Brugada pattern unmasked by fever"},"answer":"D","explanation":"Fever can unmask a type 1 Brugada pattern (coved ST elevation of 2 mm or more with T inversion in V1–V2) by worsening sodium channel dysfunction, which increases the risk of VF. Treat fever aggressively with antipyretics, avoid sodium channel blockers, and monitor. Recurrent VF responds to isoprenaline or quinidine.","distractor":"STEMI has territorial changes."},
{"id":495,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows deep symmetrical T inversion in V2–V3 with history of chest pain. What does it suggest?","options":{"A":"Normal variant T inversion in young adults","B":"Hyperkalaemia","C":"Wellens syndrome (critical LAD stenosis)","D":"Pericarditis"},"answer":"C","explanation":"Wellens syndrome means deep symmetrical (type B) or biphasic (type A) T-wave inversion in V2–V3, recorded pain-free after an episode of chest pain. It indicates critical proximal LAD stenosis. Arrange early angiography. Stress testing is contraindicated because it can trigger extensive anterior MI.","distractor":"Stress testing is contraindicated."},
{"id":496,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"ECG shows ST elevation in aVR with diffuse ST depression. What does it suggest?","options":{"A":"Acute pericarditis with diffuse changes","B":"Left main or three-vessel disease","C":"Hyperkalaemia","D":"Normal variant"},"answer":"B","explanation":"ST elevation in aVR with diffuse ST depression in six or more leads indicates diffuse subendocardial ischaemia, usually from left main or three-vessel disease. It can also occur with severe demand ischaemia (shock, tachycardia). Urgent angiography is needed. Pericarditis shows PR elevation and ST depression in aVR.","distractor":"Pericarditis shows aVR depression."},
{"id":497,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"In AHA guidance for VF/pulseless VT, when is adrenaline first given?","options":{"A":"Before the first shock, as soon as access is obtained","B":"Adrenaline 1 mg after the second shock","C":"Only after the fifth shock","D":"Never in shockable rhythms"},"answer":"B","explanation":"AHA gives adrenaline after the 2nd shock (ERC after the 3rd); amiodarone 300 mg after the 3rd shock.","distractor":"Defibrillation must not be delayed for drugs."},
{"id":498,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Which ECG finding indicates digoxin effect?","options":{"A":"Prominent U waves with QT prolongation","B":"Peaked T waves","C":"Osborn waves","D":"Scooped (reverse tick) ST depression"},"answer":"D","explanation":"Digoxin effect (therapeutic levels) causes scooped, reverse-tick ST depression, a short QT and T-wave flattening. Digoxin toxicity causes frequent ventricular ectopy, bidirectional VT, atrial tachycardia with block, and high-grade AV block. Prominent U waves indicate hypokalaemia.","distractor":"U waves indicate hypokalaemia."},
{"id":499,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"Bidirectional VT occurs in digoxin toxicity. What is treatment?","options":{"A":"Digoxin-specific antibody fragments","B":"Calcium","C":"Amiodarone","D":"Immediate DC cardioversion as first-line"},"answer":"A","explanation":"Life-threatening digoxin toxicity (ventricular arrhythmias, high-grade block, K above 5–6 mmol/L) is treated with digoxin-specific Fab fragments. Correct hypokalaemia and hypomagnesaemia. DC cardioversion carries a risk of refractory VF, so use the lowest energy if it is unavoidable. Calcium was historically avoided, although recent data suggest it may not be harmful.","distractor":"Calcium was historically cautioned."},
{"id":500,"section":9,"sectionName":"ABG, ECG, Heart Block and Pacing","stem":"A patient with new AF and rapid rate is unstable. What is first?","options":{"A":"Anticoagulation first","B":"Amiodarone","C":"Synchronised cardioversion","D":"Digoxin"},"answer":"C","explanation":"AF with a rapid rate and haemodynamic instability (shock, ischaemia, acute heart failure, syncope) needs immediate synchronised DC cardioversion, starting at about 120–200 J biphasic. Start heparin without delaying cardioversion. In stable patients, rate control (beta-blocker, amiodarone, digoxin) or pharmacological rhythm control is used.","distractor":"Drugs are for stable patients."}
]},
{"id":"cardio50","short":"Cardio 50","title":"Critical Care Cardiology — 50 MCQs","sections":[{"name":"Acute Coronary Syndromes","from":1,"to":8},{"name":"Arrhythmias and Conduction","from":9,"to":16},{"name":"Heart Failure, Cardiogenic Shock and MCS","from":17,"to":25},{"name":"Haemodynamics and Echocardiography","from":26,"to":32},{"name":"Valvular, Pericardial and Endocarditis","from":33,"to":39},{"name":"Aorta, PE and Hypertensive Emergencies","from":40,"to":45},{"name":"Cardiac Arrest and Post-Cardiac Surgery","from":46,"to":50}],"questions":[
{"id":1,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"A 66-year-old man with anterior STEMI and cardiogenic shock (BP 78/50 mmHg, lactate 5.8 mmol/L) has an occluded proximal LAD and 85% stenoses in the RCA and circumflex at angiography. What is the best revascularisation strategy?","options":{"A":"Fibrinolysis first, then angiography of all vessels within 24 hours","B":"Culprit-lesion-only PCI, staging other lesions later","C":"IABP and medical therapy, deferring all PCI until shock resolves","D":"Immediate multivessel PCI of all significant lesions in one sitting"},"answer":"B","explanation":"CULPRIT-SHOCK (NEJM 2017): in AMI-related cardiogenic shock with multivessel disease, culprit-only PCI reduced 30-day death or severe renal failure needing RRT (45.9% vs 55.4%) compared with immediate multivessel PCI.","distractor":"Immediate multivessel PCI increased the composite endpoint in CULPRIT-SHOCK."},
{"id":2,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"A haemodynamically stable 58-year-old man has successful primary PCI of an occluded RCA for inferior STEMI. Angiography also shows an 80% non-culprit stenosis in the mid circumflex. What is the best plan?","options":{"A":"Culprit-only PCI, treating the circumflex only if angina recurs later","B":"Elective CABG for the circumflex lesion before hospital discharge","C":"Staged PCI of the non-culprit lesion (complete revascularisation)","D":"No further intervention, because non-culprit PCI increases mortality"},"answer":"C","explanation":"COMPLETE (NEJM 2019): in stable STEMI with multivessel disease, staged complete revascularisation reduced cardiovascular death or new MI (7.8% vs 10.5%) compared with culprit-only PCI.","distractor":"Culprit-only PCI is preferred in cardiogenic shock (CULPRIT-SHOCK), not in stable STEMI."},
{"id":3,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"A 54-year-old man presents to a rural hospital 2 hours after onset of chest pain with anterior ST elevation. The expected time from diagnosis to PCI-mediated reperfusion is 150 minutes. He has no contraindication to fibrinolysis. What is the best strategy?","options":{"A":"Wait for the troponin result before deciding on a reperfusion strategy","B":"Give fibrinolysis only if symptoms have lasted for more than 12 hours","C":"Transfer for primary PCI, because it is superior whatever the delay","D":"Fibrinolysis within 10 minutes, then angiography at 2–24 hours"},"answer":"D","explanation":"ESC 2023: if the anticipated time from STEMI diagnosis to PCI exceeds 120 minutes, give fibrinolysis (within 10 minutes of diagnosis) and transfer for routine angiography 2–24 hours later (pharmaco-invasive strategy), or rescue PCI if fibrinolysis fails.","distractor":"Primary PCI loses its advantage when the delay exceeds 120 minutes."},
{"id":4,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"A 70-year-old man with atrial fibrillation (CHA2DS2-VASc 4) undergoes PCI with a drug-eluting stent for NSTEMI. He has no other bleeding risk factors. Which antithrombotic regimen is preferred?","options":{"A":"Aspirin plus prasugrel without any oral anticoagulant","B":"Apixaban plus ticagrelor plus aspirin for 6 months","C":"Apixaban plus clopidogrel, stopping aspirin after up to 1 week","D":"Warfarin plus aspirin plus clopidogrel for a full 12 months"},"answer":"C","explanation":"AUGUSTUS (NEJM 2019): apixaban caused less bleeding than VKA, and aspirin increased bleeding without ischaemic benefit. Guidelines recommend short peri-PCI triple therapy (≤1 week), then a DOAC plus clopidogrel.","distractor":"Prolonged triple therapy markedly increases bleeding without reducing stent thrombosis."},
{"id":5,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"A patient with cardiogenic shock after anterior MI has MAP 62 mmHg and cardiac output 3.2 L/min on noradrenaline and dobutamine. What is the cardiac power output and its implication?","options":{"A":"0.62 W; adequate pump function, so begin weaning the inotrope","B":"0.44 W; within the normal range, so no change in support is needed","C":"1.98 W; normal value, so the noradrenaline dose can be reduced","D":"0.44 W; high mortality risk, so consider escalation of support"},"answer":"D","explanation":"CPO = MAP × CO / 451 = 62 × 3.2 / 451 ≈ 0.44 W. In the SHOCK registry, CPO was the strongest haemodynamic predictor of in-hospital death; a value below 0.6 W indicates high mortality risk.","distractor":"1.98 W results from dividing by 100 instead of 451."},
{"id":6,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"On day 3 after inferior STEMI, a 68-year-old woman develops sudden pulmonary oedema and hypotension. There is a soft apical systolic murmur. The PAOP tracing shows giant v waves of 45 mmHg, with no oxygen step-up between RA and PA. What is the diagnosis and best management?","options":{"A":"Papillary muscle rupture; afterload reduction, MCS and urgent surgery","B":"RV infarction; fluid loading and avoidance of nitrates","C":"Ventricular septal rupture; percutaneous closure in 4–6 weeks","D":"Free wall rupture; immediate pericardiocentesis, no surgery needed"},"answer":"A","explanation":"Acute severe MR from papillary muscle rupture (usually posteromedial, single blood supply, inferior MI) causes giant v waves and pulmonary oedema; the murmur may be soft. Treat with afterload reduction, an IABP or other MCS, and urgent surgery.","distractor":"A ventricular septal rupture produces an oxygen step-up from RA to PA, which is absent here."},
{"id":7,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"A 38-year-old woman 3 weeks postpartum has chest pain and an NSTEMI. Angiography shows spontaneous coronary artery dissection of the mid LAD with TIMI 3 flow. She is now pain-free and haemodynamically stable. What is the best management?","options":{"A":"Immediate PCI with stenting of the dissected segment","B":"Systemic fibrinolysis to dissolve the intramural haematoma quickly","C":"Conservative medical therapy, reserving PCI for ongoing ischaemia","D":"Urgent CABG to bypass the dissected LAD segment"},"answer":"C","explanation":"Most SCAD lesions heal spontaneously within weeks; PCI carries high failure rates (wire extending the dissection). Conservative management is preferred in stable patients with preserved flow; revascularisation is for ongoing ischaemia, left main involvement, or instability.","distractor":"Stenting in SCAD has high complication rates and is not needed with TIMI 3 flow."},
{"id":8,"section":1,"sectionName":"Acute Coronary Syndromes","stem":"A 62-year-old man is resuscitated from out-of-hospital VF arrest. He is comatose and haemodynamically stable, and the post-ROSC ECG shows no ST elevation. What is the best approach to coronary angiography?","options":{"A":"Immediate angiography only if troponin is above 10 times normal","B":"Delayed or selective angiography, as in COACT and TOMAHAWK","C":"No angiography during this admission because he is comatose","D":"Emergency angiography for all, as it improves 90-day survival"},"answer":"B","explanation":"COACT (NEJM 2019) and TOMAHAWK (NEJM 2021) found no survival benefit from immediate versus delayed or selective angiography in resuscitated patients without ST elevation.","distractor":"Emergency angiography did not improve survival in these trials."},
{"id":9,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A patient on IV haloperidol and levofloxacin has QT 480 ms at a heart rate of 100/min (RR 0.6 s). What is the QTc (Bazett) and the best action?","options":{"A":"About 800 ms; perform immediate unsynchronised defibrillation","B":"About 372 ms; normal QTc, so no intervention is needed","C":"About 480 ms; acceptable, so continue current medications","D":"About 620 ms; stop QT-prolonging drugs and replace Mg and K"},"answer":"D","explanation":"QTc = QT / √RR = 480 / √0.6 = 480 / 0.775 ≈ 620 ms. A QTc above 500 ms carries a high risk of torsades: stop offending drugs, keep K ≥ 4.0 mmol/L, and give magnesium.","distractor":"372 ms results from multiplying by √RR instead of dividing."},
{"id":10,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A 72-year-old woman with hypertension, type 2 diabetes and a previous TIA has new atrial fibrillation. What is her CHA2DS2-VASc score and the recommendation?","options":{"A":"4; oral anticoagulation is optional at this score","B":"6; long-term oral anticoagulation is indicated","C":"5; aspirin alone gives sufficient stroke protection","D":"6; dual antiplatelet therapy instead of anticoagulation"},"answer":"B","explanation":"Age 65–74 (1) + female (1) + hypertension (1) + diabetes (1) + prior TIA (2) = 6. Anticoagulation (preferably a DOAC) is recommended for scores ≥2 in men or ≥3 in women.","distractor":"Antiplatelet therapy is inferior to anticoagulation for stroke prevention in AF."},
{"id":11,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A patient with septic shock on noradrenaline 0.3 µg/kg/min develops new AF at 150/min with MAP 66 mmHg. K and Mg have been corrected. What is the best pharmacological approach?","options":{"A":"Amiodarone; landiolol showed no organ benefit in STRESS-L","B":"IV diltiazem bolus followed by an infusion for rate control","C":"IV metoprolol boluses to achieve a heart rate below 100/min","D":"Landiolol, shown in STRESS-L to reduce organ dysfunction"},"answer":"A","explanation":"New AF in septic shock: treat triggers (electrolytes, volume, catecholamine dose); amiodarone is generally preferred in hypotension. STRESS-L (JAMA 2023): landiolol in tachycardic septic shock did not reduce SOFA scores and was stopped early, with a signal of possible harm.","distractor":"STRESS-L did not show reduced organ dysfunction with landiolol."},
{"id":12,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A 28-year-old man has an irregular, very fast (250/min) wide-complex tachycardia with varying QRS morphology; BP is 118/72 mmHg and he is alert. A previous ECG showed a short PR interval and delta waves. What is the best treatment?","options":{"A":"IV procainamide or ibutilide; avoid AV nodal blockers","B":"IV verapamil to slow conduction through the AV node","C":"IV adenosine 6 mg to terminate the tachycardia","D":"IV digoxin loading dose for rate control"},"answer":"A","explanation":"This is pre-excited AF (WPW). AV nodal blockers can increase conduction down the accessory pathway and precipitate VF. Stable patients receive procainamide or ibutilide; unstable patients receive synchronised cardioversion.","distractor":"Verapamil, adenosine and digoxin all favour accessory-pathway conduction and risk VF."},
{"id":13,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A 76-year-old man has symptomatic complete heart block (HR 32/min, BP 76/40 mmHg, confused). He has already received atropine 1 mg three times without response. What is the best next step?","options":{"A":"Further atropine boluses up to a total of 6 mg","B":"Transcutaneous pacing or adrenaline infusion at 2–10 µg/min","C":"Amiodarone 300 mg IV to stabilise the rhythm","D":"Isoprenaline 1 mg IV bolus followed by observation"},"answer":"B","explanation":"ACLS 2020: for unstable bradycardia unresponsive to atropine (maximum total 3 mg), use transcutaneous pacing or a chronotropic infusion (adrenaline 2–10 µg/min or dopamine 5–20 µg/kg/min) as a bridge to transvenous pacing.","distractor":"Atropine beyond 3 mg adds no benefit, and it is often ineffective in infranodal block."},
{"id":14,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A patient with ischaemic cardiomyopathy and an ICD has had 6 shocks for recurrent VT in 2 hours despite amiodarone 300 mg. He is anxious and tachycardic. What is the best management?","options":{"A":"Repeated shocks only, avoiding sedation to allow assessment","B":"Procainamide plus digoxin, then deactivate the ICD permanently","C":"Deep sedation, amiodarone and a non-selective beta-blocker","D":"Isoprenaline infusion to suppress the ventricular ectopy"},"answer":"C","explanation":"Electrical storm is driven by sympathetic activation. Sedation (even intubation) reduces drive; amiodarone plus a non-selective beta-blocker (propranolol was superior to metoprolol in a randomised trial) is effective. Correct electrolytes and ischaemia, and consider catheter ablation or stellate ganglion blockade.","distractor":"Isoprenaline is used for pause-dependent torsades, not monomorphic VT storm."},
{"id":15,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A 67-year-old woman has had persistent AF for 4 days with HR 125/min and is haemodynamically stable. She is not anticoagulated. Elective cardioversion is planned. What is the best approach?","options":{"A":"Cardioversion now, with anticoagulation started afterwards only","B":"Cardioversion only after 6 months of rate control and anticoagulation","C":"Immediate cardioversion, because AF began within the last week","D":"TEE to exclude LA thrombus, then cardioversion with anticoagulation"},"answer":"D","explanation":"For AF lasting more than 48 hours (or unknown duration) without anticoagulation, either anticoagulate for 3 weeks before cardioversion or perform TEE to exclude left atrial appendage thrombus, then anticoagulate during and for at least 4 weeks after cardioversion.","distractor":"The 48-hour threshold, not one week, determines thromboembolic risk."},
{"id":16,"section":2,"sectionName":"Arrhythmias and Conduction","stem":"A heart transplant recipient develops a regular narrow-complex tachycardia at 180/min with BP 110/70 mmHg. Adenosine is chosen. What is the correct dosing?","options":{"A":"A 12 mg first dose, because denervated hearts are much less sensitive","B":"A reduced first dose (e.g. 3 mg); denervated hearts are hypersensitive","C":"The standard 6 mg dose, then 12 mg, as for any other patient","D":"Adenosine 6 mg given slowly over 2 minutes to avoid asystole"},"answer":"B","explanation":"Denervated transplanted hearts have adenosine receptor hypersensitivity, risking prolonged asystole. ACLS recommends reducing the initial dose (3 mg) in heart transplant recipients, with central venous administration, and with dipyridamole or carbamazepine use.","distractor":"Standard dosing risks prolonged asystole after transplantation."},
{"id":17,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"In AMI-related cardiogenic shock, a PA catheter shows PA systolic 30 mmHg, PA diastolic 18 mmHg and RAP 16 mmHg. What is the PAPi and its meaning?","options":{"A":"12; preserved RV function with high pulmonary pressures","B":"0.75; significant RV dysfunction, so consider RV support","C":"0.75; normal value, so no RV-directed therapy is needed","D":"1.9; normal RV function, so focus on the left ventricle"},"answer":"B","explanation":"PAPi = (PASP − PADP) / RAP = (30 − 18) / 16 = 0.75. A PAPi below 0.9 in AMI-CS predicts RV failure and the need for RV mechanical support.","distractor":"12 is the pulse pressure, not the index."},
{"id":18,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"A patient with cardiogenic shock on dobutamine 5 µg/kg/min and noradrenaline 0.15 µg/kg/min has lactate rising from 3.0 to 6.2 mmol/L over 2 hours with falling urine output. What is the SCAI stage?","options":{"A":"Stage D (deteriorating despite initial interventions)","B":"Stage E (extremis, with cardiac arrest or ongoing CPR)","C":"Stage B (beginning shock with preserved perfusion)","D":"Stage C (classic cardiogenic shock that is responding)"},"answer":"A","explanation":"SCAI stage D describes shock that fails to stabilise or worsens despite initial vasoactive therapy (escalating drugs, rising lactate). Stage E is extremis or cardiac arrest; stage C is hypoperfusion requiring intervention without deterioration.","distractor":"Stage C does not include deterioration despite treatment."},
{"id":19,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"Which statement about routine VA-ECMO in AMI-related cardiogenic shock is correct, according to ECLS-SHOCK (2023)?","options":{"A":"No mortality effect but fewer bleeding and vascular complications","B":"No 30-day mortality benefit, more bleeding and vascular complications","C":"Reduced 30-day mortality by about 10% when it was started before PCI","D":"Reduced mortality only in patients with a lactate above 8 mmol/L"},"answer":"B","explanation":"ECLS-SHOCK (NEJM 2023): early routine ECLS in AMI-CS planned for early revascularisation did not reduce 30-day mortality (47.8% vs 49.0%) and increased moderate or severe bleeding and peripheral vascular complications.","distractor":"Complications increased, not decreased, with ECLS."},
{"id":20,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"A patient with low-output cardiogenic shock needs an inotrope. The team cites DOREMI (2021) to compare milrinone with dobutamine. What did DOREMI show?","options":{"A":"Lower mortality with dobutamine in patients with renal failure","B":"Lower in-hospital mortality with milrinone than dobutamine","C":"No significant difference in the primary composite outcome","D":"More arrhythmias and higher mortality with milrinone"},"answer":"C","explanation":"DOREMI (NEJM 2021): in cardiogenic shock, milrinone versus dobutamine showed no significant difference in a composite of in-hospital death, cardiac arrest, transplant or MCS, MI, stroke, or RRT, or in individual outcomes.","distractor":"DOREMI did not show a mortality difference."},
{"id":21,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"A 70-year-old man with acute decompensated HF remains congested after 24 hours of IV furosemide 80 mg twice daily. Bicarbonate is 31 mmol/L. Which add-on therapy improved successful decongestion in a randomised trial?","options":{"A":"Tolvaptan 30 mg daily to enhance aquaresis in all patients","B":"Acetazolamide 500 mg IV daily added to the loop diuretic (ADVOR)","C":"Low-dose dopamine 2 µg/kg/min to increase renal blood flow","D":"Nesiritide infusion to improve diuresis and survival"},"answer":"B","explanation":"ADVOR (NEJM 2022): acetazolamide added to loop diuretics increased successful decongestion at 3 days (42.2% vs 30.5%) and shortened hospital stay. Low-dose dopamine (ROSE-AHF) and nesiritide (ASCEND-HF) did not improve decongestion or outcomes.","distractor":"Low-dose dopamine did not improve decongestion in ROSE-AHF."},
{"id":22,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"A patient with HFrEF admitted with acute decompensation is now stable (SBP 110 mmHg, eGFR 45). Which in-hospital initiation improved clinical benefit at 90 days in EMPULSE?","options":{"A":"Hydralazine and nitrate combination in all patients","B":"Digoxin loading followed by maintenance dosing","C":"Ivabradine started once the resting heart rate is above 70/min","D":"Empagliflozin 10 mg daily started during the hospital admission"},"answer":"D","explanation":"EMPULSE (Nat Med 2022): starting empagliflozin in hospitalised acute HF (regardless of EF or diabetes) improved a hierarchical composite of death, HF events, and symptoms at 90 days. SGLT2 inhibitors are a guideline-directed therapy for HFrEF.","distractor":"Ivabradine is outpatient therapy for selected HFrEF patients and was not tested in EMPULSE."},
{"id":23,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"Using the Fick method: VO2 250 mL/min, Hb 10 g/dL, SaO2 98%, SvO2 50%. What is the cardiac output?","options":{"A":"About 5.2 L/min","B":"About 2.6 L/min","C":"About 39 L/min","D":"About 3.9 L/min"},"answer":"D","explanation":"Arteriovenous O2 content difference = 1.34 × 10 × (0.98 − 0.50) ≈ 6.4 mL/dL = 64 mL/L. CO = VO2 / (Ca − Cv)O2 = 250 / 64 ≈ 3.9 L/min.","distractor":"39 L/min results from not converting mL/dL to mL/L."},
{"id":24,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"A patient with a continuous-flow LVAD has a low-flow alarm, frequent PVCs and dizziness after vomiting for 2 days. Echo shows a small LV cavity with the septum shifted toward the inflow cannula. What is the best management?","options":{"A":"RV failure; start milrinone and increase the pump speed","B":"Suction event; give fluid and reduce the pump speed","C":"Pump thrombosis; increase anticoagulation and add heparin","D":"Hypertension; start IV nitroglycerin to reduce afterload"},"answer":"B","explanation":"Hypovolaemia with excessive pump speed causes LV suction (small LV, septal shift toward the cannula, low flow, ventricular ectopy). Treat with fluid, reduction of pump speed, and correction of the cause.","distractor":"Pump thrombosis causes high power and haemolysis, not a small LV."},
{"id":25,"section":3,"sectionName":"Heart Failure, Cardiogenic Shock and MCS","stem":"A patient on femoral VA-ECMO develops a cold, pale ipsilateral leg with absent Doppler signals 6 hours after cannulation. What is the best management?","options":{"A":"Place a distal perfusion cannula in the superficial femoral artery","B":"Increase ECMO flow to raise systemic perfusion pressure","C":"Give a heparin bolus and observe the limb for the next 12 hours","D":"Elevate the limb and apply warming blankets, then reassess hourly"},"answer":"A","explanation":"Limb ischaemia from the arterial cannula occluding the femoral artery is common. A distal perfusion cannula (antegrade, into the SFA) restores limb perfusion; many centres place one prophylactically. Monitor with NIRS and assess for compartment syndrome.","distractor":"Increasing ECMO flow does not perfuse the limb distal to an occluding cannula."},
{"id":26,"section":4,"sectionName":"Haemodynamics and Echocardiography","stem":"Right heart catheterisation shows mean PAP 40 mmHg, PAWP 12 mmHg and cardiac output 4.0 L/min. What is the PVR and its interpretation?","options":{"A":"7 Wood units; pre-capillary pulmonary hypertension","B":"7 Wood units; post-capillary PH due to left heart disease","C":"10 Wood units; normal for a critically ill patient","D":"3 Wood units; isolated post-capillary pulmonary hypertension"},"answer":"A","explanation":"PVR = (mPAP − PAWP) / CO = (40 − 12) / 4 = 7 WU. With PAWP ≤ 15 mmHg and PVR > 2 WU (ESC 2022), this is pre-capillary PH.","distractor":"Post-capillary PH requires PAWP > 15 mmHg."},
{"id":27,"section":4,"sectionName":"Haemodynamics and Echocardiography","stem":"Echo: LVOT diameter 2.0 cm, LVOT VTI 15 cm and heart rate 100/min. What are the stroke volume and cardiac output?","options":{"A":"SV about 30 mL; CO about 3.0 L/min","B":"SV about 60 mL; CO about 6.0 L/min","C":"SV about 94 mL; CO about 9.4 L/min","D":"SV about 47 mL; CO about 4.7 L/min"},"answer":"D","explanation":"LVOT area = π × (1.0)² = 3.14 cm². SV = 3.14 × 15 = 47 mL; CO = 47 × 100 = 4.7 L/min.","distractor":"94 mL results from using the diameter instead of the radius in the area formula."},
{"id":28,"section":4,"sectionName":"Haemodynamics and Echocardiography","stem":"Echo shows a tricuspid regurgitant peak velocity of 3.5 m/s and a dilated IVC without respiratory collapse (estimated RAP 15 mmHg). What is the estimated RV systolic pressure?","options":{"A":"About 29 mmHg","B":"About 64 mmHg","C":"About 49 mmHg","D":"About 74 mmHg"},"answer":"B","explanation":"Simplified Bernoulli: ΔP = 4v² = 4 × 3.5² = 49 mmHg; RVSP = 49 + RAP 15 = 64 mmHg.","distractor":"49 mmHg omits the right atrial pressure."},
{"id":29,"section":4,"sectionName":"Haemodynamics and Echocardiography","stem":"During a passive leg raise in a ventilated patient with shock, LVOT VTI rises from 16 to 18.5 cm. What is the interpretation?","options":{"A":"About 8% rise; fluid responsive only if the CVP is also low","B":"About 16% rise; fluid responsive, so a bolus is reasonable","C":"About 16% rise; not fluid responsive, as 25% is required","D":"About 2.5% rise; not fluid responsive, so avoid fluid"},"answer":"B","explanation":"Change = (18.5 − 16) / 16 = 15.6%. A rise in VTI or stroke volume of ≥10–15% with PLR predicts fluid responsiveness; it should be balanced against fluid tolerance.","distractor":"The threshold is about 10–15%, not 25%."},
{"id":30,"section":4,"sectionName":"Haemodynamics and Echocardiography","stem":"A dyspnoeic patient with preserved EF has mitral inflow E velocity 105 cm/s and average tissue Doppler e′ 6 cm/s. What is the interpretation?","options":{"A":"E/e′ 17.5; normal LV filling pressure","B":"E/e′ 5.7; elevated LV filling pressure","C":"E/e′ 17.5; elevated LV filling pressure","D":"E/e′ 0.06; normal diastolic function"},"answer":"C","explanation":"E/e′ = 105 / 6 = 17.5. An average E/e′ > 14 suggests elevated LV filling pressure (ASE/EACVI 2016).","distractor":"5.7 results from inverting the ratio incorrectly."},
{"id":31,"section":4,"sectionName":"Haemodynamics and Echocardiography","stem":"A patient on noradrenaline with MAP 70 mmHg after cardiac surgery has ScvO2 68%, lactate 4.0 mmol/L, PcvCO2 52 mmHg and PaCO2 43 mmHg. What does the CO2 gap suggest?","options":{"A":"Gap 9 mmHg; excess vasoconstriction, so reduce noradrenaline","B":"Gap 9 mmHg; normal value, so continue current management","C":"Gap 9 mmHg; inadequate flow, so consider an inotrope","D":"Gap 95 mmHg; severe anaerobic metabolism that needs bicarbonate"},"answer":"C","explanation":"Pcv-aCO2 = 52 − 43 = 9 mmHg. A gap above 6 mmHg indicates insufficient blood flow to clear tissue CO2; with persistent hypoperfusion, optimise cardiac output (fluid if responsive, inotrope).","distractor":"The normal gap is below 6 mmHg; 9 is abnormal."},
{"id":32,"section":4,"sectionName":"Haemodynamics and Echocardiography","stem":"In a ventilated patient on PEEP 12 cmH2O, when should the PAWP be read on the pressure tracing?","options":{"A":"At end-expiration, when pleural pressure is nearest baseline","B":"As the digital mean value averaged over the whole respiratory cycle","C":"At peak inspiration, when vascular pressures are highest","D":"During a recruitment manoeuvre to remove PEEP effects"},"answer":"A","explanation":"Vascular pressures are measured at end-expiration, when pleural pressure is closest to baseline, in both ventilated and spontaneously breathing patients. High PEEP still elevates measured PAWP relative to transmural pressure.","distractor":"Digital mean values include respiratory swings and are inaccurate."},
{"id":33,"section":5,"sectionName":"Valvular, Pericardial and Endocarditis","stem":"Echo in a 79-year-old woman: LVOT diameter 2.0 cm, LVOT VTI 20 cm and aortic valve VTI 100 cm. What is the aortic valve area and severity?","options":{"A":"About 0.40 cm²; critical, needing immediate valvotomy","B":"About 1.6 cm²; moderate aortic stenosis","C":"About 0.63 cm²; severe aortic stenosis","D":"About 2.5 cm²; no significant stenosis"},"answer":"C","explanation":"Continuity equation: AVA = (LVOT area × LVOT VTI) / AV VTI = (3.14 × 20) / 100 ≈ 0.63 cm². An AVA below 1.0 cm² is severe.","distractor":"1.6 cm² results from omitting the LVOT area calculation."},
{"id":34,"section":5,"sectionName":"Valvular, Pericardial and Endocarditis","stem":"A patient with severe aortic stenosis becomes hypotensive (BP 82/50 mmHg, HR 110/min, AF) after induction for emergency laparotomy. What is the best immediate management?","options":{"A":"IV nitroglycerin to reduce LV wall stress","B":"Aggressive diuresis to reduce left ventricular end-diastolic pressure","C":"Dobutamine to increase contractility and heart rate","D":"Phenylephrine or noradrenaline, with rate/rhythm control and preload"},"answer":"D","explanation":"In severe AS, cardiac output depends on preload, sinus rhythm and coronary perfusion pressure. Restore SVR with alpha-agonists, maintain preload, control rate, and restore sinus rhythm (cardioversion if unstable).","distractor":"Vasodilators drop coronary perfusion pressure and can cause cardiac arrest in severe AS."},
{"id":35,"section":5,"sectionName":"Valvular, Pericardial and Endocarditis","stem":"A 45-year-old man with Staphylococcus aureus native aortic valve endocarditis develops acute severe aortic regurgitation with pulmonary oedema and cardiogenic shock. What is the best management?","options":{"A":"6 weeks of IV antibiotics before considering any surgery","B":"IABP to stabilise the patient before delayed surgery","C":"Emergency valve surgery after brief stabilisation","D":"TEE-guided surveillance and surgery only if emboli occur"},"answer":"C","explanation":"ESC 2023: heart failure with cardiogenic shock or pulmonary oedema from acute valvular regurgitation is an emergency (within 24 h) surgical indication in infective endocarditis.","distractor":"An IABP is contraindicated in significant aortic regurgitation."},
{"id":36,"section":5,"sectionName":"Valvular, Pericardial and Endocarditis","stem":"A stable patient with left-sided streptococcal native valve endocarditis has received 12 days of IV antibiotics. Fever has resolved and TEE shows no abscess. What does POET support?","options":{"A":"Switch to oral therapy only after surgical valve replacement","B":"Switch to oral antibiotics; non-inferior to continued IV therapy","C":"Continue IV therapy for 6 weeks, as oral switch increases relapse","D":"Stop antibiotics now, since TEE shows no abscess or vegetation growth"},"answer":"B","explanation":"POET (NEJM 2019): in stable left-sided endocarditis (streptococci, E. faecalis, S. aureus, CoNS) after at least 10 days of IV therapy, partial oral treatment was non-inferior to continued IV therapy for the composite of death, embolism, relapse and unplanned surgery.","distractor":"POET showed no increase in relapse with partial oral therapy."},
{"id":37,"section":5,"sectionName":"Valvular, Pericardial and Endocarditis","stem":"A 40-year-old woman has a first episode of acute idiopathic pericarditis with a small effusion and no tamponade. What is the best initial treatment?","options":{"A":"Pericardiocentesis for diagnosis in all patients","B":"High-dose NSAID plus colchicine for 3 months","C":"Prednisolone 1 mg/kg as first-line therapy","D":"NSAID alone without colchicine for 2 weeks"},"answer":"B","explanation":"ICAP (NEJM 2013) and COPE showed that adding colchicine to NSAIDs reduces incomplete response and recurrence. First-line corticosteroids increase recurrence and are reserved for contraindications or specific causes.","distractor":"First-line steroids increase the risk of recurrence."},
{"id":38,"section":5,"sectionName":"Valvular, Pericardial and Endocarditis","stem":"A patient with a mechanical mitral valve and subtherapeutic INR presents in NYHA IV heart failure. Fluoroscopy shows restricted leaflet motion and TEE confirms obstructive valve thrombosis. Surgery is available and operative risk is acceptable. What is the best treatment?","options":{"A":"IV heparin and observation for 2 weeks","B":"Add aspirin to warfarin with an INR target of 3.5–4.5","C":"Urgent surgery (valve replacement or thrombectomy)","D":"Fibrinolysis with alteplase as the first-line treatment"},"answer":"C","explanation":"ESC 2021: urgent or emergency surgery is recommended for obstructive mechanical valve thrombosis in critically ill patients without serious comorbidity. Fibrinolysis is considered when surgery is unavailable or very high risk.","distractor":"Fibrinolysis carries embolic and bleeding risks and is second-line when surgery is feasible."},
{"id":39,"section":5,"sectionName":"Valvular, Pericardial and Endocarditis","stem":"A 52-year-old man with a mechanical aortic valve wants to switch from warfarin to dabigatran because of INR variability. What is the correct advice?","options":{"A":"DOACs are contraindicated with mechanical valves; keep warfarin","B":"Apixaban is now preferred to warfarin for mechanical aortic valves","C":"Switch to dabigatran after 3 months of stable INR control","D":"Dabigatran 150 mg twice daily is an equivalent alternative"},"answer":"A","explanation":"RE-ALIGN (NEJM 2013): dabigatran in mechanical valves caused more thromboembolic and bleeding events and was stopped early. PROACT Xa (2023) was also stopped early for excess thromboembolism with apixaban in On-X aortic valves.","distractor":"Dabigatran was harmful in RE-ALIGN."},
{"id":40,"section":6,"sectionName":"Aorta, PE and Hypertensive Emergencies","stem":"A 61-year-old man has acute chest pain, BP 180/100 mmHg and HR 105/min. CT shows a Stanford type A aortic dissection. What is the best management?","options":{"A":"Nitroprusside alone to lower SBP before giving a beta-blocker","B":"TEVAR of the ascending aorta as first-line treatment","C":"Emergency surgery; esmolol to HR \u003c 60/min and SBP 100–120 mmHg","D":"Medical therapy alone with BP control and repeat CT in 48 hours"},"answer":"C","explanation":"Type A dissection requires emergency surgery. Pre-operatively, a beta-blocker reduces dP/dt (target HR \u003c 60/min) before vasodilators, aiming for SBP 100–120 mmHg.","distractor":"A vasodilator without prior beta-blockade causes reflex tachycardia and increases shear stress."},
{"id":41,"section":6,"sectionName":"Aorta, PE and Hypertensive Emergencies","stem":"An 82-year-old woman with active lung cancer has acute PE. HR is 98/min, BP 118/70 mmHg and SpO2 95% on air. What is her sPESI score and implication?","options":{"A":"1; low risk, so discharge with a DOAC","B":"0; low risk, suitable for early outpatient treatment","C":"2; high-risk PE needing systemic thrombolysis","D":"2; not low risk, so admit and assess RV function"},"answer":"D","explanation":"sPESI: age > 80 (1) + cancer (1) = 2. Any score ≥1 is not low risk, so the patient is admitted and risk stratification continues with RV imaging and troponin. Thrombolysis is reserved for haemodynamic instability.","distractor":"High-risk PE is defined by haemodynamic instability, not the sPESI."},
{"id":42,"section":6,"sectionName":"Aorta, PE and Hypertensive Emergencies","stem":"A 45-year-old woman has a witnessed cardiac arrest (PEA) on the ward, with a strong clinical suspicion of massive PE. What is the recommended approach?","options":{"A":"Give thrombolysis and continue CPR for 60–90 minutes","B":"Continue CPR for 10 minutes after thrombolysis, then stop","C":"Delay thrombolysis until CT pulmonary angiography confirms PE","D":"Thrombolysis is contraindicated during CPR"},"answer":"A","explanation":"ERC 2021: for cardiac arrest with suspected PE, give thrombolytic drugs and continue CPR for 60–90 minutes before stopping, because thrombolysis takes time to act. Consider ECPR or surgical/catheter embolectomy in selected cases.","distractor":"Ten minutes is too short for thrombolysis to take effect."},
{"id":43,"section":6,"sectionName":"Aorta, PE and Hypertensive Emergencies","stem":"A 72-year-old woman has acute severe dyspnoea, BP 210/115 mmHg, SpO2 84% and flash pulmonary oedema. What is the best initial management?","options":{"A":"High-dose IV furosemide alone, avoiding vasodilators","B":"Immediate intubation and IV labetalol infusion","C":"IV morphine 10 mg to reduce preload and anxiety","D":"NIV plus high-dose IV nitroglycerin titrated rapidly"},"answer":"D","explanation":"Sympathetic crisis acute pulmonary oedema (SCAPE) is an afterload problem; patients are often not volume overloaded. Rapid high-dose nitrates with NIV reduce intubation and ICU admission. Diuretics are adjuncts.","distractor":"Morphine is associated with worse outcomes and is no longer recommended routinely."},
{"id":44,"section":6,"sectionName":"Aorta, PE and Hypertensive Emergencies","stem":"A 58-year-old man has a hypertensive emergency with encephalopathy and BP 230/130 mmHg (no stroke or dissection). What is the target for the first hour?","options":{"A":"Lower BP to below 140/90 mmHg within 1 hour","B":"Lower MAP by 50% (to about 82 mmHg) in the first hour","C":"Lower MAP by ≤25% (to about 122 mmHg) in the first hour","D":"No reduction for 24 hours, to protect cerebral perfusion"},"answer":"C","explanation":"MAP = 130 + (230 − 130)/3 ≈ 163 mmHg. Reduce by no more than 25% in the first hour (to ≈122 mmHg), then to 160/100–110 over 2–6 hours, then to normal over 24–48 hours (AHA/ACC 2017).","distractor":"Rapid normalisation risks cerebral, renal and coronary ischaemia."},
{"id":45,"section":6,"sectionName":"Aorta, PE and Hypertensive Emergencies","stem":"A 66-year-old man with acute type B aortic dissection develops abdominal pain, rising lactate and absent left femoral pulse despite BP and HR control. What is the best management?","options":{"A":"Complicated type B dissection: urgent TEVAR","B":"Continue medical therapy; malperfusion usually resolves","C":"Thrombolysis for the acute limb ischaemia","D":"Open repair of the ascending aorta"},"answer":"A","explanation":"Type B dissection with malperfusion, rupture, rapid expansion or refractory pain/hypertension is complicated and needs urgent endovascular repair (TEVAR) to cover the entry tear and restore true-lumen flow.","distractor":"Medical therapy alone is for uncomplicated type B dissection."},
{"id":46,"section":7,"sectionName":"Cardiac Arrest and Post-Cardiac Surgery","stem":"During cardiac arrest, a resident proposes routine IV calcium chloride. What did the COCA trial (2021) show?","options":{"A":"No benefit, and a trend toward harm, from routine calcium","B":"No effect on ROSC but improved neurological outcome","C":"Benefit only in patients with an initial shockable rhythm","D":"Improved ROSC and 30-day survival with routine calcium"},"answer":"A","explanation":"COCA (JAMA 2021): calcium chloride during OHCA did not improve ROSC and was stopped early for a signal of harm. Calcium is indicated only for specific causes (hyperkalaemia, hypocalcaemia, calcium channel blocker toxicity).","distractor":"COCA showed no improvement in ROSC or survival."},
{"id":47,"section":7,"sectionName":"Cardiac Arrest and Post-Cardiac Surgery","stem":"In in-hospital cardiac arrest, what did VAM-IHCA (2021) find with vasopressin plus methylprednisolone during CPR?","options":{"A":"Improved survival only for out-of-hospital arrests","B":"Improved 90-day survival with good neurological outcome","C":"No effect on ROSC, with a significant increase in 90-day mortality","D":"Improved ROSC, but no improvement in 30- or 90-day survival"},"answer":"D","explanation":"VAM-IHCA (JAMA 2021): vasopressin and methylprednisolone increased ROSC (42% vs 33%) without improving survival or neurological outcome. It is not routinely recommended.","distractor":"Survival at 90 days was not improved."},
{"id":48,"section":7,"sectionName":"Cardiac Arrest and Post-Cardiac Surgery","stem":"Two hours after CABG, a patient develops VF in the ICU with a monitored, witnessed onset. External defibrillation is available immediately. What is the recommended sequence?","options":{"A":"Up to 3 stacked shocks, then CPR and resternotomy within 5 min","B":"Single shock, then CPR, with resternotomy considered after 20 minutes","C":"Start chest compressions for 2 minutes before the first shock","D":"Give adrenaline 1 mg immediately, then a single shock"},"answer":"A","explanation":"Cardiac surgery resuscitation guidance (STS/EACTS/ERC): for VF after cardiac surgery, deliver up to 3 sequential shocks before external compressions; if unsuccessful, start CPR and prepare for emergency resternotomy within 5 minutes. Adrenaline is withheld or given in reduced doses.","distractor":"Immediate full-dose adrenaline can cause severe rebound hypertension and bleeding."},
{"id":49,"section":7,"sectionName":"Cardiac Arrest and Post-Cardiac Surgery","stem":"After aortic valve replacement, a patient has complete heart block and is VVI-paced at 80/min via epicardial wires. Cardiac index is 1.9 L/min/m², with cannon a waves on the CVP trace. What is the best intervention?","options":{"A":"Start adrenaline infusion and keep VVI pacing","B":"Switch to asynchronous VOO pacing at 80/min","C":"Increase VVI rate to 110/min to raise cardiac output","D":"DDD (AV sequential) pacing to restore AV synchrony"},"answer":"D","explanation":"Loss of AV synchrony removes the atrial contribution (up to 20–30% of LV filling, more in hypertrophied post-AVR ventricles), producing cannon a waves and low output. AV sequential pacing restores synchrony and improves cardiac output.","distractor":"A faster VVI rate does not restore the atrial contribution and shortens filling time."},
{"id":50,"section":7,"sectionName":"Cardiac Arrest and Post-Cardiac Surgery","stem":"A 52-year-old man has witnessed OHCA with refractory VF despite 3 shocks and amiodarone. He received bystander CPR, low-flow time is 35 minutes, and ETCO2 is 22 mmHg. What is the best next step?","options":{"A":"Transfer for ECPR at an expert centre (benefit shown in ARREST)","B":"Stop resuscitation, because refractory VF is futile","C":"Give thrombolysis, as refractory VF is usually caused by a massive PE","D":"Continue standard ACLS on scene for another 60 minutes"},"answer":"A","explanation":"ARREST (Lancet 2020) showed improved survival to discharge with ECPR for refractory VF in a selected expert system; INCEPTION (NEJM 2023) found no difference in a multicentre setting. ECPR is reasonable for selected candidates (witnessed, bystander CPR, short low-flow time, ETCO2 > 10 mmHg).","distractor":"Prolonged on-scene ACLS delays ECPR; survival falls with longer low-flow time."}

/* =====================================================================
   DATA
   Several question banks; every question gets a stable key "<bankId>-<number>" (e.g. icu500-12).
   SECTIONS is a global list across banks: n = 1..N, local = number inside its bank. New banks are appended.
   ===================================================================== */
const LETTERS = ['A','B','C','D'];
let BANKS = [], QS = [], SECTIONS = [], ALL_IDS = [];
const QMAP = new Map();
function loadData(){
  BANKS = JSON.parse(document.getElementById('qdata').textContent).banks;
  for (const b of BANKS) {
    b.ids = [];
    b.sections.forEach((s, i) => { s.g = SECTIONS.length + 1; SECTIONS.push({n:s.g, bank:b.id, bankShort:b.short, local:i + 1, name:s.name, from:s.from, to:s.to, ids:[]}); });
    for (const q of b.questions) {
      q.key = b.id + '-' + q.id; q.bank = b.id; q.bankShort = b.short; q.num = q.id; q.gsec = b.sections[q.section - 1].g; q.ord = QS.length;
      QS.push(q); QMAP.set(q.key, q); SECTIONS[q.gsec - 1].ids.push(q.key); b.ids.push(q.key);
    }
  }
  ALL_IDS = QS.map(q => q.key);
}
const Q = k => QMAP.get(k);
const secIds = n => SECTIONS[n - 1].ids.slice();
const byOrd = (a, b) => Q(a).ord - Q(b).ord;
const bankOf = id => BANKS.find(b => b.id === id);
const multi = () => BANKS.length > 1;
const ql = k => { const q = Q(k); return (multi() ? q.bankShort + ' · ' : '') + 'Q' + q.num; };
const secName = n => { const s = SECTIONS[n - 1]; return (multi() ? s.bankShort + ' · ' : '') + s.local + '. ' + s.name; };
/* active bank scope used by the dashboard, review lists, insights and study launcher */
const scopeBank = () => bankOf(st.settings.bank) || null;
const scopeIds = () => { const b = scopeBank(); return b ? b.ids : ALL_IDS; };
const scopeSections = () => { const b = scopeBank(); return b ? SECTIONS.filter(s => s.bank === b.id) : SECTIONS; };

/* =====================================================================
   PROGRESS LOGIC (stats, Leitner spaced repetition, trends, insights)
   ===================================================================== */
const LEITNER_DAYS = {1:1, 2:3, 3:7, 4:14};
function recordAnswer(id, letter, ms){
  ms = Math.min(Math.max(ms || 0, 0), 600000);
  const ok = letter === Q(id).answer, now = Date.now();
  const a = st.answers[id] || {attempts:0, correctCount:0, timeMs:0};
  a.attempts++; if (ok) a.correctCount++; a.last = letter; a.correct = ok; a.lastAt = now; a.timeMs += ms; a.guessed = false;
  st.answers[id] = a;
  const d = st.daily[dayKey()] || (st.daily[dayKey()] = {attempted:0, correct:0, timeMs:0});
  d.attempted++; if (ok) d.correct++; d.timeMs += ms;
  st.log.push([now, id, ok ? 1 : 0]); if (st.log.length > 10000) st.log.splice(0, st.log.length - 10000);
  // Leitner: wrong → box 1; correct moves a tracked card up one box (box 5 = mastered)
  const l = st.leitner[id];
  if (!ok) st.leitner[id] = {box:1, due:startOfDay(now) + LEITNER_DAYS[1] * DAY};
  else if (l) { l.box = Math.min(l.box + 1, 5); l.due = l.box < 5 ? startOfDay(now) + LEITNER_DAYS[l.box] * DAY : null; }
  save();
}
/* a correct answer the user says was a guess goes back to box 1 so it returns tomorrow */
function markGuess(id){
  if (st.answers[id]) st.answers[id].guessed = true;
  st.leitner[id] = {box:1, due:startOfDay(Date.now()) + DAY};
  save();
}
function dueIds(){ const end = startOfDay(Date.now()) + DAY; return Object.keys(st.leitner).filter(k => inScope(k) && st.leitner[k].box < 5 && st.leitner[k].due < end).sort(byOrd); }
const wrongIds = () => Object.keys(st.answers).filter(k => inScope(k) && !st.answers[k].correct).sort(byOrd);
const flaggedIds = () => Object.keys(st.flags).filter(inScope).sort(byOrd);
function statsFor(ids){
  let att = 0, cor = 0, time = 0, tn = 0;
  for (const id of ids) { const a = st.answers[id]; if (a) { att++; if (a.correct) cor++; if (a.timeMs) { time += a.timeMs; tn += a.attempts; } } }
  return {total:ids.length, att, cor, acc:att ? pct(cor, att) : 0, avgMs:tn ? time / tn : 0};
}
/* accuracy of attempts in the last 7 days vs. all earlier attempts (needs ≥5 of each) */
function trendFor(ids){
  const set = new Set(ids), wk = Date.now() - 7 * DAY, r = [0, 0], p = [0, 0];
  for (const e of st.log) { if (!set.has(e[1])) continue; const b = e[0] >= wk ? r : p; b[0]++; b[1] += e[2]; }
  return r[0] >= 5 && p[0] >= 5 ? {prev:pct(p[1], p[0]), now:pct(r[1], r[0])} : null;
}
function trendHTML(tr){
  if (!tr) return '<span class="trend flat" title="' + t('trend') + '">—</span>';
  const d = tr.now - tr.prev, k = d >= 3 ? 'up' : d <= -3 ? 'down' : 'flat';
  return '<span class="trend ' + k + '" title="' + t('trend') + ': ' + tr.prev + '% → ' + tr.now + '%">' + ic(k, 'xs') + (d > 0 ? '+' : '') + d + '%</span>';
}
function streak(){
  let n = 0; const d = new Date();
  if (!(st.daily[dayKey(d)] || {}).attempted) d.setDate(d.getDate() - 1);
  while ((st.daily[dayKey(d)] || {}).attempted) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const totalStudyMs = () => Object.values(st.daily).reduce((s, d) => s + d.timeMs, 0);
function qStatus(id){ const a = st.answers[id]; return !a ? 'none' : a.correct ? 'ok' : 'bad'; }
/* today's plan: due reviews first, then other mistakes, then new questions from the weakest section */
function buildPlan(){
  const goal = st.settings.dailyGoal, done = (st.daily[dayKey()] || {}).attempted || 0;
  const size = goal > done ? goal - done : 10;
  const due = dueIds(), dueSet = new Set(due);
  const picked = due.slice(0, size);
  const wrong = wrongIds().filter(k => !dueSet.has(k)).slice(0, Math.max(0, size - picked.length));
  const room = size - picked.length - wrong.length, fresh = [];
  const order = scopeSections().map(s => ({s, x:statsFor(s.ids)})).sort((a, b) => (a.x.att >= 5 ? a.x.acc : 1000 + a.s.n) - (b.x.att >= 5 ? b.x.acc : 1000 + b.s.n));
  for (const r of order) { for (const k of r.s.ids) { if (fresh.length >= room) break; if (!st.answers[k]) fresh.push(k); } }
  return {goal, done, size, due:picked, wrong, fresh, qids:[...picked, ...shuffle(wrong), ...fresh]};
}
function insights(){
  const ids = scopeIds(), o = statsFor(ids), out = [];
  if (!o.att) return [{icon:'bulb', text:t('insStart'), act:'<button class="btn sm primary" data-act="start-today">' + ic('play', 'flip') + t('startToday') + '</button>'}];
  const rows = scopeSections().map(s => ({s, x:statsFor(s.ids), tr:trendFor(s.ids)}));
  const weak = rows.filter(r => r.x.att >= 5).sort((a, b) => a.x.acc - b.x.acc)[0];
  if (weak && weak.x.acc < 75) out.push({icon:'target', tone:'weak', text:tf('insWeak', {s:'<b>' + esc(weak.s.name) + '</b>', a:weak.x.acc}), act:'<button class="btn sm" data-act="weak" data-sec="' + weak.s.n + '">' + t('practiseNow') + '</button>'});
  const drop = rows.filter(r => r.tr && r.tr.now - r.tr.prev <= -10).sort((a, b) => (a.tr.now - a.tr.prev) - (b.tr.now - b.tr.prev))[0];
  if (drop) out.push({icon:'down', tone:'weak', text:tf('insDrop', {s:'<b>' + esc(drop.s.name) + '</b>', a:drop.tr.prev, b:drop.tr.now}), act:'<button class="btn sm" data-act="weak" data-sec="' + drop.s.n + '">' + t('practiseNow') + '</button>'});
  const up = rows.filter(r => r.tr && r.tr.now - r.tr.prev >= 10).sort((a, b) => (b.tr.now - b.tr.prev) - (a.tr.now - a.tr.prev))[0];
  if (up) out.push({icon:'up', tone:'good', text:tf('insUp', {s:'<b>' + esc(up.s.name) + '</b>', a:up.tr.prev, b:up.tr.now})});
  const due = dueIds().length;
  if (due) out.push({icon:'refresh', tone:'fair', text:tf('insDue', {n:due}), act:'<button class="btn sm" data-act="start-due">' + t('startReview') + '</button>'});
  let recent = 0; for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); recent += (st.daily[dayKey(d)] || {}).attempted || 0; }
  const perDay = Math.round(recent / 7), remaining = ids.length - o.att;
  if (perDay >= 1 && remaining > 0) out.push({icon:'calendar', text:tf('insPace', {n:perDay, r:remaining, d:Math.ceil(remaining / perDay)})});
  else if (remaining > 0) out.push({icon:'calendar', text:t('insGoal')});
  const slow = rows.filter(r => r.x.avgMs > 90000).sort((a, b) => b.x.avgMs - a.x.avgMs)[0];
  if (slow) out.push({icon:'clock', tone:'fair', text:tf('insSlow', {s:'<b>' + esc(slow.s.name) + '</b>', t:fmtDur(slow.x.avgMs)})});
  return out;
}
const insightsHTML = list => list.map(x => '<div class="ins ' + (x.tone || '') + '">' + ic(x.icon) + '<div class="txt"><p>' + x.text + '</p>' + (x.act || '') + '</div></div>').join('');
