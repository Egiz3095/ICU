/* =====================================================================
   VIEWS — RESULTS
   ===================================================================== */
function optsHTML(s, id){
  const q = Q(id), perm = (s && s.opt && s.opt[id]) || 'ABCD', resp = s ? s.resp[id] : undefined;
  return '<div class="opts">' + LETTERS.map((pos, i) => { const orig = perm[i], isAns = orig === q.answer, isMine = resp === orig;
    const cls = isAns ? 'correct' : isMine ? 'wrong' : 'dim';
    return '<div class="opt ' + cls + '"><span class="key">' + pos + '</span><span class="txt">' + fmt(q.options[orig]) + (isMine ? ' <span class="small muted">(' + t('yourAnswer') + ')</span>' : '') + '</span><span class="mk">' + (isAns ? ic('check') : isMine ? ic('x') : '') + '</span>' +
      '<span class="sr-only">' + (isAns ? t('correctAnswer') : isMine ? t('wrongMsg') : '') + '</span></div>'; }).join('') + '</div>';
}
function explHTML(s, id){
  const q = Q(id), perm = (s && s.opt && s.opt[id]) || 'ABCD', dl = LETTERS[perm.indexOf(q.answer)];
  return '<div class="expl"><div class="ans-h">' + ic('check') + t('correctAnswer') + '</div><div class="ans qtext" dir="ltr" lang="en"><span class="key">' + dl + '</span><span>' + fmt(q.options[q.answer]) + '</span></div>' +
    (q.explanation ? '<div class="body qtext" dir="ltr" lang="en">' + fmt(q.explanation) + '</div>' : '') +
    (q.distractor ? '<details class="distractor"><summary>' + t('distractor') + ic('chevD') + '</summary><div class="qtext" dir="ltr" lang="en">' + fmt(q.distractor) + '</div></details>' : '') + sumReviewHTML(s, id) + '</div>';
}
function resRing(p, col, sub){
  const R = 46, C = 2 * Math.PI * R;
  return '<svg class="res-ring" viewBox="0 0 110 110" role="img" aria-label="' + t('score') + ' ' + p + '%"><circle cx="55" cy="55" r="' + R + '" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="55" cy="55" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round" transform="rotate(-90 55 55)" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - p / 100)) + '"/>' +
    '<text x="55" y="58" text-anchor="middle" font-size="24" font-weight="800" fill="var(--text)">' + p + '%</text><text x="55" y="77" text-anchor="middle" font-size="11" fill="var(--muted)" direction="ltr">' + sub + '</text></svg>';
}
function viewResults(sid){
  const s = st.sessions[sid];
  if (!s) return '<div class="card empty">' + t('sessionMissing') + '</div>';
  const r = sessionResult(s), exam = s.feedback === 'exam', pm = s.passMark || st.settings.passMark, passed = r.pct >= pm;
  const perm = id => (s.opt && s.opt[id]) || 'ABCD', disp = (id, L) => LETTERS[perm(id).indexOf(L)];
  const chg = {wr:0, rw:0, ww:0};
  const kindOf = id => { const h = (s.changes || {})[id]; if (!h || h.length < 2 || !s.resp[id]) return null; const a = Q(id).answer, f = h[0] === a, l = s.resp[id] === a; return f && !l ? 'rw' : !f && l ? 'wr' : !f && !l ? 'ww' : null; };
  s.qids.forEach(id => { const k = kindOf(id); if (k) chg[k]++; });
  const slow = s.qids.filter(id => s.qtime[id]).sort((a, b) => s.qtime[b] - s.qtime[a]).slice(0, 3);
  const items = s.qids.map((id, i) => { const resp = s.resp[id], ok = resp === Q(id).answer, k = !resp ? 'un' : ok ? 'ok' : 'bad', ck = kindOf(id), h = (s.changes || {})[id];
    return '<details class="rev-item" data-k="' + k + '"' + (st.flags[id] ? ' data-f="1"' : '') + (ck ? ' data-c="1"' : '') + '><summary><span class="st-ic ' + k + '-ic">' + (k === 'ok' ? ic('check') : k === 'bad' ? ic('x') : ic('flat')) + '</span><span style="flex:1;min-width:0"><span class="small muted">' + (i + 1) + ' · ' + ql(id) + ' · ' + ltr(Q(id).sectionName) + (st.flags[id] ? ' <span style="color:var(--flag)">' + ic('starF', 'xs') + '</span>' : '') +
      (s.qtime[id] ? ' · <span class="tm">' + ic('clock', 'xs') + fmtDur(s.qtime[id]) + '</span>' : '') + (ck ? ' <span class="chg" dir="ltr">' + ic('swap', 'xs') + h.map(L => disp(id, L)).join(' → ') + '</span>' : '') + '<span class="sr-only">, ' + (k === 'ok' ? t('correctMsg') : k === 'bad' ? t('wrongMsg') : t('unanswered')) + '</span></span><br><span class="qtext" dir="ltr" lang="en">' + fmt(trunc(Q(id).stem, 140)) + '</span></span></summary>' +
      '<div class="rv-body"><p class="stem qtext" dir="ltr" lang="en" style="font-size:1rem">' + fmt(Q(id).stem) + '</p>' + qImg(Q(id)) + '<div class="qtext" dir="ltr" lang="en">' + optsHTML(s, id) + '</div><div style="margin-top:.8rem">' + explHTML(s, id) + '</div>' +
      '<div class="row" style="margin-top:.6rem"><a class="btn sm" href="#/q/' + id + '">' + t('open') + '</a></div></div></details>'; }).join('');
  const wrongN = s.qids.filter(id => s.resp[id] && s.resp[id] !== Q(id).answer).length, unN = s.qids.filter(id => !s.resp[id]).length;
  return '<div class="stack"><section class="card"><div class="card-title"><div><h2>' + esc(s.title) + '</h2><div class="small muted">' + MODE_LABEL(s.mode) + ' · ' + fmtDate(s.startedAt) + '</div></div>' +
    (exam ? '<span class="badge st ' + (passed ? 'st-good' : 'st-weak') + '" style="font-size:.9rem">' + (passed ? ic('check', 'xs') + t('pass') : ic('x', 'xs') + t('fail')) + '</span>' : '') + '</div>' +
    '<div class="res-top">' + resRing(r.pct, exam ? (passed ? 'var(--ok)' : 'var(--bad)') : 'var(--' + ({good:'ok', fair:'warn'}[statusOf(r.pct, r.ans)] || 'bad') + ')', r.cor + ' / ' + (exam ? r.total : r.ans)) + '<div class="res-stats">' +
    '<div><div class="small muted">' + t('timeUsed') + '</div><div style="font-size:1.3rem;font-weight:700">' + fmtDur(r.used) + '</div>' + (exam ? '<div class="small muted">/ ' + fmtClock(s.limitS) + '</div>' : '') + '</div>' +
    '<div><div class="small muted">' + t('answered') + '</div><div style="font-size:1.3rem;font-weight:700">' + r.ans + ' / ' + r.total + '</div></div></div></div>' +
    (exam ? '<div class="passbar" dir="ltr" role="img" aria-label="' + t('score') + ' ' + r.pct + '%, ' + t('passMark') + ' ' + pm + '%"><span style="width:' + r.pct + '%;background:' + (passed ? 'var(--ok)' : 'var(--bad)') + '"></span><div class="line" style="left:' + pm + '%"><b>' + t('passMark') + ' ' + pm + '%</b></div></div>' : '') +
    '<div class="row" style="margin-top:1rem">' + (wrongN ? '<button class="btn primary" data-act="retry-wrong" data-id="' + s.id + '">' + ic('x') + tf('reviewSessWrong', {n:wrongN}) + '</button>' : '') + '<a class="btn" href="#/home">' + t('backHome') + '</a></div></section>' +
    '<section class="card"><h2>' + t('bySection') + '</h2>' +
      Object.keys(r.bySec).map(k => { const b = r.bySec[k], d = exam ? b.total : b.ans, p = pct(b.cor, d), stt = statusOf(p, d);
        return '<div class="res-sec st-' + stt + '"><span class="rs-name">' + secNameHTML(k) + '</span><span class="rs-v num">' + b.cor + '/' + d + ' · <b>' + (d ? p + '%' : '—') + '</b></span><span class="bar"><span style="width:' + (d ? p : 0) + '%"></span></span></div>'; }).join('') + '</section>' +
    (exam && (chg.wr + chg.rw + chg.ww || slow.length) ? '<div class="two-col">' +
      '<section class="card"><h2 style="display:flex;gap:.45rem;align-items:center">' + ic('swap') + t('changedAnswers') + ' (' + (chg.wr + chg.rw + chg.ww) + ')</h2>' +
        '<div class="sum-row"><div><span class="small muted">' + t('chWR') + '</span><b style="color:var(--ok)">' + chg.wr + '</b></div><div><span class="small muted">' + t('chRW') + '</span><b style="color:var(--bad)">' + chg.rw + '</b></div><div><span class="small muted">' + t('chWW') + '</span><b>' + chg.ww + '</b></div></div></section>' +
      '<section class="card"><h2 style="display:flex;gap:.45rem;align-items:center">' + ic('clock') + t('slowest') + '</h2>' + slow.map(id => '<div class="weak-item"><a href="#/q/' + id + '" class="small">' + (s.qids.indexOf(id) + 1) + ' · ' + ql(id) + '</a><span class="num"><b>' + fmtDur(s.qtime[id]) + '</b> ' + (s.resp[id] === Q(id).answer ? '<span style="color:var(--ok)">' + ic('check', 'xs') + '</span>' : '<span style="color:var(--bad)">' + ic('x', 'xs') + '</span>') + '</span></div>').join('') + '</section></div>' : '') +
    '<section class="card"><h2>' + t('reviewAll') + '</h2><div class="tabs seg" role="group">' +
      [['all', t('all') + ' (' + r.total + ')'], ['bad', t('wrong') + ' (' + wrongN + ')'], ['un', t('unanswered') + ' (' + unN + ')'], ['f', t('flagged')]].concat(exam && (chg.wr + chg.rw + chg.ww) ? [['c', t('changed') + ' (' + (chg.wr + chg.rw + chg.ww) + ')']] : []).map(([k, l], i) => '<button type="button" data-act="rev-filter" data-k="' + k + '" aria-pressed="' + (i === 0) + '">' + l + '</button>').join('') +
    '</div><div id="rev-list">' + items + '</div></section></div>';
}

/* =====================================================================
   PLAYER (question screen)
   ===================================================================== */
const curId = () => P.sess.qids[P.sess.idx];
function enterPlayer(s){
  P.sess = s; P.explShown = {}; P.returnTo = lastRoute; st.lastSessionId = s.id;
  s.conf = s.conf || {}; s.marked = s.marked || {}; s.strike = s.strike || {}; s.changes = s.changes || {};
  if (s.idx >= s.qids.length || s.idx < 0) s.idx = 0;
  $('#view').innerHTML = (storageOK ? '' : '<div class="storage-warn" role="alert">' + t('storageWarn') + '</div>') +
    '<div class="player"><div class="p-head card" id="p-head"></div><section class="p-main" id="p-main" aria-live="polite"></section><aside class="p-side" id="p-side"></aside><aside class="p-nav card" id="p-nav" aria-label="' + t('navigator') + '"></aside>' +
    '<div class="p-bar"><button class="btn" data-act="prev" aria-label="' + t('prev') + '">' + ic('chevL', 'flip') + '</button><button class="btn nav-open" data-act="drawer" aria-label="' + t('navigator') + '">' + ic('grid') + '</button><button class="btn primary" data-act="next" id="bar-next">' + t('next') + ic('chevR', 'flip') + '</button></div></div>';
  P.visitStart = document.hidden ? null : Date.now();
  if (s.feedback === 'exam' && !s.submitted) { P.timer = setInterval(tickExam, 1000); }
  renderQ(); save();
  bindSwipe($('.player'), () => [$('#p-main'), $('#p-side')].filter(Boolean));
}
function leavePlayer(){
  if (!P.sess) return;
  flushVisit(); clearInterval(P.timer); P.timer = null; P.sess = null; save(true);
}
function flushVisit(){
  if (!P.sess || !P.visitStart) return;
  const id = curId(), d = Math.min(Date.now() - P.visitStart, 600000);
  P.sess.qtime[id] = (P.sess.qtime[id] || 0) + d; P.visitStart = Date.now();
}
function timerClass(left){ return left < 60 ? 'warn' : left < 300 ? 'soon' : ''; }
function tickExam(){
  const s = P.sess; if (!s || s.feedback !== 'exam' || s.submitted) return;
  const left = s.limitS - (Date.now() - s.startedAt) / 1000;
  const el = $('#timer'); if (el) { el.lastChild.textContent = fmtClock(left); el.className = 'timer ' + timerClass(left); }
  if (left <= 0) submitExam(s, true);
}
function renderQ(){
  const s = P.sess, id = curId(), q = Q(id), n = s.qids.length, exam = s.feedback === 'exam';
  const resp = s.resp[id], perm = (s.opt && s.opt[id]) || 'ABCD';
  const inst = exam && s.instant && !s.submitted;
  const reveal = exam ? s.submitted || (inst && !!resp) : !!(resp || s.revealed[id]);
  const locked = exam ? s.submitted || (inst && !!resp) : !!resp;
  const answeredN = s.qids.filter(x => s.resp[x]).length;
  const left = s.limitS - (Date.now() - s.startedAt) / 1000;
  const focusOn = st.settings.focus;
  // header
  $('#p-head').innerHTML = '<div class="p-headrow"><div class="p-count">' + secIcon(SECTIONS[q.gsec - 1], true) + '<div style="min-width:0"><span class="qpill" dir="ltr" aria-label="' + t('question') + ' ' + (s.idx + 1) + ' ' + t('of') + ' ' + n + '"><b class="num">' + (s.idx + 1) + '</b><span class="num"> / ' + n + '</span></span><span class="sec">' + ltr(q.sectionName) + '</span></div></div><div class="p-tools">' +
    (exam && !s.submitted ? '<span class="timer ' + timerClass(left) + '" id="timer" role="timer" aria-label="' + t('timeLeft') + '">' + ic('clock') + '<span>' + fmtClock(left) + '</span></span>' : '') +
    (exam && !s.submitted ? '<button class="icon-btn tool mark-btn" data-act="mark" aria-pressed="' + !!s.marked[id] + '" aria-label="' + t('markReview') + '" title="' + t('markReview') + ' (M)">' + ic(s.marked[id] ? 'bookmarkF' : 'bookmark') + '<span class="tl">' + t('toolMark') + '</span></button>' : '') +
    '<button class="icon-btn tool ink-btn" data-act="ink" aria-pressed="' + !!P.ink + '" aria-label="' + t('toolInk') + '" title="' + t('toolInk') + ' (P)">' + ic('pen') + '<span class="tl">' + t('toolInk') + '</span></button>' +
    '<button class="icon-btn tool" data-act="labs" aria-label="' + t('labs') + '" title="' + t('labs') + ' (L)">' + ic('flask') + '<span class="tl">' + t('toolLabs') + '</span></button>' +
    '<button class="icon-btn tool flag-btn" data-act="flag" aria-pressed="' + !!st.flags[id] + '" aria-label="' + t('flag') + '" title="' + t('flag') + ' (F)">' + ic(st.flags[id] ? 'starF' : 'star') + '<span class="tl">' + t('toolFlag') + '</span></button>' +
    '<button class="icon-btn hide-phone" data-act="focus" aria-pressed="' + focusOn + '" aria-label="' + t('focusToggle') + '" title="' + t('focusToggle') + '">' + ic('focus') + '</button>' +
    (exam && !s.submitted ? '<button class="btn sm primary" data-act="submit">' + t('submit') + '</button>' : exam ? '<a class="btn sm" href="#/results/' + s.id + '">' + t('results') + '</a>' : s.mode !== 'browse' ? '<button class="btn sm" data-act="finish">' + t('finish') + '</button>' : '') +
    (focusOn ? '<button class="icon-btn tool" data-act="back" aria-label="' + t('exitFocus') + '" title="' + t('exitFocus') + '">' + ic('x') + '<span class="tl">' + t('toolExit') + '</span></button>' : '') +
    '</div></div><div class="p-progrow"><div class="bar p-progress" role="progressbar" aria-label="' + t('answered') + '" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + answeredN + '"><span style="width:' + pct(answeredN, n) + '%"></span></div><span class="small muted num">' + tf('answeredOf', {a:answeredN, n}) + '</span></div>';
  // options
  let opts = '<div class="opts" role="group" aria-label="Answer options">';
  perm.split('').forEach((orig, i) => {
    const pos = LETTERS[i], mine = resp === orig, isAns = orig === q.answer;
    let cls = '', mk = '', sr = '';
    if (reveal) { if (isAns) { cls = 'correct'; mk = ic('check'); sr = t('correctAnswer'); } else if (mine) { cls = 'wrong'; mk = ic('x'); sr = t('yourAnswer') + ', ' + t('wrongMsg'); } else cls = 'dim'; }
    else if (mine) { cls = 'chosen'; mk = ic('dot'); sr = t('yourAnswer'); }
    if (!reveal && (s.strike[id] || '').includes(orig)) { cls += ' struck'; sr = (sr ? sr + ', ' : '') + t('struck'); }
    opts +='<button class="opt ' + cls + '" data-act="choose" data-pos="' + i + '" aria-pressed="' + mine + '"' + (locked ? ' disabled' : '') + '><span class="key" aria-hidden="true">' + pos + '</span><span class="txt"><span class="sr-only">' + pos + '. </span>' + fmt(q.options[orig]) + (sr ? '<span class="sr-only"> (' + sr + ')</span>' : '') + '</span><span class="mk">' + mk + '</span></button>';
  });
  opts += '</div>';
  let fb = '';
  if (reveal && resp) fb = resp === q.answer ? '<div class="feedback ok" role="status">' + ic('check') + t('correctMsg') + '</div>' : '<div class="feedback bad" role="status">' + ic('x') + t('wrongMsg') + ' — ' + t('correctAnswer') + ': ' + LETTERS[perm.indexOf(q.answer)] + '</div>';
  // confidence check after a correct instant-feedback answer
  let conf = '';
  if ((!exam || inst) && resp === q.answer) {
    if (!s.conf[id]) conf = '<div class="conf"><span class="q">' + t('wasSure') + '</span><button class="btn sm" data-act="conf" data-v="s">' + ic('check') + t('sure') + ' <span class="kbd hide-phone">S</span></button><button class="btn sm" data-act="conf" data-v="g">' + ic('refresh') + t('guessed') + ' <span class="kbd hide-phone">G</span></button></div>';
    else if (s.conf[id] === 'g') conf = '<div class="conf-note">' + ic('refresh') + t('guessNote') + '</div>';
  }
  const allDone = !exam && s.mode !== 'browse' && answeredN === n;
  if (allDone && !s.endedAt) { s.endedAt = Date.now(); save(); if (s.mode !== 'browse') track('session_end', {mode:s.mode}); }

// swipe anywhere on the question screen (question, explanation, note card); el listens, parts() are the panes that slide

  const sideScroll = n => { for (; n && n !== el; n = n.parentElement) { if (n.scrollWidth > n.clientWidth + 2 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return true; } return false; };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fwd = () => document.documentElement.dir === 'rtl' ? 1 : -1; // sign of dx that means "next"
  const set = (x, t) => parts().forEach(p => { p.style.transition = t ? 'transform .22s ease, opacity .22s ease' : 'none'; p.style.transform = x ? 'translateX(' + x + 'px)' : ''; p.style.opacity = x ? String(Math.max(.35, 1 - Math.abs(x) / 500)) : ''; });

  }, {passive:true});

  }, {passive:true});

    if (x0 === null) return; x0 = null;
    if (!horiz || !P.sess) { set(0, true); return; }
    const to = P.sess.idx + (Math.sign(dx) === fwd() ? 1 : -1);

}

   ===================================================================== */
function readiness(){
  const ids = scopeIds(), o = statsFor(ids); if (!o.att) return null;
  const coverage = pct(o.att, ids.length);
  const exams = st.order.slice().reverse().map(id => st.sessions[id]).filter(s => s.mode === 'exam' && s.submitted && s.qids.some(inScope)).slice(0, 3);
  const examAvg = exams.length ? Math.round(exams.reduce((a, s) => a + sessionResult(s).pct, 0) / exams.length) : null;
  const score = Math.round(0.3 * coverage + 0.4 * o.acc + 0.3 * (examAvg === null ? o.acc : examAvg));
  return {score, coverage, acc:o.acc, examAvg, level:score >= 75 ? 'good' : score >= 60 ? 'fair' : 'weak'};
}

  const r = readiness();

    '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 56 56)" stroke="' + col + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - r.score / 100)) + '"/>' +

/* pull-to-refresh on touch screens (not inside a question session or a dialog) */
(function pullToRefresh(){

  let y0 = null, dy = 0, ind = null;
  const can = () => !P.sess && !$('#modal-root').innerHTML && !P.drawer && CL.user && scrollY <= 0;
  addEventListener('touchstart', e => { y0 = can() && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 === null) return;

    const d = Math.min(dy, 120) * .6; ind.style.transform = 'translate(-50%,' + d + 'px) rotate(' + dy * 2 + 'deg)'; ind.classList.toggle('ready', dy > 80);

    el.classList.add('spin'); el.style.transform = 'translate(-50%,48px)';

function importFile(file){

  };

function mergeState(inc){
  for (const k in inc.answers) { const a = st.answers[k], b = inc.answers[k]; if (!a || b.lastAt > a.lastAt) { st.answers[k] = b; if (inc.leitner[k]) st.leitner[k] = inc.leitner[k]; else delete st.leitner[k]; } }
  for (const k in inc.leitner) if (!st.leitner[k] && !st.answers[k]) st.leitner[k] = inc.leitner[k];
  Object.assign(st.flags, inc.flags);
  for (const k in inc.hl) if (!st.hl[k]) st.hl[k] = inc.hl[k];
  const seenR = new Set(st.reports.map(r => r.ts + '|' + r.id));
  st.reports = st.reports.concat(inc.reports.filter(r => !seenR.has(r.ts + '|' + r.id)));
  for (const k in inc.notes) if (!st.notes[k]) st.notes[k] = inc.notes[k]; else if (st.notes[k] !== inc.notes[k] && !st.notes[k].includes(inc.notes[k])) st.notes[k] += '\n\n' + inc.notes[k];
  for (const k in inc.daily) { const a = st.daily[k], b = inc.daily[k]; if (!a) st.daily[k] = b; else { a.attempted = Math.max(a.attempted, b.attempted); a.correct = Math.max(a.correct, b.correct); a.timeMs = Math.max(a.timeMs, b.timeMs); } }

  st.held = mergeHeld(st.held || {}, inc.held || {});
}

function seqScore(q, ticks){ let s = 0; q.parts.forEach((p, pi) => { let x = 0; p.k.forEach((k, ki) => { if (ticks && ticks[pi + '-' + ki]) x += k[2]; }); s += Math.min(x, p.m); }); return Math.round(s * 10) / 10; }

    if (r.goal && r.goal !== SEQ.goal && (r.at || 0) > (SEQ.at || 0)) { SEQ.goal = r.goal; changed = true; }

    const used = base + Math.round((Date.now() - t0) / 1000), left = lim - used; a.dur = used;

function sqaRowsOf(qs){

(async function init(){
  QROWS = await qcacheRead();
  loadData();
  st = loadState();
  applySettings();
  trkBoot();
  route();
  if (!st.tourDone && !gateOn()) showTour(0); // with sign-in, the welcome screen opens the tour
  cloudInit();
  // Offline caching + installable app when hosted (GitHub Pages); harmless when opened as a local file.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {});
})();
