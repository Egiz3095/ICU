<style>
/* ===================== THEME TOKENS ===================== */
:root{
  /* calm green theme */
  --navy:#123B2C; --teal:#0C7D60; --teal-strong:#0A6650; --teal-soft:#E8F6F1;
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F4F3; --text:#111816; --muted:#5F6B66; --border:#E5E7E6;
  --accent:#0C7D60; --accent-ink:#FFFFFF;
  --ok:#166534; --ok-bg:#E3F5E8; --ok-line:#86CFA0;
  --bad:#B42318; --bad-bg:#FDECEA; --bad-line:#F1A39B;
  --warn:#8A5A00; --warn-bg:#FFF2D6; --warn-line:#E8C06A;
  --none:#6B7686; --none-bg:#EBEEF3;
  --flag:#B7791F;
  --shadow:0 2px 10px -2px rgba(0,0,0,.06);
  --radius:20px; --fs:17px;
  --brand-grad:linear-gradient(135deg,#14A37F,#07533F);
  --side-w:236px;
  --qfont:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font:var(--qfont);
  --sec-l:93%; --sec-d:30%; --sec-s:55%;
  color-scheme:light;
}
:root[lang="ar"]{--font:Cairo,"Noto Sans Arabic",Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0B1410; --teal:#4FD1A5; --teal-strong:#8BE5C7; --teal-soft:#16302A;
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --text:#F2F2F7; --muted:#9A9AA2; --border:#2C2C2E;
    --accent:#4FD1A5; --accent-ink:#06261C;
    --ok:#5AD08F; --ok-bg:#123222; --ok-line:#2F7A51;
    --bad:#FF8A80; --bad-bg:#3A1716; --bad-line:#8C3A33;
    --warn:#F2BC54; --warn-bg:#382A0E; --warn-line:#8A6A24;
    --none:#8E9AAB; --none-bg:#223047;
    --flag:#F2BC54;
    --shadow:none;
    --sec-l:22%; --sec-d:74%; --sec-s:35%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0B1410; --teal:#4FD1A5; --teal-strong:#8BE5C7; --teal-soft:#16302A;
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --text:#F2F2F7; --muted:#9A9AA2; --border:#2C2C2E;
  --accent:#4FD1A5; --accent-ink:#06261C;
  --ok:#5AD08F; --ok-bg:#123222; --ok-line:#2F7A51;
  --bad:#FF8A80; --bad-bg:#3A1716; --bad-line:#8C3A33;
  --warn:#F2BC54; --warn-bg:#382A0E; --warn-line:#8A6A24;
  --none:#8E9AAB; --none-bg:#223047;
  --flag:#F2BC54;
  --shadow:none;
  --sec-l:22%; --sec-d:74%; --sec-s:35%;
  color-scheme:dark;
}

/* ===================== BASE ===================== */
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;overflow-x:hidden}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.35rem} h2{font-size:1.12rem} h3{font-size:1rem}
p{margin:0 0 .75rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.modal .btn:focus-visible{outline-width:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
sup{font-size:.7em;line-height:0}
mark{background:#FFE58A;color:#1a1a1a;border-radius:3px;padding:0 1px}
[hidden]{display:none!important}
.qtext{font-family:var(--qfont)}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.i.xs{width:.8em;height:.8em}
[dir="rtl"] .i.flip{transform:scaleX(-1)}

/* ===================== SHELL ===================== */
.app{min-height:100vh;display:flex}
.sidebar{background:var(--surface);color:var(--text);display:flex;flex-direction:column;border-inline-end:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.6rem;padding:1rem 1rem .75rem;font-weight:700;letter-spacing:.2px;color:var(--text);text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:grid;place-items:center;color:#fff;flex:none}
.brand-mark .i{width:20px;height:20px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.nav-link{display:flex;align-items:center;gap:.7rem;color:var(--muted);text-decoration:none;padding:.65rem 1rem;margin:2px .6rem;border-radius:10px;font-weight:500;min-height:44px}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link[aria-current="page"]{background:var(--teal-soft);color:var(--teal-strong);font-weight:600}
.nav-link svg{width:20px;height:20px;flex:none}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;padding:calc(.55rem + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) .55rem max(16px, env(safe-area-inset-left));min-height:56px}
.topbar h1{font-size:1.05rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text);text-decoration:none;padding:0 .4rem}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.lang-btn span{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 .35rem;border:1.5px solid currentColor;border-radius:7px;font-weight:700;font-size:.85rem;line-height:1}
.lang-btn #lang-label:lang(ar){font-family:Cairo,"Noto Sans Arabic",Tahoma,sans-serif;font-size:1rem}
main{flex:1;padding:16px;width:100%;max-width:1180px;margin:0 auto}
main:focus{outline:none}
.disclaimer{font-size:.78rem;color:var(--muted);text-align:center;padding:12px 16px 16px}
.bottomnav{display:none}
.storage-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);padding:.5rem .75rem;border-radius:10px;margin-bottom:12px;font-size:.88rem}
/* focus mode: hide app chrome while answering */
body.focus-pref.in-player .sidebar,body.focus-pref.in-player .topbar{display:none!important}
body.focus-pref.in-player main{padding-top:calc(16px + env(safe-area-inset-top))}

@media (max-width:599.98px){
  .sidebar{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45rem 0 .4rem;font-size:.7rem;color:var(--muted);text-decoration:none;min-height:56px;justify-content:center}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a[aria-current="page"]{color:var(--accent);font-weight:600}
  .app{padding-bottom:64px}
  body.in-player .bottomnav{display:none}
  body.in-player .app{padding-bottom:76px}
  .hide-phone{display:none!important}
  .tbl.sess th:nth-child(3),.tbl.sess td:nth-child(3){display:none}
  .tbl th,.tbl td{padding:.5rem .35rem}
  .bankpick #bank-l{display:none}
  .bankpick .seg{display:flex;flex-wrap:nowrap;width:100%}
  .bankpick .seg button{flex:1 1 0;min-width:0;padding:.4rem .25rem;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (min-width:600px) and (max-width:1024px){
  .app{flex-direction:column}
  .sidebar{flex-direction:row;align-items:center;position:sticky;top:0;z-index:35;overflow-x:auto;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .brand{padding:.5rem .75rem}
  .brand small,.brand .bt{display:none}
  .nav-links{display:flex;flex:1}
  .nav-link{flex:1;justify-content:center;gap:.35rem;padding:.45rem .3rem;margin:6px 2px;font-size:.82rem;white-space:nowrap}
  .nav-link svg{width:18px;height:18px}
  .sidebar{padding-top:env(safe-area-inset-top)}
  .topbar{top:calc(56px + env(safe-area-inset-top));padding-top:.55rem}
  .hide-tablet{display:none!important}
}
@media (min-width:1025px){
  .sidebar{width:var(--side-w);position:sticky;top:0;height:100vh;flex:none}
  .nav-links{display:flex;flex-direction:column;margin-top:.5rem}
  .side-foot{margin-top:auto;padding:1rem;font-size:.75rem;color:var(--muted)}
  .hide-desktop{display:none!important}
}
@media (max-width:1024px){ .side-foot{display:none} }

/* ===================== COMPONENTS ===================== */
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.card-title h2{margin:0;display:flex;align-items:center;gap:.45rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack > * + *{margin-top:16px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:.6rem 1.05rem;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--teal-strong);border-color:var(--teal-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:40px;padding:.4rem .8rem;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;font-weight:600;padding:.15rem .5rem;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.st-good{--st:var(--ok);--st-bg:var(--ok-bg);--st-line:var(--ok-line)}
.st-fair{--st:var(--warn);--st-bg:var(--warn-bg);--st-line:var(--warn-line)}
.st-weak{--st:var(--bad);--st-bg:var(--bad-bg);--st-line:var(--bad-line)}
.st-none{--st:var(--none);--st-bg:var(--none-bg);--st-line:var(--border)}
.badge.st{color:var(--st);background:var(--st-bg);border-color:var(--st-line)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.field > label,.field > .lbl{font-weight:600;font-size:.92rem}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:.55rem .75rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:.45rem .85rem;border:1px solid var(--border);border-radius:99px;background:var(--surface);font-size:.9rem;font-weight:500}
.chip input:checked + span{background:var(--teal-soft);border-color:var(--accent);color:var(--text)}
.chip input:checked + span::before{content:"";width:.55em;height:.95em;border:solid var(--accent);border-width:0 .17em .17em 0;transform:rotate(45deg) translateY(-.1em);margin-inline-end:.2em}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:44px;padding:.4rem .9rem;border:0;background:var(--surface);cursor:pointer;font-weight:500;border-inline-end:1px solid var(--border)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.switch{display:flex;align-items:center;gap:.6rem;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.empty{text-align:center;padding:1.25rem 1rem;color:var(--muted)}
.empty .i{width:2.2rem;height:2.2rem;display:block;margin:0 auto .5rem;color:var(--accent);opacity:.8}
.empty p{max-width:34ch;margin:0 auto .75rem}
.table-wrap{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:.55rem .5rem;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
/* section identity: hue per section, light/dark aware */
.sec-ic{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;flex:none;background:hsl(var(--h) var(--sec-s) var(--sec-l));color:hsl(var(--h) 62% var(--sec-d))}
.sec-ic .i{width:20px;height:20px}
.sec-ic.sm{width:28px;height:28px;border-radius:8px}
.sec-ic.sm .i{width:16px;height:16px}

/* ===================== HOME ===================== */
.plan{background:var(--teal-soft);color:var(--text);border:1px solid var(--border);box-shadow:none}
.plan .k{font-size:.82rem;color:var(--teal-strong);font-weight:600;display:flex;align-items:center;gap:.4rem}
.plan h2{font-size:1.35rem;margin:.25rem 0 .75rem}
.plan .goalbar{height:10px;border-radius:99px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.plan .goalbar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.plan .chipsrow{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0 1rem}
.plan .pchip{display:inline-flex;align-items:center;gap:.35rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:.3rem .7rem;font-size:.85rem}
.plan .pchip b{font-variant-numeric:tabular-nums;color:var(--text)}
.btn.light{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.light:hover{background:var(--teal-strong);border-color:var(--teal-strong)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.plan .done{display:inline-flex;align-items:center;gap:.35rem;color:var(--ok);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem .85rem;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.78rem;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:.35rem}
.kpi .k .i{color:var(--accent)}
.kpi .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .bar{margin-top:.35rem;height:6px}
.sec-grid{display:grid;gap:12px;grid-template-columns:1fr}
.sec-card{display:flex;gap:.75rem;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid transparent;border-inline-start:5px solid var(--st);border-radius:var(--radius);padding:.85rem 1rem;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;min-width:0}
.sec-card:hover{transform:translateY(-1px)}
.sec-card .body{flex:1;min-width:0}
.sec-card .top{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.sec-card .name{font-weight:600;line-height:1.3}
.sec-card .meta{display:flex;justify-content:space-between;gap:.5rem;font-size:.82rem;color:var(--muted);margin:.4rem 0 .35rem}
.sec-card .bar > span{background:var(--st)}
.sec-card.st-none .bar > span{background:var(--accent)}
.bank-h{margin:1rem 0 .6rem;font-size:.95rem;color:var(--muted);font-weight:600}
.ins{display:flex;gap:.75rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid var(--border)}
.ins:last-child{border-bottom:0}
.ins > .i{width:1.5rem;height:1.5rem;color:var(--accent);margin-top:.1rem}
.ins.weak > .i{color:var(--bad)} .ins.good > .i{color:var(--ok)} .ins.fair > .i{color:var(--warn)}
.ins .txt{flex:1;min-width:0}
.ins .txt p{margin:0 0 .4rem}

.tool-links b{color:var(--muted);font-weight:600}
.feedback{scroll-margin-top:76px}
.resume-card{display:flex;align-items:center;gap:.8rem;text-decoration:none;color:var(--text);background:linear-gradient(135deg,var(--teal-soft),var(--surface) 70%)}
.resume-card .rc-ic{width:44px;height:44px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

[dir="ltr"] .rc-chev{transform:scaleX(-1)}
.p-main > .card{position:relative}

.fs-ctl button:hover:not(:disabled){color:var(--accent);background:var(--surface)}
.fs-ctl button:disabled{opacity:.35;cursor:default}
.p-main .qmeta{padding-inline-start:84px;min-height:30px}
.res-top{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;margin:.5rem 0}

.res-stats{display:flex;gap:1.25rem;flex-wrap:wrap}

.res-sec .rs-name{min-width:0;font-weight:500;font-size:.9rem}

.res-sec .bar{grid-column:1/-1;height:6px} .res-sec .bar > span{background:var(--st)}
.st-tabs{width:100%}.st-tabs button{flex:1}
.st-tab[hidden]{display:none}
.drawer[data-f="un"] .qcell:not(.s-un){display:none}
.drawer[data-f="mk"] .qcell:not(:has(.fl,.bm)){display:none}
.nav-f button{padding-inline:.7rem;font-size:.85rem}
.sk{display:block;height:12px;border-radius:8px;margin:.55rem 0;background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
.sk.tall{height:22px}.sk.w30{width:30%}.sk.w40{width:40%}.sk.w55{width:55%}.sk.w70{width:70%}.sk.w80{width:80%}

.tour-art{width:120px;height:120px;margin:.25rem auto 1rem;border-radius:32px;display:grid;place-items:center;background:var(--teal-soft);color:var(--accent)}

.tour-p{text-align:center;line-height:1.7}
.sync-pill{display:inline-flex;align-items:center;gap:.35rem;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600;padding:.25rem .5rem;border-radius:99px;min-height:28px;flex:none}

@keyframes pulseDot{50%{opacity:.35}}
.ptr{position:fixed;top:calc(env(safe-area-inset-top) + 56px);left:50%;z-index:60;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--muted);transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){.sync-pill.busy i,.ptr.spin .i{animation:none}}
.chip-fold{border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.chip-fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem .9rem;min-height:48px;font-weight:600}
.chip-fold > summary::-webkit-details-marker{display:none}
.chip-fold > summary .i{transition:transform .15s;color:var(--muted)}
.chip-fold[open] > summary .i{transform:rotate(180deg)}
.chip-fold > .cf-body{padding:0 .75rem .75rem}
details.more-list > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.75rem;font-weight:600;color:var(--teal);min-height:44px}

@media (min-width:600px){

}

/* mini question grid / heatmap */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qcell{min-height:42px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:.8rem;font-weight:600;cursor:pointer;position:relative;display:grid;place-items:center;text-decoration:none;color:var(--text);padding:0}
.qcell.s-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.qcell.s-bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.qcell.s-ans{background:var(--teal-soft);border-color:var(--accent)}
.qcell.cur{outline:3px solid var(--accent);outline-offset:1px}
.qcell .fl{position:absolute;top:-7px;inset-inline-end:-5px;color:var(--flag);line-height:0}
.qcell .bm{position:absolute;top:-7px;inset-inline-start:-5px;color:var(--accent);line-height:0}
.qcell .fl .i,.qcell .bm .i{width:14px;height:14px}
.qcell .ic{position:absolute;bottom:2px;inset-inline-end:3px;line-height:0}
.qcell .ic .i{width:10px;height:10px}
.heat{display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:3px}
.heat button{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--none-bg);cursor:pointer;min-width:0;box-shadow:inset 0 0 0 1px var(--border)}
.heat .h-ok{background:var(--ok);box-shadow:none}
.heat .h-bad{background:repeating-linear-gradient(45deg,var(--bad) 0 3px,var(--bad-bg) 3px 5px);box-shadow:none}
.heat .h-flag{box-shadow:inset 0 0 0 2px var(--flag)}
.heat .h-sec{grid-column:1/-1;aspect-ratio:auto;height:auto;background:none;box-shadow:none;font-size:.72rem;color:var(--muted);text-align:start;padding:.3rem 0 .1rem;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.8rem;color:var(--muted);margin-top:.6rem;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:.3rem}

/* ===================== PLAYER ===================== */
.player{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main" "side"}
.p-head{grid-area:head}
.p-main{grid-area:main;min-width:0}
.p-side{grid-area:side;min-width:0}
.p-side > * + *{margin-top:16px}
.p-nav{grid-area:nav;display:none;min-width:0}
.p-headrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.p-count{font-weight:600;display:flex;align-items:center;gap:.6rem;min-width:0}
.p-count .sec{color:var(--muted);font-weight:500;font-size:.88rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-tools{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
@media (max-width:640px){
  .p-headrow{flex-wrap:nowrap}

  .p-tools{flex-wrap:nowrap;gap:0}

}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:.3rem .65rem;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);min-height:40px;display:inline-flex;align-items:center;gap:.35rem;font-size:1.05rem}
.timer.soon{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.timer.warn{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.flag-btn[aria-pressed="true"]{color:var(--flag)}
.mark-btn[aria-pressed="true"]{color:var(--accent);background:var(--teal-soft)}
.p-progress{margin-top:.6rem}
.stem{font-size:1.12rem;font-weight:600;line-height:1.55;margin:0 0 1rem}
.qmeta{font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:.75rem;width:100%;min-height:52px;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;text-align:start;line-height:1.45;transition:background .12s,border-color .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--surface-2)}
.opt .key{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.9rem;border:1px solid var(--border)}
.opt .txt{flex:1;padding-top:.1rem}
.opt .mk{flex:none;width:1.4rem;display:grid;place-items:center;padding-top:.2rem}
.opt .mk .i{width:1.25rem;height:1.25rem;stroke-width:3}
.opt.chosen{border-color:var(--accent);background:var(--teal-soft)}
.opt.chosen .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.72}
.feedback{margin-top:14px;padding:.75rem .9rem;border-radius:12px;font-weight:600;display:flex;gap:.5rem;align-items:center;animation:pop .18s ease-out}
.feedback .i{width:1.3rem;height:1.3rem;stroke-width:3}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.feedback.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.conf{margin-top:10px;padding:.65rem .85rem;border:1px dashed var(--border);border-radius:12px;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.conf .q{font-weight:600;flex:1;min-width:10ch}

.expl .ans{font-weight:600;margin-bottom:.5rem}
.expl .body{line-height:1.6}
details.distractor{margin-top:.85rem;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);border-inline-start:5px solid var(--warn)}
details.distractor > summary{cursor:pointer;padding:.65rem .9rem;font-weight:700;color:var(--warn);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:44px}

details.distractor > summary .i{transition:transform .15s}
details.distractor[open] > summary .i{transform:rotate(180deg)}
details.distractor > div{padding:0 .9rem .75rem}
.p-actions{display:flex;gap:.6rem;margin-top:16px}
.p-actions .btn{flex:1}
.p-bar{display:none}
.saved-ind{font-size:.78rem;color:var(--muted);min-height:1.2em}
.complete{border:1px solid var(--ok-line);background:var(--ok-bg)}
.nav-legend{display:flex;flex-wrap:wrap;gap:.6rem;font-size:.75rem;color:var(--muted);margin-top:.7rem}

  .p-nav .qgrid{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}

}

  .player{grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"head head" "main side" "main nav";align-items:start}

  body.focus-pref.in-player main{max-width:1280px}

.drawer-back{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:60;animation:fade .15s}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:16px 16px 0 0;max-height:78vh;overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .18s ease-out}

/* ===================== MODAL / TOAST / TOUR ===================== */
.modal-back{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);color:var(--text);border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}

.modal h3{margin:1rem 0 .5rem;font-size:.95rem}
.modal .actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
.tour-ic{width:52px;height:52px;border-radius:14px;background:var(--teal-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}

.dots{display:flex;gap:6px;justify-content:center;margin-top:1rem}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--border)}
.dots i.on{background:var(--accent);width:22px}
.sum-row{display:flex;gap:1rem;flex-wrap:wrap}
.sum-row div{flex:1;min-width:80px;background:var(--surface-2);border-radius:10px;padding:.5rem .7rem}
.sum-row b{display:block;font-size:1.3rem}
.kbd{display:inline-block;min-width:1.7em;text-align:center;padding:.05rem .4rem;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;font-size:.85rem;font-weight:600;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.65rem 1rem;border-radius:10px;z-index:90;box-shadow:var(--shadow);font-size:.92rem;max-width:calc(100% - 32px);animation:fade .15s}
:root[data-theme="dark"] .toast{background:#24352C}

/* ===================== SEARCH / RESULTS / STATS ===================== */
.search-bar{display:grid;gap:.6rem;grid-template-columns:1fr}
@media (min-width:600px){.search-bar{grid-template-columns:1fr 260px}}
.result{display:block;text-decoration:none;color:var(--text);padding:.85rem 0;border-bottom:1px solid var(--border)}
.result:hover .r-stem{color:var(--accent)}
.result .r-meta{font-size:.78rem;color:var(--muted);margin-bottom:.2rem}

.score-big{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

.passbar .line b{position:absolute;top:-20px;transform:translateX(-50%);font-size:.72rem;white-space:nowrap;color:var(--muted)}
.rev-item{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.rev-item > summary{list-style:none;cursor:pointer;padding:.75rem .9rem;display:flex;gap:.6rem;align-items:flex-start}
.rev-item > summary::-webkit-details-marker{display:none}
.rev-item > summary .st-ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.rev-item > summary .st-ic .i{width:15px;height:15px;stroke-width:3}
.rev-item .ok-ic{background:var(--ok-bg);color:var(--ok)}
.rev-item .bad-ic{background:var(--bad-bg);color:var(--bad)}
.rev-item .un-ic{background:var(--none-bg);color:var(--none)}
.rev-item .rv-body{padding:0 .9rem .9rem}
.rev-item .opts .opt{min-height:44px;cursor:default}
.hbar{display:grid;grid-template-columns:minmax(0,1fr);gap:.2rem;margin-bottom:.8rem}
.hbar .lab{display:flex;justify-content:space-between;gap:.5rem;font-size:.86rem;align-items:center}
.hbar .lab > span:first-child{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.hbar .lab > .num{flex:none;white-space:nowrap}

.next{display:flex;gap:14px;align-items:center}

/* ===================== PRO TOOLS ===================== */
.opt{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

mark.hl{background:#FFE58A;color:#1a1a1a;border-radius:3px;padding:0 1px;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* new bank announcement */
.newbank{display:flex;gap:14px;align-items:flex-start;position:relative;border:1px solid var(--ok-line);background:linear-gradient(135deg,var(--teal-soft),var(--surface) 70%);overflow:hidden}

/* 1/4 names and bank tags */
bdi{unicode-bidi:isolate}
.btag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.02em;padding:.05rem .4rem;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-inline-end:.35rem;vertical-align:.1em;white-space:nowrap}
/* 2 top bar logo (phones) */
.tb-mark{display:none}
@media (max-width:599.98px){.tb-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--brand-grad);color:#fff;flex:none}.tb-mark .i{width:18px;height:18px}.topbar #back-btn:not([hidden]) ~ .tb-mark{display:none}}
/* 3 today's plan stands out */
.next-card{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 16%,var(--surface)) 0%,var(--surface) 75%);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:0 8px 24px -14px color-mix(in srgb,var(--accent) 60%,transparent)}

.stem{font-weight:500;line-height:1.7;letter-spacing:.005em}

/* 6 question screen */
.qpill{display:inline-flex;align-items:baseline;gap:.1rem;padding:.15rem .6rem;border-radius:99px;background:var(--teal-soft);color:var(--teal-strong);font-size:.95rem}

.expl .ans .key{flex:none;width:24px;height:24px;border-radius:7px;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:.8rem}

/* 7 bottom nav: pill behind the active icon */
@media (max-width:599.98px){
  .bottomnav a svg{box-sizing:content-box;padding:4px 16px;border-radius:99px;transition:background .2s}
  .bottomnav a[aria-current="page"] svg{background:color-mix(in srgb,var(--accent) 18%,transparent)}
}
/* 8 stats section cards */
.sec-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.6rem}
.sec-card{display:flex;gap:.7rem;align-items:center;padding:.65rem .75rem;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}

.sec-card .sc-name{font-weight:600;font-size:.9rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.2rem}
.sec-card .sc-bar{height:4px;border-radius:99px;background:var(--surface-2);margin-top:.35rem;overflow:hidden}
.sec-card .sc-bar span{display:block;height:100%;background:var(--st);border-radius:99px}

/* answer feedback */
.opt{position:relative}
.opt.fx-ok{animation:fx-ok .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes fx-ok{0%{transform:scale(.97);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}45%{transform:scale(1.025)}100%{transform:none;box-shadow:0 0 0 12px transparent}}

@keyframes fx-bad{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback.fx-in{animation:fx-in .35s ease-out}
@keyframes fx-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx-burst{position:absolute;inset-inline-end:22px;top:50%;width:0;height:0;pointer-events:none}
.fx-burst i{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--ok);transform:rotate(var(--a)) translateX(0);animation:fx-dot .7s ease-out forwards}
.fx-burst i:nth-child(3n){background:var(--flag)}
@keyframes fx-dot{to{transform:rotate(var(--a)) translateX(34px);opacity:0}}

.spinner{display:inline-block;width:20px;height:20px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--teal) 25%,transparent);border-top-color:var(--teal);animation:spin .8s linear infinite;flex:none}

.qotd-peek{font-weight:600;line-height:1.5}
.p-main{touch-action:pan-y}
@media (prefers-reduced-motion:reduce){.opt.fx-ok,.opt.fx-bad,.feedback.fx-in,.spinner{animation:none}.fx-burst{display:none}}
@media (prefers-reduced-motion:reduce){.ios-arrow{animation:none}}
@keyframes nb-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

   DATA
   Several question banks; every question gets a stable key "<bankId>-<number>" (e.g. icu500-12).
   SECTIONS is a global list across banks: n = 1..N, local = number inside its bank. New banks are appended.
   ===================================================================== */
const LETTERS = ['A','B','C','D'];
let BANKS = [], QS = [], SECTIONS = [], ALL_IDS = [];
const QMAP = new Map();
function loadData(){
  // questions come from the server (cached on the device); the page only keeps the names of the original banks
  const builtIn = JSON.parse(document.getElementById('qdata').textContent).banks, cloud = banksFromRows(cachedCloudRows());
  BANKS = builtIn.map(b => { const c = cloud.find(x => x.id === b.id); return c ? Object.assign(c, {short:b.short, title:b.title}) : b; })
    .concat(cloud.filter(c => !builtIn.some(b => b.id === c.id))).filter(b => b.questions.length)
    .filter(b => !bcfg(b).hidden || lsGet('icuMcq500.isAdm') === '1'); // drafts: admins only
  for (const b of BANKS) {
    b.ids = [];
    b.sections.forEach((s, i) => { s.g = SECTIONS.length + 1; SECTIONS.push({n:s.g, bank:b.id, bankShort:b.short, local:i + 1, name:s.name, from:s.from, to:s.to, ids:[]}); });
    for (const q of b.questions) {
      q.key = b.id + '-' + q.id; q.bank = b.id; q.bankShort = b.short; q.num = q.id; q.gsec = b.sections[q.section - 1].g; q.ord = QS.length;
      QS.push(q); QMAP.set(q.key, q); SECTIONS[q.gsec - 1].ids.push(q.key); b.ids.push(q.key);
    }
  }
  ALL_IDS = QS.map(q => q.key);
  // display tweaks from the admin: names, section order, bank order (ids and numbers stay the same)
  BANKS.forEach((b, i) => {
    const c = bcfg(b); b.home = i; b.name = c.label || b.short || b.title; if (c.label) b.title = c.label;
    if (Array.isArray(c.sec_order)) { const rank = n => { const r = c.sec_order.indexOf(n); return r < 0 ? 1000 : r; };
      SECTIONS.filter(s => s.bank === b.id).sort((x, y) => rank(x.name) - rank(y.name) || x.local - y.local).forEach((s, k) => { s.local = k + 1; }); }
  });
  BANKS.sort((a, b) => (bcfg(a).ord ?? 1000 + a.home) - (bcfg(b).ord ?? 1000 + b.home));
}
function secOrder(x, y){ return BANKS.findIndex(b => b.id === x.bank) - BANKS.findIndex(b => b.id === y.bank) || x.local - y.local; }
const Q = k => QMAP.get(k);

/* bedside-monitor ECG: a sweeping trace drawn on canvas at a fixed pixel scale, so it looks the same on any screen */
const ECG = {raf:0, ro:null, frac:0};
function ecgStop(){ cancelAnimationFrame(ECG.raf); ECG.raf = 0; if (ECG.ro) { ECG.ro.disconnect(); ECG.ro = null; } }
function ecgStart(){
  ecgStop();
  const cv = $('#gate canvas'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, ys, head = 0, phase = 0, base, amp, beatW, last = 0, rr = 0.84;
  // sum of gaussians for P, Q, R, S, T waves; p is the position within one beat (0–1)
  const g = (p, c, w, a) => a * Math.exp(-((p - c) ** 2) / (2 * w * w));
  const shape = p => g(p, .16, .022, .11) + g(p, .335, .007, -.10) + g(p, .36, .0085, 1) + g(p, .385, .008, -.24) + g(p, .6, .042, .21);
  function size(){
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // keep the trace clear of the header above and the text/card below it
    const cr = cv.getBoundingClientRect(), rel = el => el && el.offsetParent ? el.getBoundingClientRect() : null;
    const top = (rel($('#gate .hero-top')) || {bottom:cr.top + 60}).bottom - cr.top + 12;
    const card = rel($('#gate .gate-card')), copy = rel($('#gate .hero-copy')), foot = rel($('#gate .hero-foot'));
    let bottom = H - 12;
    for (const r of [card, copy, foot]) if (r && r.top - cr.top > top + 40 && r.left < cr.right && r.right > cr.left) bottom = Math.min(bottom, r.top - cr.top - 12);
    // R wave reaches ~1×amp above the baseline, S and T ~0.25×amp below it
    amp = Math.max(30, Math.min(130, (bottom - top) / 1.3));
    base = top + amp + Math.max(0, ((bottom - top) - amp * 1.3) / 2);
    beatW = Math.max(150, Math.min(W * (W >= 700 ? .22 : .42), 280));
    ys = new Float32Array(W).fill(NaN); head = 0; phase = 0;
    if (reduce) { for (let x = 0; x < W; x++) ys[x] = base - shape((x % beatW) / beatW) * amp; draw(); }
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    const gap = reduce ? 0 : Math.max(24, W * .03);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const [lw, col, blur] of [[5, 'rgba(52,211,153,.18)', 14], [2, '#34D399', 6]]) {
      ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.shadowColor = 'rgba(52,211,153,.7)'; ctx.shadowBlur = blur;
      ctx.beginPath(); let pen = false;
      for (let x = 0; x < W; x++) {
        const d = (x - head + W) % W, y = ys[x];
        if ((d > 0 && d < gap) || y !== y) { pen = false; continue; }
        if (pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; }
      }
      ctx.stroke();
    }
    if (!reduce && ys[head] === ys[head]) { ctx.shadowBlur = 18; ctx.shadowColor = '#A7F3D0'; ctx.fillStyle = '#ECFDF5'; ctx.beginPath(); ctx.arc(head, ys[head], 2.6, 0, 7); ctx.fill(); }
    ctx.shadowBlur = 0;
  }
  function beat(){
    rr = 0.8 + Math.random() * 0.08;
    const hr = $('#ecg-hr'), sp = $('#ecg-spo2'), box = hr && hr.parentNode;
    if (hr) hr.textContent = Math.round(60 / rr);
    if (sp && Math.random() < .25) sp.textContent = 97 + Math.round(Math.random() * 2);
    if (box) { box.classList.add('blip'); setTimeout(() => box.classList.remove('blip'), 140); }
  }
  function frame(ts){
    if (!last) last = ts;
    const dt = Math.min(ts - last, 64); last = ts;
    let n = (beatW / rr) * dt / 1000 + ECG.frac; ECG.frac = n % 1; n = Math.floor(n);

}

/* =====================================================================
   PROGRESS LOGIC (stats, Leitner spaced repetition, trends, insights)
   ===================================================================== */
const LEITNER_DAYS = {1:1, 2:3, 3:7, 4:14};
function recordAnswer(id, letter, ms){
  ms = Math.min(Math.max(ms || 0, 0), 600000);
  const ok = letter === Q(id).answer, now = Date.now();
  const a = st.answers[id] || {attempts:0, correctCount:0, timeMs:0};
  a.attempts++; if (ok) a.correctCount++; a.last = letter; a.correct = ok; a.lastAt = now; a.timeMs += ms; a.guessed = false;
  st.answers[id] = a;
  const d = st.daily[dayKey()] || (st.daily[dayKey()] = {attempted:0, correct:0, timeMs:0});
  d.attempted++; if (ok) d.correct++; d.timeMs += ms;
  st.log.push([now, id, ok ? 1 : 0]); if (st.log.length > 10000) st.log.splice(0, st.log.length - 10000);
  // Leitner: wrong → box 1; correct moves a tracked card up one box (box 5 = mastered)
  const l = st.leitner[id];
  if (!ok) st.leitner[id] = {box:1, due:startOfDay(now) + LEITNER_DAYS[1] * DAY};
  else if (l) { l.box = Math.min(l.box + 1, 5); l.due = l.box < 5 ? startOfDay(now) + LEITNER_DAYS[l.box] * DAY : null; }
  save();
}
/* a correct answer the user says was a guess goes back to box 1 so it returns tomorrow */
function markGuess(id){
  if (st.answers[id]) st.answers[id].guessed = true;
  st.leitner[id] = {box:1, due:startOfDay(Date.now()) + DAY};
  save();
}
function dueIds(){ const end = startOfDay(Date.now()) + DAY; return Object.keys(st.leitner).filter(k => inScope(k) && st.leitner[k].box < 5 && st.leitner[k].due < end).sort(byOrd); }
const wrongIds = () => Object.keys(st.answers).filter(k => inScope(k) && !st.answers[k].correct).sort(byOrd);
const flaggedIds = () => Object.keys(st.flags).filter(inScope).sort(byOrd);
function statsFor(ids){
  let att = 0, cor = 0, time = 0, tn = 0;
  for (const id of ids) { const a = st.answers[id]; if (a) { att++; if (a.correct) cor++; if (a.timeMs) { time += a.timeMs; tn += a.attempts; } } }
  return {total:ids.length, att, cor, acc:att ? pct(cor, att) : 0, avgMs:tn ? time / tn : 0};
}
/* accuracy of attempts in the last 7 days vs. all earlier attempts (needs ≥5 of each) */
function trendFor(ids){
  const set = new Set(ids), wk = Date.now() - 7 * DAY, r = [0, 0], p = [0, 0];
  for (const e of st.log) { if (!set.has(e[1])) continue; const b = e[0] >= wk ? r : p; b[0]++; b[1] += e[2]; }
  return r[0] >= 5 && p[0] >= 5 ? {prev:pct(p[1], p[0]), now:pct(r[1], r[0])} : null;
}
function trendHTML(tr){
  if (!tr) return '<span class="trend flat" title="' + t('trend') + '">—</span>';
  const d = tr.now - tr.prev, k = d >= 3 ? 'up' : d <= -3 ? 'down' : 'flat';
  return '<span class="trend ' + k + '" title="' + t('trend') + ': ' + tr.prev + '% → ' + tr.now + '%">' + ic(k, 'xs') + (d > 0 ? '+' : '') + d + '%</span>';
}
function streak(){
  let n = 0; const d = new Date();
  if (!(st.daily[dayKey(d)] || {}).attempted) d.setDate(d.getDate() - 1);
  while ((st.daily[dayKey(d)] || {}).attempted) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const totalStudyMs = () => Object.values(st.daily).reduce((s, d) => s + d.timeMs, 0);
function qStatus(id){ const a = st.answers[id]; return !a ? 'none' : a.correct ? 'ok' : 'bad'; }
/* today's plan: due reviews first, then other mistakes, then new questions from the weakest section */
function buildPlan(){
  const goal = st.settings.dailyGoal, done = (st.daily[dayKey()] || {}).attempted || 0;
  const size = goal > done ? goal - done : 10;
  const due = dueIds(), dueSet = new Set(due);
  const picked = due.slice(0, size);
  const wrong = wrongIds().filter(k => !dueSet.has(k)).slice(0, Math.max(0, size - picked.length));
  const room = size - picked.length - wrong.length, fresh = [];
  const order = scopeSections().map(s => ({s, x:statsFor(s.ids)})).sort((a, b) => (a.x.att >= 5 ? a.x.acc : 1000 + a.s.n) - (b.x.att >= 5 ? b.x.acc : 1000 + b.s.n));
  for (const r of order) { for (const k of r.s.ids) { if (fresh.length >= room) break; if (!st.answers[k]) fresh.push(k); } }
  return {goal, done, size, due:picked, wrong, fresh, qids:[...picked, ...shuffle(wrong), ...fresh]};
}
function insights(){
  const ids = scopeIds(), o = statsFor(ids), out = [];
  if (!o.att) return [{icon:'bulb', text:t('insStart'), act:'<button class="btn sm primary" data-act="start-today">' + ic('play', 'flip') + t('startToday') + '</button>'}];
  const rows = scopeSections().map(s => ({s, x:statsFor(s.ids), tr:trendFor(s.ids)}));
  const weak = rows.filter(r => r.x.att >= 5).sort((a, b) => a.x.acc - b.x.acc)[0];
  if (weak && weak.x.acc < 75) out.push({icon:'target', tone:'weak', text:tf('insWeak', {s:'<b>' + esc(weak.s.name) + '</b>', a:weak.x.acc}), act:'<button class="btn sm" data-act="weak" data-sec="' + weak.s.n + '">' + t('practiseNow') + '</button>'});
  const drop = rows.filter(r => r.tr && r.tr.now - r.tr.prev <= -10).sort((a, b) => (a.tr.now - a.tr.prev) - (b.tr.now - b.tr.prev))[0];
  if (drop) out.push({icon:'down', tone:'weak', text:tf('insDrop', {s:'<b>' + esc(drop.s.name) + '</b>', a:drop.tr.prev, b:drop.tr.now}), act:'<button class="btn sm" data-act="weak" data-sec="' + drop.s.n + '">' + t('practiseNow') + '</button>'});
  const up = rows.filter(r => r.tr && r.tr.now - r.tr.prev >= 10).sort((a, b) => (b.tr.now - b.tr.prev) - (a.tr.now - a.tr.prev))[0];
  if (up) out.push({icon:'up', tone:'good', text:tf('insUp', {s:'<b>' + esc(up.s.name) + '</b>', a:up.tr.prev, b:up.tr.now})});
  const due = dueIds().length;
  if (due) out.push({icon:'refresh', tone:'fair', text:tf('insDue', {n:due}), act:'<button class="btn sm" data-act="start-due">' + t('startReview') + '</button>'});
  let recent = 0; for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); recent += (st.daily[dayKey(d)] || {}).attempted || 0; }
  const perDay = Math.round(recent / 7), remaining = ids.length - o.att;
  if (perDay >= 1 && remaining > 0) out.push({icon:'calendar', text:tf('insPace', {n:perDay, r:remaining, d:Math.ceil(remaining / perDay)})});
  else if (remaining > 0) out.push({icon:'calendar', text:t('insGoal')});
  const slow = rows.filter(r => r.x.avgMs > 90000).sort((a, b) => b.x.avgMs - a.x.avgMs)[0];
  if (slow) out.push({icon:'clock', tone:'fair', text:tf('insSlow', {s:'<b>' + esc(slow.s.name) + '</b>', t:fmtDur(slow.x.avgMs)})});
  return out;
}
const insightsHTML = list => list.map(x => '<div class="ins ' + (x.tone || '') + '">' + ic(x.icon) + '<div class="txt"><p>' + x.text + '</p>' + (x.act || '') + '</div></div>').join('');

/* =====================================================================
   SESSIONS
   ===================================================================== */
const MODE_LABEL = m => t({quick:'quick2', study:'modeStudy', exam:'modeExam', custom:'modeCustom', review:'modeReview', flagged:'modeFlagged', due:'modeDue', browse:'modeBrowse', weak:'modeWeak', today:'modeToday'}[m] || 'modeStudy');
function createSession(o){
  const s = {id:o.id || uid(), mode:o.mode, title:o.title || MODE_LABEL(o.mode), feedback:o.feedback || 'instant', sections:o.sections || [],
    qids:o.qids, opt:null, resp:{}, revealed:{}, qtime:{}, conf:{}, marked:{}, strike:{}, changes:{}, idx:o.idx || 0, startedAt:Date.now(), endedAt:null, submitted:false,
    limitS:o.limitS || 0, passMark:o.passMark || st.settings.passMark};
  if (o.shuffleOpts) { s.opt = {}; s.qids.forEach(id => { s.opt[id] = shuffle(LETTERS).join(''); }); }
  st.sessions[s.id] = s; st.order = st.order.filter(x => x !== s.id); st.order.push(s.id);
  // keep storage bounded: drop the oldest non-browse sessions beyond 150
  const real = st.order.filter(id => st.sessions[id].mode !== 'browse');
  while (real.length > 150) { const old = real.shift(); delete st.sessions[old]; st.order = st.order.filter(x => x !== old); }
  st.lastSessionId = s.id; save();
  if (s.mode !== 'browse') track('session_start', {mode:s.mode});
  return s;
}
function startSession(o){
  if (!o.qids.length) { toast(t('noQs')); return; }
  const s = createSession(o); go('#/session/' + s.id);
}
function sectionsOf(qids){ return [...new Set(qids.filter(validId).map(id => Q(id).gsec))].sort((a, b) => a - b); }
/* short description of a set of sections: whole banks by name, otherwise section numbers */
function secSummary(secs){
  const parts = [];
  for (const b of BANKS) {
    const mine = secs.filter(n => SECTIONS[n - 1] && SECTIONS[n - 1].bank === b.id);
    if (!mine.length) continue;
    const all = mine.length === b.sections.length;
    parts.push((multi() ? b.short + (all ? '' : ' ') : '') + (all ? (multi() ? '' : t('fAll')) : mine.map(n => SECTIONS[n - 1].local).join(', ')));
  }
  return parts.join(' · ');
}
function sessionResult(s){
  let ans = 0, cor = 0; const bySec = {};
  for (const id of s.qids) {
    const sec = Q(id).gsec; const b = bySec[sec] || (bySec[sec] = {total:0, ans:0, cor:0}); b.total++;
    if (s.resp[id]) { ans++; b.ans++; if (s.resp[id] === Q(id).answer) { cor++; b.cor++; } }
  }
  const denom = s.feedback === 'exam' ? s.qids.length : ans;
  const used = s.feedback === 'exam' ? Math.min((s.endedAt || Date.now()) - s.startedAt, s.limitS * 1000 || Infinity)
    : Object.values(s.qtime).reduce((a, b) => a + b, 0);
  return {total:s.qids.length, ans, cor, pct:pct(cor, denom), bySec, used};
}
const isFinished = s => s.feedback === 'exam' ? s.submitted : !!s.endedAt;
function browseSession(sec){
  const S = SECTIONS[sec - 1], id = 'browse-' + S.bank + '-' + S.local;
  return st.sessions[id] || createSession({id, mode:'browse', title:S.name, qids:secIds(sec), sections:[sec]});
}
function openQuestion(id){
  const s = browseSession(Q(id).gsec); s.idx = s.qids.indexOf(id); st.lastSessionId = s.id; save();
  location.replace('#/session/' + s.id);
}
function sectionStudy(n){
  const ids = secIds(n); const first = ids.findIndex(id => !st.answers[id]);
  startSession({mode:'study', title:SECTIONS[n - 1].name, qids:ids, sections:[n], idx:Math.max(first, 0), shuffleOpts:st.settings.shuffleOpts});
}
function weakPractice(n){
  let ids = secIds(n).filter(id => !st.answers[id] || !st.answers[id].correct);
  if (!ids.length) ids = secIds(n);
  startSession({mode:'weak', title:SECTIONS[n - 1].name, qids:shuffle(ids).slice(0, 20), sections:[n], shuffleOpts:st.settings.shuffleOpts});
}
function startToday(){
  const p = buildPlan();
  startSession({mode:'today', title:t('todayPlan'), qids:p.qids, sections:sectionsOf(p.qids), shuffleOpts:st.settings.shuffleOpts});
}

let lastRoute = '#/home';

    case 'results': html = viewResults(parts[1]); title = t('results'); active = (st.sessions[parts[1]] || {}).feedback === 'exam' ? 'exam' : 'review'; break;

const parseDay = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]).getTime() : null; };

const dayWord = n => st.settings.lang === 'ar' ? (n === 1 ? 'يوم' : n === 2 ? 'يومان' : n >= 3 && n <= 10 ? 'أيام' : 'يوماً') : (n === 1 ? 'day' : 'days');

  if (!dates.length) return '<div class="cd-head">' + t('todayPlan') + '</div><a class="small" href="#/settings">' + t('countdownNone') + '</a>';
  const next = dates.find(d => daysTo(d) >= 0);

/* daily pace needed to finish the unanswered questions before the next exam day (keeping the last day for review) */
function paceSuggestion(){
  const next = examDates().find(d => daysTo(d) > 0); if (next === undefined) return null;
  const remaining = scopeIds().filter(k => !st.answers[k]).length; if (!remaining) return null;
  return {n:Math.min(NUM_LIMITS.dailyGoal[1], Math.max(NUM_LIMITS.dailyGoal[0], Math.ceil(remaining / Math.max(1, daysTo(next) - 1)))), remaining, date:next};
}

/* ---- question of the day: one unanswered question from the weakest section, fixed for the day ---- */
function qotdId(){
  const today = dayKey();
  if (st.qotd && st.qotd.day === today && validId(st.qotd.id) && inScope(st.qotd.id)) return st.qotd.id;
  const rows = scopeSections().map(s => ({s, x:statsFor(s.ids)}));
  const weak = rows.filter(r => r.x.att >= 5).sort((a, b) => a.x.acc - b.x.acc);
  let pool = [];
  for (const r of weak.concat(rows.filter(r => !weak.includes(r)))) { pool = r.s.ids.filter(k => !st.answers[k]); if (pool.length) break; }
  if (!pool.length) pool = wrongIds(); if (!pool.length) pool = scopeIds().slice();
  let h = 0; for (const c of today) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  st.qotd = {day:today, id:pool[h % pool.length], resp:null}; save();
  return st.qotd.id;
}
function qotdHTML(){
  const id = qotdId(), q = Q(id), resp = st.qotd.resp;

    const cls = !resp ? '' : isAns ? 'correct' : mine ? 'wrong' : 'dim';
    return '<button class="opt ' + cls + '" data-act="qotd" data-l="' + L + '"' + (resp ? ' disabled' : '') + '><span class="key">' + L + '</span><span class="txt">' + fmt(q.options[L]) + '</span><span class="mk">' + (resp && isAns ? ic('check') : mine ? ic('x') : '') + '</span></button>'; }).join('');

    '<p class="small muted" id="s-count" aria-live="polite" style="margin-top:.75rem"></p><div id="s-results"></div></section>';

function highlight(text, terms){
  if (!terms.length) return fmt(text);
  const lower = text.toLowerCase(), marks = [];
  for (const term of terms) { let i = 0; while ((i = lower.indexOf(term, i)) !== -1) { marks.push([i, i + term.length]); i += term.length; } }
  if (!marks.length) return fmt(text);
  marks.sort((a, b) => a[0] - b[0]);
  const merged = []; for (const m of marks) { const l = merged[merged.length - 1]; if (l && m[0] <= l[1]) l[1] = Math.max(l[1], m[1]); else merged.push(m.slice()); }
  let out = '', p = 0;
  for (const [a, b] of merged) { out += fmt(text.slice(p, a)) + '<mark>' + fmt(text.slice(a, b)) + '</mark>'; p = b; }
  return out + fmt(text.slice(p));
}
function snippet(text, term){
  const i = text.toLowerCase().indexOf(term); if (i < 0) return null;
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + term.length + 90);
  return (a ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '');
}
function runSearch(){
  const qEl = $('#s-q'); if (!qEl) return;
  const raw = qEl.value.trim(), sec = +$('#s-sec').value || 0;
  history.replaceState(null, '', '#/search' + (raw || sec ? '?' + new URLSearchParams(Object.assign(raw ? {q:raw} : {}, sec ? {sec} : {})).toString() : ''));
  const out = $('#s-results'), cnt = $('#s-count');
  if (raw.length < 2) { out.innerHTML = ''; cnt.textContent = t('searchHint'); return; }
  const terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  const idx = searchIndex(), hits = [];
  for (let i = 0; i < QS.length; i++) { if (sec && QS[i].gsec !== sec) continue; if (terms.every(term => idx[i].includes(term))) hits.push(QS[i]); }
  cnt.textContent = hits.length + ' ' + t('resultsN');
  SEARCH_MORE = hits; SEARCH_SHOWN = 0; out.innerHTML = ''; searchMore(terms);
}
let SEARCH_MORE = [], SEARCH_SHOWN = 0;
function searchMore(terms){
  const out = $('#s-results'); if (!out) return;
  terms = terms || ($('#s-q').value.trim().toLowerCase().split(/\s+/).filter(Boolean));
  const btn = $('#s-more'); if (btn) btn.remove();
  const hits = SEARCH_MORE.slice(SEARCH_SHOWN, SEARCH_SHOWN + 25); SEARCH_SHOWN += hits.length;
  out.insertAdjacentHTML('beforeend', hits.map(q => {
    const fields = [...LETTERS.map(l => q.options[l]), q.explanation, q.distractor];
    let snip = ''; if (!terms.every(term => q.stem.toLowerCase().includes(term))) { for (const f of fields) { const sn = snippet(f, terms.find(term => f.toLowerCase().includes(term)) || '\u0000'); if (sn) { snip = sn; break; } } }
    return '<a class="result" href="#/q/' + q.key + '"><div class="r-meta">' + ql(q.key) + ' · ' + ltr(q.sectionName) + '</div><div class="r-stem qtext" dir="ltr" lang="en">' + highlight(q.stem, terms) + '</div>' + (snip ? '<div class="r-snip qtext" dir="ltr" lang="en">' + highlight(snip, terms) + '</div>' : '') + '</a>';
  }).join('') + (SEARCH_MORE.length > SEARCH_SHOWN ? '<button class="btn block" id="s-more" data-act="search-more" style="margin-top:.75rem">' + tf('showMore', {n:SEARCH_MORE.length - SEARCH_SHOWN}) + '</button>' : ''));
}

function lineChart(points){
  if (points.length < 1) return emptyState('stats', t('noData'));
  // a narrower canvas on phones keeps the axis labels readable after scaling
  const W = innerWidth < 600 ? 360 : 640, H = innerWidth < 600 ? 200 : 230, L = 40, R = 14, T = 14, B = 34, iw = W - L - R, ih = H - T - B;
  const x = i => L + (points.length === 1 ? iw / 2 : i * iw / (points.length - 1)), y = v => T + ih - v / 100 * ih;
  let g = '';
  for (const v of [0, 25, 50, 75, 100]) g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '%</text>';
  const path = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = path + ' L' + x(points.length - 1).toFixed(1) + ' ' + y(0) + ' L' + x(0).toFixed(1) + ' ' + y(0) + ' Z';
  const step = Math.ceil(points.length / 7);
  const labels = points.map((p, i) => i % step === 0 || i === points.length - 1 ? '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + p.label + '</text>' : '').join('');
  const dots = points.map((p, i) => '<circle class="pt" cx="' + x(i) + '" cy="' + y(p.v) + '" r="4"><title>' + p.label + ': ' + p.v + '% (' + p.n + ')</title></circle>').join('');
  return '<div class="chart" dir="ltr"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('accOverTime') + '">' + g + '<path class="ar" d="' + area + '"/><path class="ln" d="' + path + '"/>' + dots + labels + '</svg></div>';
}

/* swipe between questions: the card follows the finger, then slides out and the next one slides in.

function bindSwipe(el){

  const fwd = () => document.documentElement.dir === 'rtl' ? 1 : -1; // sign of dx that means "next"
  const set = (x, t) => { el.style.transition = t ? 'transform .22s ease, opacity .22s ease' : 'none'; el.style.transform = x ? 'translateX(' + x + 'px)' : ''; el.style.opacity = x ? String(Math.max(.35, 1 - Math.abs(x) / 500)) : ''; };
  el.addEventListener('touchstart', e => {
    if (e.touches.length > 1 || e.target.closest('textarea,input,select') || String(window.getSelection())) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; horiz = null;
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if (x0 === null || !P.sess) return;
    dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;

    if (!horiz) return;

    if (x0 === null) return; x0 = null;

    const to = P.sess.idx + (Math.sign(dx) === fwd() ? 1 : -1);

/* =====================================================================

   ===================================================================== */
function readiness(){
  const ids = scopeIds(), o = statsFor(ids); if (!o.att) return null;
  const coverage = pct(o.att, ids.length);
  const exams = st.order.slice().reverse().map(id => st.sessions[id]).filter(s => s.mode === 'exam' && s.submitted && s.qids.some(inScope)).slice(0, 3);
  const examAvg = exams.length ? Math.round(exams.reduce((a, s) => a + sessionResult(s).pct, 0) / exams.length) : null;
  const score = Math.round(0.3 * coverage + 0.4 * o.acc + 0.3 * (examAvg === null ? o.acc : examAvg));
  return {score, coverage, acc:o.acc, examAvg, level:score >= 75 ? 'good' : score >= 60 ? 'fair' : 'weak'};
}
function readinessHTML(){
  const r = readiness();
  if (!r) return '<section class="card"><h2 style="display:flex;gap:.45rem;align-items:center">' + ic('gauge') + t('readiness') + '</h2>' + emptyState('gauge', t('readyEmpty')) + '</section>';
  const R = 46, C = 2 * Math.PI * R, col = 'var(--' + (r.level === 'good' ? 'ok' : r.level === 'fair' ? 'warn' : 'bad') + ')';
  const part = (l, v) => '<div class="part"><span class="muted">' + l + '</span><div class="bar"><span style="width:' + (v === null ? 0 : v) + '%"></span></div><span class="num">' + (v === null ? '—' : v + '%') + '</span></div>';

    '<div class="ready"><svg class="ready-ring" viewBox="0 0 112 112" role="img" aria-label="' + t('readiness') + ' ' + r.score + '%"><circle class="bg" cx="56" cy="56" r="' + R + '" fill="none" stroke-width="10"/>' +
    '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 56 56)" stroke="' + col + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - r.score / 100)) + '"/>' +

/* pull-to-refresh on touch screens (not inside a question session or a dialog) */
(function pullToRefresh(){
  if (!matchMedia('(pointer:coarse)').matches) return;
  let y0 = null, dy = 0, ind = null;
  const can = () => !P.sess && !$('#modal-root').innerHTML && !P.drawer && CL.user && scrollY <= 0;
  addEventListener('touchstart', e => { y0 = can() && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy < 8) return;
    if (!ind) { ind = document.createElement('div'); ind.className = 'ptr'; ind.innerHTML = ic('refresh'); document.body.appendChild(ind); }
    const d = Math.min(dy, 120) * .6; ind.style.transform = 'translate(-50%,' + d + 'px) rotate(' + dy * 2 + 'deg)'; ind.classList.toggle('ready', dy > 80);
  }, {passive:true});
  addEventListener('touchend', async () => {
    if (y0 === null || !ind) { y0 = null; return; }
    const go = dy > 80, el = ind; ind = null; y0 = null;
    if (!go) { el.remove(); return; }
    el.classList.add('spin'); el.style.transform = 'translate(-50%,48px)';
    buzz(true);
    try { await cloudRefresh(true); } finally { setTimeout(() => { el.remove(); toast(t('refreshed')); }, 400); }
  });
})();

function importFile(file){
  const rd = new FileReader();
  const done = () => { save(true); toast(t('importOk')); route(); };
  rd.onload = () => {
    let obj; try { obj = JSON.parse(rd.result); } catch (e) { obj = null; }
    if (!obj || obj.app !== 'icu-mcq-500' || !isObj(obj.state) || !isObj(obj.state.answers)) { modal(t('importBtn'), '<p>' + t('importInvalid') + '</p>', [{label:t('close'), cls:'primary'}]); return; }
    const inc = normalize(obj.state);
    modal(t('importBtn'), '<p>' + t('importSummary') + ': <b>' + esc(obj.exportedAt ? fmtDate(Date.parse(obj.exportedAt) || Date.now()) : '?') + '</b></p><p><b>' + Object.keys(inc.answers).length + '</b> ' + t('answeredQs') + ' · ' + t('flagged') + ' ' + Object.keys(inc.flags).length + ' · ' + t('note') + ' ' + Object.keys(inc.notes).length + '</p><p class="small muted">' + t('mergeHelp') + '</p>',
      [{label:t('cancel')}, {label:t('replace'), cls:'danger solid', fn:() => { inc.settings = st.settings; inc.tourDone = true; st = inc; done(); cloudReset(); }}, {label:t('merge'), cls:'primary', fn:() => { mergeState(inc); done(); }}]);
  };
  rd.readAsText(file);
}
function mergeState(inc){
  for (const k in inc.answers) { const a = st.answers[k], b = inc.answers[k]; if (!a || b.lastAt > a.lastAt) { st.answers[k] = b; if (inc.leitner[k]) st.leitner[k] = inc.leitner[k]; else delete st.leitner[k]; } }
  for (const k in inc.leitner) if (!st.leitner[k] && !st.answers[k]) st.leitner[k] = inc.leitner[k];
  Object.assign(st.flags, inc.flags);
  for (const k in inc.hl) if (!st.hl[k]) st.hl[k] = inc.hl[k];
  const seenR = new Set(st.reports.map(r => r.ts + '|' + r.id));
  st.reports = st.reports.concat(inc.reports.filter(r => !seenR.has(r.ts + '|' + r.id)));
  for (const k in inc.notes) if (!st.notes[k]) st.notes[k] = inc.notes[k]; else if (st.notes[k] !== inc.notes[k] && !st.notes[k].includes(inc.notes[k])) st.notes[k] += '\n\n' + inc.notes[k];
  for (const k in inc.daily) { const a = st.daily[k], b = inc.daily[k]; if (!a) st.daily[k] = b; else { a.attempted = Math.max(a.attempted, b.attempted); a.correct = Math.max(a.correct, b.correct); a.timeMs = Math.max(a.timeMs, b.timeMs); } }
  const seen = new Set(st.log.map(e => e[0] + '|' + e[1]));
  st.log = st.log.concat(inc.log.filter(e => !seen.has(e[0] + '|' + e[1]))).sort((a, b) => a[0] - b[0]).slice(-10000);
  for (const id of inc.order) if (!st.sessions[id]) { st.sessions[id] = inc.sessions[id]; st.order.push(id); }
  st.order.sort((a, b) => st.sessions[a].startedAt - st.sessions[b].startedAt);
  st.held = mergeHeld(st.held || {}, inc.held || {});
}
function resetIds(ids, label){

    [{label:t('cancel')}, {label:t('confirm'), cls:'danger solid', fn:() => {
      const notes = $('#reset-notes').checked, set = new Set(ids);
      for (const id of ids) { delete st.answers[id]; delete st.leitner[id]; if (notes) { delete st.flags[id]; delete st.notes[id]; } }
      st.log = st.log.filter(e => !set.has(e[1]));

      else for (const sid of st.order.slice()) { const s = st.sessions[sid]; if (s.qids.every(q => set.has(q))) { delete st.sessions[sid]; st.order = st.order.filter(x => x !== sid); } }
      if (!st.sessions[st.lastSessionId]) st.lastSessionId = null;
      save(true); cloudReset(); toast(t('resetDone')); route();
    }}]);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (closeModal() || closeDrawer()) { e.preventDefault(); return; } }
  if (e.key === 'Tab' && modalOpen()) { const f = $$('#modal-root button, #modal-root input'); const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { z.focus(); e.preventDefault(); } else if (!e.shiftKey && document.activeElement === z) { a.focus(); e.preventDefault(); } return; }
  const tgt = e.target instanceof Element ? e.target : document.body;
  if (e.key === 'Enter' && /^cloud-(user|pass2?)$/.test(tgt.id)) { e.preventDefault(); cloudPassword(!!(tgt.closest('.login-form.up'))); return; }
  if ((e.key === 'Enter' || e.key === ' ') && tgt.matches('tr[data-act], label[data-act]')) { e.preventDefault(); tgt.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && tgt.matches('g[role="button"][data-act]')) { e.preventDefault(); tgt.dispatchEvent(new MouseEvent('click', {bubbles:true})); return; }
  const tag = tgt.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT' || tgt.isContentEditable || e.ctrlKey || e.metaKey || e.altKey || modalOpen()) return;
  if (e.key === '?') { e.preventDefault(); showHelp(); return; }
  if (location.hash.startsWith('#/cards') && (e.key === ' ' || e.key === 'Enter') && !tgt.closest('button, a, summary')) {
    e.preventDefault(); if (CARDS.i < CARDS.ids.length) ACT[CARDS.flipped ? 'card-next' : 'card-flip'](); return; }
  if (!P.sess) return;
  const k = e.key.toLowerCase(), map = {a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3};
  const sk = {a:0, b:1, c:2, d:3, '!':0, '@':1, '#':2, '$':3}[k];
  if (e.shiftKey && (sk !== undefined || /^Digit[1-4]$/.test(e.code))) { e.preventDefault(); toggleStrike(sk !== undefined ? sk : +e.code.slice(5) - 1); }
  else if (k in map) { e.preventDefault(); choose(map[k]); }
  else if (k === 'l') { e.preventDefault(); showLabs(0); }
  else if (k === 'h') { e.preventDefault(); commitHL(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go2(P.sess.idx - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go2(P.sess.idx + 1); }
  else if (k === 'f') { e.preventDefault(); toggleFlag(curId()); }
  else if (k === 'm') { e.preventDefault(); toggleMark(); }
  else if (k === 's' || k === 'g') { e.preventDefault(); setConf(k); }
  else if (k === 'e') { const s = P.sess, id = curId(); if (s.feedback !== 'exam') { if (!s.resp[id]) s.revealed[id] = true; P.explShown[id] = true; save(); renderQ(); } }
  else if (e.key === 'Enter') { if (tgt.closest('button, a, summary')) return; e.preventDefault(); go2(P.sess.idx + 1); }
});
