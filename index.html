<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="ICU MCQ Bank — board-level ICU question bank study dashboard (Egyptian Board / EDIC).">
<title>ICU MCQ Bank</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23047857'/%3E%3Cpath d='M10 34h10l5-12 8 22 6-14 3 4h12' fill='none' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== THEME TOKENS ===================== */
:root{
  /* calm green theme */
  --navy:#123B2C; --teal:#047857; --teal-strong:#065F46; --teal-soft:#ECFDF5;
  --bg:#F3F7F4; --surface:#FFFFFF; --surface-2:#EEF4F0; --text:#14231B; --muted:#4B5B52; --border:#DCE7E0;
  --accent:#047857; --accent-ink:#FFFFFF;
  --ok:#166534; --ok-bg:#E3F5E8; --ok-line:#86CFA0;
  --bad:#B42318; --bad-bg:#FDECEA; --bad-line:#F1A39B;
  --warn:#8A5A00; --warn-bg:#FFF2D6; --warn-line:#E8C06A;
  --none:#6B7686; --none-bg:#EBEEF3;
  --flag:#B7791F;
  --shadow:0 1px 2px rgba(20,35,27,.05),0 2px 8px rgba(20,35,27,.05);
  --radius:12px; --fs:17px;
  --side-w:236px;
  --qfont:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font:var(--qfont);
  --sec-l:93%; --sec-d:30%; --sec-s:55%;
  color-scheme:light;
}
:root[lang="ar"]{--font:Cairo,"Noto Sans Arabic",Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0B1410; --teal:#34D399; --teal-strong:#6EE7B7; --teal-soft:#12352A;
    --bg:#0E1512; --surface:#15201B; --surface-2:#1C2A23; --text:#E5EEE8; --muted:#9DB0A5; --border:#2A3B32;
    --accent:#34D399; --accent-ink:#052E1F;
    --ok:#5AD08F; --ok-bg:#123222; --ok-line:#2F7A51;
    --bad:#FF8A80; --bad-bg:#3A1716; --bad-line:#8C3A33;
    --warn:#F2BC54; --warn-bg:#382A0E; --warn-line:#8A6A24;
    --none:#8E9AAB; --none-bg:#223047;
    --flag:#F2BC54;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
    --sec-l:22%; --sec-d:74%; --sec-s:35%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0B1410; --teal:#34D399; --teal-strong:#6EE7B7; --teal-soft:#12352A;
  --bg:#0E1512; --surface:#15201B; --surface-2:#1C2A23; --text:#E5EEE8; --muted:#9DB0A5; --border:#2A3B32;
  --accent:#34D399; --accent-ink:#052E1F;
  --ok:#5AD08F; --ok-bg:#123222; --ok-line:#2F7A51;
  --bad:#FF8A80; --bad-bg:#3A1716; --bad-line:#8C3A33;
  --warn:#F2BC54; --warn-bg:#382A0E; --warn-line:#8A6A24;
  --none:#8E9AAB; --none-bg:#223047;
  --flag:#F2BC54;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --sec-l:22%; --sec-d:74%; --sec-s:35%;
  color-scheme:dark;
}

/* ===================== BASE ===================== */
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;overflow-x:hidden}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.35rem} h2{font-size:1.12rem} h3{font-size:1rem}
p{margin:0 0 .75rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
sup{font-size:.7em;line-height:0}
mark{background:#FFE58A;color:#1a1a1a;border-radius:3px;padding:0 1px}
[hidden]{display:none!important}
.qtext{font-family:var(--qfont)}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.i.xs{width:.8em;height:.8em}
[dir="rtl"] .i.flip{transform:scaleX(-1)}

/* ===================== SHELL ===================== */
.app{min-height:100vh;display:flex}
.sidebar{background:var(--surface);color:var(--text);display:flex;flex-direction:column;border-inline-end:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.6rem;padding:1rem 1rem .75rem;font-weight:700;letter-spacing:.2px;color:var(--text);text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.brand-mark .i{width:20px;height:20px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.nav-link{display:flex;align-items:center;gap:.7rem;color:var(--muted);text-decoration:none;padding:.65rem 1rem;margin:2px .6rem;border-radius:10px;font-weight:500;min-height:44px}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link[aria-current="page"]{background:var(--teal-soft);color:var(--teal-strong);font-weight:600}
.nav-link svg{width:20px;height:20px;flex:none}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;padding:calc(.55rem + env(safe-area-inset-top)) 16px .55rem;min-height:56px}
.topbar h1{font-size:1.05rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text);text-decoration:none;padding:0 .4rem}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.lang-btn span{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 .35rem;border:1.5px solid currentColor;border-radius:7px;font-weight:700;font-size:.85rem;line-height:1}
.lang-btn #lang-label:lang(ar){font-family:Cairo,"Noto Sans Arabic",Tahoma,sans-serif;font-size:1rem}
main{flex:1;padding:16px;width:100%;max-width:1180px;margin:0 auto}
main:focus{outline:none}
.disclaimer{font-size:.78rem;color:var(--muted);text-align:center;padding:12px 16px 16px}
.bottomnav{display:none}
.storage-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);padding:.5rem .75rem;border-radius:10px;margin-bottom:12px;font-size:.88rem}
/* focus mode: hide app chrome while answering */
body.focus-pref.in-player .sidebar,body.focus-pref.in-player .topbar{display:none!important}
body.focus-pref.in-player main{padding-top:calc(16px + env(safe-area-inset-top))}

@media (max-width:599.98px){
  .sidebar{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45rem 0 .4rem;font-size:.7rem;color:var(--muted);text-decoration:none;min-height:56px;justify-content:center}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a[aria-current="page"]{color:var(--accent);font-weight:600}
  .app{padding-bottom:64px}
  body.in-player .bottomnav{display:none}
  body.in-player .app{padding-bottom:76px}
  .hide-phone{display:none!important}
  .tbl.sess th:nth-child(3),.tbl.sess td:nth-child(3){display:none}
  .tbl th,.tbl td{padding:.5rem .35rem}
  .bankpick #bank-l{display:none}
  .bankpick .seg{display:flex;flex-wrap:nowrap;width:100%}
  .bankpick .seg button{flex:1 1 0;min-width:0;padding:.4rem .25rem;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (min-width:600px) and (max-width:1024px){
  .app{flex-direction:column}
  .sidebar{flex-direction:row;align-items:center;position:sticky;top:0;z-index:35;overflow-x:auto;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .brand{padding:.5rem .75rem}
  .brand small,.brand .bt{display:none}
  .nav-links{display:flex;flex:1}
  .nav-link{flex:1;justify-content:center;gap:.35rem;padding:.45rem .3rem;margin:6px 2px;font-size:.82rem;white-space:nowrap}
  .nav-link svg{width:18px;height:18px}
  .topbar{top:56px}
  .hide-tablet{display:none!important}
}
@media (min-width:1025px){
  .sidebar{width:var(--side-w);position:sticky;top:0;height:100vh;flex:none}
  .nav-links{display:flex;flex-direction:column;margin-top:.5rem}
  .side-foot{margin-top:auto;padding:1rem;font-size:.75rem;color:var(--muted)}
  .hide-desktop{display:none!important}
}
@media (max-width:1024px){ .side-foot{display:none} }

/* ===================== COMPONENTS ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.card-title h2{margin:0;display:flex;align-items:center;gap:.45rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack > * + *{margin-top:16px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:.6rem 1.05rem;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--teal-strong);border-color:var(--teal-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:40px;padding:.4rem .8rem;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;font-weight:600;padding:.15rem .5rem;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.st-good{--st:var(--ok);--st-bg:var(--ok-bg);--st-line:var(--ok-line)}
.st-fair{--st:var(--warn);--st-bg:var(--warn-bg);--st-line:var(--warn-line)}
.st-weak{--st:var(--bad);--st-bg:var(--bad-bg);--st-line:var(--bad-line)}
.st-none{--st:var(--none);--st-bg:var(--none-bg);--st-line:var(--border)}
.badge.st{color:var(--st);background:var(--st-bg);border-color:var(--st-line)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.field > label,.field > .lbl{font-weight:600;font-size:.92rem}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:.55rem .75rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:.45rem .85rem;border:1px solid var(--border);border-radius:99px;background:var(--surface);font-size:.9rem;font-weight:500}
.chip input:checked + span{background:var(--teal-soft);border-color:var(--accent);color:var(--text)}
.chip input:checked + span::before{content:"";width:.55em;height:.95em;border:solid var(--accent);border-width:0 .17em .17em 0;transform:rotate(45deg) translateY(-.1em);margin-inline-end:.2em}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:44px;padding:.4rem .9rem;border:0;background:var(--surface);cursor:pointer;font-weight:500;border-inline-end:1px solid var(--border)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.switch{display:flex;align-items:center;gap:.6rem;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.empty{text-align:center;padding:1.25rem 1rem;color:var(--muted)}
.empty .i{width:2.2rem;height:2.2rem;display:block;margin:0 auto .5rem;color:var(--accent);opacity:.8}
.empty p{max-width:34ch;margin:0 auto .75rem}
.table-wrap{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:.55rem .5rem;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
/* section identity: hue per section, light/dark aware */
.sec-ic{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;flex:none;background:hsl(var(--h) var(--sec-s) var(--sec-l));color:hsl(var(--h) 62% var(--sec-d))}
.sec-ic .i{width:20px;height:20px}
.sec-ic.sm{width:28px;height:28px;border-radius:8px}
.sec-ic.sm .i{width:16px;height:16px}

/* ===================== HOME ===================== */
.plan{background:var(--teal-soft);color:var(--text);border:1px solid var(--border);box-shadow:none}
.plan .k{font-size:.82rem;color:var(--teal-strong);font-weight:600;display:flex;align-items:center;gap:.4rem}
.plan h2{font-size:1.35rem;margin:.25rem 0 .75rem}
.plan .goalbar{height:10px;border-radius:99px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.plan .goalbar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.plan .chipsrow{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0 1rem}
.plan .pchip{display:inline-flex;align-items:center;gap:.35rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:.3rem .7rem;font-size:.85rem}
.plan .pchip b{font-variant-numeric:tabular-nums;color:var(--text)}
.btn.light{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.light:hover{background:var(--teal-strong);border-color:var(--teal-strong)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.plan .done{display:inline-flex;align-items:center;gap:.35rem;color:var(--ok);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem .85rem;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.78rem;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:.35rem}
.kpi .k .i{color:var(--accent)}
.kpi .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .bar{margin-top:.35rem;height:6px}
.sec-grid{display:grid;gap:12px;grid-template-columns:1fr}
.sec-card{display:flex;gap:.75rem;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--st);border-radius:var(--radius);padding:.85rem 1rem;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;min-width:0}
.sec-card:hover{transform:translateY(-1px)}
.sec-card .body{flex:1;min-width:0}
.sec-card .top{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.sec-card .name{font-weight:600;line-height:1.3}
.sec-card .meta{display:flex;justify-content:space-between;gap:.5rem;font-size:.82rem;color:var(--muted);margin:.4rem 0 .35rem}
.sec-card .bar > span{background:var(--st)}
.sec-card.st-none .bar > span{background:var(--accent)}
.bank-h{margin:1rem 0 .6rem;font-size:.95rem;color:var(--muted);font-weight:600}
.ins{display:flex;gap:.75rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid var(--border)}
.ins:last-child{border-bottom:0}
.ins > .i{width:1.5rem;height:1.5rem;color:var(--accent);margin-top:.1rem}
.ins.weak > .i{color:var(--bad)} .ins.good > .i{color:var(--ok)} .ins.fair > .i{color:var(--warn)}
.ins .txt{flex:1;min-width:0}
.ins .txt p{margin:0 0 .4rem}
.trend{display:inline-flex;align-items:center;gap:.2rem;font-size:.8rem;font-weight:600;white-space:nowrap}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)} .trend.flat{color:var(--muted)}
.weak-item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
.weak-item:last-child{border-bottom:0}
.weak-item .lhs{display:flex;gap:.6rem;align-items:center;min-width:0}
@media (min-width:600px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1025px){ .sec-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* mini question grid / heatmap */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qcell{min-height:42px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:.8rem;font-weight:600;cursor:pointer;position:relative;display:grid;place-items:center;text-decoration:none;color:var(--text);padding:0}
.qcell.s-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.qcell.s-bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.qcell.s-ans{background:var(--teal-soft);border-color:var(--accent)}
.qcell.cur{outline:3px solid var(--accent);outline-offset:1px}
.qcell .fl{position:absolute;top:-7px;inset-inline-end:-5px;color:var(--flag);line-height:0}
.qcell .bm{position:absolute;top:-7px;inset-inline-start:-5px;color:var(--accent);line-height:0}
.qcell .fl .i,.qcell .bm .i{width:14px;height:14px}
.qcell .ic{position:absolute;bottom:2px;inset-inline-end:3px;line-height:0}
.qcell .ic .i{width:10px;height:10px}
.heat{display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:3px}
.heat button{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--none-bg);cursor:pointer;min-width:0;box-shadow:inset 0 0 0 1px var(--border)}
.heat .h-ok{background:var(--ok);box-shadow:none}
.heat .h-bad{background:repeating-linear-gradient(45deg,var(--bad) 0 3px,var(--bad-bg) 3px 5px);box-shadow:none}
.heat .h-flag{box-shadow:inset 0 0 0 2px var(--flag)}
.heat .h-sec{grid-column:1/-1;aspect-ratio:auto;height:auto;background:none;box-shadow:none;font-size:.72rem;color:var(--muted);text-align:start;padding:.3rem 0 .1rem;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.8rem;color:var(--muted);margin-top:.6rem;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:.3rem}

/* ===================== PLAYER ===================== */
.player{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main" "side"}
.p-head{grid-area:head}
.p-main{grid-area:main;min-width:0}
.p-side{grid-area:side;min-width:0}
.p-side > * + *{margin-top:16px}
.p-nav{grid-area:nav;display:none;min-width:0}
.p-headrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.p-count{font-weight:600;display:flex;align-items:center;gap:.6rem;min-width:0}
.p-count .sec{color:var(--muted);font-weight:500;font-size:.88rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-tools{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:.3rem .65rem;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);min-height:40px;display:inline-flex;align-items:center;gap:.35rem;font-size:1.05rem}
.timer.soon{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.timer.warn{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.flag-btn[aria-pressed="true"]{color:var(--flag)}
.mark-btn[aria-pressed="true"]{color:var(--accent);background:var(--teal-soft)}
.p-progress{margin-top:.6rem}
.stem{font-size:1.12rem;font-weight:600;line-height:1.55;margin:0 0 1rem}
.qmeta{font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:.75rem;width:100%;min-height:52px;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;text-align:start;line-height:1.45;transition:background .12s,border-color .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--surface-2)}
.opt .key{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.9rem;border:1px solid var(--border)}
.opt .txt{flex:1;padding-top:.1rem}
.opt .mk{flex:none;width:1.4rem;display:grid;place-items:center;padding-top:.2rem}
.opt .mk .i{width:1.25rem;height:1.25rem;stroke-width:3}
.opt.chosen{border-color:var(--accent);background:var(--teal-soft)}
.opt.chosen .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.72}
.feedback{margin-top:14px;padding:.75rem .9rem;border-radius:12px;font-weight:600;display:flex;gap:.5rem;align-items:center;animation:pop .18s ease-out}
.feedback .i{width:1.3rem;height:1.3rem;stroke-width:3}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.feedback.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.conf{margin-top:10px;padding:.65rem .85rem;border:1px dashed var(--border);border-radius:12px;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.conf .q{font-weight:600;flex:1;min-width:10ch}
.conf-note{margin-top:8px;font-size:.85rem;color:var(--warn);display:flex;gap:.4rem;align-items:center}
.next-big{margin-top:14px}
.expl .ans{font-weight:600;margin-bottom:.5rem}
.expl .body{line-height:1.6}
details.distractor{margin-top:.85rem;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);border-inline-start:5px solid var(--warn)}
details.distractor > summary{cursor:pointer;padding:.65rem .9rem;font-weight:700;color:var(--warn);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:44px}
details.distractor > summary::-webkit-details-marker{display:none}
details.distractor > summary .i{transition:transform .15s}
details.distractor[open] > summary .i{transform:rotate(180deg)}
details.distractor > div{padding:0 .9rem .75rem}
.p-actions{display:flex;gap:.6rem;margin-top:16px}
.p-actions .btn{flex:1}
.p-bar{display:none}
.saved-ind{font-size:.78rem;color:var(--muted);min-height:1.2em}
.complete{border:1px solid var(--ok-line);background:var(--ok-bg)}
.nav-legend{display:flex;flex-wrap:wrap;gap:.6rem;font-size:.75rem;color:var(--muted);margin-top:.7rem}
.nav-legend span{display:inline-flex;align-items:center;gap:.3rem}
.nav-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--border)}
@media (max-width:599.98px){
  .p-actions{display:none}
  .p-bar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
  .p-bar .btn{flex:1;min-height:52px}
  .p-bar .btn.nav-open{flex:0 0 56px}
  .stem{font-size:1.06rem}
}
@media (min-width:600px) and (max-width:1024px){
  .player{grid-template-columns:220px minmax(0,1fr);grid-template-areas:"nav head" "nav main" "nav side"}
  .p-nav{display:block;position:sticky;top:120px;align-self:start;max-height:calc(100vh - 136px);overflow:auto}
  .p-nav .qgrid{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
  body.focus-pref.in-player .p-nav{top:16px;max-height:calc(100vh - 32px)}
}
@media (min-width:1025px){
  .player{grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"head head" "main side" "main nav";align-items:start}
  .p-main{grid-row:2 / span 2}
  .p-nav{display:block}
  body.focus-pref.in-player main{max-width:1280px}
}
.drawer-back{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:60;animation:fade .15s}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:16px 16px 0 0;max-height:78vh;overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .18s ease-out}
.drawer .handle{width:42px;height:5px;border-radius:99px;background:var(--border);margin:0 auto 10px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===================== MODAL / TOAST / TOUR ===================== */
.modal-back{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);color:var(--text);border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.modal h3{margin:1rem 0 .5rem;font-size:.95rem}
.modal .actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
.tour-ic{width:52px;height:52px;border-radius:14px;background:var(--teal-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.tour-ic .i{width:28px;height:28px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:1rem}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--border)}
.dots i.on{background:var(--accent);width:22px}
.sum-row{display:flex;gap:1rem;flex-wrap:wrap}
.sum-row div{flex:1;min-width:80px;background:var(--surface-2);border-radius:10px;padding:.5rem .7rem}
.sum-row b{display:block;font-size:1.3rem}
.kbd{display:inline-block;min-width:1.7em;text-align:center;padding:.05rem .4rem;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;font-size:.85rem;font-weight:600;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.65rem 1rem;border-radius:10px;z-index:90;box-shadow:var(--shadow);font-size:.92rem;max-width:calc(100% - 32px);animation:fade .15s}
:root[data-theme="dark"] .toast{background:#24352C}

/* ===================== SEARCH / RESULTS / STATS ===================== */
.search-bar{display:grid;gap:.6rem;grid-template-columns:1fr}
@media (min-width:600px){.search-bar{grid-template-columns:1fr 260px}}
.result{display:block;text-decoration:none;color:var(--text);padding:.85rem 0;border-bottom:1px solid var(--border)}
.result:hover .r-stem{color:var(--accent)}
.result .r-meta{font-size:.78rem;color:var(--muted);margin-bottom:.2rem}
.result .r-stem{font-weight:600}
.result .r-snip{font-size:.88rem;color:var(--muted);margin-top:.25rem}
.score-big{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.passbar{position:relative;height:14px;background:var(--surface-2);border-radius:99px;margin:1.6rem 0 .4rem;overflow:visible}
.passbar > span{display:block;height:100%;border-radius:99px}
.passbar .line{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--text);border-radius:2px}
.passbar .line b{position:absolute;top:-20px;transform:translateX(-50%);font-size:.72rem;white-space:nowrap;color:var(--muted)}
.rev-item{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.rev-item > summary{list-style:none;cursor:pointer;padding:.75rem .9rem;display:flex;gap:.6rem;align-items:flex-start}
.rev-item > summary::-webkit-details-marker{display:none}
.rev-item > summary .st-ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.rev-item > summary .st-ic .i{width:15px;height:15px;stroke-width:3}
.rev-item .ok-ic{background:var(--ok-bg);color:var(--ok)}
.rev-item .bad-ic{background:var(--bad-bg);color:var(--bad)}
.rev-item .un-ic{background:var(--none-bg);color:var(--none)}
.rev-item .rv-body{padding:0 .9rem .9rem}
.rev-item .opts .opt{min-height:44px;cursor:default}
.hbar{display:grid;grid-template-columns:minmax(0,1fr);gap:.2rem;margin-bottom:.8rem}
.hbar .lab{display:flex;justify-content:space-between;gap:.5rem;font-size:.86rem;align-items:center}
.hbar .lab > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .trk span{display:block;height:100%;border-radius:99px;background:var(--st)}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--border);stroke-dasharray:3 4}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--qfont)}
.two-col{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}

/* ===================== HOME v3 ===================== */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cd-head{font-size:1.4rem;font-weight:700;line-height:1.25;margin-top:.1rem}
.cd-n{color:var(--accent)}
.cd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cd-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;padding:.25rem .65rem;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.cd-chip b{color:var(--text)}
.cd-chip.next{background:var(--teal-soft);border-color:var(--accent);color:var(--teal-strong)}
.cd-chip.next b{color:var(--teal-strong)}
.cd-chip.past{opacity:.6;text-decoration:line-through}
.hello-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bank-row{display:flex;justify-content:flex-end}
.bank-chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:0 .75rem;min-height:40px;font-size:.88rem;color:var(--muted);cursor:pointer}
.bank-chip select{-webkit-appearance:none;appearance:none;border:0;background:transparent;font:inherit;font-weight:600;color:var(--text);padding:.3rem 0;cursor:pointer;max-width:12rem}
.bank-chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.ready-chip{display:inline-flex;align-items:center;gap:.3rem;min-height:40px;padding:0 .75rem;border-radius:99px;font-size:.85rem;text-decoration:none;color:var(--st);background:var(--st-bg);border:1px solid var(--st-line)}
.home-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.home-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.next{display:flex;gap:14px;align-items:center}
.next-ring{width:84px;height:84px;flex:none}
.next-ring text{font-family:var(--qfont)}
.pace{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.9rem;padding:.6rem .75rem;border-radius:10px;background:var(--teal-soft);font-size:.86rem}
.pace > span{flex:1;min-width:12rem}
.pace > .i{color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:.6rem .25rem;min-height:76px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text);text-align:center;box-shadow:var(--shadow)}
.qa:hover{border-color:var(--accent)}
.qa .i{width:1.4rem;height:1.4rem;color:var(--accent)}
.qa small{color:var(--muted);font-weight:500;font-size:.72rem;min-height:1em}
.wk{display:flex;gap:6px;align-items:flex-end;height:84px}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wk-col span{font-size:.7rem;color:var(--muted);white-space:nowrap}
.wk-bar{width:100%;border-radius:5px;background:var(--surface-2)}
.wk-bar.some{background:var(--ok-line)}
.wk-bar.met{background:var(--accent)}
.wk-bar.today{outline:2px solid var(--text);outline-offset:1px}
.qotd{background:var(--teal-soft)}
.qotd .opt{min-height:44px;padding:.5rem .7rem}
.sl-row{display:flex;gap:.65rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--border);color:var(--text);text-decoration:none}
.sl-row:hover .sl-name > span:first-child{color:var(--accent)}
.sl-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:500}
.sl-name > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-name .bar{height:5px}
.sl-acc{font-weight:700;color:var(--st);text-align:end;display:flex;flex-direction:column;line-height:1.15}
.sl-acc small{font-weight:500;color:var(--muted);font-size:.7rem}
details.more > summary{cursor:pointer;color:var(--accent);font-weight:600;padding:.6rem 0 .2rem;list-style:none;display:flex;align-items:center;gap:.3rem;border-top:1px solid var(--border)}
details.more > summary::-webkit-details-marker{display:none}
details.more[open] > summary{display:none}
@media (max-width:599.98px){ .cd-head{font-size:1.2rem} .hello-r{width:100%} }

/* ===================== PRO TOOLS ===================== */
.opt{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.opt.struck .txt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.5}
.opt.struck .key{opacity:.45}
mark.hl{background:#FFE58A;color:#1a1a1a;border-radius:3px;padding:0 1px;cursor:pointer}
.hl-pop{position:fixed;z-index:70;transform:translateX(-50%);display:inline-flex;align-items:center;gap:.35rem;min-height:40px;padding:.35rem .8rem;border-radius:99px;border:0;background:var(--navy);color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
:root[data-theme="dark"] .hl-pop{background:#24352C}
.tool-hint{font-size:.8rem;color:var(--muted);margin-top:10px;display:flex;gap:.4rem;align-items:flex-start}
.modal.wide{max-width:760px}
.lab td:first-child{font-weight:600;width:45%}
.lab td{font-size:.92rem}
.note-item{padding:.8rem 0;border-bottom:1px solid var(--border)}
.note-item:last-child{border-bottom:0}
.note-item .nt{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:.6rem .75rem;margin-top:.4rem}
.flash{max-width:760px;margin:0 auto}
.flash .face{min-height:220px}
.flash .ans{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--text);border-radius:10px;padding:.7rem .85rem;margin:.75rem 0;font-weight:600}
.ready{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.ready-ring{width:112px;height:112px;flex:none}
.ready-ring .bg{stroke:var(--surface-2)}
.ready-ring text{fill:var(--text);font-family:var(--qfont)}
.ready .parts{flex:1;min-width:180px}
.ready .part{display:grid;grid-template-columns:7.5em 1fr 3em;gap:.5rem;align-items:center;font-size:.85rem;margin:.3rem 0}
.ready .part .num{text-align:end;font-weight:600}
.chg{display:inline-flex;align-items:center;gap:.2rem;font-size:.75rem;font-weight:600;padding:.05rem .45rem;border-radius:99px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.tm{display:inline-flex;align-items:center;gap:.2rem;font-size:.75rem;color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* login gate: shown over everything until the user signs in */
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#gate[hidden]{display:none}
#gate .gate-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.5rem}
#gate .gate-brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.2rem;margin-bottom:.25rem}
#gate .gate-brand .brand-mark{width:36px;height:36px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center}
#gate .gate-lang{float:inline-end}
body.gated .app{visibility:hidden}
</style>

    <a class="brand" href="#/home"><span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span><span class="bt">ICU MCQ Bank<small data-i18n="tagline">Board revision dashboard</small></span></a>
    <div class="nav-links" id="side-links"></div>
    <div class="side-foot"><span data-i18n="kbdHint">Press ? for keyboard shortcuts</span></div>
  </nav>
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn" id="back-btn" data-act="back" hidden aria-label="Back"><svg class="i flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 id="page-title">ICU MCQ Bank</h1>
      <a class="icon-btn" href="#/search" id="search-link" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a>

<script type="application/json" id="qdata">{"banks":[{"id":"icu500","short":"ICU 500","title":"ICU MCQ Bank — Comprehensive 500","sections":[{"name":"Sepsis and Shock","from":1,"to":55},{"name":"Obstetric and Gynaecological Critical Care","from":56,"to":111},{"name":"Cardiology","from":112,"to":167},{"name":"Neurocritical Care","from":168,"to":225},{"name":"Renal and Electrolytes","from":226,"to":282},{"name":"Respiratory and Mechanical Ventilation","from":283,"to":337},{"name":"Ethics, Communication and Organisation","from":338,"to":391},{"name":"Transplantation and Oncology","from":392,"to":445},{"name":"ABG, ECG, Heart Block and Pacing","from":446,"to":500}],"questions":[
{"id":1,"section":1,"sectionName":"Sepsis and Shock","stem":"A 58-year-old man with pneumonia has a baseline SOFA of 0. He now has platelets 90 × 10^9/L, bilirubin 1.4 mg/dL, MAP 68 mmHg without vasopressors, and GCS 14. How should this be classified under Sepsis-3?","options":{"A":"Sepsis; SOFA has risen by ≥2 points due to infection","B":"Septic shock; organ dysfunction with thrombocytopenia","C":"SIRS only; sepsis requires a positive blood culture","D":"Infection without sepsis; MAP is above 65 mmHg"},"answer":"A","explanation":"SOFA: platelets 50–99 = 2, bilirubin 1.2–1.9 = 1, GCS 13–14 = 1 → rise of 4 from baseline. Sepsis-3 defines sepsis as life-threatening organ dysfunction (acute SOFA rise ≥2) caused by a dysregulated host response to infection.","distractor":"Septic shock additionally requires vasopressors for MAP ≥65 and lactate >2 mmol/L despite adequate fluids."},
{"id":2,"section":1,"sectionName":"Sepsis and Shock","stem":"Which combination defines septic shock according to Sepsis-3?","options":{"A":"SBP \u003c90 mmHg with lactate above 4 mmol/L, regardless of the fluid volume already given","B":"Vasopressors for MAP ≥65 mmHg and lactate >2 mmol/L despite fluids","C":"Lactate >4 mmol/L alone, even without hypotension","D":"MAP \u003c65 mmHg with at least two SIRS criteria present"},"answer":"B","explanation":"Septic shock (Sepsis-3) is sepsis with persistent hypotension requiring vasopressors to keep MAP ≥65 mmHg and a lactate >2 mmol/L after adequate fluid resuscitation; hospital mortality exceeds 40%.","distractor":"Lactate >4 alone indicates high risk but does not meet the shock definition."},
{"id":3,"section":1,"sectionName":"Sepsis and Shock","stem":"A hospital wants to use qSOFA alone as the screening tool for sepsis on its wards. What do the 2021 Surviving Sepsis Campaign guidelines recommend?","options":{"A":"qSOFA as the preferred single screening tool for all wards","B":"qSOFA ≥1 as the trigger to give broad-spectrum antibiotics within one hour of arrival","C":"Against qSOFA as a single screening tool compared with SIRS, NEWS or MEWS","D":"qSOFA combined with procalcitonin as the mandatory screen"},"answer":"C","explanation":"SSC 2021 recommends against using qSOFA alone for sepsis screening because of poor sensitivity; it is a prognostic, not a diagnostic, tool.","distractor":"qSOFA has high specificity but low sensitivity, so it misses many septic patients."},
{"id":4,"section":1,"sectionName":"Sepsis and Shock","stem":"A 64-year-old woman has fever, confusion and BP 82/45 mmHg not responding to fluids, with a likely urinary source. When should antibiotics be given?","options":{"A":"Within 6 hours, once urine culture is reported","B":"Only after CT has confirmed the infection source","C":"Within 3 hours, after full diagnostic work-up and imaging","D":"Immediately, ideally within 1 hour of recognition"},"answer":"D","explanation":"SSC 2021: for possible septic shock or high likelihood of sepsis, give antimicrobials immediately, ideally within 1 hour. For possible sepsis without shock, rapid assessment with antimicrobials within 3 hours if concern persists.","distractor":"The 3-hour window applies to possible sepsis without shock."},
{"id":5,"section":1,"sectionName":"Sepsis and Shock","stem":"A 70 kg patient with sepsis-induced hypoperfusion (lactate 4.5 mmol/L) is starting resuscitation. What initial fluid volume do the SSC 2021 guidelines suggest?","options":{"A":"At least 30 mL/kg (about 2.1 L) of crystalloid within the first 3 hours","B":"50 mL/kg (about 3.5 L) of crystalloid within the first hour for all patients","C":"No fluid until a CVP of 8–12 mmHg has been confirmed","D":"10 mL/kg (about 700 mL) then vasopressors immediately in all"},"answer":"A","explanation":"SSC 2021 suggests at least 30 mL/kg IV crystalloid within the first 3 hours for sepsis-induced hypoperfusion or shock (weak recommendation), followed by reassessment using dynamic measures.","distractor":"CVP-guided early goal-directed therapy was not superior in ProCESS, ARISE and ProMISe."},
{"id":6,"section":1,"sectionName":"Sepsis and Shock","stem":"Which crystalloid do the 2021 SSC guidelines suggest for resuscitation in sepsis?","options":{"A":"Gelatins as first-line resuscitation fluid","B":"Balanced crystalloids rather than 0.9% saline","C":"Hydroxyethyl starch for faster volume expansion","D":"0.9% saline rather than balanced crystalloids"},"answer":"B","explanation":"SSC 2021 suggests balanced crystalloids instead of normal saline (weak recommendation), recommends against starches and suggests against gelatins.","distractor":"Saline is acceptable but associated with hyperchloraemic acidosis and possibly more kidney events."},
{"id":7,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with septic shock has received 6 L of crystalloid and still needs fluid. Which additional fluid is suggested?","options":{"A":"Fresh frozen plasma, for colloid oncotic support","B":"Hydroxyethyl starch, to reduce the total volume of fluid needed","C":"Dextran, for its prolonged intravascular effect","D":"Albumin, for patients who have received large volumes of crystalloid"},"answer":"D","explanation":"SSC 2021 suggests albumin in patients who received large volumes of crystalloids (weak recommendation). ALBIOS showed no overall survival benefit but a post-hoc signal in septic shock.","distractor":"Starches increase AKI, RRT and mortality (6S) and are contraindicated."},
{"id":8,"section":1,"sectionName":"Sepsis and Shock","stem":"In the 6S trial, what was the effect of hydroxyethyl starch 130/0.42 compared with Ringer's acetate in severe sepsis?","options":{"A":"Lower 90-day mortality with less fluid given","B":"No difference in 90-day mortality or in the need for RRT","C":"Higher 90-day mortality and more renal replacement therapy","D":"Lower RRT need but more bleeding events"},"answer":"C","explanation":"6S (NEJM 2012): HES increased 90-day mortality (51% vs 43%) and RRT use; CHEST (2012) showed more RRT with HES. Starches are contraindicated in sepsis.","distractor":"6S showed harm, not neutrality."},
{"id":9,"section":1,"sectionName":"Sepsis and Shock","stem":"Which is the first-line vasopressor in septic shock?","options":{"A":"Adrenaline","B":"Phenylephrine","C":"Noradrenaline","D":"Dopamine"},"answer":"C","explanation":"SSC 2021 recommends noradrenaline as first-line. Dopamine caused more arrhythmias (SOAP II); adrenaline and vasopressin are second agents.","distractor":"Dopamine is associated with more arrhythmias and is not recommended first-line."},
{"id":10,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with septic shock is on noradrenaline 0.3 µg/kg/min. What is the next recommended vasopressor step?","options":{"A":"Add vasopressin at 0.1 U/min to reach the target MAP as rapidly as possible","B":"Switch noradrenaline to phenylephrine to reduce tachycardia","C":"Add dopamine at 10 µg/kg/min for additional vasoconstriction","D":"Add vasopressin (up to 0.03 U/min) rather than escalating noradrenaline"},"answer":"D","explanation":"SSC 2021 suggests adding vasopressin when noradrenaline reaches 0.25–0.5 µg/kg/min, usually up to 0.03 U/min.","distractor":"Vasopressin doses above 0.03–0.04 U/min increase ischaemic complications."},
{"id":11,"section":1,"sectionName":"Sepsis and Shock","stem":"A septic patient needs a vasopressor but central access will take 1 hour. What do the SSC 2021 guidelines suggest?","options":{"A":"Start noradrenaline peripherally rather than delaying until central access","B":"Give more fluid only until central access is obtained","C":"Delay noradrenaline until a central venous catheter is placed","D":"Use peripheral phenylephrine, as noradrenaline is unsafe through a peripheral cannula"},"answer":"A","explanation":"SSC 2021 suggests starting vasopressors peripherally to restore MAP rather than delaying for central access; use a proximal, well-functioning cannula with monitoring for extravasation.","distractor":"Delaying vasopressors prolongs hypotension, which is associated with mortality."},
{"id":12,"section":1,"sectionName":"Sepsis and Shock","stem":"What initial MAP target is recommended in septic shock?","options":{"A":"55 mmHg","B":"65 mmHg","C":"85 mmHg","D":"75 mmHg"},"answer":"B","explanation":"SSC 2021 recommends an initial MAP target of 65 mmHg. SEPSISPAM (80–85) showed no survival benefit and more AF; the 65 trial supported permissive targets in older patients.","distractor":"Higher targets increased arrhythmias without improving survival."},
{"id":13,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with septic shock has MAP 68 mmHg on noradrenaline, but persistent hypoperfusion (lactate 5 mmol/L, CRT 5 s). Echo shows LVEF 25%. What is the next step?","options":{"A":"Add levosimendan as the preferred inotrope","B":"Add dobutamine to noradrenaline","C":"Increase noradrenaline to reach MAP 85 mmHg","D":"Give a further 3 L of crystalloid rapidly"},"answer":"B","explanation":"SSC 2021 suggests adding dobutamine (or switching to adrenaline) for septic shock with cardiac dysfunction and persistent hypoperfusion despite adequate volume and MAP. Levosimendan is not suggested (LeoPARDS).","distractor":"Levosimendan did not improve outcomes and increased arrhythmias in LeoPARDS."},
{"id":14,"section":1,"sectionName":"Sepsis and Shock","stem":"When are corticosteroids suggested in septic shock?","options":{"A":"Only if a random cortisol level is below 10 µg/dL on admission","B":"In all patients with sepsis at the time of diagnosis","C":"Noradrenaline/adrenaline ≥0.25 µg/kg/min for at least 4 hours","D":"Only after failure of a 250 µg ACTH stimulation test"},"answer":"C","explanation":"SSC 2021 suggests IV hydrocortisone 200 mg/day for adults with septic shock and ongoing vasopressor requirement (noradrenaline or adrenaline ≥0.25 µg/kg/min for ≥4 h).","distractor":"Cortisol testing is not required to start steroids in septic shock."},
{"id":15,"section":1,"sectionName":"Sepsis and Shock","stem":"What was the main result of ANDROMEDA-SHOCK (2019)?","options":{"A":"Neither strategy differed in organ dysfunction scores or in total fluid volume given","B":"CRT-targeted resuscitation significantly increased fluid volumes","C":"Lactate-targeted resuscitation significantly reduced 28-day mortality","D":"CRT-targeted resuscitation was not inferior and caused less organ dysfunction"},"answer":"D","explanation":"ANDROMEDA-SHOCK: 28-day mortality 34.9% (CRT) vs 43.4% (lactate), not significant; CRT-guided resuscitation had less organ dysfunction at 72 h and used less fluid.","distractor":"Mortality was lower numerically with CRT, not with lactate."},
{"id":16,"section":1,"sectionName":"Sepsis and Shock","stem":"A septic patient's lactate is 4.2 mmol/L at hour 0. When should it be re-measured?","options":{"A":"Within 2–4 hours to guide resuscitation","B":"Only after 24 hours, when clearance is reliable","C":"Not repeated, as one value is enough","D":"Every 15 minutes until it normalises"},"answer":"A","explanation":"SSC suggests remeasuring lactate (if initially elevated) to guide resuscitation, typically within 2–4 hours, as its kinetics are slow.","distractor":"Very frequent sampling adds little because lactate falls slowly."},
{"id":17,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with sepsis has improved. Procalcitonin has fallen. How do the SSC 2021 guidelines suggest using procalcitonin?","options":{"A":"Alone, without clinical evaluation, to stop antimicrobials","B":"To choose between Gram-positive and Gram-negative cover","C":"To decide when to start antimicrobials in all patients with suspected sepsis","D":"With clinical evaluation, to decide when to stop antimicrobials"},"answer":"D","explanation":"SSC 2021 suggests using procalcitonin together with clinical evaluation to decide when to discontinue antimicrobials when the source is controlled; it recommends against PCT plus clinical evaluation to decide when to start.","distractor":"PCT is not recommended to guide initiation of antibiotics."},
{"id":18,"section":1,"sectionName":"Sepsis and Shock","stem":"A nursing-home resident with septic shock from pneumonia had MRSA isolated from sputum 3 months ago. What empirical cover is recommended?","options":{"A":"Add antifungal cover instead of MRSA cover","B":"Add MRSA cover (e.g. vancomycin or linezolid)","C":"No MRSA cover until cultures are reported","D":"Add MRSA cover only if Gram stain shows cocci"},"answer":"B","explanation":"SSC 2021 recommends empirical MRSA coverage for adults with sepsis or septic shock at high risk of MRSA (prior MRSA colonisation or infection, recent IV antibiotics).","distractor":"Delaying MRSA cover in a high-risk patient with shock risks inadequate initial therapy."},
{"id":19,"section":1,"sectionName":"Sepsis and Shock","stem":"When do the SSC 2021 guidelines suggest two antimicrobials with Gram-negative coverage for empirical therapy?","options":{"A":"In patients at high risk of multidrug-resistant organisms","B":"In all patients with suspected urinary source of sepsis","C":"In all patients with septic shock, regardless of their resistance risk","D":"Never; single-agent therapy is always sufficient"},"answer":"A","explanation":"SSC 2021 suggests two Gram-negative agents empirically for high MDR risk; for low MDR risk, against combination therapy. De-escalate once susceptibilities are known.","distractor":"Routine double coverage for all increases toxicity and resistance."},
{"id":20,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with septic shock is started on piperacillin-tazobactam. How should maintenance dosing be given?","options":{"A":"As a single daily dose to reduce nursing workload","B":"As continuous infusion from the start, omitting the loading dose","C":"As prolonged infusion after an initial bolus loading dose","D":"As 30-minute infusions without a loading dose"},"answer":"C","explanation":"SSC 2021 suggests prolonged infusion of beta-lactams for maintenance after an initial bolus. Meta-analyses (including BLING III) suggest lower mortality with prolonged infusion.","distractor":"The loading dose must not be omitted, as it achieves early therapeutic levels."},
{"id":21,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with septic shock from an infected necrotic gallbladder is stabilising on noradrenaline. When should source control be done?","options":{"A":"After repeat imaging confirms the source at 48 hours","B":"As soon as medically and logistically practical","C":"After 72 hours of antibiotics to sterilise the source","D":"Only when vasopressors have been weaned off"},"answer":"B","explanation":"SSC 2021 recommends rapid identification and implementation of source control as soon as practical (best-practice statement).","distractor":"Waiting for haemodynamic stability may never be achieved without source control."},
{"id":22,"section":1,"sectionName":"Sepsis and Shock","stem":"A clinician proposes IV vitamin C for septic shock. What does current evidence show?","options":{"A":"Recommended, as it reduces vasopressor duration and mortality","B":"Recommended for patients with lactate above 4 mmol/L","C":"Recommended only when combined with hydrocortisone and thiamine (HAT)","D":"Not recommended; LOVIT showed a higher risk of death or organ dysfunction"},"answer":"D","explanation":"SSC 2021 suggests against IV vitamin C. LOVIT (NEJM 2022) found a higher risk of death or persistent organ dysfunction at 28 days with vitamin C.","distractor":"VITAMINS and VICTAS showed no benefit for the vitamin C–hydrocortisone–thiamine combination."},
{"id":23,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with septic shock has lactic acidosis, pH 7.24, and no AKI. Should sodium bicarbonate be given?","options":{"A":"No; bicarbonate is not suggested for pH ≥7.2 from hypoperfusion","B":"Yes; it improves haemodynamics at any pH below 7.35","C":"Yes; it reduces vasopressor requirements in all patients","D":"No; bicarbonate is harmful even in patients with AKI and pH ≤7.2"},"answer":"A","explanation":"SSC 2021 suggests against bicarbonate for hypoperfusion-induced lactic acidaemia with pH ≥7.2, and suggests it for pH ≤7.2 with AKIN 2–3 (BICAR-ICU subgroup benefit).","distractor":"BICAR-ICU showed benefit in the AKI subgroup, so it is not universally harmful."},
{"id":24,"section":1,"sectionName":"Sepsis and Shock","stem":"A stable septic patient without ischaemia has Hb 7.6 g/dL. What is the transfusion threshold?","options":{"A":"Transfuse now to keep Hb above 10 g/dL","B":"Transfuse now to keep Hb above 9 g/dL","C":"Transfuse at Hb \u003c7 g/dL (restrictive strategy)","D":"Transfuse only if ScvO2 is below 70%"},"answer":"C","explanation":"SSC 2021 recommends a restrictive transfusion strategy (Hb 7 g/dL); TRISS showed no difference in mortality between 7 and 9 g/dL thresholds.","distractor":"Hb 9 g/dL (TRISS liberal arm) doubled transfusions without benefit."},
{"id":25,"section":1,"sectionName":"Sepsis and Shock","stem":"Which adjunct is NOT recommended in adults with septic shock by SSC 2021?","options":{"A":"IV immunoglobulin","B":"Vasopressin as a second vasopressor","C":"Hydrocortisone for refractory shock","D":"Balanced crystalloids for resuscitation"},"answer":"A","explanation":"SSC 2021 suggests against IVIG in sepsis or septic shock. The other options are recommended or suggested therapies.","distractor":"Hydrocortisone is suggested for ongoing vasopressor need."},
{"id":26,"section":1,"sectionName":"Sepsis and Shock","stem":"A septic shock patient on an insulin infusion has glucose 165 mg/dL. When does SSC 2021 recommend starting insulin?","options":{"A":"At glucose ≥140 mg/dL, targeting 100–140 mg/dL","B":"At glucose ≥110 mg/dL, targeting 80–110 mg/dL","C":"At glucose ≥250 mg/dL, targeting 180–250 mg/dL","D":"At glucose ≥180 mg/dL, targeting 144–180 mg/dL"},"answer":"D","explanation":"SSC 2021 recommends starting insulin at glucose ≥180 mg/dL (10 mmol/L) with a target of 144–180 mg/dL. NICE-SUGAR showed harm with tight control.","distractor":"Tight control (80–110) increased hypoglycaemia and mortality in NICE-SUGAR."},
{"id":27,"section":1,"sectionName":"Sepsis and Shock","stem":"What VTE prophylaxis is recommended for a septic patient without contraindication?","options":{"A":"No prophylaxis until the patient is mobilising","B":"Pharmacological prophylaxis, preferably LMWH over UFH","C":"Mechanical plus pharmacological prophylaxis for all","D":"Mechanical prophylaxis alone with compression devices"},"answer":"B","explanation":"SSC 2021 recommends pharmacological VTE prophylaxis, LMWH preferred over UFH, and suggests against adding mechanical prophylaxis routinely.","distractor":"Combined mechanical plus pharmacological prophylaxis gave no added benefit (PREVENT)."},
{"id":28,"section":1,"sectionName":"Sepsis and Shock","stem":"In septic shock, which patients do the SSC guidelines suggest should receive stress ulcer prophylaxis?","options":{"A":"Only patients with a previous history of peptic ulcer disease","B":"No patients, because PPIs increase C. difficile infection and pneumonia","C":"Those with risk factors for GI bleeding, such as coagulopathy or shock","D":"All patients in the ICU, regardless of bleeding risk"},"answer":"C","explanation":"SSC 2021 suggests stress ulcer prophylaxis for patients with risk factors for GI bleeding (coagulopathy, shock, chronic liver disease).","distractor":"Routine prophylaxis for every ICU patient is not recommended."},
{"id":29,"section":1,"sectionName":"Sepsis and Shock","stem":"When should enteral nutrition start in septic shock in a patient who can be fed enterally?","options":{"A":"After 7 days, once vasopressors are stopped","B":"Immediately at full caloric target on day 1","C":"Only after parenteral nutrition has been given first","D":"Early, within 72 hours"},"answer":"D","explanation":"SSC 2021 suggests early (within 72 h) initiation of enteral nutrition; trophic or progressive feeding is acceptable.","distractor":"Early full feeding offers no benefit and may cause harm."},
{"id":30,"section":1,"sectionName":"Sepsis and Shock","stem":"A trauma patient has HR 130/min and SBP 85 mmHg. What is the shock index and its significance?","options":{"A":"0.65; normal, no intervention needed","B":"1.53; suggests significant hypovolaemia and need for transfusion","C":"0.85; mild hypovolaemia, needing observation only","D":"1.53; within the normal range for a young, fit trauma patient"},"answer":"B","explanation":"Shock index = HR/SBP = 130/85 ≈ 1.53. A value >1.0 predicts the need for massive transfusion and higher mortality.","distractor":"Any shock index above about 1.0 is abnormal."},
{"id":31,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient has Hb 9 g/dL, SaO2 92%, PaO2 60 mmHg and cardiac output 4 L/min. What is the approximate DO2?","options":{"A":"About 450 mL/min","B":"About 330 mL/min","C":"About 1,000 mL/min","D":"About 600 mL/min"},"answer":"A","explanation":"CaO2 = 1.34 × 9 × 0.92 + 0.003 × 60 ≈ 11.1 + 0.18 ≈ 11.3 mL/dL. DO2 = 11.3 × 4 × 10 ≈ 452 mL/min.","distractor":"1,000 mL/min is the normal adult value, not this patient's DO2."},
{"id":32,"section":1,"sectionName":"Sepsis and Shock","stem":"Lactate falls from 6.0 to 4.2 mmol/L over 2 hours. What is the lactate clearance?","options":{"A":"18%","B":"43%","C":"30%","D":"70%"},"answer":"C","explanation":"Clearance = (6.0 − 4.2) / 6.0 × 100 = 30%. Lactate clearance ≥10–20% early is associated with better outcomes, but lactate must be interpreted with perfusion markers.","distractor":"43% divides by the final value (1.8/4.2) instead of the initial value."},
{"id":33,"section":1,"sectionName":"Sepsis and Shock","stem":"Which haemodynamic profile is typical of early warm septic shock?","options":{"A":"Normal cardiac output, high SVR, high CVP","B":"Low cardiac output, high SVR, low filling pressures and high lactate","C":"High cardiac output, low SVR, low or normal filling pressures","D":"Low cardiac output, high SVR, high filling pressures"},"answer":"C","explanation":"Distributive shock has vasodilation (low SVR) with a compensatory high cardiac output once fluid-resuscitated; filling pressures are low or normal.","distractor":"High SVR with high filling pressures is cardiogenic shock."},
{"id":34,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient develops anaphylaxis with hypotension after IV antibiotic. There is no IV access yet. What is the first treatment?","options":{"A":"Adrenaline 1 mg IV push as for cardiac arrest","B":"Adrenaline 0.5 mg IM into the anterolateral thigh","C":"Hydrocortisone 200 mg IV and chlorphenamine 10 mg IV","D":"Adrenaline 0.5 mg subcutaneously into the deltoid"},"answer":"B","explanation":"IM adrenaline 0.5 mg (1:1000) in the anterolateral thigh, repeated every 5 minutes if needed, is first-line. Steroids and antihistamines are not first-line.","distractor":"1 mg IV bolus is for cardiac arrest and risks arrhythmia and stroke."},
{"id":35,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient on propranolol has anaphylaxis refractory to repeated adrenaline. What is the most appropriate addition?","options":{"A":"Methylene blue 2 mg/kg IV as first rescue","B":"Additional antihistamine therapy (combined H1 plus H2 blockade)","C":"Atropine 3 mg IV as a single dose","D":"Glucagon 1–2 mg IV, repeated or followed by infusion"},"answer":"D","explanation":"Beta-blockade blunts the response to adrenaline. Glucagon increases cAMP independently of beta-receptors and is the recommended rescue therapy.","distractor":"Antihistamines do not reverse shock."},
{"id":36,"section":1,"sectionName":"Sepsis and Shock","stem":"After a C4 spinal cord injury, a patient has BP 80/45 mmHg, HR 48/min and warm peripheries. What is the shock type and first vasoactive choice?","options":{"A":"Neurogenic shock; noradrenaline","B":"Neurogenic shock; phenylephrine alone","C":"Cardiogenic shock; dobutamine","D":"Hypovolaemic shock; phenylephrine"},"answer":"A","explanation":"Loss of sympathetic tone causes hypotension, bradycardia and warm extremities. Noradrenaline (alpha + beta1) is preferred; pure alpha-agonists may worsen bradycardia. Exclude haemorrhage first.","distractor":"Phenylephrine alone can cause reflex bradycardia."},
{"id":37,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient on long-term prednisolone presents with vomiting, BP 75/40 mmHg, Na 128 and glucose 55 mg/dL. What is the immediate treatment?","options":{"A":"Hydrocortisone 100 mg IV and isotonic fluids","B":"Dexamethasone 4 mg after an ACTH test","C":"Oral prednisolone 20 mg and observation","D":"Fludrocortisone 0.1 mg orally and fluids"},"answer":"A","explanation":"Adrenal crisis: give hydrocortisone 100 mg IV immediately, then 200 mg/24 h, with saline and dextrose. Do not delay for testing.","distractor":"Fludrocortisone is unnecessary at high hydrocortisone doses and too slow."},
{"id":38,"section":1,"sectionName":"Sepsis and Shock","stem":"A stabbed patient has hypotension, raised JVP and muffled heart sounds. What is this triad and the shock type?","options":{"A":"Beck's triad; cardiogenic shock from contusion","B":"Virchow's triad; obstructive shock from PE","C":"Beck's triad; obstructive shock from tamponade","D":"Cushing's triad; neurogenic shock"},"answer":"C","explanation":"Beck's triad (hypotension, distended neck veins, muffled heart sounds) suggests tamponade. Treatment is drainage (thoracotomy in penetrating trauma).","distractor":"Cushing's triad (hypertension, bradycardia, irregular breathing) indicates raised ICP."},
{"id":39,"section":1,"sectionName":"Sepsis and Shock","stem":"A ventilated trauma patient has sudden hypotension, high airway pressures, absent breath sounds on the right and tracheal deviation to the left. What is the next step?","options":{"A":"CT chest to rule out haemothorax first","B":"Increase PEEP to improve oxygenation","C":"Chest radiograph to confirm before any intervention","D":"Immediate decompression without waiting for imaging"},"answer":"D","explanation":"Tension pneumothorax is a clinical diagnosis. Immediate decompression (finger thoracostomy in ventilated patients, or needle at the 4th–5th ICS anterior axillary line) followed by a chest tube.","distractor":"Imaging delays life-saving treatment in obstructive shock."},
{"id":40,"section":1,"sectionName":"Sepsis and Shock","stem":"A trauma patient has HR 125/min, BP 85/55 mmHg, RR 32/min and confusion. Which ATLS class of haemorrhage is this?","options":{"A":"Class II (15–30% blood volume loss)","B":"Class III (30–40% blood volume loss)","C":"Class IV (more than 40% blood volume loss)","D":"Class I (up to 15% blood volume loss)"},"answer":"B","explanation":"Class III: HR >120, falling SBP, RR 30–40, confusion — 30–40% loss; blood products needed. Class IV: HR >140, markedly low BP, lethargy.","distractor":"Class II usually has a normal SBP."},
{"id":41,"section":1,"sectionName":"Sepsis and Shock","stem":"In a bleeding trauma patient without head injury, what BP target is recommended until haemorrhage control?","options":{"A":"SBP 60 mmHg to minimise bleeding","B":"SBP above 120 mmHg to protect organs","C":"MAP above 80 mmHg in all patients to protect organs","D":"SBP 80–90 mmHg (permissive hypotension)"},"answer":"D","explanation":"European trauma guidelines recommend a target SBP of 80–90 mmHg (MAP 50–60) until bleeding is controlled; in TBI, MAP ≥80 mmHg.","distractor":"Higher pressures before haemostasis increase bleeding and dilution."},
{"id":42,"section":1,"sectionName":"Sepsis and Shock","stem":"When should tranexamic acid be given in bleeding trauma patients according to CRASH-2?","options":{"A":"Within 3 hours of injury: 1 g over 10 min, then 1 g over 8 h","B":"Within 6 hours of injury: 2 g as a single bolus","C":"At any time, as benefit is independent of timing","D":"Within 3 hours: 1 g over 10 min, with no further infusion needed"},"answer":"A","explanation":"CRASH-2: TXA within 3 hours reduced death due to bleeding; given after 3 hours, it increased bleeding deaths.","distractor":"Late TXA (>3 h) increased mortality from bleeding."},
{"id":43,"section":1,"sectionName":"Sepsis and Shock","stem":"What blood product ratio was associated with more haemostasis and fewer exsanguination deaths in PROPPR?","options":{"A":"1:2:4 plasma:platelets:red cells","B":"1:1:1 plasma:platelets:red cells","C":"Red cells only until laboratory results return","D":"1:1:2 plasma:platelets:red cells"},"answer":"B","explanation":"PROPPR (2015): 1:1:1 vs 1:1:2 showed no difference in 24-h or 30-day mortality, but more achieved haemostasis and fewer died from exsanguination by 24 h with 1:1:1.","distractor":"1:1:2 was the comparator arm with more early exsanguination deaths."},
{"id":44,"section":1,"sectionName":"Sepsis and Shock","stem":"A 25-year-old woman has fever, diffuse erythroderma, hypotension and multiorgan failure; a tampon was in place. Which antibiotic should be added to beta-lactam therapy?","options":{"A":"Azithromycin, to cover atypical organisms","B":"Metronidazole, to cover anaerobes","C":"Clindamycin, to suppress toxin production","D":"Gentamicin, to double Gram-negative cover"},"answer":"C","explanation":"Toxic shock syndrome (staphylococcal or streptococcal): remove the source, give a beta-lactam (± vancomycin) plus clindamycin (or linezolid) to inhibit toxin synthesis; consider IVIG in streptococcal TSS.","distractor":"Gentamicin has no anti-toxin effect."},
{"id":45,"section":1,"sectionName":"Sepsis and Shock","stem":"What did ATHOS-3 show for angiotensin II in vasodilatory shock?","options":{"A":"Reduced 28-day mortality by about 15%","B":"Improved MAP response at 3 hours, without a significant mortality benefit","C":"Increased mortality due to thrombotic events","D":"No effect on MAP at 3 hours, but significantly less acute kidney injury"},"answer":"B","explanation":"ATHOS-3 (2017): MAP response at 3 h 69.9% vs 23.4% with placebo; 28-day mortality not significantly different. VTE prophylaxis is advised because of thrombotic risk.","distractor":"ATHOS-3 was not powered to show, and did not show, a significant mortality benefit."},
{"id":46,"section":1,"sectionName":"Sepsis and Shock","stem":"What is the mechanism of methylene blue in refractory vasoplegia?","options":{"A":"Scavenges hydrogen sulphide like hydroxocobalamin","B":"Stimulates V1 receptors on vascular smooth muscle, raising intracellular calcium","C":"Agonist at alpha-1 adrenergic receptors","D":"Inhibits guanylate cyclase and nitric oxide synthase, reducing cGMP"},"answer":"D","explanation":"Methylene blue inhibits NOS and soluble guanylate cyclase, reducing cGMP-mediated vasodilation. Risks: serotonin syndrome with serotonergic drugs and haemolysis in G6PD deficiency.","distractor":"H2S scavenging is a mechanism of hydroxocobalamin."},
{"id":47,"section":1,"sectionName":"Sepsis and Shock","stem":"A septic patient has MAP 70 mmHg, ScvO2 85% and rising lactate (6 mmol/L). What does this most likely reflect?","options":{"A":"Excess oxygen delivery requiring a lower FiO2","B":"Adequate perfusion and oxygen delivery, so the lactate can be safely ignored","C":"Impaired tissue oxygen extraction (microcirculatory/mitochondrial)","D":"Catheter malposition in the right ventricle"},"answer":"C","explanation":"A high ScvO2 with rising lactate suggests impaired extraction (shunting, mitochondrial dysfunction). A normal or high ScvO2 does not exclude hypoperfusion.","distractor":"Rising lactate contradicts adequate perfusion."},
{"id":48,"section":1,"sectionName":"Sepsis and Shock","stem":"What is the threshold of pulse pressure variation that predicts fluid responsiveness in a passive ventilated patient in sinus rhythm with VT 8 mL/kg?","options":{"A":"PPV above about 12–13%","B":"PPV above about 3–5%","C":"PPV is valid at any value in AF","D":"PPV above about 25–30%"},"answer":"A","explanation":"PPV >12–13% predicts responsiveness (grey zone 9–13%) when prerequisites are met: controlled ventilation, sinus rhythm, VT ≥8 mL/kg, closed chest.","distractor":"PPV is unreliable in arrhythmias."},
{"id":49,"section":1,"sectionName":"Sepsis and Shock","stem":"What change in cardiac output during passive leg raising predicts fluid responsiveness?","options":{"A":"Increase of ≥10% measured in real time","B":"Increase in heart rate of ≥10/min","C":"Increase in BP of ≥5 mmHg","D":"Increase in CVP of ≥2 mmHg"},"answer":"A","explanation":"A ≥10% increase in cardiac output or stroke volume (real-time monitor, echo VTI) during PLR predicts fluid responsiveness; BP changes are insensitive.","distractor":"BP is an unreliable surrogate for flow changes."},
{"id":50,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with septic shock has new LVEF 30% with normal LV size and no previous cardiac history. What is the typical course?","options":{"A":"Permanent cardiomyopathy requiring an ICD","B":"Contraindication to vasopressor therapy","C":"Usually reversible within 7–10 days in survivors","D":"Indication for urgent coronary angiography and revascularisation"},"answer":"C","explanation":"Septic cardiomyopathy (LV and/or RV dysfunction) is common and typically reverses within 7–10 days in survivors.","distractor":"Angiography is not indicated without features of ACS."},
{"id":51,"section":1,"sectionName":"Sepsis and Shock","stem":"A diabetic patient has severe thigh pain, crepitus and septic shock. Besides antibiotics, what is the key intervention?","options":{"A":"IVIG as the primary therapy","B":"MRI to confirm fascial involvement first","C":"Hyperbaric oxygen before surgery","D":"Urgent surgical debridement"},"answer":"D","explanation":"Necrotising soft tissue infection requires immediate surgical debridement; delay increases mortality. Add clindamycin for toxin suppression.","distractor":"Imaging must not delay surgery in a shocked patient."},
{"id":52,"section":1,"sectionName":"Sepsis and Shock","stem":"A patient with neutrophils 0.2 × 10^9/L has fever and BP 85/50 mmHg. What is the most appropriate empirical antibiotic?","options":{"A":"Ceftriaxone plus azithromycin within 3 hours","B":"An antipseudomonal beta-lactam within 1 hour","C":"Vancomycin alone within 1 hour","D":"Ciprofloxacin orally within 6 hours"},"answer":"B","explanation":"Febrile neutropenia with shock needs an antipseudomonal beta-lactam (e.g. meropenem, piperacillin-tazobactam, cefepime) within 1 hour, plus vancomycin and an aminoglycoside in shock or resistant risk.","distractor":"Ceftriaxone lacks antipseudomonal activity."},
{"id":53,"section":1,"sectionName":"Sepsis and Shock","stem":"Should empirical antifungal therapy be routinely added in septic shock?","options":{"A":"Only in patients at high risk of fungal infection","B":"Never, until cultures grow yeast","C":"Yes, in all patients with septic shock on vasopressors","D":"Only if the platelet count falls below 50"},"answer":"A","explanation":"SSC 2021 suggests empirical antifungal therapy only in patients at high risk (e.g. neutropenia, TPN, recent abdominal surgery, Candida colonisation at multiple sites).","distractor":"Routine empirical antifungals increase resistance and cost."},
{"id":54,"section":1,"sectionName":"Sepsis and Shock","stem":"A cirrhotic patient with septic shock has received 3 L crystalloid. Which fluid is reasonable to add, and why?","options":{"A":"Hypotonic saline, to avoid sodium overload","B":"Fresh frozen plasma, to correct the INR and provide oncotic support","C":"Hydroxyethyl starch, to limit volume load","D":"Albumin, as cirrhosis predisposes to low oncotic pressure and HRS"},"answer":"D","explanation":"Albumin is commonly used in cirrhosis with sepsis (SBP-related AKI prevention, HRS treatment, large-volume resuscitation); starches are harmful and FFP is not a resuscitation fluid.","distractor":"Starches are contraindicated in sepsis."},
{"id":55,"section":1,"sectionName":"Sepsis and Shock","stem":"A hypotensive septic patient (MAP 62 mmHg on noradrenaline) needs urgent intubation. Which induction approach is most appropriate?","options":{"A":"Thiopental at standard dose, due to its haemodynamic stability","B":"Midazolam, as it has no haemodynamic effects","C":"Ketamine or etomidate at reduced dose, with vasopressor ready","D":"Propofol 2 mg/kg, the standard full induction dose"},"answer":"C","explanation":"Ketamine and etomidate are both acceptable induction agents in sepsis; the choice should consider haemodynamics. Propofol and thiopental cause hypotension.","distractor":"Full-dose propofol commonly causes post-intubation hypotension in sepsis."},
{"id":56,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"By the third trimester, how much does maternal cardiac output typically increase above pre-pregnancy values?","options":{"A":"By about 100%, mainly through a rise in stroke volume alone","B":"By about 30–50%, through increases in stroke volume and heart rate","C":"Not at all, because SVR rises to balance plasma volume","D":"By about 5–10%, mainly through a rise in heart rate"},"answer":"B","explanation":"Cardiac output rises 30–50% (peaking in the late second/third trimester) due to increased stroke volume and heart rate, with a further rise during labour and immediately postpartum.","distractor":"SVR falls, not rises, in pregnancy."},
{"id":57,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"Which haemodynamic change is characteristic of normal pregnancy?","options":{"A":"Reduced systemic vascular resistance with lower diastolic BP","B":"Increased central venous and pulmonary artery wedge pressures","C":"Increased systemic vascular resistance with higher BP","D":"Reduced plasma volume with haemoconcentration"},"answer":"A","explanation":"Progesterone- and NO-mediated vasodilation reduce SVR, so BP falls (especially diastolic) in mid-pregnancy. CVP and PCWP are unchanged; plasma volume rises 40–50%, causing physiological anaemia.","distractor":"Plasma volume expands, producing dilutional anaemia, not haemoconcentration."},
{"id":58,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 32 weeks' gestation has ABG pH 7.40, PaCO2 40 mmHg and HCO3 24 mmol/L while breathless. How should this be interpreted?","options":{"A":"Compensated respiratory alkalosis, which is expected in late pregnancy","B":"Relative hypercapnia; normal pregnancy PaCO2 is about 28–32 mmHg","C":"Metabolic alkalosis typical of late pregnancy","D":"Normal gas for pregnancy; no action needed"},"answer":"B","explanation":"Progesterone increases minute ventilation, so normal pregnancy has PaCO2 28–32 mmHg with compensatory HCO3 18–21 mmol/L. A 'normal' non-pregnant PaCO2 of 40 indicates ventilatory failure (e.g. fatigue in asthma).","distractor":"Normal non-pregnant values are abnormal in late pregnancy."},
{"id":59,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"Why do pregnant women desaturate rapidly during apnoea at intubation?","options":{"A":"Reduced haemoglobin affinity for oxygen only","B":"Reduced minute ventilation from progesterone","C":"Reduced FRC and increased oxygen consumption","D":"Increased FRC with higher dead space"},"answer":"C","explanation":"FRC falls by about 20% (uterine elevation of the diaphragm) while O2 consumption rises by about 20–30%, so oxygen reserves deplete quickly. Pre-oxygenation and head-up positioning are essential.","distractor":"Progesterone increases, not reduces, minute ventilation."},
{"id":60,"section":2,"sectionName":"Obstetric and Gynaecological Critical Care","stem":"A woman at 30 weeks' gestation becomes hypotensive while supine after a car crash. What is the first measure?","options":{"A":"Leg elevation only while keeping her flat supine","B":"Immediate vasopressor infusion before any repositioning","C":"Trendelenburg positioning to restore preload","D":"Manual left uterine displacement or left lateral tilt"},"answer":"D","explanation":"After ~20 weeks, the gravid uterus compresses the IVC and aorta when supine, reducing venous return by up to 30%. Left uterine displacement restores cardiac output.","distractor":"Trendelenburg does not relieve aortocaval compression."},
